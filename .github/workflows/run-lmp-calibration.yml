name: "LMP Calibration: Validate All 7 ISOs"

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to calibrate (or ALL for all 7)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      mode:
        description: 'Calibration mode'
        required: true
        default: 'weather-normalized'
        type: choice
        options:
          - weather-normalized
          - qa-actual
      year:
        description: 'Year for qa-actual mode'
        required: false
        default: '2024'
        type: string

env:
  BRANCH_PREFIX: lmp-cal

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}" >> "$GITHUB_ENV"

      - name: Create output branch
        run: |
          git checkout -b "$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy pandas pyarrow numba

      - name: Run LMP calibration
        run: |
          cd scripts
          if [ "${{ github.event.inputs.mode }}" = "qa-actual" ]; then
            python calibrate_lmp_model.py \
              --iso ${{ github.event.inputs.iso }} \
              --qa-actual \
              --year ${{ github.event.inputs.year }}
          else
            python calibrate_lmp_model.py \
              --iso ${{ github.event.inputs.iso }}
          fi

      - name: Commit and push calibration reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/step5-post-processing/lmp/
          if git diff --cached --quiet; then
            echo "No calibration reports to commit"
          else
            git commit -m "LMP calibration: ${{ github.event.inputs.iso }} (${{ github.event.inputs.mode }})"
            git push origin "$TARGET_BRANCH"
          fi

      - name: Create PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git log origin/master.."$TARGET_BRANCH" --oneline | grep -q .; then
            gh pr create \
              --title "LMP Calibration: ${{ github.event.inputs.iso }} (${{ github.event.inputs.mode }})" \
              --body "## Summary
          - Calibrated synthetic LMP model for ${{ github.event.inputs.iso }}
          - Mode: ${{ github.event.inputs.mode }}
          - Reports saved to \`data/step5-post-processing/lmp/{ISO}_calibration.json\`

          ## Metrics
          Compares synthetic LMP (avg, P10/P50/P90, peak/offpeak, volatility, negative/scarcity hours)
          against 2024 SOM calibration targets for each ISO." \
              --base master
          fi
