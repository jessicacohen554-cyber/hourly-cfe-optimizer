name: Run Step 1 PFS NYISO 100 (Tranches)

on:
  workflow_dispatch:
    inputs:
      tranche:
        description: 'Choose tranche 1-6 (recommended total for NYISO 100) or all.'
        required: true
        type: choice
        default: '1'
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Ensure target branch exists locally
      run: |
        BRANCH="iso-threshold-NYISO-100"
        git fetch origin "$BRANCH" || true
        git checkout -B "$BRANCH" "origin/$BRANCH" || git checkout -B "$BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyarrow numba pandas

    - name: Create checkpoint directory
      run: mkdir -p data/checkpoints data/checkpoints_v4

    - name: Set tranche controls
      run: |
        if [ "${{ github.event.inputs.tranche }}" = "all" ]; then
          echo "MAX_MIXES=0" >> "$GITHUB_ENV"
          echo "TRANCHE_LABEL=all" >> "$GITHUB_ENV"
        else
          # NYISO 100 guidance: run tranches 1-6 sequentially for complete phase-1 sweep.
          echo "MAX_MIXES=200" >> "$GITHUB_ENV"
          echo "TRANCHE_LABEL=tranche-${{ github.event.inputs.tranche }}-of-6" >> "$GITHUB_ENV"
        fi

    - name: Run NYISO 100 tranche
      run: |
        python "scripts/step 1 PFS - individual ISO threshold selector.py" \
          --iso "NYISO" \
          --threshold "100" \
          --max-runtime-minutes 0 \
          --max-mixes-per-run "$MAX_MIXES"

    - name: Commit results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        BRANCH="iso-threshold-NYISO-100"
        git add data/checkpoints/ data/checkpoints_v4/ data/physics_cache_v4_*.parquet scripts/dashboard/

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update NYISO threshold 100 (${TRANCHE_LABEL})"
        fi

        git push origin "$BRANCH"
