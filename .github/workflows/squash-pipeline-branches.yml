name: "Squash Pipeline Branches"

# Consolidates multiple auto/* branches (created by step 1-7 workflows) into a
# single squash commit and opens a PR against master. Branches that conflict on
# text files are skipped — binary conflicts (parquets, npz) are auto-resolved
# by taking the incoming branch's version.
#
# Typical use: after running a batch of pipeline steps (1a → 1c → 1d → 2 → 3 → ...),
# each creates its own auto/* branch. Instead of merging 20+ PRs individually,
# run this workflow to combine them into one clean squash commit.
#
# Branch naming conventions produced by each step:
#   Step 1B:  auto/{TS}-step1b-zone-search-{iso}          (PFS parquets — gitignored, force-added)
#   Step 1C:  auto/{TS}-step1c-storage-{iso}-{band}       (storage parquets in step1-pfs/)
#   Others:   auto/{TS}-{step}-{iso}
#
# branch_pattern examples:
#   "auto/"                    — all auto/* branches (default)
#   "auto/.*step1b"            — only Step 1B zone-search branches
#   "auto/.*step1c"            — all Step 1C storage branches (both naming conventions)
#   "auto/.*step1[bc]"         — Step 1B AND 1C together
#   "auto/.*step1[cd].*caiso"  — only CAISO 1c/1d branches
#   "auto/.*step1c.*high"      — only Step 1C HIGH-band branches
#   "auto/.*step1c.*caiso"     — only CAISO Step 1C branches
#   "auto/.*refilter"          — all refilter near-miss branches
#
# NOTE: Step 1B writes to data/step1-pfs/ which is gitignored.
# Those files are force-committed on the auto/* branches and re-force-added
# here during squash so they survive the git reset --soft master step.
#
# How it works:
#   1. Finds all remote auto/* branches not yet merged to master
#   2. Records master HEAD hash for integrity verification
#   3. Creates a temp branch from master
#   4. Sequentially merges each branch (binary conflicts auto-resolved, text conflicts skip)
#   5. Force-adds any gitignored data dirs that were force-committed on auto branches
#   6. Squashes all merged changes into a single commit (git reset --soft)
#   7. Verifies master HEAD is unchanged
#   8. Pushes and opens a PR (or merges directly)
#   9. Optionally closes old PRs and deletes merged branches

on:
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Regex pattern for branches to squash (or use custom_pattern for free-form)'
        default: 'auto/'
        type: choice
        options:
          - 'auto/'
          - 'auto/.*step1c'
          - 'auto/.*step1c.*storage'
          - 'auto/.*step1c.*low'
          - 'auto/.*step1c.*mid'
          - 'auto/.*step1c.*high'
          - 'auto/.*step1c.*caiso'
          - 'auto/.*step2'
          - 'auto/.*step3'
          - 'auto/.*step5d-mac'
      custom_pattern:
        description: 'Custom regex pattern (overrides branch_pattern if set). E.g. "auto/.*step1c.*ercot"'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Preview only — list branches without merging'
        default: false
        type: boolean
      delete_branches:
        description: 'Delete remote branches after successful squash'
        default: true
        type: boolean
      close_prs:
        description: 'Auto-close associated open PRs for squashed branches'
        default: true
        type: boolean
      merge_direct:
        description: 'Merge squash commit directly to master (skip PR)'
        default: false
        type: boolean
      commit_message:
        description: 'Custom squash commit message (auto-generated if empty)'
        default: ''
        type: string

jobs:
  squash-pipeline-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config push.default current

      - name: Fetch and identify unmerged branches
        id: find-branches
        run: |
          set -euo pipefail

          # custom_pattern overrides the dropdown choice when set
          CUSTOM="${{ inputs.custom_pattern }}"
          if [ -n "$CUSTOM" ]; then
            PATTERN="$CUSTOM"
          else
            PATTERN="${{ inputs.branch_pattern }}"
          fi
          echo "Looking for unmerged remote branches matching: ${PATTERN}"

          # Fetch all remote branches
          git fetch origin --prune

          # Record master HEAD for integrity verification later
          MASTER_HEAD=$(git rev-parse HEAD)
          MASTER_TREE=$(git rev-parse HEAD^{tree})
          echo "Master HEAD: $MASTER_HEAD"
          echo "Master tree: $MASTER_TREE"
          echo "master_head=$MASTER_HEAD" >> "$GITHUB_OUTPUT"
          echo "master_tree=$MASTER_TREE" >> "$GITHUB_OUTPUT"

          # Find unmerged branches matching pattern
          BRANCHES=()
          while IFS= read -r ref; do
            # Strip remotes/origin/ prefix and whitespace
            branch=$(echo "$ref" | sed 's|^ *remotes/origin/||; s|^ *origin/||; s/^ *//')
            [ -z "$branch" ] && continue
            BRANCHES+=("$branch")
          done < <(git branch -r --no-merged master | grep "origin/${PATTERN}" || true)

          if [ ${#BRANCHES[@]} -eq 0 ]; then
            echo "No unmerged branches found matching pattern '${PATTERN}'"
            echo "has_branches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ${#BRANCHES[@]} unmerged branch(es):"
          printf '  %s\n' "${BRANCHES[@]}"

          # Sort by branch name (timestamp prefix = chronological order)
          IFS=$'\n' SORTED=($(printf '%s\n' "${BRANCHES[@]}" | sort))
          unset IFS

          # Save for subsequent steps
          printf '%s\n' "${SORTED[@]}" > /tmp/branches.txt
          echo "has_branches=true" >> "$GITHUB_OUTPUT"
          echo "branch_count=${#SORTED[@]}" >> "$GITHUB_OUTPUT"

      # ── Dry Run ─────────────────────────────────────────────────────────
      - name: Preview (dry run)
        if: inputs.dry_run && steps.find-branches.outputs.has_branches == 'true'
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  DRY RUN — No changes will be made"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "Branches that would be squash-merged into master:"
          echo ""
          while IFS= read -r branch; do
            COMMITS=$(git rev-list --count master.."origin/$branch" 2>/dev/null || echo "?")
            LATEST=$(git log -1 --format="%s" "origin/$branch" 2>/dev/null || echo "?")
            FILES=$(git diff --name-only master..."origin/$branch" 2>/dev/null | wc -l || echo "?")
            echo "  [$COMMITS commits, $FILES files] $branch"
            echo "    └─ $LATEST"
          done < /tmp/branches.txt
          echo ""
          echo "To execute, re-run with dry_run=false"

      # ── Squash Merge ────────────────────────────────────────────────────
      - name: Squash-merge branches
        if: ${{ !inputs.dry_run && steps.find-branches.outputs.has_branches == 'true' }}
        id: squash
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          SQUASH_BRANCH="auto/${TIMESTAMP}-squash-pipeline"
          echo "SQUASH_BRANCH=$SQUASH_BRANCH" >> "$GITHUB_ENV"

          git checkout -b "$SQUASH_BRANCH" master

          MERGED=()
          SKIPPED=()
          MERGED_SUMMARIES=()

          while IFS= read -r branch; do
            echo "─── Merging: $branch ───"

            # -X theirs: auto-resolve text conflicts by preferring the incoming branch.
            if git merge --no-edit -X theirs "origin/$branch" 2>/dev/null; then
              echo "  ✓ Merged successfully"
              MERGED+=("$branch")
              LATEST=$(git log -1 --format="%s" "origin/$branch" 2>/dev/null || true)
              MERGED_SUMMARIES+=("$branch → $LATEST")
            else
              # -X theirs only resolves TEXT conflicts. Binary files (parquets, npz)
              # still cause unresolved conflicts. Resolve them by taking the incoming
              # branch's version (pipeline data should always take the newer run).
              UNRESOLVED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [ -n "$UNRESOLVED" ]; then
                conflict_count=$(echo "$UNRESOLVED" | wc -l)
                echo "  Resolving $conflict_count remaining conflict(s) (binary files) by taking incoming version..."
                echo "$UNRESOLVED" | while IFS= read -r conflicted_file; do
                  git checkout --theirs -- "$conflicted_file" 2>/dev/null || true
                  git add "$conflicted_file" 2>/dev/null || true
                  echo "    resolved: $conflicted_file"
                done

                # Complete the merge with resolved conflicts
                if git -c core.editor=true merge --continue 2>/dev/null; then
                  echo "  ✓ Merged (binary conflicts resolved)"
                  MERGED+=("$branch")
                  LATEST=$(git log -1 --format="%s" "origin/$branch" 2>/dev/null || true)
                  MERGED_SUMMARIES+=("$branch → $LATEST (binary conflicts auto-resolved)")
                else
                  echo "  ✗ Could not complete merge even after conflict resolution — skipping"
                  git merge --abort 2>/dev/null || true
                  SKIPPED+=("$branch")
                fi
              else
                echo "  ✗ Merge failed (no unresolved files detected) — skipping"
                git merge --abort 2>/dev/null || true
                SKIPPED+=("$branch")
              fi
            fi
          done < /tmp/branches.txt

          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  Merged: ${#MERGED[@]}    Skipped: ${#SKIPPED[@]}"
          echo "═══════════════════════════════════════════════"

          if [ ${#MERGED[@]} -eq 0 ]; then
            echo "No branches merged successfully — nothing to squash."
            echo "has_merges=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Squash: collapse all merge commits into one ──
          git reset --soft master

          # Force-add gitignored data directories that pipeline steps committed
          # via "git add -f" on their auto branches. After git reset --soft master,
          # these files are in the index but gitignore would block re-adding if
          # they were somehow dropped. Force-add all known pipeline data dirs.
          for data_dir in data/step1-pfs data/step2.1-ef data/step2.2-cost \
                          data/step3-dispatch data/step4-analysis \
                          data/step5-scenarios data/step5-wrights \
                          data/step6-smartargets; do
            git add -f "$data_dir/" 2>/dev/null || true
          done

          # Check that we actually have changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit after squash (all branches may have been empty)."
            echo "has_merges=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Show what the squash commit will contain
          echo ""
          echo "Squash commit diff summary:"
          git diff --cached --stat | tail -5

          # Build commit message
          CUSTOM_MSG="${{ inputs.commit_message }}"
          if [ -n "$CUSTOM_MSG" ]; then
            TITLE="$CUSTOM_MSG"
          else
            TITLE="Squash ${#MERGED[@]} pipeline branches"
          fi

          # Compose detailed body
          BODY="Consolidated ${#MERGED[@]} auto/* branches into a single commit."
          BODY+=$'\n\nMerged branches:'
          for summary in "${MERGED_SUMMARIES[@]}"; do
            BODY+=$'\n'"  - $summary"
          done
          if [ ${#SKIPPED[@]} -gt 0 ]; then
            BODY+=$'\n\nSkipped (conflicts):'
            for s in "${SKIPPED[@]}"; do
              BODY+=$'\n'"  - $s"
            done
          fi

          git commit -m "$TITLE" -m "$BODY"

          echo "has_merges=true" >> "$GITHUB_OUTPUT"
          echo "merged_count=${#MERGED[@]}" >> "$GITHUB_OUTPUT"
          echo "skipped_count=${#SKIPPED[@]}" >> "$GITHUB_OUTPUT"

          # Persist lists for cleanup steps
          printf '%s\n' "${MERGED[@]}" > /tmp/merged_branches.txt
          if [ ${#SKIPPED[@]} -gt 0 ]; then
            printf '%s\n' "${SKIPPED[@]}" > /tmp/skipped_branches.txt
          else
            touch /tmp/skipped_branches.txt
          fi

      # ── Verify master integrity ───────────────────────────────────────
      - name: Verify master HEAD unchanged
        if: ${{ !inputs.dry_run && steps.squash.outputs.has_merges == 'true' }}
        run: |
          set -euo pipefail
          EXPECTED_TREE="${{ steps.find-branches.outputs.master_tree }}"

          # The squash branch should be exactly 1 commit ahead of the original master.
          # Verify master's tree is the parent commit's tree.
          PARENT_TREE=$(git rev-parse HEAD~1^{tree})

          if [ "$EXPECTED_TREE" = "$PARENT_TREE" ]; then
            echo "PASS — master tree is intact (parent tree: ${PARENT_TREE:0:12})"
          else
            echo "::error::Master tree mismatch!"
            echo "  Expected: $EXPECTED_TREE"
            echo "  Parent:   $PARENT_TREE"
            echo "The squash commit's parent does not match the original master. Aborting."
            exit 1
          fi

      # ── Push ────────────────────────────────────────────────────────────
      - name: Push squash branch
        if: ${{ !inputs.dry_run && steps.squash.outputs.has_merges == 'true' }}
        run: |
          set -euo pipefail
          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            if git push -u origin "$SQUASH_BRANCH" 2>&1; then
              echo "Push succeeded."
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      # ── Merge directly to master (optional) ────────────────────────────
      - name: Fast-forward master
        if: ${{ !inputs.dry_run && inputs.merge_direct && steps.squash.outputs.has_merges == 'true' }}
        run: |
          set -euo pipefail

          # Re-fetch master to ensure we have the latest remote state.
          # If someone pushed to master since our workflow started, the
          # ff-only merge will fail (safe — we don't force-push master).
          git fetch origin master

          git checkout master
          git merge --ff-only "$SQUASH_BRANCH"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push master attempt $i/$MAX_RETRIES..."
            if git push origin master 2>&1; then
              echo "Master push succeeded."
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Push to master failed after $MAX_RETRIES attempts."
              echo "The squash branch ($SQUASH_BRANCH) was pushed successfully."
              echo "You can manually merge it via PR."
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      # ── Create PR (if not merging directly) ─────────────────────────────
      - name: Create PR
        if: ${{ !inputs.dry_run && !inputs.merge_direct && steps.squash.outputs.has_merges == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          MERGED_COUNT=$(wc -l < /tmp/merged_branches.txt | tr -d ' ')
          SKIPPED_COUNT=$(grep -c . /tmp/skipped_branches.txt 2>/dev/null || echo 0)

          # Build PR body
          PR_BODY="## Squashed Pipeline Branches"
          PR_BODY+=$'\n\n'"Consolidated **${MERGED_COUNT}** auto/* branches into a single squash commit."
          PR_BODY+=$'\n\n'"### Merged Branches"
          while IFS= read -r branch; do
            PR_BODY+=$'\n'"- \`$branch\`"
          done < /tmp/merged_branches.txt

          if [ "$SKIPPED_COUNT" -gt 0 ] && [ "$SKIPPED_COUNT" != "0" ]; then
            PR_BODY+=$'\n\n'"### Skipped (Conflicts)"
            while IFS= read -r branch; do
              [ -z "$branch" ] && continue
              PR_BODY+=$'\n'"- \`$branch\` — needs manual resolution"
            done < /tmp/skipped_branches.txt
          fi

          PR_BODY+=$'\n\n'"### How to Merge"
          PR_BODY+=$'\n'"Use **Squash and merge** or **Rebase and merge** to keep master history clean."

          echo "$PR_BODY" > /tmp/pr_body.md

          gh pr create \
            --title "Squash: ${MERGED_COUNT} pipeline branches" \
            --body-file /tmp/pr_body.md \
            --base master \
            --head "$SQUASH_BRANCH" || echo "::warning::PR creation failed (may already exist)"

      # ── Cleanup: close old PRs ──────────────────────────────────────────
      - name: Close superseded PRs
        if: ${{ !inputs.dry_run && inputs.close_prs && steps.squash.outputs.has_merges == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Closing PRs for merged branches..."
          CLOSED=0
          while IFS= read -r branch; do
            PR_NUM=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
              echo "  Closing PR #${PR_NUM} for $branch"
              gh pr close "$PR_NUM" \
                --comment "Superseded by squash commit in \`${SQUASH_BRANCH}\`" 2>/dev/null || true
              CLOSED=$((CLOSED + 1))
            fi
          done < /tmp/merged_branches.txt
          echo "Closed $CLOSED PR(s)"

      # ── Cleanup: delete remote branches ─────────────────────────────────
      - name: Delete merged remote branches
        if: ${{ !inputs.dry_run && inputs.delete_branches && steps.squash.outputs.has_merges == 'true' }}
        run: |
          echo "Deleting merged remote branches..."
          DELETED=0
          while IFS= read -r branch; do
            echo "  Deleting origin/$branch"
            git push origin --delete "$branch" 2>/dev/null && DELETED=$((DELETED + 1)) || echo "    (already deleted or protected)"
          done < /tmp/merged_branches.txt
          echo "Deleted $DELETED branch(es)"

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Summary
        if: ${{ always() && steps.find-branches.outputs.has_branches == 'true' }}
        run: |
          MERGED_COUNT=0
          SKIPPED_COUNT=0
          [ -f /tmp/merged_branches.txt ] && MERGED_COUNT=$(grep -c . /tmp/merged_branches.txt 2>/dev/null || echo 0)
          [ -f /tmp/skipped_branches.txt ] && SKIPPED_COUNT=$(grep -c . /tmp/skipped_branches.txt 2>/dev/null || echo 0)

          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  SQUASH PIPELINE — SUMMARY"
          echo "═══════════════════════════════════════════════"
          echo "  Branches squashed:  $MERGED_COUNT"
          echo "  Branches skipped:   $SKIPPED_COUNT"
          if [ "$MERGED_COUNT" -gt 0 ] && [ "$MERGED_COUNT" != "0" ]; then
            echo "  Squash branch:      ${SQUASH_BRANCH:-n/a}"
            echo "  Direct merge:       ${{ inputs.merge_direct }}"
            echo "  Old PRs closed:     ${{ inputs.close_prs }}"
            echo "  Old branches deleted: ${{ inputs.delete_branches }}"
          fi
          echo "═══════════════════════════════════════════════"

          if [ "$SKIPPED_COUNT" -gt 0 ] && [ "$SKIPPED_COUNT" != "0" ]; then
            echo ""
            echo "Skipped branches (need manual resolution):"
            cat /tmp/skipped_branches.txt
          fi
