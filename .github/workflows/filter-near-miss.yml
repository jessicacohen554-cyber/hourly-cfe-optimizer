name: "Refilter near-miss parquets (threshold-crossing + stratified cap)"

# Applies threshold-crossing filter + 100K stratified cap to near-miss parquets.
# Computes max_storage_score for each mix, keeps only mixes that cross at least
# one active threshold with storage, then caps at 100K via stratified sampling.
# Reduces bloated near-miss files from 60-80 MB to ~1-2 MB.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to filter (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to run on'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 1
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install numpy numba pyarrow pandas

    - name: Show near-miss sizes before
      run: ls -lh data/step1-pfs-parquets/*near_miss*.parquet 2>/dev/null || echo "No near-miss files found"

    - name: Run threshold-crossing refilter
      run: python scripts/temp_refilter_near_miss.py --iso "${{ inputs.iso }}"

    - name: Show near-miss sizes after
      run: ls -lh data/step1-pfs-parquets/*near_miss*.parquet 2>/dev/null || echo "No near-miss files found"

    - name: Commit and push refiltered parquets to auto branch
      run: |
        ISO="${{ inputs.iso }}"
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
        TARGET_BRANCH="auto/${TIMESTAMP}-refilter-near-miss-${ISO}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git checkout -b "$TARGET_BRANCH"
        git add -f data/step1-pfs-parquets/*near_miss*.parquet 2>/dev/null || true

        if ! git diff --cached --quiet; then
          git commit -m "Refilter ${ISO} near-miss: threshold-crossing + 100K stratified cap

        Applies threshold-crossing filter (keep only mixes where storage pushes
        base_score across an active threshold) + 100K stratified cap per ISO.
        Typical reduction: 60-80 MB → 1-2 MB (97%+ reduction)."

          for i in 1 2 3 4; do
            git push -u origin "$TARGET_BRANCH" && break
            echo "Push attempt $i failed, retrying in $((2**i))s..."
            sleep $((2**i))
          done
        else
          echo "No changes — near-miss parquets already filtered."
        fi
