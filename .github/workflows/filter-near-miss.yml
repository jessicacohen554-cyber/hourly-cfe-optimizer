name: "Filter near-miss parquets (curtailment + bridge)"

# Two-pass filter on near-miss parquets to shrink them before Step 1d:
#  1. Remove zero-curtailment mixes (no surplus hours → can't charge storage)
#  2. Remove bridge-fail mixes (base_score + surplus_pct < 50% → can't reach
#     any storage threshold even with all available surplus)
# Run after Step 1c to prune before Step 1d.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to filter (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to run on'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install numpy numba pyarrow pandas

    - name: Run curtailment + bridge filter
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          python scripts/filter_near_miss_curtailment.py
        else
          python scripts/filter_near_miss_curtailment.py "$ISO"
        fi

    - name: Commit and push filtered/compressed parquets
      run: |
        BRANCH="${{ inputs.branch || 'master' }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f data/step1-pfs-parquets/*.parquet data/step1d-storage-parquets/*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Filter + compress PFS parquets (int8/float32 + zstd)

        Near-miss: remove zero-curtailment + bridge-fail mixes.
        All parquets: downcast float64 → int8/float32, recompress with zstd."
          for i in 1 2 3 4; do
            git push origin HEAD:"$BRANCH" && break
            echo "Push attempt $i failed, retrying in $((2**i))s..."
            sleep $((2**i))
          done
        else
          echo "No changes — all parquets already optimized."
        fi
