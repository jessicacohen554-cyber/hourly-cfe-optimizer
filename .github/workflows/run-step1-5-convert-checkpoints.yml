name: Run Step 1.5 Convert Checkpoints To Parquet

on:
  workflow_dispatch:

jobs:
  run-step1-5:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Ensure output directory exists
        run: mkdir -p data/step1_raw_pfs_parquets

      - name: Ensure target branch exists locally
        run: |
          git fetch origin step1-5-raw-pfs-parquets || true
          git checkout -B step1-5-raw-pfs-parquets origin/step1-5-raw-pfs-parquets || git checkout -B step1-5-raw-pfs-parquets

      - name: Run Step 1.5 checkpoint conversion
        run: python scripts/step1_5_convert_checkpoints_to_parquet.py

      - name: Commit Step 1.5 parquet outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          BRANCH="step1-5-raw-pfs-parquets"
          git add -f data/step1_raw_pfs_parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Step 1.5 raw PFS parquet exports"
          fi

          git push origin "$BRANCH"

