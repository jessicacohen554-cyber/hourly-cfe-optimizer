name: Run Step 1.5 Convert Checkpoints To Parquet

on:
  workflow_dispatch:

jobs:
  run-step1-5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Ensure output directory exists
        run: mkdir -p data/step1_raw_pfs_parquets

      - name: Run Step 1.5 checkpoint conversion
        run: python step1_5_convert_checkpoints_to_parquet.py

      - name: Upload Step 1.5 parquet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: step1-5-raw-pfs-parquets
          path: data/step1_raw_pfs_parquets/
          if-no-files-found: error
