name: "Step 2.3 DE: Thermal Fleet Disaggregation"

# Runs step2_3_de_pathway_tf.py — thermal fleet variant of the DE pathway
# optimizer. Identical interface to step2-3-de-optimizer.yml but uses the
# _tf script with coal+oil peak credit and CFE-driven retirement feedback.
#
# Output files tagged `_tf` — won't collide with baseline runs.
#
# iso=ALL fans out to 7 parallel matrix jobs.
# Run squash-pipeline-branches.yml with pattern "auto/.*step2-3-de-tf"
# to consolidate into master.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region (ALL = parallel across 7)'
        required: true
        default: 'ERCOT'
        type: choice
        options:
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
          - ALL
      pathway:
        description: 'Pathway (A=VRE-only, B=firm incl, BOTH=A→B seeded, ALL=A→B→C→D)'
        required: true
        default: 'BOTH'
        type: choice
        options:
          - A
          - B
          - C
          - D
          - BOTH
          - ALL
      gas_mode:
        description: 'Gas visibility in optimizer: 1=cost+shadow, 2=cost only, 3=blind'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      popsize:
        description: 'DE population multiplier (pop = popsize × n_dims)'
        required: false
        default: '15'
        type: choice
        options:
          - '10'
          - '15'
          - '20'
          - '40'
          - '80'
          - '160'
      maxiter:
        description: 'DE generations per year-step'
        required: false
        default: '150'
        type: choice
        options:
          - '100'
          - '150'
          - '200'
          - '400'
          - '800'
          - '1600'
      demand_growth:
        description: 'Demand growth level'
        required: true
        default: 'Medium'
        type: choice
        options:
          - Medium
          - Low
          - High
      scenario:
        description: 'Cost scenario'
        required: true
        default: 'base'
        type: choice
        options:
          - base
          - firm_high_vre_low
          - firm_low_vre_high
          - all_low
          - all_high
      seed:
        description: 'Random seed (use different seeds to test sensitivity)'
        required: false
        default: '42'
        type: choice
        options:
          - '42'
          - '7'
          - '123'
          - '456'
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step2-3-de-tf
  PYTHONUNBUFFERED: "1"
  SEED: ${{ inputs.seed || '42' }}
  TARGET_2040: "90"
  TARGET_2050: "99.9"
  WORKERS: "2"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  de-optimize-tf:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    concurrency:
      group: step2-3-de-tf-${{ matrix.iso }}-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Verify prerequisites
        run: |
          for f in data/eia-930/eia_generation_profiles.parquet data/eia-930/eia_demand_profiles.parquet; do
            if [ ! -f "$f" ]; then
              echo "::error::$f not found. Run Step 0 data fetch first."
              exit 1
            fi
          done
          if [ ! -f "data/hybrid_profiles/${{ matrix.iso }}_hybrid_profiles.npz" ]; then
            echo "::warning::Hybrid profiles not found for ${{ matrix.iso }} — hybrids will be zero"
          fi

      - name: Verify thermal fleet script exists
        run: |
          if [ ! -f "scripts/step2_3_de_pathway_tf.py" ]; then
            echo "::error::scripts/step2_3_de_pathway_tf.py not found. Commit it first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Verify imports
        working-directory: scripts
        run: |
          python -c "
          import numpy, numba, pyarrow, pandas, scipy
          from scipy.optimize import differential_evolution
          print(f'numpy={numpy.__version__}')
          print(f'scipy={scipy.__version__}')

          import pipeline_config as pc
          # Verify thermal fleet functions exist
          fleet = pc.thermal_fleet_mw('ERCOT', 2030, 60.0)
          peak = pc.thermal_peak_credit_mw('ERCOT', 2030, 60.0)
          print(f'Thermal fleet OK — ERCOT 2030 @60% CFE: gas={fleet[\"gas_mw\"]:,.0f} coal={fleet[\"coal_mw\"]:,.0f} peak={peak:,.0f}')
          "

      - name: Ensure output directory
        run: mkdir -p data/step2.3-de/thermal-fleet

      - name: Build pathway list
        id: pathways
        env:
          PATHWAY: ${{ inputs.pathway }}
        run: |
          case "$PATHWAY" in
            BOTH)     echo "list=A B" >> "$GITHUB_OUTPUT" ;;
            ALL)      echo "list=A B C D" >> "$GITHUB_OUTPUT" ;;
            *)        echo "list=$PATHWAY" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: "Run DE optimizer (thermal fleet) — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          PATHWAYS: ${{ steps.pathways.outputs.list }}
          GAS_MODE: ${{ inputs.gas_mode }}
          POPSIZE: ${{ inputs.popsize }}
          MAXITER: ${{ inputs.maxiter }}
          SCENARIO: ${{ inputs.scenario }}
          DEMAND: ${{ inputs.demand_growth }}
        timeout-minutes: 330
        run: |
          set -euo pipefail
          REF_FLAG=""

          for pw in $PATHWAYS; do
            echo ""
            echo "============================================================"
            echo "[workflow] Starting DE Pathway $pw (thermal fleet) for $ISO"
            echo "  gas_mode=$GAS_MODE popsize=$POPSIZE maxiter=$MAXITER"
            echo "  workers=$WORKERS seed=$SEED"
            echo "  target_2040=$TARGET_2040 target_2050=$TARGET_2050"
            echo "============================================================"
            t0=$SECONDS

            python scripts/step2_3_de_pathway_tf.py \
              --iso "$ISO" \
              --pathway "$pw" \
              --gas-mode "$GAS_MODE" \
              --popsize "$POPSIZE" \
              --maxiter "$MAXITER" \
              --workers "$WORKERS" \
              --seed "$SEED" \
              --scenario "$SCENARIO" \
              --demand-growth "$DEMAND" \
              --target-2040 "$TARGET_2040" \
              --target-2050 "$TARGET_2050" \
              $REF_FLAG

            echo "[workflow] Pathway $pw done in $(( SECONDS - t0 ))s"

            # After pathway A, set ref-winners flag for subsequent pathways
            if [ "$pw" = "A" ]; then
              WINNERS_FILE="data/step2.3-de/thermal-fleet/${ISO}_pathwayA_${SCENARIO}_${DEMAND}_p${POPSIZE}_i${MAXITER}_s${SEED}_g${GAS_MODE}_tf_winners.json"
              if [ -f "$WINNERS_FILE" ]; then
                REF_FLAG="--ref-winners $WINNERS_FILE"
                echo "[workflow] Will seed subsequent pathways with $WINNERS_FILE"
              fi
            fi
          done

      - name: "Verify outputs — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          PATHWAYS: ${{ steps.pathways.outputs.list }}
          SCENARIO: ${{ inputs.scenario }}
          DEMAND: ${{ inputs.demand_growth }}
          GAS_MODE: ${{ inputs.gas_mode }}
        run: |
          for pw in $PATHWAYS; do
            results="data/step2.3-de/thermal-fleet/${ISO}_pathway${pw}_${SCENARIO}_${DEMAND}_p${{ inputs.popsize }}_i${{ inputs.maxiter }}_s${SEED}_g${GAS_MODE}_tf.parquet"
            if [ ! -f "$results" ]; then
              echo "::error::Missing results: $results"
              exit 1
            fi
            size=$(stat -c%s "$results" 2>/dev/null || stat -f%z "$results")
            echo "[verify] ${results}: ${size} bytes"
          done

      - name: "Push results — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          GAS_MODE: ${{ inputs.gas_mode }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          branch="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"

          # Stage output files (_tf tagged)
          file_count=0
          for f in data/step2.3-de/thermal-fleet/${ISO}_*_tf.parquet data/step2.3-de/thermal-fleet/${ISO}_*_tf_winners.json; do
            [ -f "$f" ] || continue
            git add "$f"
            file_count=$((file_count + 1))
            echo "[push] Staged: ${f} ($(du -h "$f" | cut -f1))"
          done

          if [ "$file_count" -eq 0 ]; then
            echo "::error::No _tf output files found for ${ISO}"
            exit 1
          fi

          COMMIT_MSG="Step 2.3 DE thermal fleet: ${ISO} pw=${{ inputs.pathway }} pop=${{ inputs.popsize }} iter=${{ inputs.maxiter }} gas=${GAS_MODE} s=${SEED}"
          git commit -m "$COMMIT_MSG"
          git push origin "$branch"
          echo "[push] Branch created: ${branch}"
          echo "BRANCH=${branch}" >> "${GITHUB_ENV}"

      - name: Summary
        if: always()
        env:
          ISO: ${{ matrix.iso }}
        run: |
          {
            echo "## Step 2.3 DE Thermal Fleet — ${ISO}"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Pathway | \`${{ inputs.pathway }}\` |"
            echo "| Gas mode | ${{ inputs.gas_mode }} |"
            echo "| Popsize | ${{ inputs.popsize }} |"
            echo "| Maxiter | ${{ inputs.maxiter }} |"
            echo "| Seed | ${SEED} |"
            echo "| Scenario | \`${{ inputs.scenario }}\` |"
            echo "| Demand | \`${{ inputs.demand_growth }}\` |"
            echo ""
            echo "**Thermal fleet model:** gas + coal + oil peak credit with CFE-driven coal retirement."
            echo "Output tagged \`_tf\` — does not overwrite baseline results."
            echo ""
            if [ -n "${BRANCH:-}" ]; then
              echo "Branch: \`${BRANCH}\`"
            fi
            echo ""
            echo "Run **Squash Pipeline Branches** with pattern \`auto/.*step2-3-de-tf\` to consolidate."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-3-de-tf-${{ matrix.iso }}-${{ github.run_id }}
          path: data/step2.3-de/thermal-fleet/
          retention-days: 30
          if-no-files-found: warn
