name: "Step 2.3 DE: Thermal Fleet Disaggregation"

# Runs step2_3_de_pathway_tf.py — thermal fleet variant of the DE pathway
# optimizer. Identical interface to step2-3-de-optimizer.yml but uses the
# _tf script with coal+oil peak credit and CFE-driven retirement feedback.
#
# Output files tagged `_tf` — won't collide with baseline runs.
#
# Sweep dimensions (all sequential except ISO which fans out in parallel):
#   iso       — ALL fans out to 7 parallel matrix jobs
#   pathway   — BOTH = A→B seeded, ALL = A→B→C→D
#   gas_mode  — BOTH = 1+2, ALL = 1+2+3
#   scenario  — extremes/cross/core/ALL (see descriptions)
#   demand    — ALL = Low+Medium+High
#   popsize   — explore = 10+15+20, bounds = 10+20
#   maxiter   — mid_high = 400+800
#   seed_mode — loop_new runs seeds 7,123,256,314,567,773,999 (skips 42)
#
# Run squash-pipeline-branches.yml with pattern "auto/.*step2-3-de-tf"
# to consolidate into master.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region (ALL = parallel across 7)'
        required: true
        default: 'ERCOT'
        type: choice
        options:
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
          - ALL
      pathway:
        description: 'Pathway (A=VRE-only, B=firm incl, BOTH=A→B seeded, ALL=A→B→C→D)'
        required: true
        default: 'BOTH'
        type: choice
        options:
          - A
          - B
          - C
          - D
          - BOTH
          - ALL
      gas_mode:
        description: 'Gas in optimizer: 1=cost+shadow, 2=cost only, 3=blind, BOTH=1+2, ALL=1+2+3'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - BOTH
          - ALL
      scenario:
        description: 'Cost scenario — extremes=low+high, cross=firm↔vre, core=base+low+high, ALL=all 5'
        required: true
        default: 'base'
        type: choice
        options:
          - base
          - firm_high_vre_low
          - firm_low_vre_high
          - all_low
          - all_high
          - extremes
          - cross
          - core
          - ALL
      demand_growth:
        description: 'Demand growth (ALL = loop Low/Medium/High)'
        required: true
        default: 'Medium'
        type: choice
        options:
          - Low
          - Medium
          - High
          - ALL
      popsize:
        description: 'DE pop multiplier — explore=10+15+20, bounds=10+20'
        required: false
        default: '15'
        type: choice
        options:
          - '10'
          - '15'
          - '20'
          - '40'
          - '80'
          - '160'
          - explore
          - bounds
      maxiter:
        description: 'DE generations — mid_high=400+800'
        required: false
        default: '150'
        type: choice
        options:
          - '100'
          - '150'
          - '200'
          - '400'
          - '800'
          - '1600'
          - mid_high
      seed:
        description: 'Random seed (ignored when seed_mode=loop_new)'
        required: false
        default: '42'
        type: choice
        options:
          - '42'
          - '7'
          - '123'
          - '256'
          - '314'
          - '567'
          - '773'
          - '999'
      seed_mode:
        description: 'single = use selected seed | loop_new = run 7 new seeds sequentially (excludes 42)'
        required: false
        default: 'single'
        type: choice
        options:
          - single
          - loop_new
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step2-3-de-tf
  PYTHONUNBUFFERED: "1"
  TARGET_2040: "90"
  TARGET_2050: "99.9"
  WORKERS: "2"

jobs:
  # -------------------------------------------------------------------
  # Fan-out: ISO dimension → parallel matrix jobs
  # All other dimensions expand to space-separated lists, looped
  # sequentially inside each matrix job.
  # -------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      pathways: ${{ steps.dims.outputs.pathways }}
      gas_modes: ${{ steps.dims.outputs.gas_modes }}
      scenarios: ${{ steps.dims.outputs.scenarios }}
      demands: ${{ steps.dims.outputs.demands }}
      popsizes: ${{ steps.dims.outputs.popsizes }}
      maxiters: ${{ steps.dims.outputs.maxiters }}
      seed_list: ${{ steps.set-seeds.outputs.seed_list }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

      - id: set-seeds
        run: |
          if [ "${{ inputs.seed_mode }}" = "loop_new" ]; then
            echo "seed_list=7 123 256 314 567 773 999" >> "$GITHUB_OUTPUT"
          else
            echo "seed_list=${{ inputs.seed || '42' }}" >> "$GITHUB_OUTPUT"
          fi

      # Expand ALL/BOTH/group shortcuts into space-separated lists.
      # These are passed to the matrix job and looped sequentially.
      - id: dims
        env:
          PATHWAY: ${{ inputs.pathway }}
          GAS_MODE: ${{ inputs.gas_mode }}
          SCENARIO: ${{ inputs.scenario }}
          DEMAND: ${{ inputs.demand_growth }}
          POPSIZE: ${{ inputs.popsize }}
          MAXITER: ${{ inputs.maxiter }}
        run: |
          # Pathways
          case "$PATHWAY" in
            BOTH) echo "pathways=A B" >> "$GITHUB_OUTPUT" ;;
            ALL)  echo "pathways=A B C D" >> "$GITHUB_OUTPUT" ;;
            *)    echo "pathways=$PATHWAY" >> "$GITHUB_OUTPUT" ;;
          esac

          # Gas modes — BOTH = 1+2, ALL = 1+2+3
          case "$GAS_MODE" in
            BOTH) echo "gas_modes=1 2" >> "$GITHUB_OUTPUT" ;;
            ALL)  echo "gas_modes=1 2 3" >> "$GITHUB_OUTPUT" ;;
            *)    echo "gas_modes=$GAS_MODE" >> "$GITHUB_OUTPUT" ;;
          esac

          # Scenarios
          case "$SCENARIO" in
            extremes) echo "scenarios=all_low all_high" >> "$GITHUB_OUTPUT" ;;
            cross)    echo "scenarios=firm_high_vre_low firm_low_vre_high" >> "$GITHUB_OUTPUT" ;;
            core)     echo "scenarios=base all_low all_high" >> "$GITHUB_OUTPUT" ;;
            ALL)      echo "scenarios=base firm_high_vre_low firm_low_vre_high all_low all_high" >> "$GITHUB_OUTPUT" ;;
            *)        echo "scenarios=$SCENARIO" >> "$GITHUB_OUTPUT" ;;
          esac

          # Demand growth
          case "$DEMAND" in
            ALL) echo "demands=Low Medium High" >> "$GITHUB_OUTPUT" ;;
            *)   echo "demands=$DEMAND" >> "$GITHUB_OUTPUT" ;;
          esac

          # Popsize — explore = 10+15+20, bounds = 10+20
          case "$POPSIZE" in
            explore) echo "popsizes=10 15 20" >> "$GITHUB_OUTPUT" ;;
            bounds)  echo "popsizes=10 20" >> "$GITHUB_OUTPUT" ;;
            *)       echo "popsizes=$POPSIZE" >> "$GITHUB_OUTPUT" ;;
          esac

          # Maxiter — mid_high = 400+800
          case "$MAXITER" in
            mid_high) echo "maxiters=400 800" >> "$GITHUB_OUTPUT" ;;
            *)        echo "maxiters=$MAXITER" >> "$GITHUB_OUTPUT" ;;
          esac

  # -------------------------------------------------------------------
  # Main job: one per ISO, loops all other dims sequentially.
  # Loop order: seed → demand → scenario → gas_mode → popsize →
  #             maxiter → pathway
  # Pathway is innermost because A's winners seed B/C/D (REF_FLAG).
  # -------------------------------------------------------------------
  de-optimize-tf:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    concurrency:
      group: step2-3-de-tf-${{ matrix.iso }}-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Verify prerequisites
        run: |
          for f in data/eia-930/eia_generation_profiles.parquet data/eia-930/eia_demand_profiles.parquet; do
            if [ ! -f "$f" ]; then
              echo "::error::$f not found. Run Step 0 data fetch first."
              exit 1
            fi
          done
          if [ ! -f "data/hybrid_profiles/${{ matrix.iso }}_hybrid_profiles.npz" ]; then
            echo "::warning::Hybrid profiles not found for ${{ matrix.iso }} — hybrids will be zero"
          fi

      - name: Verify thermal fleet script exists
        run: |
          if [ ! -f "scripts/step2_3_de_pathway_tf.py" ]; then
            echo "::error::scripts/step2_3_de_pathway_tf.py not found. Commit it first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Verify imports
        working-directory: scripts
        run: |
          python -c "
          import numpy, numba, pyarrow, pandas, scipy
          from scipy.optimize import differential_evolution
          print(f'numpy={numpy.__version__}')
          print(f'scipy={scipy.__version__}')

          import pipeline_config as pc
          # Verify thermal fleet functions exist
          fleet = pc.thermal_fleet_mw('ERCOT', 2030, 60.0)
          peak = pc.thermal_peak_credit_mw('ERCOT', 2030, 60.0)
          print(f'Thermal fleet OK — ERCOT 2030 @60% CFE: gas={fleet[\"gas_mw\"]:,.0f} coal={fleet[\"coal_mw\"]:,.0f} peak={peak:,.0f}')
          "

      - name: Ensure output directory
        run: mkdir -p data/step2.3-de/thermal-fleet

      # ------------------------------------------------------------------
      # Nested loop: seed × demand × scenario × gas_mode × popsize ×
      #              maxiter × pathway
      #
      # Pathway is innermost so A's winners file can seed B/C/D.
      # REF_FLAG resets at the top of each pathway sweep (i.e., every
      # unique combo of the outer dimensions).
      # ------------------------------------------------------------------
      - name: "Run DE optimizer (thermal fleet) — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          PATHWAYS: ${{ needs.prepare.outputs.pathways }}
          GAS_MODES: ${{ needs.prepare.outputs.gas_modes }}
          SCENARIOS: ${{ needs.prepare.outputs.scenarios }}
          DEMANDS: ${{ needs.prepare.outputs.demands }}
          POPSIZES: ${{ needs.prepare.outputs.popsizes }}
          MAXITERS: ${{ needs.prepare.outputs.maxiters }}
          SEED_LIST: ${{ needs.prepare.outputs.seed_list }}
        timeout-minutes: 330
        run: |
          set -euo pipefail
          run_count=0
          t_total=$SECONDS

          for SEED in $SEED_LIST; do
            echo ""
            echo "############################################################"
            echo "# SEED $SEED"
            echo "############################################################"

            for dg in $DEMANDS; do
              for sc in $SCENARIOS; do
                for gm in $GAS_MODES; do
                  for ps in $POPSIZES; do
                    for mi in $MAXITERS; do

                      # Reset ref-winners for each outer-dimension combo
                      REF_FLAG=""

                      for pw in $PATHWAYS; do
                        run_count=$((run_count + 1))
                        echo ""
                        echo "============================================================"
                        echo "[run $run_count] $ISO pw=$pw gas=$gm scenario=$sc demand=$dg"
                        echo "  popsize=$ps maxiter=$mi workers=$WORKERS seed=$SEED"
                        echo "  target_2040=$TARGET_2040 target_2050=$TARGET_2050"
                        echo "============================================================"
                        t0=$SECONDS

                        python scripts/step2_3_de_pathway_tf.py \
                          --iso "$ISO" \
                          --pathway "$pw" \
                          --gas-mode "$gm" \
                          --popsize "$ps" \
                          --maxiter "$mi" \
                          --workers "$WORKERS" \
                          --seed "$SEED" \
                          --scenario "$sc" \
                          --demand-growth "$dg" \
                          --target-2040 "$TARGET_2040" \
                          --target-2050 "$TARGET_2050" \
                          $REF_FLAG

                        echo "[run $run_count] Pathway $pw done in $(( SECONDS - t0 ))s"

                        # After pathway A, set ref-winners flag for subsequent pathways
                        # (path-dependent seeding: B/C/D warm-start from A's winners)
                        if [ "$pw" = "A" ]; then
                          WINNERS_FILE="data/step2.3-de/thermal-fleet/${ISO}_pathwayA_${sc}_${dg}_p${ps}_i${mi}_s${SEED}_g${gm}_tf_winners.json"
                          if [ -f "$WINNERS_FILE" ]; then
                            REF_FLAG="--ref-winners $WINNERS_FILE"
                            echo "[workflow] Will seed subsequent pathways with $WINNERS_FILE"
                          fi
                        fi
                      done

                    done
                  done
                done
              done
            done
          done

          echo ""
          echo "============================================================"
          echo "[workflow] All $run_count runs complete in $(( SECONDS - t_total ))s"
          echo "============================================================"

      - name: "Verify outputs — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
        run: |
          count=$(find data/step2.3-de/thermal-fleet/ -name "${ISO}_*_tf.parquet" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No _tf parquet files produced for ${ISO}"
            exit 1
          fi
          echo "[verify] Found $count parquet file(s) for $ISO:"
          find data/step2.3-de/thermal-fleet/ -name "${ISO}_*_tf.parquet" -exec ls -lh {} \;

      - name: "Push results — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          SEED_LIST: ${{ needs.prepare.outputs.seed_list }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)

          # Annotate branch name with seed info
          SEED_TAG=$(echo "$SEED_LIST" | tr ' ' '-')
          branch="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO}-s${SEED_TAG}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"

          # Stage all _tf output files for this ISO
          file_count=0
          for f in data/step2.3-de/thermal-fleet/${ISO}_*_tf.parquet data/step2.3-de/thermal-fleet/${ISO}_*_tf_winners.json; do
            [ -f "$f" ] || continue
            git add "$f"
            file_count=$((file_count + 1))
          done

          if [ "$file_count" -eq 0 ]; then
            echo "::error::No _tf output files found for ${ISO}"
            exit 1
          fi

          COMMIT_MSG="Step 2.3 DE thermal fleet: ${ISO} pw=${{ inputs.pathway }} gas=${{ inputs.gas_mode }} sc=${{ inputs.scenario }} dg=${{ inputs.demand_growth }} pop=${{ inputs.popsize }} iter=${{ inputs.maxiter }} seeds=${SEED_TAG}"
          git commit -m "$COMMIT_MSG"
          git push origin "$branch"
          echo "[push] Branch created: ${branch} ($file_count files)"
          echo "BRANCH=${branch}" >> "${GITHUB_ENV}"

      - name: Summary
        if: always()
        env:
          ISO: ${{ matrix.iso }}
          PATHWAYS: ${{ needs.prepare.outputs.pathways }}
          GAS_MODES: ${{ needs.prepare.outputs.gas_modes }}
          SCENARIOS: ${{ needs.prepare.outputs.scenarios }}
          DEMANDS: ${{ needs.prepare.outputs.demands }}
          POPSIZES: ${{ needs.prepare.outputs.popsizes }}
          MAXITERS: ${{ needs.prepare.outputs.maxiters }}
          SEED_LIST: ${{ needs.prepare.outputs.seed_list }}
        run: |
          {
            echo "## Step 2.3 DE Thermal Fleet — ${ISO}"
            echo ""
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Pathway | \`${{ inputs.pathway }}\` → \`${PATHWAYS}\` |"
            echo "| Gas mode | \`${{ inputs.gas_mode }}\` → \`${GAS_MODES}\` |"
            echo "| Scenario | \`${{ inputs.scenario }}\` → \`${SCENARIOS}\` |"
            echo "| Demand | \`${{ inputs.demand_growth }}\` → \`${DEMANDS}\` |"
            echo "| Popsize | \`${{ inputs.popsize }}\` → \`${POPSIZES}\` |"
            echo "| Maxiter | \`${{ inputs.maxiter }}\` → \`${MAXITERS}\` |"
            echo "| Seed(s) | \`${SEED_LIST}\` |"
            echo "| Seed mode | \`${{ inputs.seed_mode }}\` |"
            echo ""
            echo "**Thermal fleet model:** gas + coal + oil peak credit with CFE-driven coal retirement."
            echo "Output tagged \`_tf\` — does not overwrite baseline results."
            echo ""
            if [ -n "${BRANCH:-}" ]; then
              echo "Branch: \`${BRANCH}\`"
            fi
            echo ""
            echo "Run **Squash Pipeline Branches** with pattern \`auto/.*step2-3-de-tf\` to consolidate."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-3-de-tf-${{ matrix.iso }}-${{ github.run_id }}
          path: data/step2.3-de/thermal-fleet/
          retention-days: 30
          if-no-files-found: warn
