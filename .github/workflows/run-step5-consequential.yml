name: Run Step 6 Consequential Analysis

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: 'Which consequential scripts to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - consequential_queue
          - scenario_comparison

env:
  BRANCH_PREFIX: step6-consequential

jobs:
  run-consequential:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${SCRIPTS_LABEL}" >> "$GITHUB_ENV"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          if [ -d "data/step4-gas-ccs-parquets" ] && ls data/step4-gas-ccs-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-4 Gas CCS parquets found"
            HAS_DATA=true
          elif [ -d "data/step3-cost-opt-parquets" ] && ls data/step3-cost-opt-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-3 Cost-Opt parquets found (fallback)"
            HAS_DATA=true
          fi

          if [ -f "dashboard/js/shared-data.js" ]; then
            echo "shared-data.js found"
          else
            echo "WARNING: dashboard/js/shared-data.js not found — scenario_comparison will fail"
            if [ "${{ github.event.inputs.scripts }}" = "scenario_comparison" ]; then
              echo "ERROR: scenario_comparison selected but shared-data.js missing."
              exit 1
            fi
          fi

          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No parquets found. Run Step 3/4 first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow numba

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step5-post-processing
          mkdir -p dashboard/js

      - name: "Step 6: Consequential Queue"
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'consequential_queue' }}
        run: python scripts/step6_consequential_queue.py

      - name: "Step 6: Scenario Comparison"
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'scenario_comparison' }}
        run: python scripts/step6_scenario_comparison.py

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step5-post-processing/consequential_queue.json 2>/dev/null || true
          git add -f dashboard/js/consequential-queue-data.js 2>/dev/null || true
          git add -f data/step5-post-processing/scenario_comparison.json 2>/dev/null || true
          git add -f dashboard/js/scenario-comparison-data.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          git commit -m "Step 6 Consequential: ${SCRIPTS_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && break
            echo "$PUSH_OUTPUT"
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then exit 1; fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then exit 1; fi
            sleep $((2 ** i))
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          PR_BODY="## Summary"$'\n'"- Step 6 consequential analysis (**${SCRIPTS_LABEL}**)"$'\n'"- Dispatch-cache-based hourly emission accounting"$'\n'"- Auto-generated by GitHub Actions"
          gh pr create \
            --title "Step 6 Consequential: ${SCRIPTS_LABEL}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
