name: "Step 6.2: Update LMP Page"

# Runs scripts sequentially to populate the Wholesale Price (LMP) page:
#   1. step6_compute_lmp_prices.py — synthetic 8760-hour LMP per ISO × threshold × fuel level
#   2. extract_lmp_dashboard_data.py — extracts LMP parquets into dashboard/js/lmp-data.js
#
# Output: data/step5-post-processing/lmp/{ISO}_lmp.parquet, dashboard/js/lmp-data.js

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to compute'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which script to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - compute-lmp
          - extract-dashboard
      fuel_level:
        description: 'Fuel price level (or ALL for L/M/H)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - L
          - M
          - H
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-2-lmp

jobs:
  update-lmp-page:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0
          lfs: true

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ inputs.iso }}"
          SCRIPT_LABEL="${{ inputs.script }}"
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${SCRIPT_LABEL}-${ISO_LABEL}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"
          # Align .github/workflows/ with default branch (GITHUB_TOKEN lacks workflows permission)
          git checkout origin/master -- .github/workflows/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Align workflow files with default branch"

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          for dir in data/step4-gas-ccs-parquets data/step3-cost-opt-parquets; do
            if [ -d "$dir" ] && ls "$dir"/*.parquet >/dev/null 2>&1; then
              HAS_DATA=true
            fi
          done
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No step-3 or step-4 parquets found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: |
          mkdir -p data/step5-post-processing/lmp
          mkdir -p dashboard/js

      # ════════════════════════════════════════════════════════════════════
      # Sequential: Compute LMP → Extract dashboard JS
      # ════════════════════════════════════════════════════════════════════

      - name: "1/2 — Compute LMP Prices"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'compute-lmp' }}
        run: |
          ISO="${{ inputs.iso }}"
          FL="${{ inputs.fuel_level }}"

          if [ "$ISO" = "ALL" ]; then
            for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
              echo "=== Computing LMP for $iso ==="
              if [ "$FL" = "ALL" ]; then
                python scripts/step6_compute_lmp_prices.py --iso "$iso" || echo "WARNING: $iso failed, continuing..."
              else
                python scripts/step6_compute_lmp_prices.py --iso "$iso" --fuel-level "$FL" || echo "WARNING: $iso failed, continuing..."
              fi
            done
          else
            if [ "$FL" = "ALL" ]; then
              python scripts/step6_compute_lmp_prices.py --iso "$ISO"
            else
              python scripts/step6_compute_lmp_prices.py --iso "$ISO" --fuel-level "$FL"
            fi
          fi

      - name: "2/2 — Extract Dashboard Data"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'extract-dashboard' }}
        run: |
          if [ -f scripts/extract_lmp_dashboard_data.py ]; then
            echo "=== Extracting LMP dashboard data ==="
            python scripts/extract_lmp_dashboard_data.py
          else
            echo "extract_lmp_dashboard_data.py not found — skipping JS generation"
          fi

      - name: Commit and push
        run: |
          git add -f data/step5-post-processing/lmp/ 2>/dev/null || true
          git add -f dashboard/js/lmp-data.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6.2 LMP: ${{ inputs.script }} ${{ inputs.iso }} fuel=${{ inputs.fuel_level }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 6.2 LMP: ${{ inputs.script }} ${{ inputs.iso }}" \
            --body "## Summary
          Updates the Wholesale Price (LMP) page for **${{ inputs.iso }}** (script: ${{ inputs.script }}, fuel=${{ inputs.fuel_level }}).

          ## Scripts (sequential when ALL)
          1. \`step6_compute_lmp_prices.py\` — synthetic 8760-hour LMP per ISO × threshold × fuel level
          2. \`extract_lmp_dashboard_data.py\` — extracts parquets into dashboard JS

          ## Outputs
          - \`data/step5-post-processing/lmp/{ISO}_lmp.parquet\`
          - \`dashboard/js/lmp-data.js\`" \
            --base ${{ inputs.branch || 'master' }} \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
