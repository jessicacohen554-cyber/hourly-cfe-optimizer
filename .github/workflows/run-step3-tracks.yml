name: Run Step 3 Tracks 2-3 (NB + CTR)

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Which track to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - nb-only
          - ctr-only
      iso:
        description: 'ISO to run (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      sensitivity_mode:
        description: 'Medium-only (fast) or Full (all combos)'
        required: true
        default: 'medium'
        type: choice
        options:
          - medium
          - full
      fresh:
        description: 'Ignore checkpoint and start from scratch'
        required: false
        default: true
        type: boolean

env:
  BRANCH_PREFIX: step3-tracks

jobs:
  run-tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          TRACK_LABEL="${{ github.event.inputs.track }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${TRACK_LABEL}-${ISO_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${TRACK_LABEL}-${ISO_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify step-2 EF parquets exist
        run: |
          if [ ! -d data/step2-ef-parquets ] || [ -z "$(ls data/step2-ef-parquets/*.parquet 2>/dev/null)" ]; then
            echo "ERROR: Step-2 EF parquets not found in data/step2-ef-parquets/"
            echo "Run Step 2 workflow first and merge results to master."
            exit 1
          fi
          echo "Step-2 EF parquets found:"
          ls -lh data/step2-ef-parquets/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step3-cost-opt-parquets
          mkdir -p dashboard

      - name: Build arguments
        id: build-args
        run: |
          # ISO flag
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            ISO_FLAGS=""
          else
            ISO_FLAGS="--iso $INPUT_ISO"
          fi
          echo "iso_flags=$ISO_FLAGS" >> "$GITHUB_OUTPUT"

          # Sensitivity mode
          SENS_FLAGS=""
          if [ "${{ github.event.inputs.sensitivity_mode }}" = "full" ]; then
            SENS_FLAGS="--full"
          fi
          echo "sens_flags=$SENS_FLAGS" >> "$GITHUB_OUTPUT"

          # Fresh flag
          FRESH_FLAGS=""
          if [ "${{ github.event.inputs.fresh }}" = "true" ]; then
            FRESH_FLAGS="--fresh"
          fi
          echo "fresh_flags=$FRESH_FLAGS" >> "$GITHUB_OUTPUT"

          # Track flag for the script
          INPUT_TRACK="${{ github.event.inputs.track }}"
          if [ "$INPUT_TRACK" = "both" ]; then
            TRACK_FLAG="--track both"
          elif [ "$INPUT_TRACK" = "nb-only" ]; then
            TRACK_FLAG="--track nb"
          else
            TRACK_FLAG="--track ctr"
          fi
          echo "track_flag=$TRACK_FLAG" >> "$GITHUB_OUTPUT"

      # ════════════════════════════════════════════════════════════════════
      # NEW-BUILD (Track 2)
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 2: New-Build Cost Optimization"
        if: ${{ github.event.inputs.track == 'both' || github.event.inputs.track == 'nb-only' }}
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  TRACK 2: NEW-BUILD (NB)"
          echo "  ISO: ${{ github.event.inputs.iso }}"
          echo "  Sensitivity: ${{ github.event.inputs.sensitivity_mode }}"
          echo "═══════════════════════════════════════════════════════════"
          python scripts/step3_track_nb_ctr.py \
            ${{ steps.build-args.outputs.fresh_flags }} \
            --track nb \
            ${{ steps.build-args.outputs.iso_flags }} \
            ${{ steps.build-args.outputs.sens_flags }}

      # ════════════════════════════════════════════════════════════════════
      # COST-TO-REPLACE (Track 3)
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 3: Cost-to-Replace Optimization"
        if: ${{ github.event.inputs.track == 'both' || github.event.inputs.track == 'ctr-only' }}
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  TRACK 3: COST-TO-REPLACE (CTR)"
          echo "  ISO: ${{ github.event.inputs.iso }}"
          echo "  Sensitivity: ${{ github.event.inputs.sensitivity_mode }}"
          echo "═══════════════════════════════════════════════════════════"
          python scripts/step3_track_nb_ctr.py \
            ${{ steps.build-args.outputs.fresh_flags }} \
            --track ctr \
            ${{ steps.build-args.outputs.iso_flags }} \
            ${{ steps.build-args.outputs.sens_flags }}

      # ════════════════════════════════════════════════════════════════════
      # COMMIT & PR
      # ════════════════════════════════════════════════════════════════════

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage all track outputs
          git add -f data/step3-cost-opt-parquets/ 2>/dev/null || true
          git add -f dashboard/track_scenarios.parquet 2>/dev/null || true
          git add -f dashboard/track_demand_growth.parquet 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          ISO_LABEL="${{ github.event.inputs.iso }}"
          TRACK_LABEL="${{ github.event.inputs.track }}"
          SENS_LABEL="${{ github.event.inputs.sensitivity_mode }}"
          git commit -m "Step 3 Tracks: ${TRACK_LABEL} | ${ISO_LABEL} | ${SENS_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TRACK_LABEL="${{ github.event.inputs.track }}"
          SENS_LABEL="${{ github.event.inputs.sensitivity_mode }}"
          ISO_LABEL="${{ github.event.inputs.iso }}"
          PR_BODY="## Summary"$'\n'"- Step 3 tracks: **${TRACK_LABEL}** for **${ISO_LABEL}** (${SENS_LABEL} sensitivity)"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 3 Tracks: ${TRACK_LABEL} | ${ISO_LABEL} | ${SENS_LABEL}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
