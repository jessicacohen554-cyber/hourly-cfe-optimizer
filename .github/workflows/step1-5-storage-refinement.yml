name: "Step 1.5: Storage Refinement"

# Matrix strategy: ISO × threshold band — up to 21 parallel jobs (7 ISOs × 3 bands).
# HIGH band is split into per-threshold jobs (5 jobs per ISO) for better
# resume support — each threshold auto-commits inline so partial progress
# is banked even if the runner times out.
#
# Each (ISO, band) cell runs on its own runner and commits+pushes its own branch
# (matching the inline-commit pattern used by Steps 1.2-1.4 and Step 2).
#
# Threshold bands:
#   LOW  — 55, 60, 65, 70, 75, 80
#   MID  — 85, 87.5, 90, 92.5, 95
#   HIGH — 97.5, 99, 99.5, 99.9 (split into per-threshold jobs)
#
# Storage grids are the union of V1 (near-term) and V2 (2050-oriented) caps.
# Floor/fine mix augmentation is always on.
#
# Prerequisite: Steps 1.2-1.4 (Zone Search + Floor + Fine Grid) must have run first.
# Output: data/step1-pfs/{ISO}_t{XX}_storage.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region(s) to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      threshold_band:
        description: 'Threshold band(s) to run (ignored if custom_thresholds set)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - LOW
          - MID
          - HIGH
      custom_thresholds:
        description: 'Custom thresholds (e.g. "90,95,99"). Overrides threshold_band.'
        required: false
        default: ''
        type: string
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"
  # Threshold bands for matrix expansion
  THRESHOLDS_LOW:  "55,60,65,70,75,80"
  THRESHOLDS_MID:  "85,87.5,90,92.5,95"
  THRESHOLDS_HIGH: "97.5,99,99.5,99.9"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Build the ISO × threshold-band matrix
  # ════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      high_matrix: ${{ steps.build.outputs.high_matrix }}
      run_low_mid: ${{ steps.build.outputs.run_low_mid }}
      run_high: ${{ steps.build.outputs.run_high }}
    steps:
      - name: Build matrix
        id: build
        run: |
          # ── ISO dimension ────────────────────────────────────────────
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            ISOS='["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]'
          else
            ISOS='["${{ inputs.iso }}"]'
          fi

          # ── Threshold-band dimension ────────────────────────────────
          CUSTOM="${{ inputs.custom_thresholds }}"
          RUN_LOW_MID="false"
          RUN_HIGH="false"

          if [ -n "$CUSTOM" ]; then
            # Custom thresholds — run as single CUSTOM band (no HIGH split)
            BANDS='["CUSTOM"]'
            RUN_LOW_MID="true"
          elif [ "${{ inputs.threshold_band }}" = "ALL" ]; then
            BANDS='["LOW","MID"]'
            RUN_LOW_MID="true"
            RUN_HIGH="true"
          elif [ "${{ inputs.threshold_band }}" = "HIGH" ]; then
            BANDS='[]'
            RUN_HIGH="true"
          else
            BANDS='["${{ inputs.threshold_band }}"]'
            RUN_LOW_MID="true"
          fi

          # LOW/MID matrix (bands run as grouped thresholds)
          echo "matrix={\"iso\":${ISOS},\"band\":${BANDS}}" >> "$GITHUB_OUTPUT"

          # HIGH matrix (per-threshold jobs for better resume)
          echo "high_matrix={\"iso\":${ISOS},\"threshold\":[\"97.5\",\"99\",\"99.5\",\"99.9\"]}" >> "$GITHUB_OUTPUT"

          echo "run_low_mid=${RUN_LOW_MID}" >> "$GITHUB_OUTPUT"
          echo "run_high=${RUN_HIGH}" >> "$GITHUB_OUTPUT"

          echo "Matrix: iso=${ISOS} × bands=${BANDS} (low_mid=${RUN_LOW_MID}, high=${RUN_HIGH})"

  # ════════════════════════════════════════════════════════════════════════
  # LOW / MID bands — grouped thresholds per job
  # ════════════════════════════════════════════════════════════════════════
  fine-storage:
    needs: prepare
    if: needs.prepare.outputs.run_low_mid == 'true' && needs.prepare.outputs.matrix != '{"iso":[],"band":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 200

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false   # don't cancel other cells if one fails
      max-parallel: 7    # limit concurrent clones

    permissions:
      contents: write    # needed for commit + push
      workflows: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        lfs: false

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        BAND_LOWER=$(echo "${{ matrix.band }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="auto/${TIMESTAMP}-step1-5-storage-${ISO_LOWER}-${BAND_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify near-miss data exists
      run: |
        ISO="${{ matrix.iso }}"
        NM="data/step1-pfs/${ISO}_near_miss.parquet"
        if [ ! -f "$NM" ]; then
          echo "ERROR: Missing near-miss data for $ISO"
          echo "  Expected: $NM"
          echo "  Run Steps 1.2-1.4 first."
          exit 1
        fi
        ROWS=$(python3 -c "import pyarrow.parquet as pq; t=pq.read_table('$NM'); print(t.num_rows)")
        SIZE=$(du -h "$NM" | cut -f1)
        echo "OK: $ISO near-miss ($ROWS rows, $SIZE)"
        if [ "$ROWS" -eq 0 ]; then
          echo "ERROR: Near-miss file is empty (0 rows). Re-run Steps 1.2-1.4."
          exit 1
        fi

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    - name: Resolve thresholds for this band
      id: resolve
      run: |
        BAND="${{ matrix.band }}"
        CUSTOM="${{ inputs.custom_thresholds }}"
        if [ "$BAND" = "CUSTOM" ]; then
          echo "thresholds=$CUSTOM" >> "$GITHUB_OUTPUT"
          echo "label=custom" >> "$GITHUB_OUTPUT"
        elif [ "$BAND" = "LOW" ]; then
          echo "thresholds=$THRESHOLDS_LOW" >> "$GITHUB_OUTPUT"
          echo "label=low-55-80" >> "$GITHUB_OUTPUT"
        elif [ "$BAND" = "MID" ]; then
          echo "thresholds=$THRESHOLDS_MID" >> "$GITHUB_OUTPUT"
          echo "label=mid-85-95" >> "$GITHUB_OUTPUT"
        fi

    - name: "Run Step 1.5 — ${{ matrix.iso }} / ${{ matrix.band }}"
      timeout-minutes: 180
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Band: ${{ matrix.band }}"
        echo "  Thresholds: ${{ steps.resolve.outputs.thresholds }}"
        echo "═══════════════════════════════════════════════════════════"
        ARGS="--iso ${{ matrix.iso }} --thresholds ${{ steps.resolve.outputs.thresholds }}"
        echo "Running: python scripts/step1_5_storage_refinement.py $ARGS"
        eval python scripts/step1_5_storage_refinement.py $ARGS

    - name: Split any oversized parquets (safety net)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        MAX_MB=45
        for f in data/step1-pfs/"${ISO}"_*_storage*.parquet; do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "⚠ $f is ${SIZE_MB}MB (>${MAX_MB}MB), re-splitting..."
            python3 -c "import sys; sys.path.insert(0, 'scripts'); from parquet_utils import write_parquet_chunked; import pyarrow.parquet as pq; import os; t=pq.read_table('$f'); os.remove('$f'); parts=write_parquet_chunked(t, '$f', max_mb=$MAX_MB); print(f'Re-split into {len(parts)} parts')"
          fi
        done

    - name: Commit results (per-file to stay under 50 MB)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        BAND="${{ matrix.band }}"
        CUSTOM="${{ inputs.custom_thresholds }}"
        [ -n "$CUSTOM" ] && BAND="custom($CUSTOM)"
        COMMITTED=0

        for f in data/step1-pfs/"${ISO}"_*_storage*.parquet data/step1-pfs/"${ISO}"_storage_manifest.json; do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt 49 ]; then
            echo "ERROR: $f is ${SIZE_MB}MB — still over limit after splitting, skipping"
            continue
          fi
          git add -f "$f"
          if ! git diff --cached --quiet; then
            FNAME=$(basename "$f")
            git commit -m "Step 1.5 Storage: ${ISO}×${BAND} ${FNAME} (${SIZE_MB}MB) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            COMMITTED=$((COMMITTED + 1))
          fi
        done
        if [ "$COMMITTED" -eq 0 ]; then
          echo "No new results to commit (files already match HEAD)."
        else
          echo "Committed $COMMITTED file(s)"
        fi

    - name: Push results
      if: always()
      run: |
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "════════════════════════════════════════════════════"
        echo "  Branch: $TARGET_BRANCH"
        echo "  Merge into master to bank the storage results."
        echo "════════════════════════════════════════════════════"

  # ════════════════════════════════════════════════════════════════════════
  # HIGH band — per-threshold jobs with auto-commit for resume support
  #
  # Each (ISO, threshold) pair runs as its own job. The Python script
  # auto-commits after every batch flush (100K results) for thresholds
  # >= 97.5%, so even if the runner times out, partial progress is banked.
  # The manifest tracks per-threshold pass1/pass2 completion, enabling
  # seamless resume on re-run.
  # ════════════════════════════════════════════════════════════════════════
  fine-storage-high:
    needs: prepare
    if: needs.prepare.outputs.run_high == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.high_matrix) }}
      fail-fast: false
      max-parallel: 7

    permissions:
      contents: write
      workflows: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        lfs: false

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        # Normalize threshold for branch name (99.9 → 99p9)
        T_LABEL=$(echo "${{ matrix.threshold }}" | tr '.' 'p')
        TARGET_BRANCH="auto/${TIMESTAMP}-step1-5-storage-${ISO_LOWER}-t${T_LABEL}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify near-miss data exists
      run: |
        ISO="${{ matrix.iso }}"
        NM="data/step1-pfs/${ISO}_near_miss.parquet"
        if [ ! -f "$NM" ]; then
          echo "ERROR: Missing near-miss data for $ISO"
          echo "  Expected: $NM"
          echo "  Run Steps 1.2-1.4 first."
          exit 1
        fi
        ROWS=$(python3 -c "import pyarrow.parquet as pq; t=pq.read_table('$NM'); print(t.num_rows)")
        SIZE=$(du -h "$NM" | cut -f1)
        echo "OK: $ISO near-miss ($ROWS rows, $SIZE)"
        if [ "$ROWS" -eq 0 ]; then
          echo "ERROR: Near-miss file is empty (0 rows). Re-run Steps 1.2-1.4."
          exit 1
        fi

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    - name: "Run Step 1.5 — ${{ matrix.iso }} / t${{ matrix.threshold }}%"
      timeout-minutes: 180
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Threshold: ${{ matrix.threshold }}%"
        echo "  Auto-commit: enabled (high threshold)"
        echo "═══════════════════════════════════════════════════════════"
        # --auto-commit enables inline git commit+push after each batch.
        # For high thresholds (>=97.5%), the script also forces auto-commit
        # internally with smaller batch flush size (100K vs 500K).
        ARGS="--iso ${{ matrix.iso }} --thresholds ${{ matrix.threshold }} --auto-commit"
        echo "Running: python scripts/step1_5_storage_refinement.py $ARGS"
        eval python scripts/step1_5_storage_refinement.py $ARGS

    - name: Split any oversized parquets (safety net)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        MAX_MB=45
        for f in data/step1-pfs/"${ISO}"_*_storage*.parquet; do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "⚠ $f is ${SIZE_MB}MB (>${MAX_MB}MB), re-splitting..."
            python3 -c "import sys; sys.path.insert(0, 'scripts'); from parquet_utils import write_parquet_chunked; import pyarrow.parquet as pq; import os; t=pq.read_table('$f'); os.remove('$f'); parts=write_parquet_chunked(t, '$f', max_mb=$MAX_MB); print(f'Re-split into {len(parts)} parts')"
          fi
        done

    - name: Commit remaining results (per-file to stay under 50 MB)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        THRESHOLD="${{ matrix.threshold }}"
        COMMITTED=0

        for f in data/step1-pfs/"${ISO}"_*_storage*.parquet data/step1-pfs/"${ISO}"_storage_manifest.json; do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt 49 ]; then
            echo "ERROR: $f is ${SIZE_MB}MB — still over limit after splitting, skipping"
            continue
          fi
          git add -f "$f"
          if ! git diff --cached --quiet; then
            FNAME=$(basename "$f")
            git commit -m "Step 1.5 Storage: ${ISO}×t${THRESHOLD}% ${FNAME} (${SIZE_MB}MB) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            COMMITTED=$((COMMITTED + 1))
          fi
        done
        if [ "$COMMITTED" -eq 0 ]; then
          echo "No additional results to commit (all banked by auto-commit)."
        else
          echo "Committed $COMMITTED file(s)"
        fi

    - name: Push results
      if: always()
      run: |
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "════════════════════════════════════════════════════"
        echo "  Branch: $TARGET_BRANCH"
        echo "  Merge into master to bank the storage results."
        echo "════════════════════════════════════════════════════"
