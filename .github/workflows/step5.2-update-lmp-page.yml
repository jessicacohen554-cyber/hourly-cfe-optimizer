name: "Step 5.2: Update LMP Page"

# Runs scripts to populate the Wholesale Price (LMP) page:
#   1. step5_compute_lmp_prices.py — synthetic 8760-hour LMP per ISO × threshold × fuel level
#   2. extract_lmp_dashboard_data.py — extracts LMP parquets into dashboard/js/lmp-data.js
#
# iso=ALL fans out parallel matrix jobs for LMP computation, then merge job
# runs the global extract-dashboard script and commits everything.
# Output: data/step5-post-processing/lmp/{ISO}_lmp.parquet, dashboard/js/lmp-data.js

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to compute (ALL = parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which script to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - compute-lmp
          - extract-dashboard
      fuel_level:
        description: 'Fuel price level (or ALL for L/M/H)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - L
          - M
          - H
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step5-2-lmp

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: prepare
    if: ${{ inputs.script == 'ALL' || inputs.script == 'compute-lmp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          lfs: true

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          for dir in data/step4-gas-ccs-parquets data/step3-cost-opt-parquets; do
            if [ -d "$dir" ] && ls "$dir"/*.parquet >/dev/null 2>&1; then
              HAS_DATA=true
            fi
          done
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No step-3 or step-4 parquets found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing/lmp

      - name: "Compute LMP — ${{ matrix.iso }}"
        run: |
          FL="${{ inputs.fuel_level }}"
          if [ "$FL" = "ALL" ]; then
            python scripts/step5_compute_lmp_prices.py --iso ${{ matrix.iso }}
          else
            python scripts/step5_compute_lmp_prices.py --iso ${{ matrix.iso }} --fuel-level "$FL"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmp-${{ matrix.iso }}
          path: data/step5-post-processing/lmp/
          retention-days: 1

  merge:
    needs: [prepare, process]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.script }}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download LMP artifacts
        if: ${{ inputs.script == 'ALL' || inputs.script == 'compute-lmp' }}
        uses: actions/download-artifact@v4
        with:
          pattern: lmp-*
          path: data/step5-post-processing/lmp/
          merge-multiple: true

      - name: Set up Python
        if: ${{ inputs.script == 'ALL' || inputs.script == 'extract-dashboard' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ inputs.script == 'ALL' || inputs.script == 'extract-dashboard' }}
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure JS directory
        run: mkdir -p dashboard/js

      - name: "Extract Dashboard Data"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'extract-dashboard' }}
        run: |
          if [ -f scripts/extract_lmp_dashboard_data.py ]; then
            echo "=== Extracting LMP dashboard data ==="
            python scripts/extract_lmp_dashboard_data.py
          else
            echo "extract_lmp_dashboard_data.py not found — skipping JS generation"
          fi

      - name: Batched commit and push (per-ISO + dashboard JS)
        run: |
          git config http.postBuffer 524288000

          push_with_retry() {
            local label="$1"
            local MAX_RETRIES=4
            for i in $(seq 1 $MAX_RETRIES); do
              echo "  Push attempt $i/$MAX_RETRIES for ${label}..."
              git push -u origin "$TARGET_BRANCH" 2>&1 && return 0
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "  ERROR: Push failed for ${label} after $MAX_RETRIES attempts"
                return 1
              fi
              BACKOFF=$((2 ** i))
              echo "  Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
            done
          }

          PUSHED=false

          # Determine ISOs to batch
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
          else
            ISOS="${{ inputs.iso }}"
          fi

          # Batch 1: LMP parquets per-ISO
          for iso in $ISOS; do
            echo "--- Batching LMP commit for $iso ---"

            FILES=$(find data/step5-post-processing/lmp/ -name "*${iso}*" -type f 2>/dev/null || true)
            if [ -z "$FILES" ]; then
              echo "  No LMP files for $iso — skipping"
              continue
            fi

            git add -f $FILES
            if git diff --cached --quiet; then
              echo "  No changes for $iso — skipping"
              continue
            fi

            BATCH_MB=$(du -cm $FILES | tail -1 | cut -f1)
            echo "  Staging ~${BATCH_MB} MB for $iso"
            git commit -m "Step 6.2 LMP: ${iso} fuel=${{ inputs.fuel_level }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if push_with_retry "$iso"; then
              PUSHED=true
            else
              echo "  Per-ISO push failed for $iso — falling back to per-file batching"
              git reset HEAD~1

              for f in $FILES; do
                FNAME=$(basename "$f")
                git add -f "$f"
                if git diff --cached --quiet; then continue; fi
                FILE_MB=$(du -m "$f" | cut -f1)
                echo "  Staging file: $FNAME (~${FILE_MB} MB)"
                git commit -m "Step 6.2 LMP: ${iso} ${FNAME} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if push_with_retry "$FNAME"; then
                  PUSHED=true
                else
                  echo "  WARNING: Could not push $FNAME — resetting commit"
                  git reset HEAD~1
                fi
              done
            fi
          done

          # Batch 2: Dashboard JS (small file, separate commit)
          if [ -f dashboard/js/lmp-data.js ]; then
            git add -f dashboard/js/lmp-data.js
            if ! git diff --cached --quiet; then
              echo "--- Committing dashboard JS ---"
              git commit -m "Step 6.2 LMP: lmp-data.js — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if push_with_retry "lmp-data.js"; then
                PUSHED=true
              else
                echo "  WARNING: Could not push lmp-data.js — resetting commit"
                git reset HEAD~1
              fi
            fi
          fi

          if [ "$PUSHED" = "false" ]; then
            echo "No changes were pushed"
          fi

