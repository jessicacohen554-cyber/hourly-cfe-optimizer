name: "Step 2.3 Sobol Adaptive: Quasi-Random Pathway Optimizer"

# Runs step2_3_adaptive_sobol.py — Sobol-sequence-based quasi-random sampling
# with four pathways:
#   A = VRE-only
#   B = full P3 incl nuclear/CCS/offshore, NOAK 2035
#   C = same resources as B, delayed deployment NOAK 2040
#   D = same resources as B, further-delayed deployment NOAK 2045
# and two cost modes (incremental clean / clean minus gas savings).
#
# iso=ALL fans out to 7 parallel matrix jobs, each pushing its own branch.
# Run squash-pipeline-branches.yml with pattern "auto/.*step2-3-sobol"
# afterwards to consolidate into master.
#
# pathway options:
#   A, B, C, D       — run a single pathway
#   BOTH              — run A then B (legacy compat)
#   ALL_FIRM          — run B then C then D sequentially
#   ALL               — run A then B then C then D sequentially
#
# archetype:
#   all               — full cross-archetype seeding (default)
#   solar-led, wind-led, balanced, nuclear-heavy, offshore-heavy
#                     — label-only; the script seeds all archetypes internally.
#                       Use separate dispatches with different n_beams to achieve
#                       per-archetype beam control.
#
# scenario=all runs all 3 named cost scenarios (base, firm_high_vre_low,
# firm_low_vre_high). Otherwise runs only the selected scenario.
#
# demand_growth=all crosses Low × Medium × High (--batch-demand).
# Otherwise runs only the selected level.
#
# Output parquets are tagged with __sobol to distinguish from LHS results:
#   data/step2.3-adaptive/{ISO}__pathway{A|B|C|D}__sobol.parquet
#
# Prerequisite: Step 2.1 EF parquets (incl 2.1e augment), EIA-930 profiles,
#               hybrid profiles.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run (ALL = parallel across 7)'
        required: true
        default: 'ERCOT'
        type: choice
        options:
          - ERCOT
          - PJM
          - CAISO
          - NYISO
          - NEISO
          - MISO
          - SPP
          - ALL
      pathway:
        description: 'Pathway (A=VRE-only, B=NOAK 2035, C=NOAK 2040, D=NOAK 2045, BOTH=A+B, ALL_FIRM=B+C+D, ALL=A+B+C+D)'
        required: true
        default: 'B'
        type: choice
        options:
          - A
          - B
          - C
          - D
          - BOTH
          - ALL_FIRM
          - ALL
      archetype:
        description: 'Archetype focus (all = cross-archetype seeding). Per-archetype beam control: dispatch separately with different n_beams.'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - solar-led
          - wind-led
          - balanced
          - nuclear-heavy
          - offshore-heavy
      demand_growth:
        description: 'Demand growth level (all = Low × Medium × High)'
        required: true
        default: 'Medium'
        type: choice
        options:
          - Medium
          - Low
          - High
          - all
      scenario:
        description: 'Cost scenario (all = base × firm_high_vre_low × firm_low_vre_high)'
        required: true
        default: 'base'
        type: choice
        options:
          - base
          - firm_high_vre_low
          - firm_low_vre_high
          - all
      n_beams:
        description: 'Number of seed beams per config (firm pathways auto-scale +2). Set per-archetype by dispatching separately.'
        required: false
        default: '5'
        type: string
      stage2_samples:
        description: 'Sobol sample count per year-step (auto-scaled by dimensionality). Default: 5000'
        required: false
        default: '5000'
        type: string
      runner_size:
        description: 'Runner size (standard = 2-core/7GB, large = 16-core/64GB)'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - large
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step2-3-sobol
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  sobol:
    needs: prepare
    runs-on: ${{ inputs.runner_size == 'large' && 'ubuntu-24.04-16core' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.runner_size == 'large' && 120 || 360 }}
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    # Per-ISO + per-dispatch concurrency — different dispatches run in parallel;
    # re-dispatch of the SAME run queues behind it.
    concurrency:
      group: step2-3-sobol-${{ matrix.iso }}-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Verify step 2.1 EF parquets exist
        run: |
          if [ ! -d data/step2.1-ef ] || ! ls data/step2.1-ef/step_2_1_EF_${{ matrix.iso }}_*.parquet >/dev/null 2>&1; then
            echo "ERROR: Step 2.1 EF parquets not found for ${{ matrix.iso }}. Run Step 2.1 first."
            exit 1
          fi

      - name: Verify EIA-930 profiles exist
        run: |
          for f in data/eia-930/eia_generation_profiles.parquet data/eia-930/eia_demand_profiles.parquet; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f not found. Run Step 0 data fetch first."
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy numba pyarrow scipy

      - name: Ensure output directory
        run: mkdir -p data/step2.3-adaptive

      - name: Build CLI flags
        id: cli
        env:
          ISO: ${{ matrix.iso }}
          PATHWAY: ${{ inputs.pathway }}
          DEMAND: ${{ inputs.demand_growth }}
          SCENARIO: ${{ inputs.scenario }}
          N_BEAMS: ${{ inputs.n_beams }}
          STAGE2: ${{ inputs.stage2_samples }}
        run: |
          # Demand flags
          if [ "$DEMAND" = "all" ]; then
            DEMAND_FLAG="--batch-demand"
          else
            DEMAND_FLAG="--demand-growth $DEMAND"
          fi

          # Scenario flags
          if [ "$SCENARIO" = "all" ]; then
            SCENARIO_FLAG="--batch"
          else
            SCENARIO_FLAG="--scenario $SCENARIO"
          fi

          COMMON="--iso $ISO --n-beams $N_BEAMS"
          COMMON="$COMMON --stage2-samples $STAGE2"
          COMMON="$COMMON $DEMAND_FLAG $SCENARIO_FLAG"
          echo "common=$COMMON" >> "$GITHUB_OUTPUT"

          # Determine which pathways to run
          case "$PATHWAY" in
            BOTH)      echo "pathways=A B" >> "$GITHUB_OUTPUT" ;;
            ALL_FIRM)  echo "pathways=B C D" >> "$GITHUB_OUTPUT" ;;
            ALL)       echo "pathways=A B C D" >> "$GITHUB_OUTPUT" ;;
            *)         echo "pathways=$PATHWAY" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: "Clean stale results — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          PATHWAYS: ${{ steps.cli.outputs.pathways }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          for pw in $PATHWAYS; do
            if [ "$SCENARIO" = "all" ]; then
              # Batch mode: clean everything for this pathway (both sobol and non-sobol)
              stale=$(ls data/step2.3-adaptive/${ISO}__pathway${pw}__*.json data/step2.3-adaptive/${ISO}__pathway${pw}*__sobol.parquet 2>/dev/null | wc -l)
              if [ "$stale" -gt 0 ]; then
                echo "[clean] Removing ${stale} stale files for ${ISO} pathway ${pw} (all scenarios, sobol)"
                rm -f data/step2.3-adaptive/${ISO}__pathway${pw}__*.json
                rm -f data/step2.3-adaptive/${ISO}__pathway${pw}*__sobol.parquet
              fi
            else
              # Single scenario: only clean that scenario's files
              stale=$(ls data/step2.3-adaptive/${ISO}__pathway${pw}__${SCENARIO}__*.json data/step2.3-adaptive/${ISO}__pathway${pw}__sobol.parquet 2>/dev/null | wc -l)
              if [ "$stale" -gt 0 ]; then
                echo "[clean] Removing ${stale} stale files for ${ISO} pathway ${pw} scenario ${SCENARIO} (sobol)"
                rm -f data/step2.3-adaptive/${ISO}__pathway${pw}__${SCENARIO}__*.json
                rm -f data/step2.3-adaptive/${ISO}__pathway${pw}__sobol.parquet
              fi
            fi
          done

      - name: "Run Sobol optimizer — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          COMMON: ${{ steps.cli.outputs.common }}
          PATHWAYS: ${{ steps.cli.outputs.pathways }}
        timeout-minutes: ${{ inputs.runner_size == 'large' && 100 || 330 }}
        run: |
          set -euo pipefail
          for pw in $PATHWAYS; do
            echo ""
            echo "============================================================"
            echo "[workflow] Starting Sobol Pathway $pw for $ISO"
            echo "============================================================"
            t0=$SECONDS
            python scripts/step2_3_adaptive_sobol.py --pathway "$pw" $COMMON
            echo "[workflow] Pathway $pw done in $(( SECONDS - t0 ))s"
          done

      - name: "Tag parquets with sobol — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          PATHWAYS: ${{ steps.cli.outputs.pathways }}
        run: |
          # Rename consolidated parquets: {ISO}__pathway{X}.parquet → {ISO}__pathway{X}__sobol.parquet
          for pw in $PATHWAYS; do
            src="data/step2.3-adaptive/${ISO}__pathway${pw}.parquet"
            dst="data/step2.3-adaptive/${ISO}__pathway${pw}__sobol.parquet"
            if [ -f "$src" ]; then
              mv "$src" "$dst"
              echo "[tag] ${src} → ${dst} ($(du -h "$dst" | cut -f1))"
            else
              echo "::warning::Expected parquet not found: ${src}"
            fi
          done

      - name: "Verify output — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          PATHWAY: ${{ inputs.pathway }}
        run: |
          # Check sobol-tagged consolidated parquets
          for pw in A B C D; do
            case "$PATHWAY" in
              BOTH)      [[ "$pw" == "A" || "$pw" == "B" ]] || continue ;;
              ALL_FIRM)  [[ "$pw" == "B" || "$pw" == "C" || "$pw" == "D" ]] || continue ;;
              ALL)       ;; # check all
              *)         [[ "$pw" == "$PATHWAY" ]] || continue ;;
            esac
            pq="data/step2.3-adaptive/${ISO}__pathway${pw}__sobol.parquet"
            if [ ! -f "$pq" ]; then
              echo "::error::Missing sobol parquet: ${pq}"
              exit 1
            fi
            size=$(stat -c%s "$pq" 2>/dev/null || stat -f%z "$pq")
            echo "[verify] ${pq}: ${size} bytes"
          done

          # Count JSONs for logging (not committed)
          json_count=$(ls data/step2.3-adaptive/${ISO}__pathway*.json 2>/dev/null | wc -l)
          echo "[verify] ${ISO}: ${json_count} intermediate JSONs (not committed)"

      # ── Push via GitHub REST API ──────────────────────────────────
      # Bypasses git-push pack negotiation, which fails on shallow/sparse
      # clones with HTTP 500.  Creates blob→tree→commit→ref directly.
      - name: "Push results via API — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHETYPE: ${{ inputs.archetype }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          # Include archetype in branch name when not 'all' for dispatch tracking
          if [ "$ARCHETYPE" = "all" ]; then
            branch="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO}"
          else
            branch="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ARCHETYPE}-${ISO}"
          fi
          REPO="${GITHUB_REPOSITORY}"
          SOURCE_BRANCH="${{ inputs.branch || 'master' }}"

          # ── 1. Resolve base commit + tree from source branch ──
          BASE_SHA=$(gh api "repos/${REPO}/git/ref/heads/${SOURCE_BRANCH}" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq '.tree.sha')
          echo "[api] Base commit: ${BASE_SHA}"
          echo "[api] Base tree:   ${BASE_TREE}"

          # ── 2. Upload each sobol-tagged parquet as a blob ──
          TREE_ENTRIES="[]"
          file_count=0

          for pq in data/step2.3-adaptive/${ISO}__pathway*__sobol.parquet; do
            [ -f "$pq" ] || continue
            file_count=$((file_count + 1))
            echo "[api] Uploading blob: ${pq} ($(du -h "$pq" | cut -f1))"

            BLOB_SHA=$(gh api "repos/${REPO}/git/blobs" \
              -f encoding=base64 \
              -f content="$(base64 -w0 "$pq")" \
              --jq '.sha')

            echo "[api]   → blob SHA: ${BLOB_SHA}"

            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$pq" \
              --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')
          done

          if [ "$file_count" -eq 0 ]; then
            echo "::error::No sobol parquet files found to commit for ${ISO}"
            exit 1
          fi
          echo "[api] ${file_count} blobs uploaded"

          # ── 3. Create tree with new/updated files ──
          TREE_SHA=$(echo "$TREE_ENTRIES" | jq --arg base "$BASE_TREE" \
            '{"base_tree": $base, "tree": .}' | \
            gh api "repos/${REPO}/git/trees" --input - --jq '.sha')
          echo "[api] New tree: ${TREE_SHA}"

          # ── 4. Create commit ──
          COMMIT_MSG="Step 2.3 Sobol: ${ISO} pw=${{ inputs.pathway }} beams=${{ inputs.n_beams }} samples=${{ inputs.stage2_samples }}"
          if [ "$ARCHETYPE" != "all" ]; then
            COMMIT_MSG="${COMMIT_MSG} arch=${ARCHETYPE}"
          fi
          COMMIT_SHA=$(jq -n \
            --arg msg "${COMMIT_MSG}" \
            --arg tree "$TREE_SHA" \
            --arg parent "$BASE_SHA" \
            '{"message": $msg, "tree": $tree, "parents": [$parent]}' | \
            gh api "repos/${REPO}/git/commits" --input - --jq '.sha')
          echo "[api] New commit: ${COMMIT_SHA}"

          # ── 5. Create branch ref ──
          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "[api] Creating ref attempt $i/$MAX_RETRIES..."
            if gh api "repos/${REPO}/git/refs" \
              -f "ref=refs/heads/${branch}" \
              -f "sha=${COMMIT_SHA}" > /dev/null 2>&1; then
              echo "[api] Branch created: ${branch}"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to create branch ref after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "[api] Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

          echo "BRANCH=${branch}" >> "${GITHUB_ENV}"

      - name: Summary
        if: always()
        env:
          ISO: ${{ matrix.iso }}
        run: |
          {
            echo "## Step 2.3 Sobol Adaptive — ${ISO}"
            echo ""
            if [ -n "${BRANCH:-}" ]; then
              echo "- Branch: \`${BRANCH}\`"
            else
              echo "- Branch: (not pushed — job failed before commit step)"
            fi
            echo "- Pathway: \`${{ inputs.pathway }}\`"
            echo "- Archetype: \`${{ inputs.archetype }}\`"
            echo "- Scenario: \`${{ inputs.scenario }}\`"
            echo "- Demand growth: \`${{ inputs.demand_growth }}\`"
            echo "- Beams: ${{ inputs.n_beams }}"
            echo "- Sobol samples: ${{ inputs.stage2_samples }}"
            echo "- Runner: \`${{ inputs.runner_size == 'large' && 'ubuntu-24.04-16core' || 'ubuntu-latest' }}\`"
            echo "- Outputs: \`data/step2.3-adaptive/${ISO}__pathway*__sobol.parquet\`"
            echo ""
            pq_count=$(ls data/step2.3-adaptive/${ISO}__pathway*__sobol.parquet 2>/dev/null | wc -l)
            json_count=$(ls data/step2.3-adaptive/${ISO}__pathway*.json 2>/dev/null | wc -l)
            echo "**${pq_count} sobol parquets committed, ${json_count} intermediate JSONs (not committed).**"
            echo ""
            echo "Run the **Squash Pipeline Branches** workflow with pattern \`auto/.*step2-3-sobol\` to consolidate."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-3-sobol-${{ matrix.iso }}-${{ github.run_id }}
          path: data/step2.3-adaptive/
          retention-days: 30
          if-no-files-found: warn
