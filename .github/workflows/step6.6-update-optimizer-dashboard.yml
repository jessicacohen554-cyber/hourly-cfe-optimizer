name: "Step 6.6: Update Optimizer Dashboard"

# Runs scripts to populate the interactive Cost Optimizer dashboard (dashboard.html):
#   1. step6_compressed_day.py — 24-hour representative day profiles per unique mix
#   2. step7_generate_shared_data.py — consolidates all results into shared-data.js
#
# The dashboard reads from shared-data.js (cost/mix/threshold data) and uses
# compressed day profiles for the dispatch visualization chart.
#
# Prerequisite: Steps 3-5 complete (cost optimization + dispatch cache).
# Output: dashboard/js/shared-data.js, data/step5-post-processing/compressed_day/

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which script to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - compressed-day
          - shared-data
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-6-dashboard

jobs:
  update-optimizer-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ inputs.iso }}"
          SCRIPT_LABEL="${{ inputs.script }}"
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${SCRIPT_LABEL}-${ISO_LABEL}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          for dir in data/step4-gas-ccs-parquets data/step3-cost-opt-parquets; do
            if [ -d "$dir" ] && ls "$dir"/*.parquet >/dev/null 2>&1; then
              HAS_DATA=true
            fi
          done
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No step-3 or step-4 parquets found. Run earlier steps first."
            exit 1
          fi

      - name: Check dispatch cache
        run: |
          if [ -d "data/step5-post-processing/dispatch_cache" ] && ls data/step5-post-processing/dispatch_cache/*.npz >/dev/null 2>&1; then
            echo "Dispatch cache found — compressed day will use cache"
          else
            echo "WARNING: No dispatch cache found. Compressed day will compute dispatch live (slower)."
            echo "Consider running Step 5 (dispatch cache) first."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: |
          mkdir -p data/step5-post-processing
          mkdir -p dashboard/js

      # ════════════════════════════════════════════════════════════════════
      # Sequential: Compressed Day → Shared Data
      # ════════════════════════════════════════════════════════════════════

      - name: "1/2 — Compute Compressed Day Profiles"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'compressed-day' }}
        run: |
          echo "=== Compressed Day (24-hour representative dispatch profiles) ==="
          python scripts/step6_compressed_day.py

      - name: "2/2 — Generate Shared Data"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'shared-data' }}
        run: |
          echo "=== Consolidate results into shared-data.js ==="
          python scripts/step7_generate_shared_data.py

      - name: Commit and push
        run: |
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/shared-data.js 2>/dev/null || true
          git add -f data/step5-post-processing/shared_data.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6.6 Dashboard: ${{ inputs.script }} ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done
