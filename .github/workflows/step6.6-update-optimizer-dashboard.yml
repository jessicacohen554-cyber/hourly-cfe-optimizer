name: "Step 6.6: Update Optimizer Dashboard"

# Runs scripts to populate the interactive Cost Optimizer dashboard (dashboard.html):
#   1. step6_compressed_day.py — 24-hour representative day profiles per unique mix
#   2. step7_generate_shared_data.py — consolidates all results into shared-data.js
#
# iso=ALL fans out parallel matrix jobs for compressed-day, then merge job
# runs the global shared-data generation and commits everything.
# Prerequisite: Steps 3-5 complete (cost optimization + dispatch cache).
# Output: dashboard/js/shared-data.js, data/step5-post-processing/compressed_day/

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process (ALL = parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which script to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - compressed-day
          - shared-data
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-6-dashboard

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: prepare
    if: ${{ inputs.script == 'ALL' || inputs.script == 'compressed-day' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          for dir in data/step4-gas-ccs-parquets data/step3-cost-opt-parquets; do
            if [ -d "$dir" ] && ls "$dir"/*.parquet >/dev/null 2>&1; then
              HAS_DATA=true
            fi
          done
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No step-3 or step-4 parquets found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing

      - name: "Compressed Day — ${{ matrix.iso }}"
        run: python scripts/step6_compressed_day.py --iso ${{ matrix.iso }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.iso }}
          path: data/step5-post-processing/
          retention-days: 1

  merge:
    needs: [prepare, process]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.script }}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download compressed-day artifacts
        if: ${{ inputs.script == 'ALL' || inputs.script == 'compressed-day' }}
        uses: actions/download-artifact@v4
        with:
          pattern: dashboard-*
          path: data/step5-post-processing/
          merge-multiple: true

      - name: Set up Python
        if: ${{ inputs.script == 'ALL' || inputs.script == 'shared-data' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: ${{ inputs.script == 'ALL' || inputs.script == 'shared-data' }}
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure JS directory
        run: mkdir -p dashboard/js

      - name: "Generate Shared Data"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'shared-data' }}
        run: |
          echo "=== Consolidate results into shared-data.js ==="
          python scripts/step7_generate_shared_data.py

      - name: Commit and push
        run: |
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/shared-data.js 2>/dev/null || true
          git add -f data/step5-post-processing/shared_data.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6.6 Dashboard: ${{ inputs.script }} ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

