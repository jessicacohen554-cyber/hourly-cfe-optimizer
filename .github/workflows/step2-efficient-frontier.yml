name: "Step 2: Efficient Frontier Filter"

# Extracts the Efficient Frontier (EF) from PFS.
# Filters: existing gen utilization, procurement minimization, strict dominance removal.
# ~21.4M → ~1.8M rows.
#
# Prerequisite: Step 1b (Build PFS) must have produced PFS parquets.
# Output: data/step2-ef-parquets/

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step2-ef

jobs:
  run-step2:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pyarrow

      - name: Ensure output directory
        run: mkdir -p data/step2-ef-parquets

      - name: Build ISO arguments
        id: iso-args
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso ${{ inputs.iso }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Run Efficient Frontier filter"
        timeout-minutes: 90
        run: python scripts/step2_efficient_frontier.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: Commit and push
        run: |
          git add -f data/step2-ef-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 2 EF: ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 2 EF: ${{ inputs.iso }}" \
            --body "## Summary
          - Efficient Frontier filter for **${{ inputs.iso }}**
          - Filters PFS (~21M) down to EF (~1.8M rows)
          - Output: \`data/step2-ef-parquets/\`" \
            --base ${{ inputs.branch || 'master' }} \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
