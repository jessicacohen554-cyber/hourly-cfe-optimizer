name: "Step 2.3 Sampling Test: LHS × Beam Sweep"

# Runs lhs_multibeam_test.py with user-selected ISO, pathway, LHS size,
# beam count, and optional archetype filter.
#
# Archetype options (pathway B/C/D only for nuclear/offshore):
#   solar-led, wind-led, balanced, nuclear-heavy, offshore-heavy
#   "all" = cross-archetype seeding (one cheapest per archetype)
#
# Output: Single merged JSON per dispatch committed to auto/ branch,
#         plus artifact backup of individual run files.
#         Run squash-pipeline-branches.yml with pattern "auto/.*sampling-test"
#         to consolidate into master.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: "ISO region"
        required: true
        default: "ERCOT"
        type: choice
        options:
          - ERCOT
          - PJM
          - CAISO
          - NYISO
          - NEISO
          - MISO
          - SPP
      pathway:
        description: "Pathway (A=VRE-only, B=NOAK 2035, C=NOAK 2040, D=NOAK 2045)"
        required: true
        default: "B"
        type: choice
        options:
          - A
          - B
          - C
          - D
      lhs_size:
        description: "LHS sample count per solver step (all = sweep 1k→40k)"
        required: true
        default: "5000"
        type: choice
        options:
          - "1000"
          - "2500"
          - "5000"
          - "10000"
          - "20000"
          - "40000"
          - "all"
      beams:
        description: "Number of parallel beams (all = sweep 1→32)"
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"
          - "16"
          - "32"
          - "all"
      archetype:
        description: "Archetype filter (all = cross-archetype, one seed per arch)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - solar-led
          - wind-led
          - balanced
          - nuclear-heavy
          - offshore-heavy

env:
  BRANCH_PREFIX: sampling-test
  PYTHONUNBUFFERED: "1"

jobs:
  sampling-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for large parquets
        run: |
          git config http.postBuffer 524288000
          git config core.packedGitLimit 2g
          git config core.packedGitWindowSize 256m
          git config pack.windowMemory 256m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy numba pyarrow

      - name: Build archetype flag
        id: arch
        run: |
          if [ "${{ inputs.archetype }}" = "all" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--archetype ${{ inputs.archetype }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure output directory
        run: mkdir -p data/sampling-tests

      - name: Run LHS multibeam test
        env:
          ISO: ${{ inputs.iso }}
          PATHWAY: ${{ inputs.pathway }}
          LHS_INPUT: ${{ inputs.lhs_size }}
          BEAMS_INPUT: ${{ inputs.beams }}
          ARCHETYPE: ${{ inputs.archetype }}
          ARCH_FLAG: ${{ steps.arch.outputs.flag }}
        run: |
          # Expand "all" to full sweep lists
          if [ "${LHS_INPUT}" = "all" ]; then
            LHS_LIST="1000 2500 5000 10000 20000 40000"
          else
            LHS_LIST="${LHS_INPUT}"
          fi

          if [ "${BEAMS_INPUT}" = "all" ]; then
            BEAMS_LIST="1 2 4 8 16 32"
          else
            BEAMS_LIST="${BEAMS_INPUT}"
          fi

          COMBO_COUNT=0
          for lhs in $LHS_LIST; do for beams in $BEAMS_LIST; do COMBO_COUNT=$((COMBO_COUNT + 1)); done; done
          echo "═══════════════════════════════════════════════════"
          echo "  ISO:       ${ISO}"
          echo "  Pathway:   ${PATHWAY}"
          echo "  LHS:       ${LHS_INPUT} → [${LHS_LIST}]"
          echo "  Beams:     ${BEAMS_INPUT} → [${BEAMS_LIST}]"
          echo "  Archetype: ${ARCHETYPE}"
          echo "  Combos:    ${COMBO_COUNT}"
          echo "═══════════════════════════════════════════════════"

          FAIL=0
          RUN=0
          for lhs in $LHS_LIST; do
            for beams in $BEAMS_LIST; do
              RUN=$((RUN + 1))
              TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
              OUTFILE="data/sampling-tests/${ISO}__pw${PATHWAY}__lhs${lhs}__beams${beams}__${ARCHETYPE}__${TIMESTAMP}.json"

              echo ""
              echo "── Run ${RUN}/${COMBO_COUNT}: LHS=${lhs} beams=${beams} ──"

              python3 -u scripts/lhs_multibeam_test.py \
                "${ISO}" "${PATHWAY}" "${lhs}" "${beams}" ${ARCH_FLAG} \
                2>&1 | tee /tmp/run.log

              if grep -q "RESULT_JSON:" /tmp/run.log; then
                grep "RESULT_JSON:" /tmp/run.log | sed 's/^RESULT_JSON://' > "${OUTFILE}"
                echo "[capture] Wrote $(du -h "${OUTFILE}" | cut -f1) → ${OUTFILE}"
              else
                echo "::warning::No RESULT_JSON for LHS=${lhs} beams=${beams}"
                FAIL=$((FAIL + 1))
              fi
            done
          done

          echo ""
          echo "[done] ${RUN} runs, ${FAIL} failures"
          if [ "$FAIL" -eq "$RUN" ]; then
            echo "::error::All ${RUN} runs failed — no RESULT_JSON captured"
            exit 1
          fi

      - name: Verify individual outputs
        env:
          ISO: ${{ inputs.iso }}
        run: |
          file_count=$(ls data/sampling-tests/${ISO}__*.json 2>/dev/null | wc -l)
          if [ "$file_count" -eq 0 ]; then
            echo "::error::No result JSON files found for ${ISO}"
            exit 1
          fi
          for f in data/sampling-tests/${ISO}__*.json; do
            python3 -c "
          import json, sys
          f = sys.argv[1]
          d = json.load(open(f))
          print(f'[verify] {f}: {len(d.get(\"beams\", []))} beams, wall={d.get(\"wall_s\", \"?\")}s')
          " "$f"
          done

      # ── Merge + push via git ──────────────────────────────────
      - name: Merge results and push
        env:
          ISO: ${{ inputs.iso }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          branch="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO}"

          # 1. Merge this ISO's per-run JSONs into a single array
          MERGED="data/sampling-tests/${ISO}__pw${{ inputs.pathway }}__lhs${{ inputs.lhs_size }}__beams${{ inputs.beams }}__${{ inputs.archetype }}__${TIMESTAMP}__merged.json"
          jq -s '.' data/sampling-tests/${ISO}__*.json > "${MERGED}"
          echo "[merge] $(wc -c < "${MERGED}") bytes → ${MERGED}"

          # 2. Configure git identity
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Commit merged file on a new branch
          git checkout -b "${branch}"
          git add "${MERGED}"
          git commit -m "Sampling test: ${ISO} pw${{ inputs.pathway }} lhs${{ inputs.lhs_size }} beams${{ inputs.beams }} ${{ inputs.archetype }}"

          # 4. Push (retry with backoff on transient failures)
          for i in 1 2 3 4; do
            echo "[push] Attempt ${i}/4..."
            if git push origin "${branch}" 2>&1; then
              echo "[push] Branch pushed: ${branch}"
              break
            fi
            if [ "$i" -eq 4 ]; then
              echo "::error::git push failed after 4 attempts"
              exit 1
            fi
            sleep $((2 ** i))
          done

          echo "BRANCH=${branch}" >> "${GITHUB_ENV}"

      - name: Summary
        if: always()
        env:
          ISO: ${{ inputs.iso }}
        run: |
          {
            echo "## Sampling Test — ${ISO}"
            echo ""
            if [ -n "${BRANCH:-}" ]; then
              echo "- Branch: \`${BRANCH}\`"
            else
              echo "- Branch: (not pushed — job failed before commit step)"
            fi
            echo "- Pathway: \`${{ inputs.pathway }}\`"
            echo "- LHS: \`${{ inputs.lhs_size }}\`"
            echo "- Beams: \`${{ inputs.beams }}\`"
            echo "- Archetype: \`${{ inputs.archetype }}\`"
            echo ""
            echo "Run **Squash Pipeline Branches** with pattern \`auto/.*sampling-test\` to consolidate."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-test-${{ inputs.iso }}-${{ github.run_id }}
          path: data/sampling-tests/
          retention-days: 30
          if-no-files-found: warn
