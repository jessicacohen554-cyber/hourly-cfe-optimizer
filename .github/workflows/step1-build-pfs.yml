name: "Step 1c: Build PFS from Scored Database"

# Run per-threshold after the scored database is committed.
# Reads {ISO}_coarse_cache.parquet, runs storage sweep + fine refinement.
# Can be triggered multiple times for different threshold sets — the database
# is never rebuilt.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (or ALL)'
        required: true
        default: 'NYISO'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds or "all"'
        required: true
        default: 'all'
        type: string
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

jobs:
  build-pfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        echo "--- Verify imports ---"
        python -c "import numpy; import numba; import pyarrow; print('All imports OK')"

    - name: Diagnostic — list repo state
      run: |
        echo "=== Branch ==="
        git branch --show-current
        git log --oneline -3
        echo ""
        echo "=== Scored databases ==="
        ls -lh data/step1-pfs-parquets/*_coarse_cache.parquet 2>/dev/null || echo "NO coarse_cache files found!"
        echo ""
        echo "=== Mixes ==="
        ls -lh data/step1-pfs-parquets/*_mixes.parquet 2>/dev/null || echo "NO mixes files found!"
        echo ""
        echo "=== Existing PFS parquets ==="
        ls -lh data/step1-pfs-parquets/*_raw_pfs.parquet 2>/dev/null || echo "No existing PFS files"
        echo ""
        echo "=== EIA data check ==="
        ls data/eia_hourly_profiles_* 2>/dev/null | head -5 || echo "NO EIA profile files found!"
        echo ""
        echo "=== Script check ==="
        python -c "import py_compile; py_compile.compile('scripts/step1c_build_pfs.py', doraise=True); print('step1c syntax OK')"
        python -c "import py_compile; py_compile.compile('scripts/step1_pfs_generator.py', doraise=True); print('step1_pfs_generator syntax OK')"

    - name: Verify scored database exists
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO"
        fi
        MISSING=""
        for iso in $ISOS; do
          CACHE="data/step1-pfs-parquets/${iso}_coarse_cache.parquet"
          if [ ! -f "$CACHE" ]; then
            MISSING="$MISSING $iso"
          else
            SIZE=$(du -h "$CACHE" | cut -f1)
            echo "✓ $iso scored database: $CACHE ($SIZE)"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo ""
          echo "ERROR: Missing scored databases for:$MISSING"
          echo "Run the 'Step 1: Build Scored Mix Database (1a+1b)' workflow first."
          exit 1
        fi

    - name: Configure git for auto-commit
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        # Increase post buffer to 500 MB — PFS parquets can be large and
        # the default 1 MB buffer causes HTTP 500 on push.
        git config http.postBuffer 524288000
        # Create the target branch for incremental commits
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LABEL="${{ inputs.iso }}"
        TARGET_BRANCH="auto/${TIMESTAMP}-pfs-${ISO_LABEL}"
        git checkout -b "$TARGET_BRANCH"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        echo "Created branch: $TARGET_BRANCH"

    - name: "Build PFS from scored database (step1c — auto-commit per threshold)"
      run: |
        set -euo pipefail
        ISO="${{ inputs.iso }}"
        THRESHOLDS="${{ inputs.thresholds }}"

        echo "ISO=$ISO  THRESHOLDS=$THRESHOLDS"
        echo "Python: $(python --version)"
        echo "Working dir: $(pwd)"
        echo "Branch: $(git branch --show-current)"
        echo "Auto-commit: ON (each threshold committed as it completes)"
        echo ""

        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo ""
            echo "=============================================="
            echo "=== Building PFS for $iso ==="
            echo "=============================================="
            python -u scripts/step1c_build_pfs.py --iso "$iso" --thresholds "$THRESHOLDS" --auto-commit 2>&1
            echo "=== $iso complete (exit $?) ==="
          done
        else
          python -u scripts/step1c_build_pfs.py --iso "$ISO" --thresholds "$THRESHOLDS" --auto-commit 2>&1
          echo "=== $ISO complete (exit $?) ==="
        fi

    - name: Verify PFS outputs
      run: |
        echo "=== PFS parquets after build ==="
        ls -lh data/step1-pfs-parquets/*_raw_pfs.parquet 2>/dev/null || echo "WARNING: No PFS parquets generated!"
        echo ""
        echo "=== Row counts ==="
        python -c "
        import pyarrow.parquet as pq
        import glob, os
        files = sorted(glob.glob('data/step1-pfs-parquets/*_raw_pfs.parquet'))
        total = 0
        for f in files:
            n = pq.read_metadata(f).num_rows
            total += n
            print(f'  {os.path.basename(f)}: {n:,} rows')
        print(f'\nTotal: {total:,} solutions across {len(files)} files')
        " 2>/dev/null || echo "Could not read parquet metadata"

    - name: Final commit — catch any remaining uncommitted PFS files
      run: |
        set -euo pipefail

        # Auto-commit already handled most files during the run.
        # This step catches anything that wasn't pushed (e.g., push failures).
        ISO_LABEL="${{ inputs.iso }}"
        if [ "$ISO_LABEL" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO_LABEL"
        fi

        REMAINING=false
        for iso in $ISOS; do
          FILES=$(ls data/step1-pfs-parquets/${iso}_t*_raw_pfs.parquet 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            git add -f $FILES
          fi
        done

        if ! git diff --cached --quiet; then
          echo "Committing remaining PFS files..."
          git commit -m "PFS results (final batch): ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REMAINING=true
        fi

        # Final push with retry — pushes one commit at a time to avoid
        # HTTP 500 from oversized payloads when multiple large parquets
        # accumulated (e.g., auto-commit pushes failed during the run).
        push_single_with_retry() {
          local COMMIT_SHA="$1"
          local MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "  Push attempt $i/$MAX_RETRIES for ${COMMIT_SHA:0:8}..."
            if git push -u origin "$COMMIT_SHA:refs/heads/$TARGET_BRANCH" 2>&1; then
              echo "  Push succeeded for ${COMMIT_SHA:0:8}"
              return 0
            fi
            BACKOFF=$((2 ** i))
            echo "  Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done
          echo "  ERROR: Push failed for ${COMMIT_SHA:0:8} after $MAX_RETRIES attempts"
          return 1
        }

        # Check if branch has any commits ahead of base
        BASE_REF=$(git rev-parse "origin/${{ inputs.branch || 'master' }}" 2>/dev/null || echo "")
        if [ -z "$BASE_REF" ]; then
          echo "No base ref found — nothing to push"
          echo "PUSHED=false" >> "$GITHUB_ENV"
        else
          COMMITS=$(git rev-list --reverse "$BASE_REF..HEAD" 2>/dev/null)
          COMMIT_COUNT=$(echo "$COMMITS" | grep -c . || echo "0")
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo "Pushing $COMMIT_COUNT commit(s) one at a time..."
            PUSH_OK=true
            for sha in $COMMITS; do
              if ! push_single_with_retry "$sha"; then
                PUSH_OK=false
                break
              fi
            done
            if [ "$PUSH_OK" = true ]; then
              echo "PUSHED=true" >> "$GITHUB_ENV"
            else
              echo "PUSHED=false" >> "$GITHUB_ENV"
              exit 1
            fi
          else
            echo "No new commits to push"
            echo "PUSHED=false" >> "$GITHUB_ENV"
          fi
        fi

    - name: Create pull request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "${PUSHED:-false}" != "true" ]; then
          # Check if auto-commit pushed anything during the run
          COMMITS_AHEAD=$(git log origin/${{ inputs.branch || 'master' }}..HEAD --oneline 2>/dev/null | wc -l || echo "0")
          if [ "$COMMITS_AHEAD" -eq 0 ]; then
            echo "No commits to create PR for"
            exit 0
          fi
        fi
        N_COMMITS=$(git log origin/${{ inputs.branch || 'master' }}..HEAD --oneline | wc -l)
        gh pr create \
          --title "PFS: ${{ inputs.iso }} thresholds=${{ inputs.thresholds }}" \
          --body "$(cat <<EOF
        ## Summary
        - Built PFS (step 1c) for **${{ inputs.iso }}** at thresholds **${{ inputs.thresholds }}**
        - Each threshold committed incrementally as it completed ($N_COMMITS commits)
        - Mined from pre-built scored database (no 1a/1b rerun)
        - Auto-generated by GitHub Actions
        EOF
        )" \
          --base ${{ inputs.branch || 'master' }} \
          --head "$TARGET_BRANCH" || echo "PR creation skipped"
