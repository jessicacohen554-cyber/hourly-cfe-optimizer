name: "Step 1c: Build PFS from Scored Database"

# Run per-threshold after the scored database is committed.
# Reads {ISO}_coarse_cache.parquet, runs storage sweep + fine refinement.
# Can be triggered multiple times for different threshold sets — the database
# is never rebuilt.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (or ALL)'
        required: true
        default: 'NYISO'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds or "all"'
        required: true
        default: 'all'
        type: string
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

jobs:
  build-pfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        echo "--- Verify imports ---"
        python -c "import numpy; import numba; import pyarrow; print('All imports OK')"

    - name: Diagnostic — list repo state
      run: |
        echo "=== Branch ==="
        git branch --show-current
        git log --oneline -3
        echo ""
        echo "=== Scored databases ==="
        ls -lh data/step1-pfs-parquets/*_coarse_cache.parquet 2>/dev/null || echo "NO coarse_cache files found!"
        echo ""
        echo "=== Mixes ==="
        ls -lh data/step1-pfs-parquets/*_mixes.parquet 2>/dev/null || echo "NO mixes files found!"
        echo ""
        echo "=== Existing PFS parquets ==="
        ls -lh data/step1-pfs-parquets/*_raw_pfs.parquet 2>/dev/null || echo "No existing PFS files"
        echo ""
        echo "=== EIA data check ==="
        ls data/eia_hourly_profiles_* 2>/dev/null | head -5 || echo "NO EIA profile files found!"
        echo ""
        echo "=== Script check ==="
        python -c "import py_compile; py_compile.compile('scripts/step1c_build_pfs.py', doraise=True); print('step1c syntax OK')"
        python -c "import py_compile; py_compile.compile('scripts/step1_pfs_generator.py', doraise=True); print('step1_pfs_generator syntax OK')"

    - name: Verify scored database exists
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO"
        fi
        MISSING=""
        for iso in $ISOS; do
          CACHE="data/step1-pfs-parquets/${iso}_coarse_cache.parquet"
          if [ ! -f "$CACHE" ]; then
            MISSING="$MISSING $iso"
          else
            SIZE=$(du -h "$CACHE" | cut -f1)
            echo "✓ $iso scored database: $CACHE ($SIZE)"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo ""
          echo "ERROR: Missing scored databases for:$MISSING"
          echo "Run the 'Step 1: Build Scored Mix Database (1a+1b)' workflow first."
          exit 1
        fi

    - name: "Build PFS from scored database (step1c)"
      run: |
        set -euo pipefail
        ISO="${{ inputs.iso }}"
        THRESHOLDS="${{ inputs.thresholds }}"

        echo "ISO=$ISO  THRESHOLDS=$THRESHOLDS"
        echo "Python: $(python --version)"
        echo "Working dir: $(pwd)"
        echo ""

        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo ""
            echo "=============================================="
            echo "=== Building PFS for $iso ==="
            echo "=============================================="
            python -u scripts/step1c_build_pfs.py --iso "$iso" --thresholds "$THRESHOLDS" 2>&1
            echo "=== $iso complete (exit $?) ==="
          done
        else
          python -u scripts/step1c_build_pfs.py --iso "$ISO" --thresholds "$THRESHOLDS" 2>&1
          echo "=== $ISO complete (exit $?) ==="
        fi

    - name: Verify PFS outputs
      run: |
        echo "=== PFS parquets after build ==="
        ls -lh data/step1-pfs-parquets/*_raw_pfs.parquet 2>/dev/null || echo "WARNING: No PFS parquets generated!"
        echo ""
        echo "=== Row counts ==="
        python -c "
        import pyarrow.parquet as pq
        import glob, os
        files = sorted(glob.glob('data/step1-pfs-parquets/*_raw_pfs.parquet'))
        total = 0
        for f in files:
            n = pq.read_metadata(f).num_rows
            total += n
            print(f'  {os.path.basename(f)}: {n:,} rows')
        print(f'\nTotal: {total:,} solutions across {len(files)} files')
        " 2>/dev/null || echo "Could not read parquet metadata"

    - name: Commit and push PFS results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LABEL="${{ inputs.iso }}"
        TARGET_BRANCH="auto/${TIMESTAMP}-pfs-${ISO_LABEL}"
        git checkout -b "$TARGET_BRANCH"

        git add -f data/step1-pfs-parquets/*_raw_pfs.parquet
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "PFS results: ${ISO_LABEL} thresholds=${{ inputs.thresholds }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

        MAX_RETRIES=5
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Push attempt $i/$MAX_RETRIES..."
          PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
            echo "Push succeeded on attempt $i"
            break
          }
          echo "$PUSH_OUTPUT"
          if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
            echo "ERROR: Push rejected due to large files (GH001)."
            exit 1
          fi
          if [ "$i" -eq "$MAX_RETRIES" ]; then
            echo "ERROR: Push failed after $MAX_RETRIES attempts"
            exit 1
          fi
          BACKOFF=$((2 ** i))
          echo "Retrying in ${BACKOFF}s..."
          sleep "$BACKOFF"
        done

        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

    - name: Create pull request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "${TARGET_BRANCH:-}" ]; then
          echo "No branch to create PR for"
          exit 0
        fi
        gh pr create \
          --title "PFS: ${{ inputs.iso }} thresholds=${{ inputs.thresholds }}" \
          --body "$(cat <<'EOF'
        ## Summary
        - Built PFS (step 1c) for **${{ inputs.iso }}** at thresholds **${{ inputs.thresholds }}**
        - Mined from pre-built scored database (no 1a/1b rerun)
        - Auto-generated by GitHub Actions
        EOF
        )" \
          --base master \
          --head "$TARGET_BRANCH" || echo "PR creation skipped"
