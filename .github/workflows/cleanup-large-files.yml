name: Cleanup Large File Blobs from History

# Removes all .parquet, .npz, and large JSON blobs from git history.
# WARNING: This rewrites history. All collaborators must re-clone afterward.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REWRITE-HISTORY to confirm (irreversible)'
        required: true
        type: string
      dry_run:
        description: 'Dry run only — show what would be removed'
        required: false
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate confirmation
        if: ${{ inputs.dry_run == false && inputs.confirm != 'REWRITE-HISTORY' }}
        run: |
          echo "::error::You must type 'REWRITE-HISTORY' to confirm. Aborting."
          exit 1

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Repo size before
        run: |
          echo "=== Repo size BEFORE ==="
          git count-objects -vH

      - name: "Dry run: list matching paths"
        if: ${{ inputs.dry_run == true }}
        run: |
          set +o pipefail
          echo "=== Files that would be stripped from history ==="
          echo ""

          # Dump all blobs once to a temp file to avoid repeated traversals
          BLOB_LIST=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$BLOB_LIST"

          echo "Total blobs in history: $(wc -l < "$BLOB_LIST")"
          total_bytes=$(awk '{s+=$2} END{print s}' "$BLOB_LIST")
          echo "Total blob size: $(echo "$total_bytes" | awk '{printf "%.1f MB", $1/1048576}')"
          echo ""

          echo "--- By extension ---"
          for ext in parquet npz json; do
            matched=$(grep -i "\.${ext}$" "$BLOB_LIST" || true)
            count=$(echo "$matched" | grep -c "\.${ext}$" 2>/dev/null || echo 0)
            size=$(echo "$matched" | awk '{s+=$2} END{printf "%.1f MB", s/1048576}')
            echo "  *.${ext}  →  ${count} blob versions, ${size}"
          done
          echo ""

          echo "--- Top 30 largest blobs ---"
          sort -rnk2 "$BLOB_LIST" | head -30 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          echo ""

          echo "--- By directory ---"
          for dir in data/step1-pfs-parquets data/step1d-storage-parquets data/step2-ef-parquets \
                     data/step3-cost-opt-parquets data/step4-gas-ccs-parquets \
                     data/step5-post-processing data/checkpoints data/checkpoints_v4; do
            matched=$(grep " ${dir}/" "$BLOB_LIST" || true)
            size=$(echo "$matched" | awk '{s+=$2} END{printf "%.1f MB", s/1048576}')
            echo "  ${dir}/  →  ${size}"
          done
          echo ""

          rm -f "$BLOB_LIST"
          echo "Re-run with dry_run=false and confirm=REWRITE-HISTORY to execute."

      - name: Run git-filter-repo
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "Removing *.parquet, *.npz, and large data JSON blobs from all history..."
          git filter-repo \
            --path-glob '*.parquet' \
            --path-glob '*.npz' \
            --path-glob 'data/step5-post-processing/co2_results/*.json' \
            --path data/analysis_results.json \
            --path data/optimizer_cache.json \
            --invert-paths --force

      - name: Repo size after
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "=== Repo size AFTER ==="
          git count-objects -vH
          echo ""
          echo "=== Top 25 remaining blobs ==="
          BLOB_LIST=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$BLOB_LIST"
          sort -rnk2 "$BLOB_LIST" | head -25 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          rm -f "$BLOB_LIST"

      - name: Force push cleaned history
        if: ${{ inputs.dry_run == false }}
        run: |
          git remote add origin-rw https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 2>/dev/null || true
          git push --force --all origin-rw
          git push --force --tags origin-rw
          echo ""
          echo "Done. All branches force-pushed with cleaned history."
          echo "WARNING: All collaborators must re-clone the repository."
