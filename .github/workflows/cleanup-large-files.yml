name: Cleanup Large File Blobs from History (Protected)

# Removes old/deleted/overwritten .parquet, .npz, and large JSON blobs from
# git history — but PROTECTS every blob currently live in HEAD.
#
# How it works:
#   1. Snapshot all blob SHAs in the current HEAD tree (the "protected set")
#   2. Walk all history to find blobs matching target extensions
#   3. Only blobs NOT in the protected set are candidates for removal
#   4. Build an explicit blob-map file for git-filter-repo
#   5. Rewrite history, replacing dead blobs with empty content
#
# This means: if a parquet file exists in the repo today, its current version
# is NEVER touched. Only old versions of overwritten files and entirely deleted
# files are stripped.
#
# WARNING: This rewrites history. All collaborators must re-clone afterward.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REWRITE-HISTORY to confirm (irreversible)'
        required: true
        type: string
      dry_run:
        description: 'Dry run only — show what would be removed vs. protected'
        required: false
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate confirmation
        if: ${{ inputs.dry_run == false && inputs.confirm != 'REWRITE-HISTORY' }}
        run: |
          echo "::error::You must type 'REWRITE-HISTORY' to confirm. Aborting."
          exit 1

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Repo size before
        run: |
          echo "=== Repo size BEFORE ==="
          git count-objects -vH

      - name: Build protected blob set from HEAD
        id: protect
        run: |
          echo "=== Building protected blob set (all blobs live in HEAD) ==="

          # Every blob currently in the working tree — these are sacred
          PROTECTED_BLOBS=$(mktemp)
          git ls-tree -r HEAD | awk '{print $3}' | sort -u > "$PROTECTED_BLOBS"
          echo "Protected blob SHAs (live in HEAD): $(wc -l < "$PROTECTED_BLOBS")"
          echo "protected_blobs=$PROTECTED_BLOBS" >> "$GITHUB_OUTPUT"

      - name: Enumerate all historical blobs matching target extensions
        id: enumerate
        run: |
          PROTECTED_BLOBS="${{ steps.protect.outputs.protected_blobs }}"

          echo "=== Enumerating all historical blobs ==="

          # Dump every blob in entire history: SHA, size, path
          ALL_BLOBS=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$ALL_BLOBS"

          echo "Total blobs in all history: $(wc -l < "$ALL_BLOBS")"

          # Filter to target extensions only
          TARGET_BLOBS=$(mktemp)
          grep -iE '\.(parquet|npz)$' "$ALL_BLOBS" > "$TARGET_BLOBS" || true
          grep -E '(data/step5-post-processing/co2_results/.*\.json|data/analysis_results\.json|data/optimizer_cache\.json)$' \
            "$ALL_BLOBS" >> "$TARGET_BLOBS" || true
          echo "Target blobs (matching extensions): $(wc -l < "$TARGET_BLOBS")"

          # Split into protected vs removable
          REMOVABLE=$(mktemp)
          KEPT=$(mktemp)
          while IFS=' ' read -r sha size path; do
            if grep -qF "$sha" "$PROTECTED_BLOBS"; then
              echo "$sha $size $path" >> "$KEPT"
            else
              echo "$sha $size $path" >> "$REMOVABLE"
            fi
          done < "$TARGET_BLOBS"

          # Ensure files exist even if empty
          touch "$REMOVABLE" "$KEPT"

          removable_count=$(wc -l < "$REMOVABLE")
          kept_count=$(wc -l < "$KEPT")
          removable_bytes=$(awk '{s+=$2} END{print s+0}' "$REMOVABLE")
          kept_bytes=$(awk '{s+=$2} END{print s+0}' "$KEPT")

          echo ""
          echo "========================================"
          echo "  PROTECTED (live in HEAD): $kept_count blobs ($(echo "$kept_bytes" | awk '{printf "%.1f MB", $1/1048576}'))"
          echo "  REMOVABLE (dead/old):     $removable_count blobs ($(echo "$removable_bytes" | awk '{printf "%.1f MB", $1/1048576}'))"
          echo "========================================"

          echo "removable=$REMOVABLE" >> "$GITHUB_OUTPUT"
          echo "kept=$KEPT" >> "$GITHUB_OUTPUT"
          echo "all_blobs=$ALL_BLOBS" >> "$GITHUB_OUTPUT"
          echo "target_blobs=$TARGET_BLOBS" >> "$GITHUB_OUTPUT"
          echo "removable_count=$removable_count" >> "$GITHUB_OUTPUT"

      - name: "Dry run: show protected vs. removable breakdown"
        if: ${{ inputs.dry_run == true }}
        run: |
          REMOVABLE="${{ steps.enumerate.outputs.removable }}"
          KEPT="${{ steps.enumerate.outputs.kept }}"
          ALL_BLOBS="${{ steps.enumerate.outputs.all_blobs }}"

          echo "=== PROTECTED FILES (will NOT be touched) ==="
          if [ -s "$KEPT" ]; then
            echo ""
            echo "--- Protected by extension ---"
            for ext in parquet npz json; do
              matched=$(grep -i "\.${ext}$" "$KEPT" || true)
              count=$(echo "$matched" | grep -c "." 2>/dev/null || echo 0)
              size=$(echo "$matched" | awk '{s+=$2} END{printf "%.1f MB", s/1048576}')
              echo "  *.${ext}  →  ${count} live blobs, ${size}"
            done
            echo ""
            echo "--- Protected by directory ---"
            for dir in data/step1-pfs-parquets data/step1d-storage-parquets data/step2-ef-parquets \
                       data/step3-cost-opt-parquets data/step4-gas-ccs-parquets \
                       data/step5-post-processing; do
              matched=$(grep " ${dir}/" "$KEPT" || true)
              count=$(echo "$matched" | grep -c "." 2>/dev/null || echo 0)
              size=$(echo "$matched" | awk '{s+=$2} END{printf "%.1f MB", s/1048576}')
              [ "$count" -gt 0 ] && echo "  ${dir}/  →  ${count} blobs, ${size}"
            done
          else
            echo "  (none — no target blobs in HEAD)"
          fi

          echo ""
          echo "=== REMOVABLE BLOBS (dead/overwritten — will be stripped) ==="
          if [ -s "$REMOVABLE" ]; then
            echo ""
            echo "--- Removable by extension ---"
            for ext in parquet npz json; do
              matched=$(grep -i "\.${ext}$" "$REMOVABLE" || true)
              count=$(echo "$matched" | grep -c "." 2>/dev/null || echo 0)
              size=$(echo "$matched" | awk '{s+=$2} END{printf "%.1f MB", s/1048576}')
              echo "  *.${ext}  →  ${count} dead blob versions, ${size}"
            done
            echo ""
            echo "--- Removable by directory ---"
            for dir in data/step1-pfs-parquets data/step1d-storage-parquets data/step2-ef-parquets \
                       data/step3-cost-opt-parquets data/step4-gas-ccs-parquets \
                       data/step5-post-processing data/checkpoints data/checkpoints_v4; do
              matched=$(grep " ${dir}/" "$REMOVABLE" || true)
              count=$(echo "$matched" | grep -c "." 2>/dev/null || echo 0)
              size=$(echo "$matched" | awk '{s+=$2} END{printf "%.1f MB", s/1048576}')
              [ "$count" -gt 0 ] && echo "  ${dir}/  →  ${count} dead blobs, ${size}"
            done
            echo ""
            echo "--- Top 30 largest removable blobs ---"
            sort -rnk2 "$REMOVABLE" | head -30 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          else
            echo "  (none — all target blobs are live in HEAD)"
          fi

          echo ""
          echo "Re-run with dry_run=false and confirm=REWRITE-HISTORY to execute."

      - name: Build blob replacement map
        if: ${{ inputs.dry_run == false }}
        id: blobmap
        run: |
          REMOVABLE="${{ steps.enumerate.outputs.removable }}"
          removable_count="${{ steps.enumerate.outputs.removable_count }}"

          if [ "$removable_count" = "0" ]; then
            echo "No removable blobs found. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Create an empty blob to replace dead blobs with
          EMPTY_SHA=$(git hash-object -t blob --stdin < /dev/null)
          echo "Empty blob SHA: $EMPTY_SHA"

          # Build the blob-map: old-sha → empty-sha
          # git-filter-repo --replace-blob expects: OLD_SHA NEW_SHA
          BLOB_MAP=$(mktemp)
          awk -v empty="$EMPTY_SHA" '{print $1, empty}' "$REMOVABLE" | sort -u > "$BLOB_MAP"
          echo "Blob map entries: $(wc -l < "$BLOB_MAP")"
          echo "blob_map=$BLOB_MAP" >> "$GITHUB_OUTPUT"

      - name: Run git-filter-repo with blob replacement map
        if: ${{ inputs.dry_run == false && steps.blobmap.outputs.skip != 'true' }}
        run: |
          BLOB_MAP="${{ steps.blobmap.outputs.blob_map }}"
          echo "Replacing $( wc -l < "$BLOB_MAP" ) dead blobs with empty content..."
          echo "(All live HEAD blobs are protected and untouched)"
          git filter-repo --replace-blob "$BLOB_MAP" --force

      - name: Repo size after
        if: ${{ inputs.dry_run == false && steps.blobmap.outputs.skip != 'true' }}
        run: |
          echo "=== Repo size AFTER ==="
          git count-objects -vH
          echo ""

          # Verify HEAD content is identical
          echo "=== Verifying HEAD integrity ==="
          file_count=$(git ls-tree -r HEAD | wc -l)
          echo "Files in HEAD after cleanup: $file_count"
          echo ""

          echo "=== Top 25 remaining blobs ==="
          BLOB_LIST=$(mktemp)
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '/^blob /{print $2, $3, substr($0, index($0,$4))}' > "$BLOB_LIST"
          sort -rnk2 "$BLOB_LIST" | head -25 | awk '{printf "  %s  %.1f MB  %s\n", $1, $2/1048576, $3}'
          rm -f "$BLOB_LIST"

      - name: Force push cleaned history
        if: ${{ inputs.dry_run == false && steps.blobmap.outputs.skip != 'true' }}
        run: |
          git remote add origin-rw https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 2>/dev/null || true
          git push --force --all origin-rw
          git push --force --tags origin-rw
          echo ""
          echo "Done. All branches force-pushed with cleaned history."
          echo "Live HEAD content is UNCHANGED — only dead/overwritten blobs were removed."
          echo "WARNING: All collaborators must re-clone the repository."
