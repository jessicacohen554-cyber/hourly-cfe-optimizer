name: "Step 6.0: Compute CO2 (Shared)"

# Shared utility — computes dispatch-stack CO2 emissions for all ISOs.
# Must run BEFORE Step 6.1 (MAC depends on CO2 output).
# Merit-order retirement: coal → oil → gas. Demand-growth-aware.
# Output: data/step5-post-processing/co2_*.json

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-0-co2

jobs:
  compute-co2:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ inputs.iso }}"
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          if [ -d "data/step4-gas-ccs-parquets" ] && ls data/step4-gas-ccs-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-4 Gas CCS parquets found"
            HAS_DATA=true
          fi
          if [ -d "data/step3-cost-opt-parquets" ] && ls data/step3-cost-opt-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-3 CO parquets found"
            HAS_DATA=true
          fi
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: Neither step-4 nor step-3 parquets found."
            exit 1
          fi

          if [ -d "data/step5-post-processing/dispatch_cache" ] && ls data/step5-post-processing/dispatch_cache/*.npz >/dev/null 2>&1; then
            echo "Dispatch cache found"
          else
            echo "WARNING: No dispatch cache found. CO2 script will compute dispatch live (slower)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Build ISO arguments
        id: iso-args
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso ${{ inputs.iso }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing

      - name: "Compute CO2 emissions"
        run: |
          echo "=== Step 6.0: Compute CO2 ==="
          python scripts/step6_recompute_co2.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: Commit and push
        run: |
          git add -f data/step5-post-processing/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6.0 CO2: ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 6.0 CO2: ${{ inputs.iso }}" \
            --body "## Summary
          - Computed dispatch-stack CO2 emissions for **${{ inputs.iso }}**
          - Merit-order retirement: coal → oil → gas
          - Output: \`data/step5-post-processing/co2_*.json\`
          - **Run this before Step 6.1 (MAC depends on CO2)**" \
            --base ${{ inputs.branch || 'master' }} \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
