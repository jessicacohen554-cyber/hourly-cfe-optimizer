name: "Step 4: Gas CCS Post-Processing"

# NEISO winter gas pipeline constraint (+$13.13/MWh CCS adder), 45Q correction
# ($27.5/MWh), without-45Q overlay, gas capacity backup & resource adequacy
# (15% RA margin), CCS vs LDES crossover analysis.
#
# Prerequisite: Step 3 (Cost Optimization) must have produced cost parquets.
# Output: data/step4-gas-ccs-parquets/
#
# iso=ALL fans out 7 parallel matrix jobs, then merges into one branch + PR.
# Single-ISO selection runs that one ISO only.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process (ALL = 7 parallel jobs)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step4-gas-ccs

jobs:
  # ---------------------------------------------------------------------------
  # Build the ISO matrix
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Per-ISO processing (parallel when ALL)
  # ---------------------------------------------------------------------------
  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Verify step-3 parquets exist
        run: |
          if [ ! -d data/step3-cost-opt-parquets ] || [ -z "$(ls data/step3-cost-opt-parquets/*.parquet 2>/dev/null)" ]; then
            echo "ERROR: Step-3 parquets not found. Run Step 3 first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas

      - name: Ensure output directory
        run: mkdir -p data/step4-gas-ccs-parquets

      - name: "Run Gas CCS — ${{ matrix.iso }}"
        run: python scripts/step4_gas_ccs_adjustement.py --iso ${{ matrix.iso }}

      - name: Upload parquet artifact
        uses: actions/upload-artifact@v4
        with:
          name: step4-${{ matrix.iso }}
          path: data/step4-gas-ccs-parquets/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge all artifacts into one branch + PR
  # ---------------------------------------------------------------------------
  merge:
    needs: [prepare, process]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download all ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: step4-*
          path: data/step4-gas-ccs-parquets/
          merge-multiple: true

      - name: Commit and push
        run: |
          git config http.postBuffer 524288000

          git add -f data/step4-gas-ccs-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 4 Gas CCS: ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 4 Gas CCS: ${{ inputs.iso }}" \
            --body "## Summary
          - Gas CCS post-processing for **${{ inputs.iso }}**
          - NEISO winter pipeline, 45Q correction, RA margin, CCS vs LDES crossover
          - Output: \`data/step4-gas-ccs-parquets/\`" \
            --base ${{ inputs.branch || 'master' }} \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
