name: Run Step 3 Cost Optimization

on:
  workflow_dispatch:
    inputs:
      iso:
        description: ISO to run
        required: true
        type: choice
        options:
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP

jobs:
  run-step3:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure target branch exists locally
        run: |
          git fetch origin step3-co-iso-results || true
          git checkout -B step3-co-iso-results origin/step3-co-iso-results || git checkout -B step3-co-iso-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow numba

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step-3-CO-ISO-parquets
          mkdir -p data/step-2-EF-parquets

      - name: Run Step 3 optimizer for selected ISO
        run: |
          python scripts/step3_cost_optimization.py --iso "${{ inputs.iso }}" --input-dir data/step-2-EF-parquets

      - name: Checkpoint outputs by threshold (intermediate commits)
        run: |
          set -euo pipefail
          ISO="${{ inputs.iso }}"
          ISO_FILE="data/step-3-CO-ISO-parquets/step3_co_${ISO}.parquet"

          if [ ! -f "$ISO_FILE" ]; then
            echo "Missing expected output: $ISO_FILE"
            exit 1
          fi

          python - <<'PY'
from pathlib import Path
import pandas as pd

iso = "${{ inputs.iso }}"
iso_file = Path(f"data/step-3-CO-ISO-parquets/step3_co_{iso}.parquet")
df = pd.read_parquet(iso_file)
for thr, part in df.groupby('threshold', sort=True):
    thr_tag = str(thr).replace('.', '_')
    out = iso_file.parent / f"step3_co_{iso}_thr_{thr_tag}.parquet"
    part.to_parquet(out, index=False, compression='zstd')
    print(out)
PY

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Commit each threshold file independently as a timeout-safe checkpoint.
          for file in data/step-3-CO-ISO-parquets/step3_co_${ISO}_thr_*.parquet; do
            [ -e "$file" ] || continue
            git add -f "$file"
            if git diff --cached --quiet; then
              continue
            fi
            THR=$(basename "$file" | sed -E 's/.*_thr_(.*)\.parquet/\1/')
            git commit -m "Step 3 CO checkpoint: ${ISO} threshold ${THR}"
            git push origin step3-co-iso-results
          done

          # Final aggregate ISO parquet + metadata outputs.
          git add -f \
            "$ISO_FILE" \
            data/step-3-CO-ISO-parquets/.gitkeep \
            dashboard/overprocure_scenarios.parquet \
            dashboard/overprocure_feasible_mixes.parquet \
            dashboard/demand_growth_results.parquet \
            dashboard/overprocure_results.json \
            dashboard/demand_growth_results.json \
            dashboard/overprocure_meta.json \
            dashboard/demand_growth_meta.json \
            dashboard/track_results.json \
            data/cf_split_table.json

          if git diff --cached --quiet; then
            echo "No final changes to commit"
          else
            git commit -m "Update Step 3 cost optimization outputs for ${ISO}"
            git push origin step3-co-iso-results
          fi
