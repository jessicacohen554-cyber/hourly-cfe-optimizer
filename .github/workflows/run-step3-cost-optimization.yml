name: Run Step 3 Cost Optimization

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Which track to run'
        required: true
        default: 'track1-baseline'
        type: choice
        options:
          - ALL
          - track1-baseline
          - track2-newbuild
          - track3-cost-to-replace
          - track2-and-3
      iso:
        description: 'ISO to run (CAISO, ERCOT, PJM, NYISO, NEISO — or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      sensitivity_mode:
        description: 'Track 2-3 sensitivity mode (ignored for Track 1)'
        required: false
        default: 'medium'
        type: choice
        options:
          - medium
          - full

env:
  BRANCH_PREFIX: step3-co

jobs:
  run-step3:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          TRACK_LABEL="${{ github.event.inputs.track }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${TRACK_LABEL}-${ISO_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${TRACK_LABEL}-${ISO_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify step-2 EF parquets exist
        run: |
          if [ ! -d data/step2-ef-parquets ] || [ -z "$(ls data/step2-ef-parquets/*.parquet 2>/dev/null)" ]; then
            echo "ERROR: Step-2 EF parquets not found in data/step2-ef-parquets/"
            echo "Run Step 2 workflow first and merge results to master."
            exit 1
          fi
          echo "Step-2 EF parquets found:"
          ls -lh data/step2-ef-parquets/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step3-cost-opt-parquets
          mkdir -p dashboard

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Track 2-3 arguments
        id: track-args
        run: |
          INPUT_MODE="${{ github.event.inputs.sensitivity_mode }}"
          FLAGS=""
          if [ "$INPUT_MODE" = "full" ]; then
            FLAGS="--full"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      # ════════════════════════════════════════════════════════════════════
      # TRACK 1: Baseline cost optimization
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 1: Run Baseline Cost Optimization"
        if: ${{ github.event.inputs.track == 'track1-baseline' || github.event.inputs.track == 'ALL' }}
        run: |
          echo "=== Track 1: Baseline Cost Optimization ==="
          python scripts/step3_cost_optimization.py --track baseline ${{ steps.iso-args.outputs.iso_flags }}

      # ════════════════════════════════════════════════════════════════════
      # TRACK 2: New-Build cost optimization
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 2: Run New-Build Cost Optimization"
        if: ${{ github.event.inputs.track == 'track2-newbuild' || github.event.inputs.track == 'track2-and-3' || github.event.inputs.track == 'ALL' }}
        run: |
          echo "=== Track 2: New-Build Cost Optimization ==="
          python scripts/step3_track_nb_ctr.py --fresh --track nb ${{ steps.iso-args.outputs.iso_flags }} ${{ steps.track-args.outputs.flags }}

      # ════════════════════════════════════════════════════════════════════
      # TRACK 3: Cost-to-Replace optimization
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 3: Run Cost-to-Replace Optimization"
        if: ${{ github.event.inputs.track == 'track3-cost-to-replace' || github.event.inputs.track == 'track2-and-3' || github.event.inputs.track == 'ALL' }}
        run: |
          echo "=== Track 3: Cost-to-Replace Optimization ==="
          python scripts/step3_track_nb_ctr.py --fresh --track ctr ${{ steps.iso-args.outputs.iso_flags }} ${{ steps.track-args.outputs.flags }}

      # ════════════════════════════════════════════════════════════════════
      # COMMIT & PR
      # ════════════════════════════════════════════════════════════════════

      - name: Commit and push Step 3 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage all possible outputs
          git add -f data/step3-cost-opt-parquets/ 2>/dev/null || true
          git add -f dashboard/track_scenarios.parquet 2>/dev/null || true
          git add -f dashboard/track_demand_growth.parquet 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          ISO_LABEL="${{ github.event.inputs.iso }}"
          TRACK_LABEL="${{ github.event.inputs.track }}"
          git commit -m "Step 3: ${TRACK_LABEL} ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push fresh branch (retry for transient network errors only)
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            # Fail immediately on large-file rejection (not recoverable by retry)
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              echo "Check file sizes — GitHub limit is 100 MB per file."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TRACK_LABEL="${{ github.event.inputs.track }}"
          PR_BODY="## Summary"$'\n'"- Step 3 cost optimization: **${TRACK_LABEL}** for **${{ github.event.inputs.iso }}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 3: ${TRACK_LABEL} ${{ github.event.inputs.iso }}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
