name: "Step 1b: Build PFS from Scored Database"

# Mines Physics Feasible Space (PFS) from pre-built scored database per threshold.
# Reads {ISO}_coarse_cache.parquet, runs storage sweep + fine refinement.
# Can be triggered multiple times for different threshold sets — the scored DB
# is never rebuilt. Auto-commits each threshold as it completes.
#
# Prerequisite: Step 1a (Scored Database) must have run first.
# Output: data/step1-pfs-parquets/{ISO}_t{threshold}_raw_pfs.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds or "all"'
        required: true
        default: 'all'
        type: string
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

jobs:
  build-pfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "import numpy; import numba; import pyarrow; print('All imports OK')"

    - name: Verify scored database exists
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO"
        fi
        MISSING=""
        for iso in $ISOS; do
          CACHE="data/step1-pfs-parquets/${iso}_coarse_cache.parquet"
          if [ ! -f "$CACHE" ]; then
            MISSING="$MISSING $iso"
          else
            SIZE=$(du -h "$CACHE" | cut -f1)
            echo "OK: $iso scored database ($SIZE)"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "ERROR: Missing scored databases for:$MISSING"
          echo "Run Step 1a (Build Scored Mix Database) first."
          exit 1
        fi

    - name: Configure git for auto-commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git config push.default current
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        TARGET_BRANCH="auto/${TIMESTAMP}-step1b-pfs-${{ inputs.iso }}"
        git checkout -b "$TARGET_BRANCH"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

    - name: "Build PFS from scored database (auto-commit per threshold)"
      run: |
        set -euo pipefail
        ISO="${{ inputs.iso }}"
        THRESHOLDS="${{ inputs.thresholds }}"

        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo "=============================================="
            echo "=== Building PFS for $iso ==="
            echo "=============================================="
            python -u scripts/step1c_build_pfs.py --iso "$iso" --thresholds "$THRESHOLDS" --auto-commit 2>&1
          done
        else
          python -u scripts/step1c_build_pfs.py --iso "$ISO" --thresholds "$THRESHOLDS" --auto-commit 2>&1
        fi

    - name: Verify PFS outputs
      run: |
        echo "=== PFS parquets after build ==="
        ls -lh data/step1-pfs-parquets/*_raw_pfs.parquet 2>/dev/null || echo "WARNING: No PFS parquets generated!"
        python -c "
        import pyarrow.parquet as pq
        import glob, os
        files = sorted(glob.glob('data/step1-pfs-parquets/*_raw_pfs.parquet'))
        total = 0
        for f in files:
            n = pq.read_metadata(f).num_rows
            total += n
            print(f'  {os.path.basename(f)}: {n:,} rows')
        print(f'\nTotal: {total:,} solutions across {len(files)} files')
        " 2>/dev/null || echo "Could not read parquet metadata"

    - name: Final commit — catch any remaining uncommitted PFS files
      run: |
        set -euo pipefail
        ISO_LABEL="${{ inputs.iso }}"
        if [ "$ISO_LABEL" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO_LABEL"
        fi

        for iso in $ISOS; do
          FILES=$(ls data/step1-pfs-parquets/${iso}_t*_raw_pfs.parquet 2>/dev/null || true)
          if [ -n "$FILES" ]; then
            git add -f $FILES
          fi
        done

        if ! git diff --cached --quiet; then
          echo "Committing remaining PFS files..."
          git commit -m "Step 1b PFS (final batch): ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

        # Push all commits one at a time
        BASE_REF=$(git rev-parse "origin/${{ inputs.branch || 'master' }}" 2>/dev/null || echo "")
        if [ -z "$BASE_REF" ]; then
          echo "No base ref — nothing to push"
          echo "PUSHED=false" >> "$GITHUB_ENV"
          exit 0
        fi

        COMMITS=$(git rev-list --reverse "$BASE_REF..HEAD" 2>/dev/null)
        COMMIT_COUNT=$(echo "$COMMITS" | grep -c . || echo "0")
        if [ "$COMMIT_COUNT" -gt 0 ]; then
          echo "Pushing $COMMIT_COUNT commit(s)..."
          PUSH_OK=true
          for sha in $COMMITS; do
            MAX_RETRIES=4
            PUSHED_SHA=false
            for i in $(seq 1 $MAX_RETRIES); do
              echo "  Push attempt $i/$MAX_RETRIES for ${sha:0:8}..."
              if git push -u origin "$sha:refs/heads/$TARGET_BRANCH" 2>&1; then
                PUSHED_SHA=true
                break
              fi
              BACKOFF=$((2 ** i))
              sleep "$BACKOFF"
            done
            if [ "$PUSHED_SHA" = "false" ]; then
              PUSH_OK=false
              break
            fi
          done
          if [ "$PUSH_OK" = true ]; then
            echo "PUSHED=true" >> "$GITHUB_ENV"
          else
            echo "PUSHED=false" >> "$GITHUB_ENV"
            exit 1
          fi
        else
          echo "No new commits to push"
          echo "PUSHED=false" >> "$GITHUB_ENV"
        fi

