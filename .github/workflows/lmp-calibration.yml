name: "LMP Calibration: Validate Model"

# Validates synthetic LMP model against calibration targets for each ISO.
# Two modes:
#   - weather-normalized: Compare against SOM calibration targets
#   - qa-actual: Compare against actual historical LMP (needs fetched data)
#
# Output: data/step5-post-processing/lmp/{ISO}_calibration.json

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to calibrate'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      mode:
        description: 'Calibration mode'
        required: true
        default: 'weather-normalized'
        type: choice
        options:
          - weather-normalized
          - qa-actual
      year:
        description: 'Year for qa-actual mode'
        required: false
        default: '2024'
        type: string
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: lmp-calibration

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"
          # Align .github/workflows/ with default branch (GITHUB_TOKEN lacks workflows permission)
          git checkout origin/master -- .github/workflows/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Align workflow files with default branch"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas pyarrow numba

      - name: Run LMP calibration
        run: |
          if [ "${{ inputs.mode }}" = "qa-actual" ]; then
            python scripts/calibrate_lmp_model.py \
              --iso ${{ inputs.iso }} \
              --qa-actual \
              --year ${{ inputs.year }}
          else
            python scripts/calibrate_lmp_model.py \
              --iso ${{ inputs.iso }}
          fi

      - name: Commit and push
        run: |
          git add -f data/step5-post-processing/lmp/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No calibration reports to commit"
            exit 0
          fi

          git commit -m "LMP Calibration: ${{ inputs.iso }} (${{ inputs.mode }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "LMP Calibration: ${{ inputs.iso }} (${{ inputs.mode }})" \
            --body "## Summary
          - Calibrated synthetic LMP model for **${{ inputs.iso }}**
          - Mode: ${{ inputs.mode }}
          - Compares synthetic LMP (avg, P10/P50/P90, peak/offpeak, volatility) against calibration targets
          - Output: \`data/step5-post-processing/lmp/{ISO}_calibration.json\`" \
            --base ${{ inputs.branch || 'master' }} \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
