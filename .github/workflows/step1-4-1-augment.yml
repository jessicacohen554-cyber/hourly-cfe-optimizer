name: "Step 1.4.1: Thin-Band Augmentation"

# Augment-only step: fills thin threshold bands (50-99.9%) with up to 50K
# diverse mixes each. Runs AFTER step 1.4 fine-grid has completed.
# Requires existing PFS files in data/step1-pfs/.
#
# Output: data/step1-pfs/{ISO}_t{T}_augment.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  augment:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="auto/${TIMESTAMP}-step1-4-1-augment-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    - name: "Run Thin-Band Augmentation — ${{ matrix.iso }}"
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Augment-Only (thin bands 50-99.9%)"
        echo "═══════════════════════════════════════════════════════════"
        python scripts/step1_4_fine_grid_pfs.py --iso ${{ matrix.iso }} --augment-only

    - name: Split any oversized parquets (safety net)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        MAX_MB=45
        for f in data/step1-pfs/"${ISO}"_*augment*.parquet; do
          [ -f "$f" ] || continue
          echo "$f" | grep -q '_part[0-9]' && continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "Warning: $f is ${SIZE_MB}MB (>${MAX_MB}MB), re-splitting..."
            python3 -c "import sys; sys.path.insert(0, 'scripts'); from parquet_utils import write_parquet_chunked; import pyarrow.parquet as pq; import os; t=pq.read_table('$f'); os.remove('$f'); parts=write_parquet_chunked(t, '$f', max_mb=$MAX_MB); print(f'Re-split into {len(parts)} parts')"
          fi
        done

    - name: Commit and push results
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        COMMITTED=0

        push_with_retry() {
          for attempt in 1 2 3 4; do
            git push -u origin "$TARGET_BRANCH" 2>&1 && return 0
            echo "  Push attempt $attempt failed, retrying in $((2**attempt))s..."
            sleep $((2**attempt))
          done
          echo "::error::Push failed after 4 attempts"
          return 1
        }

        for f in data/step1-pfs/"${ISO}"_*augment*.parquet; do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt 49 ]; then
            echo "ERROR: $f is ${SIZE_MB}MB — still over limit after splitting, skipping"
            continue
          fi
          git add -f "$f"
          if ! git diff --cached --quiet; then
            FNAME=$(basename "$f")
            git commit -m "Step 1.4.1 Augment: ${ISO} ${FNAME} (${SIZE_MB}MB) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            COMMITTED=$((COMMITTED + 1))
            echo "  Pushing ${FNAME}..."
            push_with_retry
          fi
        done
        if [ "$COMMITTED" -eq 0 ]; then
          echo "No new augment results to commit."
        else
          echo "Committed and pushed $COMMITTED file(s)"
        fi
        echo "════════════════════════════════════════════════════"
        echo "  Branch: $TARGET_BRANCH"
        echo "  Merge into master to bank the augment results."
        echo "════════════════════════════════════════════════════"

    - name: Upload results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: step1-4-1-augment-${{ matrix.iso }}
        path: data/step1-pfs/${{ matrix.iso }}_*augment*.parquet
        retention-days: 30
        if-no-files-found: warn
