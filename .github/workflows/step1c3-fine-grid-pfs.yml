name: "Step 1C3: Fine-Grid PFS Generator"

# Generates fine-grid PFS mixes (40-70% thresholds) with 1% step incremental
# additions above existing clean floor. Produces dense coverage for MAC
# optimization at mid-range thresholds.
#
# Each ISO runs on its own runner in parallel.
# A final commit job downloads all artifacts and pushes to a single output branch.
#
# Output: data/step1-pfs-parquets/{ISO}_t{T}_fine_pfs.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region(s) to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Build the ISO matrix
  # ════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix
        id: build
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            ISOS='["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]'
          else
            ISOS='["${{ inputs.iso }}"]'
          fi
          echo "matrix={\"iso\":${ISOS}}" >> "$GITHUB_OUTPUT"
          echo "Matrix: iso=${ISOS}"

  # ════════════════════════════════════════════════════════════════════════
  # Per-ISO job — runs in parallel
  # ════════════════════════════════════════════════════════════════════════
  fine-grid-pfs:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 7

    permissions:
      contents: read

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        lfs: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs-parquets

    - name: "Run Step 1C3 — ${{ matrix.iso }}"
      timeout-minutes: 150
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Fine-Grid PFS (40-70%, 1% step)"
        echo "═══════════════════════════════════════════════════════════"
        python scripts/step1c3_fine_grid_pfs.py --iso ${{ matrix.iso }}

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: step1c3-${{ matrix.iso }}
        path: data/step1-pfs-parquets/${{ matrix.iso }}_*_fine_pfs.parquet
        retention-days: 7
        if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════════════
  # Download all artifacts and commit to output branch
  # ════════════════════════════════════════════════════════════════════════
  commit-results:
    needs: [prepare, fine-grid-pfs]
    if: always() && needs.fine-grid-pfs.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 1
        lfs: false

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ inputs.iso }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="auto/${TIMESTAMP}-step1c3-fine-grid-pfs-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Output branch: $TARGET_BRANCH"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs-parquets

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: step1c3-*
        path: data/step1-pfs-parquets/
        merge-multiple: true

    - name: Validate downloaded files
      run: |
        echo "Downloaded results:"
        find data/step1-pfs-parquets/ -name "*_fine_pfs.parquet" | sort
        COUNT=$(find data/step1-pfs-parquets/ -name "*_fine_pfs.parquet" | wc -l)
        echo "Total fine-grid PFS parquet files: $COUNT"
        if [ "$COUNT" -eq 0 ]; then
          echo "WARNING: No fine-grid PFS parquet files found. All jobs may have failed."
          exit 0
        fi

    - name: Commit and push
      run: |
        find data/step1-pfs-parquets/ -name "*_fine_pfs.parquet" -exec git add -f {} +

        if ! git diff --cached --quiet; then
          ISO="${{ inputs.iso }}"
          COUNT=$(git diff --cached --name-only | wc -l)
          git commit -m "Step 1C3 Fine-Grid PFS: ${ISO} — ${COUNT} files — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        else
          echo "No new results to commit."
          exit 0
        fi

        PUSH_OK=false
        for i in 1 2 3 4; do
          if git push -u origin "$TARGET_BRANCH"; then
            PUSH_OK=true
            break
          fi
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done

        if [ "$PUSH_OK" != "true" ]; then
          echo "ERROR: Push failed after 4 attempts."
          exit 1
        fi

        echo "════════════════════════════════════════════════════"
        echo "  Branch: $TARGET_BRANCH"
        echo "  Merge into master to bank the fine-grid PFS results."
        echo "════════════════════════════════════════════════════"
