name: "Step 2.5: Expand EF for Scenario A Floors"

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      dry_run:
        description: 'Dry run (simulate only, no parquet changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_mixes:
        description: 'Target floor mixes per threshold'
        required: false
        default: '200'
        type: string
      source_ref:
        description: 'Branch/tag to checkout scripts from (default: master)'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step2-5-ef-expand

jobs:
  expand-ef:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || 'master' }}
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data exists
        run: |
          if [ ! -d "data/step1-pfs-parquets" ] || ! ls data/step1-pfs-parquets/*.parquet >/dev/null 2>&1; then
            echo "ERROR: PFS parquets not found in data/step1-pfs-parquets/"
            echo "Step 2.5 needs existing PFS data from Step 1."
            exit 1
          fi
          echo "PFS parquets found:"
          ls data/step1-pfs-parquets/ | head -20

          if [ ! -d "data/step3-cost-opt-parquets" ] || ! ls data/step3-cost-opt-parquets/step3_feasible_*.parquet >/dev/null 2>&1; then
            echo "WARNING: No step3 feasible parquets found. Will use shared-data.js only."
          else
            echo "Step 3 feasible parquets found:"
            ls data/step3-cost-opt-parquets/step3_feasible_*.parquet
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas scipy

      - name: Build CLI arguments
        id: cli-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          TARGET="${{ github.event.inputs.target_mixes }}"

          ARGS=""
          if [ "$INPUT_ISO" != "ALL" ]; then
            ARGS="$ARGS --iso $INPUT_ISO"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$TARGET" ] && [ "$TARGET" != "200" ]; then
            ARGS="$ARGS --target-mixes $TARGET"
          fi
          echo "cli_args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: "Step 2.5: Expand EF with floor-compatible PFS mixes"
        timeout-minutes: 90
        run: python scripts/step2_5_expand_ef_for_floors.py ${{ steps.cli-args.outputs.cli_args }}

      - name: Commit and push outputs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step3-cost-opt-parquets/step3_feasible_*.parquet 2>/dev/null || true
          git add -f data/step5-post-processing/ef_expansion_log.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          ISO_LABEL="${{ github.event.inputs.iso }}"
          git commit -m "Step 2.5 EF Expansion: ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO_LABEL="${{ github.event.inputs.iso }}"
          PR_BODY="## Summary"$'\n'"- Step 2.5 EF expansion with floor-compatible PFS mixes for **${ISO_LABEL}**"$'\n'"- Augments step3 feasible parquets with mixes that satisfy Scenario A floor constraints"$'\n'"- After merging, re-run Step 7 (generate_shared_data) to update dashboard JS"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 2.5 EF Expansion: ${ISO_LABEL}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
