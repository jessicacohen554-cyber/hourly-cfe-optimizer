name: Run Step 1 PFS (two-stage)

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (or ALL)'
        required: true
        default: 'NYISO'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds or "all"'
        required: true
        default: 'all'
        type: string
      branch:
        description: 'Branch to checkout (default: master)'
        required: false
        default: 'master'
        type: string
      stage:
        description: 'Which stage(s) to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - 1a-only
          - 1b-only
      chunk_size:
        description: 'Scoring chunk size (default 20000 ≈ 1.4 GiB peak)'
        required: false
        default: '20000'
        type: string

env:
  BRANCH_PREFIX: step1-pfs

jobs:
  run-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install numpy numba pyarrow pandas

    - name: Create output directories
      run: mkdir -p data/step1-pfs-parquets

    - name: "Stage 1a: Build scored mix database"
      if: ${{ inputs.stage == 'both' || inputs.stage == '1a-only' }}
      run: |
        ISO="${{ inputs.iso }}"
        CHUNK="${{ inputs.chunk_size || '20000' }}"
        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo "=== Building scored mixes for $iso ==="
            python scripts/step1a_build_scored_mixes.py --iso "$iso" --chunk-size "$CHUNK" --force
          done
        else
          python scripts/step1a_build_scored_mixes.py --iso "$ISO" --chunk-size "$CHUNK" --force
        fi

    - name: "Stage 1b: Build PFS from scored database"
      if: ${{ inputs.stage == 'both' || inputs.stage == '1b-only' }}
      run: |
        ISO="${{ inputs.iso }}"
        THRESHOLDS="${{ inputs.thresholds }}"
        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo "=== Building PFS for $iso ==="
            python scripts/step1b_build_pfs.py --iso "$iso" --thresholds "$THRESHOLDS"
          done
        else
          python scripts/step1b_build_pfs.py --iso "$ISO" --thresholds "$THRESHOLDS"
        fi

    - name: Commit and push results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LABEL="${{ inputs.iso }}"
        TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}"
        git checkout -b "$TARGET_BRANCH"

        git add -f data/step1-pfs-parquets/
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        STAGE="${{ inputs.stage }}"
        git commit -m "Step 1 PFS (${STAGE}): ${ISO_LABEL} thresholds=${{ inputs.thresholds }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

        MAX_RETRIES=5
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Push attempt $i/$MAX_RETRIES..."
          PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
            echo "Push succeeded on attempt $i"
            break
          }
          echo "$PUSH_OUTPUT"
          if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
            echo "ERROR: Push rejected due to large files (GH001)."
            exit 1
          fi
          if [ "$i" -eq "$MAX_RETRIES" ]; then
            echo "ERROR: Push failed after $MAX_RETRIES attempts"
            exit 1
          fi
          BACKOFF=$((2 ** i))
          echo "Retrying in ${BACKOFF}s..."
          sleep "$BACKOFF"
        done

        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

    - name: Create pull request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$TARGET_BRANCH" ]; then
          echo "No branch to create PR for"
          exit 0
        fi
        PR_BODY="## Summary"$'\n'"- Step 1 PFS (two-stage) for **${{ inputs.iso }}** at thresholds **${{ inputs.thresholds }}**"$'\n'"- Stage: ${{ inputs.stage }}"$'\n'"- Auto-generated by GitHub Actions workflow run"
        gh pr create \
          --title "Step 1 PFS: ${{ inputs.iso }} thresholds=${{ inputs.thresholds }}" \
          --body "$PR_BODY" \
          --base master \
          --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
