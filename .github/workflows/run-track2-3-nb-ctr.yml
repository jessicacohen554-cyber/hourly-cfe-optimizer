name: Run Track 2-3 NB + CTR

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (CAISO, ERCOT, PJM, NYISO, NEISO, MISO, SPP — or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
      mode:
        description: 'Sensitivity mode'
        required: true
        default: 'medium'
        type: choice
        options:
          - medium
          - full

env:
  TARGET_BRANCH: tracks-2-3-NB-CTR

jobs:
  run-track2-3:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify step-2 EF parquets exist
        run: |
          if [ ! -d data/step2-ef-parquets ] || [ -z "$(ls data/step2-ef-parquets/*.parquet 2>/dev/null)" ]; then
            echo "ERROR: Step-2 EF parquets not found in data/step2-ef-parquets/"
            echo "Run Step 2 workflow first and merge results to master."
            exit 1
          fi
          echo "Step-2 EF parquets found:"
          ls -lh data/step2-ef-parquets/

      - name: Switch to target branch
        run: |
          # Stash any uncommitted changes so branch switch doesn't conflict
          git stash --include-untracked || true

          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

          git stash drop || true

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow

      - name: Ensure output directories exist
        run: mkdir -p dashboard

      - name: Build run arguments
        id: run-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          INPUT_MODE="${{ github.event.inputs.mode }}"

          FLAGS=""
          if [ "$INPUT_ISO" != "ALL" ]; then
            FLAGS="--iso $INPUT_ISO"
          fi
          if [ "$INPUT_MODE" = "full" ]; then
            FLAGS="$FLAGS --full"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run Track 2-3 NB + CTR
        run: |
          python scripts/step3_track_nb_ctr.py ${{ steps.run-args.outputs.flags }}

      - name: Commit and push Track 2-3 outputs (with retry for concurrent runs)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add output files if they exist (script may skip ISOs with no EF data)
          for f in dashboard/track_scenarios.parquet dashboard/track_demand_growth.parquet; do
            if [ -f "$f" ]; then
              git add -f "$f"
            else
              echo "WARNING: $f not found — script may not have produced output"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          ISO_LABEL="${{ github.event.inputs.iso }}"
          MODE_LABEL="${{ github.event.inputs.mode }}"
          git commit -m "Track 2-3 NB+CTR: ${ISO_LABEL} (${MODE_LABEL}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Retry push with pull-rebase to handle concurrent ISO jobs pushing
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            if git push origin "$TARGET_BRANCH"; then
              echo "Push succeeded on attempt $i"
              break
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push rejected — another ISO job pushed first. Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"

            git pull --rebase origin "$TARGET_BRANCH"
          done

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
          else
            PR_BODY="## Summary"$'\n'"- Track 2-3 New-Build + Cost-to-Replace results for **${{ github.event.inputs.iso }}** (**${{ github.event.inputs.mode }}** mode)"$'\n'"- Auto-generated by GitHub Actions workflow run"
            gh pr create \
              --title "Track 2-3 NB+CTR: ${{ github.event.inputs.iso }} (${{ github.event.inputs.mode }})" \
              --body "$PR_BODY" \
              --base master \
              --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
          fi
