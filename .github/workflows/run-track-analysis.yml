name: Run Step 5 Track Analysis

on:
  workflow_dispatch:
    inputs:
      scripts:
        description: 'Which scripts to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - export-only
          - analyze-only

env:
  BRANCH_PREFIX: track-analysis

jobs:
  run-track-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${SCRIPTS_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${SCRIPTS_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify track parquets exist
        run: |
          if [ ! -f dashboard/track_scenarios.parquet ]; then
            echo "ERROR: dashboard/track_scenarios.parquet not found"
            echo "Run the Track 2-3 NB+CTR workflow first and merge results to master."
            exit 1
          fi
          echo "Track parquets found:"
          ls -lh dashboard/track_scenarios.parquet
          ls -lh dashboard/track_demand_growth.parquet 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p dashboard
          mkdir -p data/step5-post-processing

      # ── Export track parquets → track_results.json ──
      - name: Run Export Track Results
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'export-only' }}
        run: python scripts/step5_export_track_results.py

      # ── Analyze tracks (cost envelopes, mix differentials) ──
      - name: Run Analyze Tracks
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'analyze-only' }}
        run: python scripts/step5_analyze_tracks.py

      - name: Commit and push track analysis outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage output files
          git add -f dashboard/track_results.json 2>/dev/null || true
          git add -f data/step5-post-processing/track_results.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          git commit -m "Step 5 Track Analysis: ${SCRIPTS_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push fresh branch (retry for transient network errors only)
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## Summary"$'\n'"- Step 5 track analysis (export + analyze) — **${{ github.event.inputs.scripts }}** mode"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Track Analysis: ${{ github.event.inputs.scripts }}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
