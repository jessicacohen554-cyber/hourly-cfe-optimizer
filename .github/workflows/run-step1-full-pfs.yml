name: Run Step 1 Full PFS Generation

on:
  workflow_dispatch:

jobs:
  run-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: step1-PFS-ISO-parquets

      - name: Ensure target branch exists locally
        run: |
          git fetch origin step1-PFS-ISO-parquets || true
          git checkout -B step1-PFS-ISO-parquets origin/step1-PFS-ISO-parquets || git checkout -B step1-PFS-ISO-parquets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas

      - name: Ensure output directories exist
        run: |
          mkdir -p data/checkpoints_v4
          mkdir -p data/step1_raw_pfs_parquets

      - name: Run Step 1 PFS generator (full run)
        run: python scripts/step1_pfs_generator.py

      - name: Commit Step 1 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/checkpoints_v4/ data/step1_raw_pfs_parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Step 1 full PFS: all ISOs × all thresholds — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git push origin step1-PFS-ISO-parquets
