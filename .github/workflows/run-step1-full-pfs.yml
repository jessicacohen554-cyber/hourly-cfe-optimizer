name: Run Step 1 Full PFS Generation

on:
  workflow_dispatch:

jobs:
  run-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure target branch exists locally
        run: |
          git fetch origin step1-full-pfs-results || true
          git checkout -B step1-full-pfs-results origin/step1-full-pfs-results || git checkout -B step1-full-pfs-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p data
          mkdir -p data/checkpoints_v4

      - name: Run Step 1 PFS generator (full run)
        run: python scripts/step1_pfs_generator.py

      - name: Commit Step 1 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/physics_cache_v4*.parquet data/checkpoints_v4/ scripts/dashboard/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Step 1 full PFS outputs"
          fi

          git push origin step1-full-pfs-results
