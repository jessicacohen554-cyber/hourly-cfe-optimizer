name: Run Step 1 Full PFS Generation

on:
  workflow_dispatch:

env:
  TARGET_BRANCH: step1-PFS-ISO-parquets

jobs:
  run-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to target branch
        run: |
          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p data/checkpoints_v4
          mkdir -p data/step1-pfs-parquets

      - name: Run Step 1 PFS generator (full run)
        run: python scripts/step1_pfs_generator.py

      - name: Commit Step 1 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/checkpoints_v4/ data/step1-pfs-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Step 1 full PFS: all ISOs × all thresholds — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git pull --rebase origin "$TARGET_BRANCH" || true
          git push origin "$TARGET_BRANCH"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
          else
            PR_BODY="## Summary"$'\n'"- Full Step 1 PFS generation for all ISOs and thresholds"$'\n'"- Auto-generated by GitHub Actions workflow run"
            gh pr create \
              --title "Step 1 PFS: full generation — all ISOs × all thresholds" \
              --body "$PR_BODY" \
              --base master \
              --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
          fi
