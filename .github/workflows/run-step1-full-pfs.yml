name: Run Step 1 Full PFS Generation

on:
  workflow_dispatch:

jobs:
  run-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p data
          mkdir -p data/checkpoints_v4

      - name: Run Step 1 PFS generator (full run)
        run: python step1_pfs_generator.py

      - name: Upload Step 1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: step1-pfs-output
          path: |
            data/physics_cache_v4.parquet
            data/checkpoints_v4/
          if-no-files-found: error
