name: Run Step 1 Full PFS Generation

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to generate (ALL runs every region)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      workers:
        description: 'Parallel workers (0 = auto from CPU count)'
        required: false
        default: '0'
        type: string
      branch:
        description: 'Branch to checkout (default: master)'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step1-pfs-full

jobs:
  run-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ inputs.iso }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Increase post buffer to 500 MB — PFS parquets can be large and
          # the default 1 MB buffer causes HTTP 500 on push.
          git config http.postBuffer 524288000
          git checkout -b "$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas

      - name: Ensure output directories exist
        run: |
          mkdir -p data/checkpoints_v4
          mkdir -p data/step1-pfs-parquets

      - name: Run Step 1 PFS generator
        run: |
          ISO_ARGS=""
          if [ "${{ inputs.iso }}" != "ALL" ]; then
            ISO_ARGS="${{ inputs.iso }}"
          fi

          WORKERS="${{ inputs.workers }}"
          if [ -z "$WORKERS" ] || [ "$WORKERS" = "0" ]; then
            WORKERS=$(nproc)
          fi

          echo "ISOs: ${ISO_ARGS:-ALL}"
          echo "Workers: $WORKERS"
          echo "CPUs available: $(nproc)"

          python scripts/step1_pfs_generator.py $ISO_ARGS --workers "$WORKERS"

      - name: Commit and push Step 1 outputs (batched by ISO)
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          ISO_LABEL="${{ inputs.iso }}"
          if [ "$ISO_LABEL" = "ALL" ]; then
            ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
          else
            ISOS="$ISO_LABEL"
          fi

          push_with_retry() {
            local label="$1"
            local MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "  Push attempt $i/$MAX_RETRIES for ${label}..."
              PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
                echo "  Push succeeded for ${label} on attempt $i"
                return 0
              }
              echo "$PUSH_OUTPUT"
              if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
                echo "  ERROR: GH001 (large file) for ${label}"
                return 1
              fi
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "  ERROR: Push failed for ${label} after $MAX_RETRIES attempts"
                return 1
              fi
              BACKOFF=$((2 ** i))
              echo "  Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
            done
          }

          PUSHED=false

          for iso in $ISOS; do
            echo ""
            echo "--- Batching commit for $iso ---"

            # Collect this ISO's PFS parquets + checkpoints
            PFS_FILES=$(ls data/step1-pfs-parquets/${iso}_*.parquet 2>/dev/null || true)
            CKPT_FILES=$(ls data/checkpoints_v4/${iso}_*.parquet 2>/dev/null || true)
            ALL_FILES="$PFS_FILES $CKPT_FILES"
            ALL_FILES=$(echo "$ALL_FILES" | xargs)  # trim whitespace

            if [ -z "$ALL_FILES" ]; then
              echo "  No output files for $iso — skipping"
              continue
            fi

            git add -f $ALL_FILES
            if git diff --cached --quiet; then
              echo "  No changes for $iso — skipping"
              continue
            fi

            FILE_COUNT=$(echo "$ALL_FILES" | wc -w)
            BATCH_MB=$(du -cm $ALL_FILES 2>/dev/null | tail -1 | cut -f1)
            echo "  Staging $FILE_COUNT files (~${BATCH_MB} MB) for $iso"

            git commit -m "Step 1 PFS: ${iso} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            if push_with_retry "$iso"; then
              PUSHED=true
            else
              echo "  Per-ISO push failed for $iso — falling back to per-file batching"
              git reset HEAD~1

              for f in $ALL_FILES; do
                FNAME=$(basename "$f")
                git add -f "$f"
                if git diff --cached --quiet; then
                  continue
                fi
                FILE_MB=$(du -m "$f" | cut -f1)
                echo "  Committing $FNAME (~${FILE_MB} MB)"
                git commit -m "Step 1: ${FNAME} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

                if push_with_retry "$FNAME"; then
                  PUSHED=true
                else
                  echo "  ERROR: Per-file push also failed for $FNAME — skipping"
                  git reset HEAD~1
                fi
              done
            fi
          done

          if [ "$PUSHED" = false ]; then
            echo "No changes were pushed"
          fi

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO_LABEL="${{ inputs.iso }}"
          if [ "$ISO_LABEL" = "ALL" ]; then
            PR_TITLE="Step 1 PFS: full generation — all ISOs × all thresholds"
            PR_SUMMARY="Full Step 1 PFS generation for all ISOs and thresholds"
          else
            PR_TITLE="Step 1 PFS: ${ISO_LABEL} × all thresholds"
            PR_SUMMARY="Step 1 PFS generation for **${ISO_LABEL}** (all thresholds)"
          fi
          PR_BODY="## Summary"$'\n'"- ${PR_SUMMARY}"$'\n'"- Workers: ${{ inputs.workers }} (0 = auto)"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
