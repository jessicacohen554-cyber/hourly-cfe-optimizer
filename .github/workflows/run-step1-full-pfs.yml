name: Run Step 1 Full PFS Generation

on:
  workflow_dispatch:

env:
  BRANCH_PREFIX: step1-pfs-full

jobs:
  run-step1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p data/checkpoints_v4
          mkdir -p data/step1-pfs-parquets

      - name: Run Step 1 PFS generator (full run)
        run: python scripts/step1_pfs_generator.py

      - name: Commit and push Step 1 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/checkpoints_v4/ data/step1-pfs-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 1 full PFS: all ISOs × all thresholds — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push fresh branch (retry for transient network errors only)
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            # Fail immediately on large-file rejection (not recoverable by retry)
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              echo "Check file sizes — GitHub limit is 100 MB per file."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## Summary"$'\n'"- Full Step 1 PFS generation for all ISOs and thresholds"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 1 PFS: full generation — all ISOs × all thresholds" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
