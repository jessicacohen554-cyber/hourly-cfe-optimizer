name: "Step 2.3: Sobol + Refinement"

# Runs sobol_refinement_test.py in two modes:
#   refine-only:  Sobol N samples + Nelder-Mead polish (default)
#   comparison:   Full A/B test with baseline and low_refined arms
#
# Supports "all" sweeps for samples and beams.
# Output: JSON results committed to auto/ branch via GitHub REST API.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: "ISO region"
        required: true
        default: "ERCOT"
        type: choice
        options:
          - ERCOT
          - PJM
          - CAISO
          - NYISO
          - NEISO
          - MISO
          - SPP
      pathway:
        description: "Pathway (A=VRE-only, B=NOAK 2035, C=NOAK 2040, D=NOAK 2045)"
        required: true
        default: "A"
        type: choice
        options:
          - A
          - B
          - C
          - D
      sample_size:
        description: "Sobol sample count (all = sweep 1k→160k)"
        required: true
        default: "20000"
        type: choice
        options:
          - "1000"
          - "2500"
          - "5000"
          - "10000"
          - "20000"
          - "40000"
          - "80000"
          - "160000"
          - "all"
      beams:
        description: "Beams per archetype (all = 1→256, all_under_64 = 1→32)"
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"
          - "16"
          - "32"
          - "64"
          - "128"
          - "256"
          - "all_under_64"
          - "all"
      archetype:
        description: "Archetype filter"
        required: true
        default: "balanced"
        type: choice
        options:
          - balanced
          - solar-led
          - wind-led
          - nuclear-heavy
          - offshore-heavy
          - all
      radius:
        description: "Refinement radius (pct per dimension)"
        required: true
        default: "2.0"
        type: choice
        options:
          - "1.0"
          - "2.0"
          - "3.0"
          - "5.0"
      mode:
        description: "refine-only = just run Sobol+refinement; comparison = full A/B test"
        required: true
        default: "refine-only"
        type: choice
        options:
          - "refine-only"
          - "comparison"
      branch:
        description: "Branch to checkout"
        required: false
        default: "master"
        type: string

env:
  BRANCH_PREFIX: refinement-test
  PYTHONUNBUFFERED: "1"

jobs:
  refinement-test:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: write

    concurrency:
      group: refinement-test-${{ inputs.iso }}-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Configure git for large parquets
        run: |
          git config http.postBuffer 524288000
          git config core.packedGitLimit 2g
          git config core.packedGitWindowSize 256m
          git config pack.windowMemory 256m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy numba pyarrow

      - name: Ensure output directory
        run: mkdir -p data/sampling-tests

      - name: Run Sobol + refinement
        env:
          ISO: ${{ inputs.iso }}
          PATHWAY: ${{ inputs.pathway }}
          SAMPLES_INPUT: ${{ inputs.sample_size }}
          BEAMS_INPUT: ${{ inputs.beams }}
          RADIUS: ${{ inputs.radius }}
          ARCHETYPE: ${{ inputs.archetype }}
          MODE: ${{ inputs.mode }}
        run: |
          # Expand "all" to sweep lists
          if [ "${SAMPLES_INPUT}" = "all" ]; then
            SAMPLES_LIST="1000 2500 5000 10000 20000 40000 80000 160000"
          else
            SAMPLES_LIST="${SAMPLES_INPUT}"
          fi

          if [ "${BEAMS_INPUT}" = "all" ]; then
            BEAMS_LIST="1 2 4 8 16 32 64 128 256"
          elif [ "${BEAMS_INPUT}" = "all_under_64" ]; then
            BEAMS_LIST="1 2 4 8 16 32"
          else
            BEAMS_LIST="${BEAMS_INPUT}"
          fi

          COMBO_COUNT=0
          for s in $SAMPLES_LIST; do for b in $BEAMS_LIST; do COMBO_COUNT=$((COMBO_COUNT + 1)); done; done

          echo "═══════════════════════════════════════════════════"
          echo "  ISO:       ${ISO}"
          echo "  Pathway:   ${PATHWAY}"
          echo "  Samples:   ${SAMPLES_INPUT} → [${SAMPLES_LIST}]"
          echo "  Beams:     ${BEAMS_INPUT} → [${BEAMS_LIST}]"
          echo "  Radius:    ${RADIUS}"
          echo "  Archetype: ${ARCHETYPE}"
          echo "  Mode:      ${MODE}"
          echo "  Combos:    ${COMBO_COUNT}"
          echo "═══════════════════════════════════════════════════"

          MODE_FLAG=""
          if [ "${MODE}" = "refine-only" ]; then
            MODE_FLAG="--refine-only"
          fi

          FAIL=0
          RUN=0
          for samples in $SAMPLES_LIST; do
            for beams in $BEAMS_LIST; do
              RUN=$((RUN + 1))
              echo ""
              echo "── Run ${RUN}/${COMBO_COUNT}: samples=${samples} beams=${beams} ──"

              BASELINE_FLAG=""
              if [ "${MODE}" != "refine-only" ]; then
                PATTERN="data/sampling-tests/${ISO}__pw${PATHWAY}__sobol${samples}__beams${beams}__${ARCHETYPE}__*.json"
                BASELINE=$(ls -t ${PATTERN} 2>/dev/null | head -1)
                if [ -n "${BASELINE}" ]; then
                  echo "[baseline] Reusing: ${BASELINE}"
                  BASELINE_FLAG="--baseline-file ${BASELINE}"
                fi
              fi

              python3 -u scripts/sobol_refinement_test.py \
                "${ISO}" "${PATHWAY}" "${samples}" "${beams}" \
                --radius "${RADIUS}" --archetype "${ARCHETYPE}" \
                ${MODE_FLAG} ${BASELINE_FLAG} \
                2>&1 | tee /tmp/run_${samples}_${beams}.log

              if grep -q "RESULT_JSON:" /tmp/run_${samples}_${beams}.log; then
                echo "[ok] samples=${samples} beams=${beams} complete"
              else
                echo "::warning::No RESULT_JSON for samples=${samples} beams=${beams}"
                FAIL=$((FAIL + 1))
              fi
            done
          done

          echo ""
          echo "[done] ${RUN} runs, ${FAIL} failures"
          if [ "$FAIL" -eq "$RUN" ]; then
            echo "::error::All ${RUN} runs failed"
            exit 1
          fi

      - name: Verify outputs
        run: |
          file_count=$(ls data/sampling-tests/*refinement_test*.json 2>/dev/null | wc -l)
          if [ "$file_count" -eq 0 ]; then
            echo "::error::No result files found"
            exit 1
          fi
          echo "[verify] ${file_count} result files:"
          for f in data/sampling-tests/*refinement_test*.json; do
            sz=$(du -h "$f" | cut -f1)
            echo "  ${f} (${sz})"
          done

      # ── Push via GitHub REST API ──────────────────────────────
      - name: Push results via API
        env:
          ISO: ${{ inputs.iso }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          branch="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO}"
          REPO="${GITHUB_REPOSITORY}"
          SOURCE_BRANCH="${{ inputs.branch || 'master' }}"

          BASE_SHA=$(gh api "repos/${REPO}/git/ref/heads/${SOURCE_BRANCH}" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/${REPO}/git/commits/${BASE_SHA}" --jq '.tree.sha')
          echo "[api] Base commit: ${BASE_SHA}"

          TREE_ENTRIES="[]"
          file_count=0

          for f in data/sampling-tests/*refinement_test*.json; do
            [ -f "$f" ] || continue
            file_count=$((file_count + 1))
            echo "[api] Uploading: ${f} ($(du -h "$f" | cut -f1))"

            BLOB_SHA=$(base64 -w0 "$f" \
              | jq -Rs '{"encoding":"base64","content":.}' \
              | gh api "repos/${REPO}/git/blobs" --input - --jq '.sha')

            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$f" \
              --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')
          done

          if [ "$file_count" -eq 0 ]; then
            echo "::error::No files to commit"
            exit 1
          fi

          TREE_SHA=$(echo "$TREE_ENTRIES" | jq --arg base "$BASE_TREE" \
            '{"base_tree": $base, "tree": .}' | \
            gh api "repos/${REPO}/git/trees" --input - --jq '.sha')

          COMMIT_MSG="Refinement: ${ISO} pw=${{ inputs.pathway }} s=${{ inputs.sample_size }} b=${{ inputs.beams }} r=${{ inputs.radius }} arch=${{ inputs.archetype }}"
          COMMIT_SHA=$(jq -n \
            --arg msg "${COMMIT_MSG}" \
            --arg tree "$TREE_SHA" \
            --arg parent "$BASE_SHA" \
            '{"message": $msg, "tree": $tree, "parents": [$parent]}' | \
            gh api "repos/${REPO}/git/commits" --input - --jq '.sha')

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            if gh api "repos/${REPO}/git/refs" \
              -f "ref=refs/heads/${branch}" \
              -f "sha=${COMMIT_SHA}" > /dev/null 2>&1; then
              echo "[api] Branch created: ${branch}"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Failed to create branch after $MAX_RETRIES attempts"
              exit 1
            fi
            sleep $((2 ** i))
          done

          echo "BRANCH=${branch}" >> "${GITHUB_ENV}"

      - name: Summary
        if: always()
        env:
          ISO: ${{ inputs.iso }}
        run: |
          {
            echo "## Sobol + Refinement — ${ISO}"
            echo ""
            if [ -n "${BRANCH:-}" ]; then
              echo "- Branch: \`${BRANCH}\`"
            else
              echo "- Branch: (not pushed)"
            fi
            echo "- Pathway: \`${{ inputs.pathway }}\`"
            echo "- Samples: \`${{ inputs.sample_size }}\`"
            echo "- Beams: \`${{ inputs.beams }}\`"
            echo "- Radius: \`${{ inputs.radius }}\`"
            echo "- Archetype: \`${{ inputs.archetype }}\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo ""

            file_count=$(ls data/sampling-tests/*refinement_test*.json 2>/dev/null | grep -v logs | wc -l)
            echo "**${file_count} result file(s) committed.**"
            echo ""
            echo "Run **Squash Pipeline Branches** with pattern \`auto/.*refinement-test\` to consolidate."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refinement-test-${{ inputs.iso }}-${{ github.run_id }}
          path: data/sampling-tests/*refinement_test*
          retention-days: 30
          if-no-files-found: warn
