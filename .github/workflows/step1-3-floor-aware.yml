name: "Step 1.3: Floor-Aware PFS"

# Floor-aware PFS augmentation for 50-70% thresholds (2% step).
# Each ISO runs on its own runner in parallel.
#
# Output: data/step1-pfs/{ISO}_*.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      threshold_band:
        description: 'Threshold band to run (ignored if custom_thresholds set)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - FLOOR
          - NEAR_MISS
      custom_thresholds:
        description: 'Custom thresholds (e.g. "55,60,70"). Overrides threshold_band.'
        required: false
        default: ''
        type: string
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"
  # Threshold bands for matrix expansion
  THRESHOLDS_FLOOR: "50,55,60,65,70"
  THRESHOLDS_NEAR_MISS: "75,80"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      thresholds: ${{ steps.resolve-thresholds.outputs.thresholds }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve thresholds
        id: resolve-thresholds
        run: |
          CUSTOM="${{ inputs.custom_thresholds }}"
          BAND="${{ inputs.threshold_band }}"

          if [ -n "$CUSTOM" ]; then
            echo "Using custom thresholds: $CUSTOM"
            echo "thresholds=$CUSTOM" >> "$GITHUB_OUTPUT"
          elif [ "$BAND" = "FLOOR" ]; then
            echo "thresholds=$THRESHOLDS_FLOOR" >> "$GITHUB_OUTPUT"
          elif [ "$BAND" = "NEAR_MISS" ]; then
            echo "thresholds=$THRESHOLDS_NEAR_MISS" >> "$GITHUB_OUTPUT"
          else
            echo "thresholds=" >> "$GITHUB_OUTPUT"
          fi

  floor-aware:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="auto/${TIMESTAMP}-step1-3-floor-pfs-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    - name: "Run Floor-Aware PFS — ${{ matrix.iso }}"
      run: |
        THRESHOLDS="${{ needs.prepare.outputs.thresholds }}"
        echo "═══════════════════════════════════════════════════════════"
        if [ -n "$THRESHOLDS" ]; then
          echo "  ISO: ${{ matrix.iso }}  |  Floor-Aware PFS  |  Thresholds: $THRESHOLDS"
        else
          echo "  ISO: ${{ matrix.iso }}  |  Floor-Aware PFS (50-80%, all)"
        fi
        echo "═══════════════════════════════════════════════════════════"

        ARGS="--iso ${{ matrix.iso }}"
        if [ -n "$THRESHOLDS" ]; then
          ARGS="$ARGS --thresholds $THRESHOLDS"
        fi
        eval python scripts/step1_3_floor_aware_pfs.py $ARGS

    - name: Commit results
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        git add -f data/step1-pfs/"${ISO}"_*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1.3 Floor-Aware PFS: ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        else
          echo "No new results"
        fi

    - name: Push results
      if: always()
      run: |
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "Branch: $TARGET_BRANCH"
        echo "Merge this branch into master to bank the PFS results."
