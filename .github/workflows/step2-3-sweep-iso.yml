name: "Step 2.3: Pathway Sweep (+ 2.3a Peakclean)"

# Runs step_2_3_reliability_tax_optimized.py for each ISO.
# Each matrix job runs 20 myopic + 12 foresight = 32 combos for one ISO and
# pushes its own auto/<TS>-step2-3-sweep-<ISO> branch. iso=ALL fans out to 7
# parallel matrix jobs, each landing on its own branch; run
# squash-pipeline-branches.yml with pattern "auto/.*step2-3-sweep" afterwards
# to consolidate into master.
#
# One failed ISO does NOT block the others (fail-fast: false + per-ISO push).
#
# phase=full               : regenerates peakclean sidecars (standard + interp)
#                             then runs the 32-combo sweep
# phase=peakclean_only     : runs step2_3a_regenerate_peakclean.py for standard
#                             bands + interp files (no sweep)
# phase=peakclean_interp_only : runs step2_3a_regenerate_peakclean.py --interp-only
#                             (only interp/dense-augment sidecars, no standard bands)
# phase=peakclean_lowcf_only : runs step2_3a_regenerate_peakclean.py --lowcf-only
#                             (only *_interp_lowcf.parquet sidecars from step 2.1d)
# phase=sweep_only         : only runs the 32-combo sweep (assumes peakclean exists)
# runner_size=large        : uses 16-core/64GB runner (~8x faster numba parallelism)
# runner_size=standard     : uses default 2-core/7GB runner
#
# Prerequisite: Step 2.1 EF parquets, Step 2.2 cost endpoints (for foresight
# ceilings), Step 3A dispatch cache.
# Output: data/step2.3-pathway/<ISO>/pathway*_ep*{,_foresight}.json
#         data/step2.3-pathway/MANIFEST_<ISO>.parquet
#         data/step2.1-ef/step_2_1_EF_<ISO>_*_peakclean.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run (ALL = parallel across 7)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      phase:
        description: 'Which phase to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - peakclean_only
          - peakclean_interp_only
          - peakclean_lowcf_only
          - sweep_only
      runner_size:
        description: 'Runner size (standard = 2-core/7GB, large = 16-core/64GB — requires GitHub Team plan)'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - large
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step2-3-sweep
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: prepare
    runs-on: ${{ inputs.runner_size == 'large' && 'ubuntu-24.04-16core' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.runner_size == 'large' && 90 || 240 }}
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    # Per-ISO concurrency group — different ISOs run in parallel; a re-dispatch
    # of the same ISO queues behind the in-flight one.
    concurrency:
      group: step2-3-sweep-${{ matrix.iso }}
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Verify step 2.1 EF parquets exist
        run: |
          if [ ! -d data/step2.1-ef ] || ! ls data/step2.1-ef/step_2_1_EF_${{ matrix.iso }}_*.parquet >/dev/null 2>&1; then
            echo "ERROR: Step 2.1 EF parquets not found for ${{ matrix.iso }}. Run Step 2.1 first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy numba pyarrow scipy

      - name: "Phase: Regenerate peakclean sidecars — ${{ matrix.iso }}"
        if: inputs.phase == 'full' || inputs.phase == 'peakclean_only' || inputs.phase == 'peakclean_interp_only' || inputs.phase == 'peakclean_lowcf_only'
        env:
          ISO: ${{ matrix.iso }}
        timeout-minutes: ${{ inputs.runner_size == 'large' && 20 || 90 }}
        run: |
          if [ "${{ inputs.phase }}" = "peakclean_interp_only" ]; then
            python scripts/step2_3a_regenerate_peakclean.py --iso "$ISO" --interp-only --validate
          elif [ "${{ inputs.phase }}" = "peakclean_lowcf_only" ]; then
            python scripts/step2_3a_regenerate_peakclean.py --iso "$ISO" --lowcf-only --validate
          else
            python scripts/step2_3a_regenerate_peakclean.py --iso "$ISO" --validate
          fi

      - name: Ensure output directory
        run: mkdir -p data/step2.3-pathway/${{ matrix.iso }}

      - name: "Run sweep (32 combos) — ${{ matrix.iso }}"
        if: inputs.phase == 'full' || inputs.phase == 'sweep_only'
        env:
          ISO: ${{ matrix.iso }}
          # Restrict module-scope loads (dispatch cache, gen profiles, hybrid
          # profiles) to this one ISO — full 7-ISO load OOMs ubuntu-latest's 7GB.
          # Still used on larger runners to reduce startup time.
          ISO_FILTER: ${{ matrix.iso }}
        run: |
          python - <<'PY'
          import os, sys, time
          sys.path.insert(0, 'scripts')
          from step2_3_reliability_tax_optimized import _run_iso_all
          iso = os.environ['ISO']
          t0 = time.time()
          _run_iso_all(iso)
          print(f'[sweep] {iso} done in {time.time()-t0:.1f}s', flush=True)
          PY

      - name: "Verify combo count — ${{ matrix.iso }}"
        if: inputs.phase == 'full' || inputs.phase == 'sweep_only'
        env:
          ISO: ${{ matrix.iso }}
        run: |
          myopic=$(ls data/step2.3-pathway/${ISO}/pathway*_ep*.json 2>/dev/null \
                   | grep -v '_foresight\.json$' | wc -l)
          foresight=$(ls data/step2.3-pathway/${ISO}/pathway*_ep*_foresight.json 2>/dev/null | wc -l)
          total=$((myopic + foresight))
          echo "[verify] ${ISO}: ${myopic}/20 myopic + ${foresight}/12 foresight = ${total}/32 JSONs"
          if [ "${myopic}" -lt 20 ] || [ "${foresight}" -lt 12 ]; then
            echo "::warning::${ISO} wrote ${myopic}/20 myopic + ${foresight}/12 foresight — investigate before merging"
          fi

      - name: "Build MANIFEST shard — ${{ matrix.iso }}"
        if: inputs.phase == 'full' || inputs.phase == 'sweep_only'
        env:
          ISO: ${{ matrix.iso }}
        run: |
          python - <<'PY'
          import glob, json, os
          import pyarrow as pa
          import pyarrow.parquet as pq

          iso = os.environ['ISO']
          rows = []
          for p in sorted(glob.glob(f'data/step2.3-pathway/{iso}/pathway*_ep*.json')):
              with open(p) as f:
                  d = json.load(f)
              cfg = d['config']
              rows.append({
                  'iso':                        cfg['iso'],
                  'pathway':                    cfg['pathway'],
                  'endpoint':                   float(cfg['endpoint']),
                  'endpoint_pct':               float(cfg['endpoint_pct']),
                  'solver_mode':                str(cfg.get('solver_mode', 'myopic')),
                  'schema_version':             int(d['schema_version']),
                  'feasibility_physical':       bool(d['feasibility']['physical']),
                  'achieved_cfe_pct':           float(d['headline']['achieved_cfe_pct']),
                  'undiscounted_cost_usd':      float(d['headline']['undiscounted_cost_usd']),
                  'npv_at_5pct':                float(d['headline']['npv_at_5pct']),
                  'npv_at_7pct':                float(d['headline']['npv_at_7pct']),
                  'npv_at_9pct':                float(d['headline']['npv_at_9pct']),
                  'reliability_tax_total_usd':  float(d['reliability_tax']['total_usd']),
                  'reliability_tax_usd_per_mwh':float(d['reliability_tax']['usd_per_mwh']),
                  'fleet_size_mw':              float(d['stranding_metadata']['fleet_size_mw']),
                  'peak_year':                  int(d['stranding_metadata']['peak_year']),
                  'stranded_mw_at_2050':        float(d['stranding_metadata']['stranded_mw_at_2050']),
                  'total_stranded_capex_usd':   float(d['stranding_metadata']['total_stranded_capex_usd']),
              })

          out = f'data/step2.3-pathway/MANIFEST_{iso}.parquet'
          pq.write_table(pa.Table.from_pylist(rows), out)
          print(f'[manifest] wrote {out} with {len(rows)} rows', flush=True)
          PY

      - name: "Commit + push to per-ISO branch — ${{ matrix.iso }}"
        env:
          ISO: ${{ matrix.iso }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          if [ "${{ inputs.phase }}" = "peakclean_only" ] || [ "${{ inputs.phase }}" = "peakclean_interp_only" ] || [ "${{ inputs.phase }}" = "peakclean_lowcf_only" ]; then
            branch="auto/${TIMESTAMP}-step2-3a-peakclean-${ISO}"
          else
            branch="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git checkout -b "${branch}"

          git add -f "data/step2.3-pathway/${ISO}/" 2>/dev/null || true
          git add -f "data/step2.3-pathway/MANIFEST_${ISO}.parquet" 2>/dev/null || true
          git add -f data/step2.1-ef/step_2_1_EF_${ISO}_*_peakclean.parquet 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::error::No changes staged — nothing to commit for ${ISO}"
            exit 1
          fi

          if [ "${{ inputs.phase }}" = "peakclean_only" ]; then
            git commit -m "Step 2.3a: regenerate peakclean sidecars for ${ISO} (standard + interp)"
          elif [ "${{ inputs.phase }}" = "peakclean_interp_only" ]; then
            git commit -m "Step 2.3a: regenerate peakclean sidecars for ${ISO} (interp-only)"
          elif [ "${{ inputs.phase }}" = "peakclean_lowcf_only" ]; then
            git commit -m "Step 2.3a: regenerate peakclean sidecars for ${ISO} (lowcf-only)"
          else
            total=$(ls data/step2.3-pathway/${ISO}/pathway*_ep*.json 2>/dev/null | wc -l)
            git commit -m "Step 2.3 pathway sweep: ${ISO} (${total} JSONs)"
          fi

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "${branch}" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

          echo "BRANCH=${branch}" >> "${GITHUB_ENV}"

      - name: Summary
        if: always()
        env:
          ISO: ${{ matrix.iso }}
        run: |
          {
            echo "## Step 2.3 — ${ISO} pathway sweep"
            echo ""
            if [ -n "${BRANCH:-}" ]; then
              echo "- Branch: \`${BRANCH}\`"
            else
              echo "- Branch: (not pushed — job failed before commit step)"
            fi
            echo "- Phase: \`${{ inputs.phase }}\`"
            echo "- Runner: \`${{ inputs.runner_size == 'large' && 'ubuntu-24.04-16core' || 'ubuntu-latest' }}\`"
            echo "- Outputs:"
            echo "  - \`data/step2.3-pathway/${ISO}/pathway*_ep*.json\`"
            echo "  - \`data/step2.3-pathway/MANIFEST_${ISO}.parquet\`"
            echo "  - \`data/step2.1-ef/step_2_1_EF_${ISO}_*_peakclean.parquet\`"
            echo ""
            echo "Run the **Squash Pipeline Branches** workflow with pattern \`auto/.*step2-3-sweep\` to consolidate all ISO runs into master."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-3-${{ matrix.iso }}-${{ github.run_id }}
          path: |
            data/step2.3-pathway/${{ matrix.iso }}/
            data/step2.3-pathway/MANIFEST_${{ matrix.iso }}.parquet
            data/step2.1-ef/step_2_1_EF_${{ matrix.iso }}_*_peakclean.parquet
          retention-days: 30
          if-no-files-found: warn
