name: "Step 1D: Storage Refinement"

# Fills storage exploration gaps in Step 1C PFS results by testing intermediate
# storage levels that the coarse grid missed. Reads coarse cache from Step 1B,
# does NOT rerun Steps 1A-1C.
#
# Prerequisite: Step 1A (Scored Database) must exist (coarse_cache.parquet).
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage_refined.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds (65+) or "all"'
        required: true
        default: 'all'
        type: string
      force:
        description: 'Force rerun even if output exists'
        required: false
        default: false
        type: boolean
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

concurrency:
  group: step1d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Determine ISO matrix ──
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  # ── Run storage refinement per ISO (parallel) ──
  storage-refinement:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify coarse cache exists
      run: |
        CACHE="data/step1-pfs-parquets/${{ matrix.iso }}_coarse_cache.parquet"
        if [ ! -f "$CACHE" ]; then
          echo "ERROR: Missing coarse cache for ${{ matrix.iso }}"
          echo "Run Step 1A (Scored Database) first."
          exit 1
        fi
        SIZE=$(du -h "$CACHE" | cut -f1)
        echo "OK: ${{ matrix.iso }} coarse cache ($SIZE)"

    - name: Configure git for auto-commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        TARGET_BRANCH="auto/${TIMESTAMP}-step1d-storage-${{ matrix.iso }}"
        git checkout -b "$TARGET_BRANCH"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

    - name: "Run Step 1D Storage Refinement (${{ matrix.iso }})"
      run: |
        set -euo pipefail
        THRESHOLDS="${{ inputs.thresholds }}"
        FORCE="${{ inputs.force }}"

        # Build CLI args — single ISO from matrix, always auto-commit
        ARGS="${{ matrix.iso }} --auto-commit"

        if [ "$THRESHOLDS" != "all" ]; then
          ARGS="$ARGS --threshold=$THRESHOLDS"
        fi

        if [ "$FORCE" = "true" ]; then
          ARGS="$ARGS --force"
        fi

        echo "Running: python -u scripts/step1d_storage_refinement.py $ARGS"
        python -u scripts/step1d_storage_refinement.py $ARGS 2>&1

    - name: Verify outputs
      run: |
        echo "=== Step 1D outputs for ${{ matrix.iso }} ==="
        ls -lh data/step1d-storage-parquets/${{ matrix.iso }}_*.parquet 2>/dev/null || echo "WARNING: No parquets generated!"
        python -c "
        import pyarrow.parquet as pq
        import glob, os
        files = sorted(glob.glob('data/step1d-storage-parquets/${{ matrix.iso }}_*_storage_refined.parquet'))
        total = 0
        for f in files:
            n = pq.read_metadata(f).num_rows
            total += n
            print(f'  {os.path.basename(f)}: {n:,} rows')
        print(f'Total ${{ matrix.iso }}: {total:,} storage-refined solutions')
        "

    - name: Commit any remaining results
      run: |
        git add data/step1d-storage-parquets/
        if git diff --staged --quiet; then
          echo "All results already committed per-threshold"
        else
          COUNT=$(git diff --staged --stat | tail -1)
          git commit -m "Step 1D: Remaining storage refinement for ${{ matrix.iso }}

        Auto-generated by Step 1D workflow (catch-all for any uncommitted thresholds).
        $COUNT"
          for attempt in 1 2 3 4; do
            git push origin "$TARGET_BRANCH" && break
            sleep $((2 ** attempt))
          done
          echo "Pushed remaining to branch: $TARGET_BRANCH"
        fi

    - name: Create PR
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if git log origin/master..HEAD --oneline | grep -q .; then
          gh pr create \
            --title "Step 1D: Storage refinement for ${{ matrix.iso }}" \
            --body "## Storage Refinement Results

        Auto-generated by Step 1D Storage Refinement workflow.

        **ISO**: ${{ matrix.iso }}
        **Thresholds**: ${{ inputs.thresholds }}
        **Force rerun**: ${{ inputs.force }}

        Fills intermediate storage levels missing from Step 1C's coarse grid.
        Ready for Step 2 EF extraction." \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation failed (may already exist)"
        else
          echo "No new commits — skipping PR creation"
        fi
