name: "Step 1D: Storage Refinement"

# Fills storage exploration gaps in Step 1C PFS results by testing intermediate
# storage levels that the coarse grid missed. Reads coarse cache from Step 1B,
# does NOT rerun Steps 1A-1C.
#
# Prerequisite: Step 1A (Scored Database) must exist (coarse_cache.parquet).
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage_refined.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds (65+) or "all"'
        required: true
        default: 'all'
        type: string
      force:
        description: 'Force rerun even if output exists'
        required: false
        default: false
        type: boolean
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

jobs:
  storage-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify coarse cache exists
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO"
        fi
        MISSING=""
        for iso in $ISOS; do
          CACHE="data/step1-pfs-parquets/${iso}_coarse_cache.parquet"
          if [ ! -f "$CACHE" ]; then
            MISSING="$MISSING $iso"
          else
            SIZE=$(du -h "$CACHE" | cut -f1)
            echo "OK: $iso coarse cache ($SIZE)"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "ERROR: Missing coarse cache for:$MISSING"
          echo "Run Step 1A (Scored Database) first."
          exit 1
        fi

    - name: Configure git for auto-commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        TARGET_BRANCH="auto/${TIMESTAMP}-step1d-storage-${{ inputs.iso }}"
        git checkout -b "$TARGET_BRANCH"
        # Align .github/workflows/ with default branch (GITHUB_TOKEN lacks workflows permission)
        git checkout origin/master -- .github/workflows/ 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Align workflow files with default branch"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

    - name: "Run Step 1D Storage Refinement"
      run: |
        set -euo pipefail
        ISO="${{ inputs.iso }}"
        THRESHOLDS="${{ inputs.thresholds }}"
        FORCE="${{ inputs.force }}"

        # Build CLI args
        ARGS=""
        if [ "$ISO" = "ALL" ]; then
          ARGS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ARGS="$ISO"
        fi

        if [ "$THRESHOLDS" != "all" ]; then
          ARGS="$ARGS --threshold=$THRESHOLDS"
        fi

        if [ "$FORCE" = "true" ]; then
          ARGS="$ARGS --force"
        fi

        echo "Running: python -u scripts/step1d_storage_refinement.py $ARGS"
        python -u scripts/step1d_storage_refinement.py $ARGS 2>&1

    - name: Verify outputs
      run: |
        echo "=== Step 1D outputs ==="
        ls -lh data/step1d-storage-parquets/*.parquet 2>/dev/null || echo "WARNING: No parquets generated!"
        python -c "
        import pyarrow.parquet as pq
        import glob, os
        files = sorted(glob.glob('data/step1d-storage-parquets/*_storage_refined.parquet'))
        total = 0
        for f in files:
            n = pq.read_metadata(f).num_rows
            total += n
            print(f'  {os.path.basename(f)}: {n:,} rows')
        print(f'Total: {total:,} new storage-refined solutions')
        "

    - name: Commit and push results
      run: |
        git add data/step1d-storage-parquets/
        if git diff --staged --quiet; then
          echo "No new parquets to commit"
        else
          COUNT=$(git diff --staged --stat | tail -1)
          git commit -m "Step 1D: Storage refinement for ${{ inputs.iso }} (${{ inputs.thresholds }})

        Auto-generated by Step 1D workflow.
        $COUNT"
          git push origin "$TARGET_BRANCH"
          echo "Pushed to branch: $TARGET_BRANCH"
        fi

    - name: Create PR
      if: success()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if git log origin/master..HEAD --oneline | grep -q .; then
          gh pr create \
            --title "Step 1D: Storage refinement for ${{ inputs.iso }}" \
            --body "## Storage Refinement Results

        Auto-generated by Step 1D Storage Refinement workflow.

        **ISO**: ${{ inputs.iso }}
        **Thresholds**: ${{ inputs.thresholds }}
        **Force rerun**: ${{ inputs.force }}

        Fills intermediate storage levels missing from Step 1C's coarse grid.
        Ready for Step 2 EF extraction." \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation failed (may already exist)"
        else
          echo "No new commits — skipping PR creation"
        fi
