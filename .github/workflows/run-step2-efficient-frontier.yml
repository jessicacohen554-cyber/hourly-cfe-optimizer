name: Run Step 2 Efficient Frontier Filter

on:
  workflow_dispatch:

jobs:
  run-step2:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure target branch exists locally
        run: |
          git fetch origin step2-ef-parquets-results || true
          git checkout -B step2-ef-parquets-results origin/step2-ef-parquets-results || git checkout -B step2-ef-parquets-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow

      - name: Ensure data directory exists
        run: mkdir -p data/step-2-EF-parquets

      - name: Run Step 1.5 checkpoint conversion
        run: python scripts/step1_5_convert_checkpoints_to_parquet.py

      - name: Run Step 2 Efficient Frontier filter
        run: python scripts/step2_efficient_frontier.py

      - name: Commit Step 2 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/pfs_post_ef.parquet data/step-2-EF-parquets/ data/step1_raw_pfs_parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Step 2 efficient frontier outputs"
          fi

          git push origin step2-ef-parquets-results
