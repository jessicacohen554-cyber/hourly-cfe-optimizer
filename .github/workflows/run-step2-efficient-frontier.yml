name: Run Step 2 Efficient Frontier Filter

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP

env:
  BRANCH_PREFIX: step2-ef

jobs:
  run-step2:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyarrow

      - name: Ensure output directory exists
        run: mkdir -p data/step2-ef-parquets

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Step 2 Efficient Frontier filter
        timeout-minutes: 90
        run: python scripts/step2_efficient_frontier.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: Commit and push Step 2 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step2-ef-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          ISO_LABEL="${{ github.event.inputs.iso }}"
          git commit -m "Step 2 EF: ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push fresh branch (retry for transient network errors only)
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            # Fail immediately on large-file rejection (not recoverable by retry)
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              echo "Check file sizes — GitHub limit is 100 MB per file."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO_LABEL="${{ github.event.inputs.iso }}"
          PR_BODY="## Summary"$'\n'"- Step 2 efficient frontier filter results for **${ISO_LABEL}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 2 EF: ${ISO_LABEL}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
