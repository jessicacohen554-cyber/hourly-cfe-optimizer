name: Run Step 2 Efficient Frontier Filter

on:
  workflow_dispatch:

jobs:
  run-step2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyarrow

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run Step 2 Efficient Frontier filter
        run: python step2_efficient_frontier.py

      - name: Upload Step 2 output artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfs-post-ef
          path: data/pfs_post_ef.parquet
          if-no-files-found: error
