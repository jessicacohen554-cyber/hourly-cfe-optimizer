name: Run Step 2 Efficient Frontier Filter

on:
  workflow_dispatch:

env:
  TARGET_BRANCH: step2-ef-parquets

jobs:
  run-step2:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to target branch
        run: |
          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyarrow

      - name: Ensure output directory exists
        run: mkdir -p data/step2-ef-parquets

      - name: Run Step 2 Efficient Frontier filter
        run: python scripts/step2_efficient_frontier.py

      - name: Commit and push Step 2 outputs (with retry)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step2-ef-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 2 EF: efficient frontier extraction — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Retry push with pull-rebase to handle concurrent pushes
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            # Fail immediately on large-file rejection (not recoverable by retry)
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              echo "Check file sizes — GitHub limit is 100 MB per file."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push rejected — another job pushed first. Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"

            git pull --rebase origin "$TARGET_BRANCH"
          done

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
          else
            PR_BODY="## Summary"$'\n'"- Step 2 efficient frontier filter results for all ISOs"$'\n'"- Auto-generated by GitHub Actions workflow run"
            gh pr create \
              --title "Step 2 EF: efficient frontier extraction" \
              --body "$PR_BODY" \
              --base master \
              --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
          fi
