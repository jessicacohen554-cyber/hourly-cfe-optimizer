name: Run Step 2 Efficient Frontier Filter

on:
  workflow_dispatch:

env:
  TARGET_BRANCH: step-2-EF-ISO-parquets

jobs:
  run-step2:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to target branch
        run: |
          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow

      - name: Ensure output directory exists
        run: mkdir -p data/step-2-EF-parquets

      - name: Run Step 2 Efficient Frontier filter
        run: python scripts/step2_efficient_frontier.py

      - name: Commit Step 2 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step-2-EF-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Step 2 EF: efficient frontier extraction — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git push origin "$TARGET_BRANCH"
