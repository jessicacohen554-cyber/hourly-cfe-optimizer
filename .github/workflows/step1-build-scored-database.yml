name: "Step 1: Build Scored Mix Database (1a+1b)"

# Run once after physics changes or code updates.
# Generates all resource fraction combos and scores them → coarse_cache.parquet.
# This is the database that step1c mines per-threshold.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to build (or ALL for all 7)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string
      chunk_size:
        description: 'Scoring chunk size (default 20000 ≈ 1.4 GiB peak)'
        required: false
        default: '20000'
        type: string
      force_1a:
        description: 'Force regenerate mixes (step 1a) even if parquet exists'
        required: false
        default: false
        type: boolean
      force_1b:
        description: 'Force rescore (step 1b) even if coarse_cache exists'
        required: false
        default: false
        type: boolean

jobs:
  build-database:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install numpy numba pyarrow pandas

    - name: Create output directories
      run: mkdir -p data/step1-pfs-parquets

    - name: "Stage 1a: Generate mix combinations"
      run: |
        ISO="${{ inputs.iso }}"
        FORCE_FLAG=""
        if [ "${{ inputs.force_1a }}" = "true" ]; then FORCE_FLAG="--force"; fi

        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo "=== Generating mixes for $iso ==="
            python scripts/step1a_generate_mixes.py --iso "$iso" $FORCE_FLAG
          done
        else
          python scripts/step1a_generate_mixes.py --iso "$ISO" $FORCE_FLAG
        fi

    - name: "Stage 1b: Score mix combinations (chunked)"
      run: |
        ISO="${{ inputs.iso }}"
        CHUNK="${{ inputs.chunk_size || '20000' }}"
        FORCE_FLAG=""
        if [ "${{ inputs.force_1b }}" = "true" ]; then FORCE_FLAG="--force"; fi

        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo "=== Scoring mixes for $iso ==="
            python scripts/step1b_score_mixes.py --iso "$iso" --chunk-size "$CHUNK" $FORCE_FLAG
          done
        else
          python scripts/step1b_score_mixes.py --iso "$ISO" --chunk-size "$CHUNK" $FORCE_FLAG
        fi

    - name: Commit and push scored database (batched by ISO)
      run: |
        set -euo pipefail
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LABEL="${{ inputs.iso }}"
        TARGET_BRANCH="auto/${TIMESTAMP}-scored-database-${ISO_LABEL}"
        git checkout -b "$TARGET_BRANCH"

        if [ "$ISO_LABEL" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO_LABEL"
        fi

        push_with_retry() {
          local label="$1"
          local MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "  Push attempt $i/$MAX_RETRIES for ${label}..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "  Push succeeded for ${label} on attempt $i"
              return 0
            }
            echo "$PUSH_OUTPUT"
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "  ERROR: GH001 (large file) for ${label}"
              return 1
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "  ERROR: Push failed for ${label} after $MAX_RETRIES attempts"
              return 1
            fi
            BACKOFF=$((2 ** i))
            echo "  Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done
        }

        PUSHED=false

        for iso in $ISOS; do
          echo ""
          echo "--- Batching commit for $iso ---"

          FILES=$(ls data/step1-pfs-parquets/${iso}_mixes.parquet data/step1-pfs-parquets/${iso}_coarse_cache.parquet 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "  No database files for $iso — skipping"
            continue
          fi

          git add -f $FILES
          if git diff --cached --quiet; then
            echo "  No changes for $iso — skipping"
            continue
          fi

          BATCH_MB=$(du -cm $FILES | tail -1 | cut -f1)
          echo "  Staging ~${BATCH_MB} MB for $iso"

          git commit -m "Scored mix database: ${iso} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if push_with_retry "$iso"; then
            PUSHED=true
          else
            echo "  Per-ISO push failed for $iso — falling back to per-file batching"
            git reset HEAD~1

            for f in $FILES; do
              FNAME=$(basename "$f")
              git add -f "$f"
              if git diff --cached --quiet; then
                continue
              fi
              FILE_MB=$(du -m "$f" | cut -f1)
              echo "  Committing $FNAME (~${FILE_MB} MB)"
              git commit -m "Scored DB: ${FNAME} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

              if push_with_retry "$FNAME"; then
                PUSHED=true
              else
                echo "  ERROR: Per-file push also failed for $FNAME — skipping"
                git reset HEAD~1
              fi
            done
          fi
        done

        if [ "$PUSHED" = true ]; then
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        else
          echo "No changes were pushed"
        fi

    - name: Create pull request
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$TARGET_BRANCH" ]; then
          echo "No branch to create PR for"
          exit 0
        fi
        gh pr create \
          --title "Scored mix database: ${{ inputs.iso }}" \
          --body "## Summary"$'\n'"- Built scored mix database (1a+1b) for **${{ inputs.iso }}**"$'\n'"- Merge this first, then run PFS threshold workflow to mine it"$'\n'"- Auto-generated by GitHub Actions" \
          --base master \
          --head "$TARGET_BRANCH" || echo "PR creation skipped"
