name: Run ISO Threshold Script

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (NYISO or CAISO)'
        required: true
        default: 'NYISO'

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyarrow numba pandas

    - name: Create checkpoint directory
      run: mkdir -p data/checkpoints

    - name: Run script
      run: |
        python complete_iso_thresholds.py --iso ${{ github.event.inputs.iso }} --threshold 100

    - name: Commit results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git checkout -B iso-threshold-${{ github.event.inputs.iso }}
        git add data/checkpoints/
        git commit -m "Update ${{ github.event.inputs.iso }} ISO thresholds" || echo "No changes"
        git push origin iso-threshold-${{ github.event.inputs.iso }}
