name: "Step 1.4: Fine-Grid PFS"

# Fine-grid PFS for 40-75% thresholds (1% step).
# Each ISO runs on its own runner in parallel.
# Supports threshold filtering, resume mode, and mid-run commits.
#
# Output: data/step1-pfs/{ISO}_*.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      custom_thresholds:
        description: 'Custom thresholds (e.g. "55,60,70"). Default: all (40-75).'
        required: false
        default: ''
        type: string
      resume:
        description: 'Skip thresholds that already have output files'
        required: false
        default: true
        type: boolean
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      thresholds: ${{ steps.resolve-thresholds.outputs.thresholds }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve thresholds
        id: resolve-thresholds
        run: |
          CUSTOM="${{ inputs.custom_thresholds }}"
          if [ -n "$CUSTOM" ]; then
            echo "Using custom thresholds: $CUSTOM"
            echo "thresholds=$CUSTOM" >> "$GITHUB_OUTPUT"
          else
            echo "thresholds=" >> "$GITHUB_OUTPUT"
          fi

  fine-grid:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="auto/${TIMESTAMP}-step1-4-fine-grid-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    - name: "Run Fine-Grid PFS — ${{ matrix.iso }}"
      run: |
        THRESHOLDS="${{ needs.prepare.outputs.thresholds }}"
        RESUME="${{ inputs.resume }}"
        echo "═══════════════════════════════════════════════════════════"
        if [ -n "$THRESHOLDS" ]; then
          echo "  ISO: ${{ matrix.iso }}  |  Fine-Grid PFS  |  Thresholds: $THRESHOLDS"
        else
          echo "  ISO: ${{ matrix.iso }}  |  Fine-Grid PFS (40-75%, all)"
        fi
        if [ "$RESUME" = "true" ]; then
          echo "  Resume mode: ON (skipping completed thresholds)"
        fi
        echo "═══════════════════════════════════════════════════════════"

        ARGS="--iso ${{ matrix.iso }}"
        if [ -n "$THRESHOLDS" ]; then
          ARGS="$ARGS --thresholds $THRESHOLDS"
        fi
        if [ "$RESUME" = "true" ]; then
          ARGS="$ARGS --resume"
        fi
        eval python scripts/step1_4_fine_grid_pfs.py $ARGS

    - name: Split any oversized parquets (safety net)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        MAX_MB=45
        for f in data/step1-pfs/"${ISO}"_*fine_pfs*.parquet; do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "⚠ $f is ${SIZE_MB}MB (>${MAX_MB}MB), re-splitting..."
            python3 -c "import sys; sys.path.insert(0, 'scripts'); from parquet_utils import write_parquet_chunked; import pyarrow.parquet as pq; import os; t=pq.read_table('$f'); os.remove('$f'); parts=write_parquet_chunked(t, '$f', max_mb=$MAX_MB); print(f'Re-split into {len(parts)} parts')"
          fi
        done

    - name: Commit any remaining results
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        COMMITTED=0
        for f in data/step1-pfs/"${ISO}"_*fine_pfs*.parquet; do
          [ -f "$f" ] || continue
          # Skip files already committed by mid-run commits
          git diff --cached --quiet -- "$f" 2>/dev/null
          git status --porcelain "$f" | grep -q . || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt 49 ]; then
            echo "ERROR: $f is ${SIZE_MB}MB — still over limit after splitting, skipping"
            continue
          fi
          git add -f "$f"
          if ! git diff --cached --quiet; then
            FNAME=$(basename "$f")
            git commit -m "Step 1.4 Fine: ${ISO} ${FNAME} (${SIZE_MB}MB) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            COMMITTED=$((COMMITTED + 1))
          fi
        done
        # Also commit near_miss updates
        NM="data/step1-pfs/${ISO}_near_miss.parquet"
        if [ -f "$NM" ]; then
          git add -f "$NM"
          if ! git diff --cached --quiet; then
            git commit -m "Step 1.4 Fine: ${ISO} near_miss update — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            COMMITTED=$((COMMITTED + 1))
          fi
        fi
        if [ "$COMMITTED" -eq 0 ]; then
          echo "No new uncommitted results"
        else
          echo "Committed $COMMITTED remaining file(s)"
        fi

    - name: Push results
      if: always()
      run: |
        # Check if there are any commits to push
        if git log --oneline origin/${{ inputs.branch || 'master' }}..HEAD 2>/dev/null | grep -q .; then
          for i in 1 2 3 4; do
            git push -u origin "$TARGET_BRANCH" && break
            echo "Push attempt $i failed, retrying in $((2**i))s..."
            sleep $((2**i))
          done
          echo "Branch: $TARGET_BRANCH"
          echo "Merge this branch into master to bank the PFS results."
        else
          echo "No commits to push"
        fi
