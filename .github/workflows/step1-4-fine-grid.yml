name: "Step 1.4: Fine-Grid PFS + Augmentation"

# Fine-grid PFS for 40-75% thresholds (1% step), plus thin-band augmentation
# for 50-99.9% thresholds (merged from former step 1.6).
# Each ISO runs on its own runner in parallel.
# Supports threshold filtering, resume mode, and mid-run commits.
#
# Output: data/step1-pfs/{ISO}_*fine_pfs.parquet + {ISO}_*augment.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      custom_thresholds:
        description: 'Custom thresholds (e.g. "55,60,70"). Default: all (40-75).'
        required: false
        default: ''
        type: string
      augment:
        description: 'After fine-grid, augment thin bands (50-99.9%) with 50K diverse mixes'
        required: false
        default: true
        type: boolean
      resume:
        description: 'Skip thresholds that already have output files'
        required: false
        default: true
        type: boolean
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      thresholds: ${{ steps.resolve-thresholds.outputs.thresholds }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve thresholds
        id: resolve-thresholds
        run: |
          CUSTOM="${{ inputs.custom_thresholds }}"
          if [ -n "$CUSTOM" ]; then
            echo "Using custom thresholds: $CUSTOM"
            echo "thresholds=$CUSTOM" >> "$GITHUB_OUTPUT"
          else
            echo "thresholds=" >> "$GITHUB_OUTPUT"
          fi

  fine-grid:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    - name: "Run Fine-Grid PFS + Augmentation — ${{ matrix.iso }}"
      run: |
        THRESHOLDS="${{ needs.prepare.outputs.thresholds }}"
        RESUME="${{ inputs.resume }}"
        AUGMENT="${{ inputs.augment }}"
        echo "═══════════════════════════════════════════════════════════"
        if [ -n "$THRESHOLDS" ]; then
          echo "  ISO: ${{ matrix.iso }}  |  Fine-Grid PFS  |  Thresholds: $THRESHOLDS"
        else
          echo "  ISO: ${{ matrix.iso }}  |  Fine-Grid PFS (40-75%, all)"
        fi
        if [ "$RESUME" = "true" ]; then
          echo "  Resume mode: ON (skipping completed thresholds)"
        fi
        if [ "$AUGMENT" = "true" ]; then
          echo "  Augment mode: ON (fill thin bands 50-99.9%)"
        fi
        echo "═══════════════════════════════════════════════════════════"

        ARGS="--iso ${{ matrix.iso }}"
        if [ -n "$THRESHOLDS" ]; then
          ARGS="$ARGS --thresholds $THRESHOLDS"
        fi
        if [ "$RESUME" = "true" ]; then
          ARGS="$ARGS --resume"
        fi
        if [ "$AUGMENT" = "true" ]; then
          ARGS="$ARGS --augment"
        fi
        eval python scripts/step1_4_fine_grid_pfs.py $ARGS

    - name: Split any oversized parquets (safety net)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        MAX_MB=45
        for f in data/step1-pfs/"${ISO}"_*.parquet; do
          [ -f "$f" ] || continue
          echo "$f" | grep -q '_part[0-9]' && continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "Warning: $f is ${SIZE_MB}MB (>${MAX_MB}MB), re-splitting..."
            python3 -c "import sys; sys.path.insert(0, 'scripts'); from parquet_utils import write_parquet_chunked; import pyarrow.parquet as pq; import os; t=pq.read_table('$f'); os.remove('$f'); parts=write_parquet_chunked(t, '$f', max_mb=$MAX_MB); print(f'Re-split into {len(parts)} parts')"
          fi
        done

    - name: Upload results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: step1-4-fine-grid-${{ matrix.iso }}
        path: data/step1-pfs/${{ matrix.iso }}_*.parquet
        retention-days: 30
        if-no-files-found: warn
