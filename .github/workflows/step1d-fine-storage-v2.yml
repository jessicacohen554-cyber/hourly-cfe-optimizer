name: "Step 1d: Two-Pass Fine Storage"

# Two-pass storage sweep:
#   Pass 1: Coarse global sweep on ALL near-miss mixes (score once per combo)
#   Pass 2: Fine 0.05% targeted refinement on boundary mixes per threshold
#
# Prerequisite: Step 1c (Zone Search) must have run first and near_miss
#               parquets must exist in data/step1-pfs-parquets/.
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage.parquet
#
# Batching tips:
#   - Run one ISO at a time for large ISOs
#   - Select specific thresholds to process (e.g. "90,95,99,99.99")
#   - create-branch=true (default) commits results to a fresh branch

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Thresholds to process: "ALL" or comma-separated (e.g. "90,95,99,99.99")'
        required: false
        default: 'ALL'
        type: string
      create-branch:
        description: 'Create a fresh data branch for commits (recommended)'
        required: false
        default: 'true'
        type: boolean
      branch:
        description: 'Base branch to checkout (used when create-branch=false)'
        required: false
        default: 'master'
        type: string

jobs:
  fine-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify near-miss data exists
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO"
        fi
        MISSING=""
        for iso in $ISOS; do
          NM="data/step1-pfs-parquets/${iso}_near_miss.parquet"
          if [ ! -f "$NM" ]; then
            MISSING="$MISSING $iso"
          else
            SIZE=$(du -h "$NM" | cut -f1)
            echo "OK: $iso near-miss data ($SIZE)"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "ERROR: Missing near-miss data for:$MISSING"
          echo "Run Step 1c (Zone Search) first — near_miss parquets are saved"
          echo "after each zone completes, so partial runs are sufficient."
          exit 1
        fi

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000

    - name: Create results branch
      run: |
        ISO="${{ inputs.iso }}"
        CREATE="${{ inputs.create-branch }}"
        if [ "$CREATE" = "true" ]; then
          BRANCH="data/step1d-${ISO}-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          echo "RESULTS_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "Created and pushed results branch: $BRANCH"
        else
          echo "RESULTS_BRANCH=${{ inputs.branch || 'master' }}" >> "$GITHUB_ENV"
          echo "Using existing branch: ${{ inputs.branch || 'master' }}"
        fi

    - name: "Run two-pass storage sweep"
      timeout-minutes: 330
      run: |
        ISO="${{ inputs.iso }}"
        THRESHOLDS="${{ inputs.thresholds || 'ALL' }}"

        run_iso() {
          local iso="$1"
          echo "=== Two-pass storage: $iso  thresholds=$THRESHOLDS ==="
          python scripts/step1d_fine_storage.py \
            --iso "$iso" \
            --auto-commit \
            --thresholds "$THRESHOLDS"
        }

        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            run_iso "$iso"
          done
        else
          run_iso "$ISO"
        fi

    - name: Final commit and push
      if: always()
      run: |
        mkdir -p data/step1d-storage-parquets
        git add -A data/step1d-storage-parquets/
        if ! git diff --cached --quiet; then
          git commit -m "Step 1d Fine Storage: ${{ inputs.iso }} t=${{ inputs.thresholds }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            git push -u origin HEAD && { echo "Push succeeded"; break; }
            echo "Push attempt $i failed, retrying in $((2**i))s..."
            sleep $((2**i))
          done
        else
          echo "No remaining changes to commit"
        fi
        echo "Results committed to branch: $RESULTS_BRANCH"
