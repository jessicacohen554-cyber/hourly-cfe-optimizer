name: "Step 1d: Two-Pass Fine Storage"

# Two-pass storage sweep:
#   Pass 1: Coarse global sweep on ALL near-miss mixes (score once per combo)
#   Pass 2: Fine 0.05% targeted refinement on boundary mixes per threshold
#
# Prerequisite: Step 1c (Zone Search) must have run first.
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

jobs:
  fine-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify near-miss data exists
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
        else
          ISOS="$ISO"
        fi
        MISSING=""
        for iso in $ISOS; do
          NM="data/step1-pfs-parquets/${iso}_near_miss.parquet"
          if [ ! -f "$NM" ]; then
            MISSING="$MISSING $iso"
          else
            SIZE=$(du -h "$NM" | cut -f1)
            echo "OK: $iso near-miss data ($SIZE)"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "ERROR: Missing near-miss data for:$MISSING"
          echo "Run Step 1c (Zone Search) first."
          exit 1
        fi

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000

    - name: "Run two-pass storage sweep"
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          for iso in CAISO ERCOT PJM NYISO NEISO MISO SPP; do
            echo "=== Two-pass storage for $iso ==="
            python scripts/step1d_fine_storage.py --iso "$iso" --auto-commit
          done
        else
          python scripts/step1d_fine_storage.py --iso "$ISO" --auto-commit
        fi

    - name: Final commit and push
      run: |
        mkdir -p data/step1d-storage-parquets
        git add -A data/step1d-storage-parquets/
        if ! git diff --cached --quiet; then
          git commit -m "Step 1d Fine Storage: ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4; do
            git push -u origin HEAD && break
            echo "Push attempt $i failed, retrying in $((2**i))s..."
            sleep $((2**i))
          done
        else
          echo "No remaining changes to commit"
        fi
