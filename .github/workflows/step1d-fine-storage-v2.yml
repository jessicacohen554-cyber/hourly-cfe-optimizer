name: "Step 1d: Two-Pass Fine Storage"

# Two-pass storage sweep:
#   Pass 1: Coarse global sweep on ALL near-miss mixes (score once per combo)
#   Pass 2: Fine 0.05% targeted refinement on boundary mixes per threshold
#
# Features:
#   - Run individual ISOs and/or thresholds (batching)
#   - Creates a results branch and auto-commits after each ISO
#   - Resume support via manifest files
#
# Prerequisite: Step 1c (Zone Search) must have run first.
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run (individual or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds or "all" (e.g., "90,95,99")'
        required: false
        default: 'all'
        type: string
      branch:
        description: 'Branch to checkout (source of code + data)'
        required: false
        default: 'master'
        type: string

jobs:
  fine-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create results branch
      run: |
        SOURCE_BRANCH="${{ inputs.branch || 'master' }}"
        ISO="${{ inputs.iso }}"
        TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
        RESULTS_BRANCH="results/step1d-${ISO,,}-${TIMESTAMP}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000

        git checkout -b "$RESULTS_BRANCH"
        echo "RESULTS_BRANCH=$RESULTS_BRANCH" >> "$GITHUB_ENV"
        echo "Created results branch: $RESULTS_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Determine ISOs to process
      id: iso-list
      run: |
        ISO="${{ inputs.iso }}"
        if [ "$ISO" = "ALL" ]; then
          echo "isos=CAISO ERCOT PJM NYISO NEISO MISO SPP" >> "$GITHUB_OUTPUT"
        else
          echo "isos=$ISO" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify near-miss data exists
      run: |
        ISOS="${{ steps.iso-list.outputs.isos }}"
        MISSING=""
        for iso in $ISOS; do
          NM="data/step1-pfs-parquets/${iso}_near_miss.parquet"
          if [ ! -f "$NM" ]; then
            MISSING="$MISSING $iso"
          else
            SIZE=$(du -h "$NM" | cut -f1)
            echo "OK: $iso near-miss data ($SIZE)"
          fi
        done
        if [ -n "$MISSING" ]; then
          echo "ERROR: Missing near-miss data for:$MISSING"
          echo "Run Step 1c (Zone Search) first."
          exit 1
        fi

    - name: "Run two-pass storage sweep (per-ISO with intermittent commits)"
      run: |
        ISOS="${{ steps.iso-list.outputs.isos }}"
        THRESHOLDS="${{ inputs.thresholds || 'all' }}"

        # Build threshold arg
        if [ "$THRESHOLDS" = "all" ] || [ -z "$THRESHOLDS" ]; then
          THRESHOLD_ARG=""
        else
          THRESHOLD_ARG="--thresholds $THRESHOLDS"
        fi

        mkdir -p data/step1d-storage-parquets

        FAILED=""
        for iso in $ISOS; do
          echo ""
          echo "================================================================"
          echo "  Two-pass storage: $iso (thresholds: ${THRESHOLDS:-all})"
          echo "================================================================"

          # Run storage sweep with auto-commit for this ISO
          if python scripts/step1d_fine_storage.py --iso "$iso" --auto-commit $THRESHOLD_ARG; then
            echo "--- $iso storage sweep SUCCEEDED ---"
          else
            echo "--- $iso storage sweep FAILED (exit code $?) ---"
            FAILED="$FAILED $iso"
          fi

          # Intermittent commit: stage + commit + push whatever we have
          echo "--- Committing $iso results ---"
          git add -A data/step1d-storage-parquets/
          if ! git diff --cached --quiet; then
            git commit -m "Step 1d: $iso storage sweep — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3 4; do
              git push -u origin "$RESULTS_BRANCH" && break
              echo "Push attempt $attempt failed, retrying in $((2**attempt))s..."
              sleep $((2**attempt))
            done
          else
            echo "No changes to commit for $iso"
          fi
        done

        if [ -n "$FAILED" ]; then
          echo ""
          echo "WARNING: Storage sweep failed for:$FAILED"
          echo "Successful ISOs were committed. Check logs above for errors."
        fi

    - name: Final commit and push
      run: |
        mkdir -p data/step1d-storage-parquets
        git add -A data/step1d-storage-parquets/
        if ! git diff --cached --quiet; then
          git commit -m "Step 1d final: ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4; do
            git push -u origin "$RESULTS_BRANCH" && break
            echo "Push attempt $attempt failed, retrying in $((2**attempt))s..."
            sleep $((2**attempt))
          done
        else
          echo "No remaining changes to commit"
        fi
        echo ""
        echo "================================================================"
        echo "  Results branch: $RESULTS_BRANCH"
        echo "  Merge into ${{ inputs.branch || 'master' }} when ready."
        echo "================================================================"
