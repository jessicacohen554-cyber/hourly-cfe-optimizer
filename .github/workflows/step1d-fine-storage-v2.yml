name: "Step 1d: Two-Pass Fine Storage"

# Two-pass storage sweep:
#   Pass 1: Coarse global sweep on ALL near-miss mixes (score once per combo)
#   Pass 2: Fine 0.05% targeted refinement on boundary mixes per threshold
#
# What's new vs. legacy:
#   - Parallel per-ISO jobs (matrix strategy, each on its own runner)
#   - Each job creates its own auto/* branch and commits there (never master)
#   - Intermittent auto-commits after every threshold completion
#   - Threshold filtering: run only the subset you need
#   - O(1) hash-map lookup for Pass 2 resume (was O(N²) linear search)
#
# Prerequisite: Step 1c (Zone Search) must have run first.
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds (e.g. "90,95,99"). Leave blank for all 17.'
        required: false
        default: ''
        type: string
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step1d-fine-storage
  PYTHONUNBUFFERED: "1"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Build the ISO matrix: single ISO or fan out to all 7
  # ════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════════════════
  # Per-ISO job: runs on its own runner in parallel
  # ════════════════════════════════════════════════════════════════════════
  fine-storage:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false   # don't cancel other ISOs if one fails

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify near-miss data exists
      run: |
        ISO="${{ matrix.iso }}"
        NM="data/step1-pfs-parquets/${ISO}_near_miss.parquet"
        if [ ! -f "$NM" ]; then
          echo "ERROR: Missing near-miss data for $ISO"
          echo "  Expected: $NM"
          echo "  Run Step 1c (Zone Search) first."
          exit 1
        fi
        SIZE=$(du -h "$NM" | cut -f1)
        echo "OK: $ISO near-miss data ($SIZE)"

    - name: "Run two-pass storage sweep — ${{ matrix.iso }}"
      run: |
        ISO="${{ matrix.iso }}"
        ARGS="--iso $ISO --auto-commit"

        THRESHOLDS="${{ inputs.thresholds }}"
        if [ -n "$THRESHOLDS" ]; then
          ARGS="$ARGS --thresholds \"$THRESHOLDS\""
          echo "Threshold filter: $THRESHOLDS"
        fi

        echo "=== Two-pass storage for $ISO ==="
        echo "Command: python scripts/step1d_fine_storage.py $ARGS"
        eval python scripts/step1d_fine_storage.py $ARGS

    - name: Final commit and push
      if: always()
      run: |
        mkdir -p data/step1d-storage-parquets
        git add -A data/step1d-storage-parquets/
        if ! git diff --cached --quiet; then
          THRESHOLDS="${{ inputs.thresholds }}"
          LABEL="${{ matrix.iso }}"
          [ -n "$THRESHOLDS" ] && LABEL="$LABEL thresholds=$THRESHOLDS"
          git commit -m "Step 1d Fine Storage: $LABEL — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        else
          echo "No remaining changes to commit"
        fi

        # Push with retry
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "Branch: $TARGET_BRANCH"
        echo "Merge this branch into master to bank the storage results."
