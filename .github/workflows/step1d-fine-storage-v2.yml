name: "Step 1d: Two-Pass Fine Storage"

# Two-pass storage sweep:
#   Pass 1: Coarse global sweep on ALL near-miss mixes (score once per combo)
#   Pass 2: Fine 0.05% targeted refinement on boundary mixes per threshold
#
# Modes:
#   full   — run all thresholds in one job (may hit 6hr timeout on large ISOs)
#   batched — run LOW (50-80%), MID (85-95%), HIGH (97.5-99.99%) as separate
#             steps with independent commits. Best for CAISO/ERCOT/PJM.
#   custom — specify thresholds= input directly (e.g. "90,95")
#
# Each ISO runs on its own runner in parallel. Every threshold commits
# individually via --auto-commit so partial progress is always banked.
#
# Prerequisite: Step 1c (Zone Search) must have run first.
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      batch_mode:
        description: 'full (all thresholds at once) or batched (LOW/MID/HIGH steps)'
        required: true
        default: 'batched'
        type: choice
        options:
          - batched
          - full
      thresholds:
        description: 'Custom thresholds (e.g. "90,95,99"). Overrides batch_mode when set.'
        required: false
        default: ''
        type: string
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step1d-fine-storage
  PYTHONUNBUFFERED: "1"
  # Threshold bands for batched mode
  THRESHOLDS_LOW:  "50,55,60,65,70,75,80"
  THRESHOLDS_MID:  "85,87.5,90,92.5,95"
  THRESHOLDS_HIGH: "97.5,99,99.5,99.9,99.99"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Build the ISO matrix: single ISO or fan out to all 7
  # ════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════════════════
  # Per-ISO job: runs on its own runner in parallel
  # ════════════════════════════════════════════════════════════════════════
  fine-storage:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false   # don't cancel other ISOs if one fails

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        MODE="${{ inputs.batch_mode }}"
        CUSTOM="${{ inputs.thresholds }}"
        if [ -n "$CUSTOM" ]; then
          LABEL="custom"
        else
          LABEL="$MODE"
        fi
        TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LOWER}-${LABEL}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify near-miss data exists
      run: |
        ISO="${{ matrix.iso }}"
        NM="data/step1-pfs-parquets/${ISO}_near_miss.parquet"
        if [ ! -f "$NM" ]; then
          echo "ERROR: Missing near-miss data for $ISO"
          echo "  Expected: $NM"
          echo "  Run Step 1c (Zone Search) first, or generate from coarse cache."
          exit 1
        fi
        ROWS=$(python3 -c "import pyarrow.parquet as pq; t=pq.read_table('$NM'); print(t.num_rows)")
        SIZE=$(du -h "$NM" | cut -f1)
        echo "OK: $ISO near-miss ($ROWS rows, $SIZE)"
        if [ "$ROWS" -eq 0 ]; then
          echo "ERROR: Near-miss file is empty (0 rows). Re-run Step 1c."
          exit 1
        fi

    - name: Ensure output directory
      run: mkdir -p data/step1d-storage-parquets

    # ── Custom thresholds ───────────────────────────────────────────────────
    - name: "Custom thresholds — ${{ matrix.iso }}"
      if: ${{ inputs.thresholds != '' }}
      timeout-minutes: 300
      run: |
        python scripts/step1d_fine_storage.py \
          --iso "${{ matrix.iso }}" \
          --thresholds "${{ inputs.thresholds }}" \
          --auto-commit

    # ── Full mode (all thresholds, single invocation) ────────────────────
    # Both 'full' and 'batched' now use a single Python invocation.
    # --batch-commit handles per-band commits internally, avoiding 3×
    # startup overhead (data load + Numba JIT + Pass 0 screen).
    - name: "Full run — ${{ matrix.iso }}"
      if: ${{ inputs.thresholds == '' && inputs.batch_mode == 'full' }}
      timeout-minutes: 340
      run: |
        python scripts/step1d_fine_storage.py \
          --iso "${{ matrix.iso }}" \
          --auto-commit

    - name: "Batched run — ${{ matrix.iso }}"
      if: ${{ inputs.thresholds == '' && inputs.batch_mode == 'batched' }}
      timeout-minutes: 340
      run: |
        python scripts/step1d_fine_storage.py \
          --iso "${{ matrix.iso }}" \
          --auto-commit --batch-commit

    # ── Final sweep: catch anything not yet committed ─────────────────────
    - name: Final commit and push
      if: always()
      run: |
        # Scope to THIS ISO's files only to prevent cross-ISO merge conflicts
        git add data/step1d-storage-parquets/"${{ matrix.iso }}"_*.parquet \
                data/step1d-storage-parquets/"${{ matrix.iso }}"_*.json 2>/dev/null || true
        if ! git diff --cached --quiet; then
          LABEL="${{ matrix.iso }}"
          CUSTOM="${{ inputs.thresholds }}"
          MODE="${{ inputs.batch_mode }}"
          [ -n "$CUSTOM" ] && LABEL="$LABEL thresholds=$CUSTOM" || LABEL="$LABEL $MODE"
          git commit -m "Step 1d final: $LABEL — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

        # Push with retry
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "Branch: $TARGET_BRANCH"
        echo "Merge into master to bank the storage results."
