name: "Step 5D: MAC Queue (New)"

# Runs step5d_mac_queue.py — MAC-optimized consequential deployment queue.
# Forward-stepping through thresholds with per-resource floor ratchets,
# hybrid 8760-hour dispatch CO2 rescoring, and dual-floor (filter/cost) logic.
#
# iso=ALL fans out parallel matrix jobs, then merges into one branch + PR.
# Output: data/step5-post-processing/mac_queue/

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process (ALL = parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      sensitivity:
        description: 'Price sensitivity (blank = all 5)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - all_low
          - all_med
          - all_high
          - high_vre_low_firm
          - high_firm_low_vre
      growth:
        description: 'Demand growth level (blank = all 3)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Low
          - Medium
          - High
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step5d-mac-queue

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing/mac_queue

      - name: "MAC Queue — ${{ matrix.iso }}"
        run: |
          ARGS="--iso ${{ matrix.iso }}"
          if [ -n "${{ inputs.sensitivity }}" ]; then
            ARGS="$ARGS --sensitivity ${{ inputs.sensitivity }}"
          fi
          if [ -n "${{ inputs.growth }}" ]; then
            ARGS="$ARGS --growth ${{ inputs.growth }}"
          fi
          echo "Running: python scripts/step5d_mac_queue.py $ARGS"
          python scripts/step5d_mac_queue.py $ARGS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-queue-${{ matrix.iso }}
          path: |
            data/step5-post-processing/mac_queue/
          retention-days: 1

  merge:
    needs: [prepare, process]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mac-queue-*
          path: ./artifact-tmp/
          merge-multiple: true

      - name: Place artifacts
        run: |
          mkdir -p data/step5-post-processing/mac_queue
          cp -rf artifact-tmp/data/step5-post-processing/mac_queue/* data/step5-post-processing/mac_queue/ 2>/dev/null || true

      - name: Batched commit and push (per-ISO)
        run: |
          git config http.postBuffer 524288000

          push_with_retry() {
            local label="$1"
            local MAX_RETRIES=4
            for i in $(seq 1 $MAX_RETRIES); do
              echo "  Push attempt $i/$MAX_RETRIES for ${label}..."
              git push -u origin "$TARGET_BRANCH" 2>&1 && return 0
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "  ERROR: Push failed for ${label} after $MAX_RETRIES attempts"
                return 1
              fi
              BACKOFF=$((2 ** i))
              echo "  Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
            done
          }

          PUSHED=false

          if [ "${{ inputs.iso }}" = "ALL" ]; then
            ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
          else
            ISOS="${{ inputs.iso }}"
          fi

          for iso in $ISOS; do
            echo "--- Batching commit for $iso ---"
            FILES=$(find data/step5-post-processing/mac_queue/ -name "*${iso}*" -type f 2>/dev/null || true)
            if [ -z "$FILES" ]; then
              echo "  No files for $iso — skipping"
              continue
            fi
            git add -f $FILES
            if git diff --cached --quiet; then
              echo "  No changes for $iso — skipping"
              continue
            fi
            BATCH_MB=$(du -cm $FILES | tail -1 | cut -f1)
            echo "  Staging ~${BATCH_MB} MB for $iso"
            git commit -m "Step 5D MAC Queue: ${iso} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if push_with_retry "$iso"; then
              PUSHED=true
            else
              echo "  Per-ISO push failed for $iso — falling back to per-file"
              git reset HEAD~1
              for f in $FILES; do
                FNAME=$(basename "$f")
                git add -f "$f"
                if git diff --cached --quiet; then continue; fi
                git commit -m "Step 5D MAC Queue: ${iso} ${FNAME} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if push_with_retry "$FNAME"; then PUSHED=true; else git reset HEAD~1; fi
              done
            fi
          done

          # Summary JSON
          git add -f data/step5-post-processing/mac_queue/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            echo "--- Staging remaining files ---"
            git commit -m "Step 5D MAC Queue: summary — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if push_with_retry "summary"; then PUSHED=true; else git reset HEAD~1; fi
          fi

          if [ "$PUSHED" = "false" ]; then
            echo "No changes were pushed"
          fi
