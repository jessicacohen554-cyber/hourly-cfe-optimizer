name: "Step 6: Update Home Page / Shared Data"

# Consolidates all pipeline results into dashboard/js/shared-data.js.
# This is the data file that powers the Home Page (index.html) and Dashboard.
# Run this when you want to refresh the home page after upstream data changes.
#
# Includes: SBTi milestone mapping, DAC trajectory projections, LCOE/transmission
# tables, and aggregated Step 5/6 outputs (mac_stats, etc.).
#
# Prerequisite: Steps 4-5 should have produced their respective outputs.
# Output: dashboard/js/shared-data.js, data/step5-post-processing/shared_data.json

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-shared-data

jobs:
  generate-shared-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data
        run: |
          echo "Available inputs:"
          ls -lh data/step5-post-processing/ 2>/dev/null || echo "  No step5 results dir"
          ls -lh dashboard/overprocure_results.json 2>/dev/null || echo "  No overprocure_results.json"

          if [ ! -d "data/step5-post-processing" ]; then
            echo "ERROR: No step-5 data found. Run earlier pipeline steps first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pandas pyarrow

      - name: Ensure output directories
        run: |
          mkdir -p dashboard/js
          mkdir -p data/step5-post-processing

      - name: "Generate Shared Data"
        run: |
          echo "=== Generating shared-data.js ==="
          python scripts/step9a_generate_shared_data.py

      - name: Commit and push
        run: |
          git config http.postBuffer 524288000

          git add -f dashboard/js/shared-data.js 2>/dev/null || true
          git add -f data/step5-post-processing/shared_data.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 7 Shared Data — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done
