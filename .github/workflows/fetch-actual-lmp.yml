name: "Fetch Actual LMP Data from ISOs"

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to fetch (2024 or 2025)'
        required: true
        default: '2024'
        type: choice
        options:
          - '2024'
          - '2025'
      iso:
        description: 'ISO to fetch (or ALL for all 7)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      force:
        description: 'Force re-fetch even if data exists'
        required: false
        default: false
        type: boolean

env:
  BRANCH_PREFIX: fetch-lmp

jobs:
  fetch-lmp:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          YEAR_LABEL="${{ github.event.inputs.year }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${YEAR_LABEL}-${ISO_LABEL}" >> "$GITHUB_ENV"

      - name: Create output branch
        run: |
          git checkout -b "$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gridstatus pandas numpy pyarrow

      - name: Fetch actual LMP data
        run: |
          cd scripts
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python step0_fetch_lmp_2025.py \
            --iso ${{ github.event.inputs.iso }} \
            --year ${{ github.event.inputs.year }} \
            $FORCE_FLAG

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lmp/
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "Fetch ${{ github.event.inputs.year }} actual LMP data — ${{ github.event.inputs.iso }}"
            git push origin "$TARGET_BRANCH"
            echo "Pushed to $TARGET_BRANCH"
          fi

      - name: Create PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git log origin/master.."$TARGET_BRANCH" --oneline | grep -q .; then
            gh pr create \
              --title "Fetch ${{ github.event.inputs.year }} actual LMP — ${{ github.event.inputs.iso }}" \
              --body "## Summary
          - Fetched ${{ github.event.inputs.year }} actual DA hourly LMP from ${{ github.event.inputs.iso }}
          - Data saved to \`data/lmp/{ISO}_actual_lmp_${{ github.event.inputs.year }}.json\`
          - Stats saved to \`data/lmp/{ISO}_actual_lmp_stats_${{ github.event.inputs.year }}.json\`
          - Source: gridstatus library (ISO public APIs)

          ## Purpose
          Calibration data for synthetic LMP model validation across all 7 ISOs." \
              --base master
          fi
