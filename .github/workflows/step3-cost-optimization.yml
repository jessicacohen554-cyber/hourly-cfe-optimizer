name: "Step 3: Cost Optimization"

# Vectorized cross-evaluation of EF mixes under 5,832 sensitivity combos
# (17,496 for CAISO with geothermal). Merit-order tranche pricing for clean firm.
# Supports 3 tracks: baseline (Track 1), new-build (Track 2), cost-to-replace (Track 3).
#
# Prerequisite: Step 2 (Efficient Frontier) must have produced EF parquets.
# Output: data/step3-cost-opt-parquets/

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      track:
        description: 'Which track(s) to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - track1-baseline
          - track2-newbuild
          - track3-cost-to-replace
          - track2-and-3
      sensitivity_mode:
        description: 'Track 2-3 sensitivity mode (ignored for Track 1)'
        required: false
        default: 'medium'
        type: choice
        options:
          - medium
          - full
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step3-cost-opt

jobs:
  run-step3:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.track }}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify step-2 EF parquets exist
        run: |
          if [ ! -d data/step2-ef-parquets ] || [ -z "$(ls data/step2-ef-parquets/*.parquet 2>/dev/null)" ]; then
            echo "ERROR: Step-2 EF parquets not found. Run Step 2 first."
            exit 1
          fi
          echo "Step-2 EF parquets found:"
          ls -lh data/step2-ef-parquets/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow

      - name: Ensure output directories
        run: |
          mkdir -p data/step3-cost-opt-parquets
          mkdir -p dashboard

      - name: Build arguments
        id: build-args
        run: |
          # ISO flag
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso ${{ inputs.iso }}" >> "$GITHUB_OUTPUT"
          fi

          # Sensitivity flag
          if [ "${{ inputs.sensitivity_mode }}" = "full" ]; then
            echo "sens_flags=--full" >> "$GITHUB_OUTPUT"
          else
            echo "sens_flags=" >> "$GITHUB_OUTPUT"
          fi

      # ════════════════════════════════════════════════════════════════════
      # TRACK 1: Baseline
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 1: Baseline Cost Optimization"
        if: ${{ inputs.track == 'track1-baseline' || inputs.track == 'ALL' }}
        run: |
          echo "=== Track 1: Baseline ==="
          python scripts/step3_cost_optimization.py --track baseline ${{ steps.build-args.outputs.iso_flags }}

      # ════════════════════════════════════════════════════════════════════
      # TRACK 2: New-Build
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 2: New-Build Cost Optimization"
        if: ${{ inputs.track == 'track2-newbuild' || inputs.track == 'track2-and-3' || inputs.track == 'ALL' }}
        run: |
          echo "=== Track 2: New-Build ==="
          python scripts/step3_track_nb_ctr.py --fresh --track nb \
            ${{ steps.build-args.outputs.iso_flags }} ${{ steps.build-args.outputs.sens_flags }}

      # ════════════════════════════════════════════════════════════════════
      # TRACK 3: Cost-to-Replace
      # ════════════════════════════════════════════════════════════════════

      - name: "Track 3: Cost-to-Replace Optimization"
        if: ${{ inputs.track == 'track3-cost-to-replace' || inputs.track == 'track2-and-3' || inputs.track == 'ALL' }}
        run: |
          echo "=== Track 3: Cost-to-Replace ==="
          python scripts/step3_track_nb_ctr.py --fresh --track ctr \
            ${{ steps.build-args.outputs.iso_flags }} ${{ steps.build-args.outputs.sens_flags }}

      # ════════════════════════════════════════════════════════════════════
      # COMMIT & PR
      # ════════════════════════════════════════════════════════════════════

      - name: Commit and push
        run: |
          git add -f data/step3-cost-opt-parquets/ 2>/dev/null || true
          git add -f dashboard/track_scenarios.parquet 2>/dev/null || true
          git add -f dashboard/track_demand_growth.parquet 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 3: ${{ inputs.track }} ${{ inputs.iso }} (${{ inputs.sensitivity_mode }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

