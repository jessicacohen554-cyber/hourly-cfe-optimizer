name: "Cleanup: Clear Step 1D Storage Parquets"

# Removes all step1d storage refinement parquets from data/step1d-storage-parquets/.
# Use this before re-running Step 1D to ensure a clean slate — no stale storage
# files from previous runs will linger.
#
# Can target a single ISO or clear all ISOs at once.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to clear (or ALL for everything)'
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      dry_run:
        description: 'Preview only — list files that would be deleted without changing anything'
        default: true
        type: boolean
      branch:
        description: 'Branch to commit the deletion to'
        default: 'master'
        type: string

jobs:
  clear-step1d:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

      - name: Find step1d files to clear
        id: find
        run: |
          DIR="data/step1d-storage-parquets"
          if [ ! -d "$DIR" ]; then
            echo "Directory $DIR does not exist"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISO="${{ inputs.iso }}"
          if [ "$ISO" = "ALL" ]; then
            FILES=$(find "$DIR" -maxdepth 1 -type f \( -name "*.parquet" -o -name "*.json" \) | sort)
          else
            FILES=$(find "$DIR" -maxdepth 1 -type f \( -name "${ISO}_*.parquet" -o -name "${ISO}_*.json" \) | sort)
          fi

          COUNT=$(echo "$FILES" | grep -c . 2>/dev/null || echo 0)

          echo "Found $COUNT step1d file(s) for $ISO:"
          echo "$FILES"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Preview (dry run)
        if: ${{ inputs.dry_run && steps.find.outputs.count != '0' }}
        run: |
          DIR="data/step1d-storage-parquets"
          ISO="${{ inputs.iso }}"

          echo "═══════════════════════════════════════════════"
          echo "  DRY RUN — No files will be deleted"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "Files that would be removed ($ISO):"

          if [ "$ISO" = "ALL" ]; then
            find "$DIR" -maxdepth 1 -type f \( -name "*.parquet" -o -name "*.json" \) -exec du -h {} \; | sort
            TOTAL=$(find "$DIR" -maxdepth 1 -type f \( -name "*.parquet" -o -name "*.json" \) -exec du -cb {} + | tail -1 | cut -f1)
          else
            find "$DIR" -maxdepth 1 -type f \( -name "${ISO}_*.parquet" -o -name "${ISO}_*.json" \) -exec du -h {} \; | sort
            TOTAL=$(find "$DIR" -maxdepth 1 -type f \( -name "${ISO}_*.parquet" -o -name "${ISO}_*.json" \) -exec du -cb {} + | tail -1 | cut -f1)
          fi

          echo ""
          echo "Total size: $(echo "$TOTAL" | numfmt --to=iec 2>/dev/null || echo "${TOTAL} bytes")"
          echo ""
          echo "Re-run with dry_run=false to delete."

      - name: Delete files and commit
        if: ${{ !inputs.dry_run && steps.find.outputs.count != '0' }}
        run: |
          DIR="data/step1d-storage-parquets"
          ISO="${{ inputs.iso }}"
          COUNT=${{ steps.find.outputs.count }}

          echo "Deleting $COUNT step1d file(s) for $ISO..."

          if [ "$ISO" = "ALL" ]; then
            find "$DIR" -maxdepth 1 -type f \( -name "*.parquet" -o -name "*.json" \) -delete
          else
            find "$DIR" -maxdepth 1 -type f \( -name "${ISO}_*.parquet" -o -name "${ISO}_*.json" \) -delete
          fi

          git add -u "$DIR/"
          git commit -m "Clear step1d storage parquets ($ISO): $COUNT files removed

          Clean slate before re-running Step 1D storage refinement."

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push origin "${{ inputs.branch || 'master' }}" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  CLEAR STEP 1D SUMMARY"
          echo "═══════════════════════════════════════════════"
          echo "  ISO:        ${{ inputs.iso }}"
          echo "  Files found: ${{ steps.find.outputs.count }}"
          echo "  Dry run:    ${{ inputs.dry_run }}"
          if [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ steps.find.outputs.count }}" != "0" ]; then
            echo "  Status:     Deleted and committed"
          fi
          echo "═══════════════════════════════════════════════"
