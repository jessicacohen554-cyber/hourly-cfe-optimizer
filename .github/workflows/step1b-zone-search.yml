name: "Step 1B: Zone Search + Floor/Fine PFS"

# Unified workflow for all Step 1B scripts:
#   - Zone Search (1B): Score-band zone search, fine 1% mixes per zone
#   - Floor-Aware (1B2): Floor-aware PFS for 50-70% thresholds (2% step)
#   - Fine-Grid (1B3): Fine-grid PFS for 40-70% thresholds (1% step)
#
# Use the "script" dropdown to run one script, or "All" to run all three
# sequentially per ISO.
#
# Each ISO runs on its own runner in parallel and commits to its own auto/* branch.
# Output: data/step1-pfs-parquets/{ISO}_*.parquet

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which Step 1B script(s) to run'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Zone Search (1B)
          - Floor-Aware (1B2)
          - Fine-Grid (1B3)
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds (e.g. "90,95,99"). Zone Search only. Leave blank for all.'
        required: false
        default: ''
        type: string
      zones:
        description: 'Zones to run: A (50-75%), B (75-90%), C (90-99.99%). Zone Search only. Blank for all.'
        required: false
        default: ''
        type: string
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Build the ISO matrix: single ISO or fan out to all 7
  # ════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      timeout: ${{ steps.set-timeout.outputs.timeout }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Set timeout based on script selection
        id: set-timeout
        run: |
          SCRIPT="${{ inputs.script }}"
          case "$SCRIPT" in
            "All"|"Zone Search (1B)")
              echo "timeout=360" >> "$GITHUB_OUTPUT"
              ;;
            "Fine-Grid (1B3)")
              echo "timeout=180" >> "$GITHUB_OUTPUT"
              ;;
            "Floor-Aware (1B2)")
              echo "timeout=120" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "timeout=360" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ════════════════════════════════════════════════════════════════════════
  # Per-ISO job: runs on its own runner in parallel
  # ════════════════════════════════════════════════════════════════════════
  step1b:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(needs.prepare.outputs.timeout) }}

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        # Short label for branch name
        SCRIPT="${{ inputs.script }}"
        case "$SCRIPT" in
          "All")                LABEL="step1b-all" ;;
          "Zone Search (1B)")   LABEL="step1b-zone-search" ;;
          "Floor-Aware (1B2)")  LABEL="step1b2-floor-pfs" ;;
          "Fine-Grid (1B3)")    LABEL="step1b3-fine-grid" ;;
          *)                    LABEL="step1b" ;;
        esac
        TARGET_BRANCH="auto/${TIMESTAMP}-${LABEL}-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs-parquets

    # ── Zone Search (1B) ──────────────────────────────────────────────
    - name: Verify scored database (Zone Search)
      if: inputs.script == 'All' || inputs.script == 'Zone Search (1B)'
      run: |
        ISO="${{ matrix.iso }}"
        CACHE="data/step1-pfs-parquets/${ISO}_coarse_cache.parquet"
        if [ ! -f "$CACHE" ]; then
          echo "ERROR: Missing scored database for $ISO"
          echo "  Expected: $CACHE"
          echo "  Run Step 1A (Scored Database) first."
          exit 1
        fi
        SIZE=$(du -h "$CACHE" | cut -f1)
        echo "OK: $ISO scored database ($SIZE)"

    - name: "Compute prior windows (Zone Search)"
      if: inputs.script == 'All' || inputs.script == 'Zone Search (1B)'
      continue-on-error: true
      run: |
        python scripts/step1_prior_windows.py --iso "${{ matrix.iso }}"

    - name: "Run Zone Search — ${{ matrix.iso }}"
      if: inputs.script == 'All' || inputs.script == 'Zone Search (1B)'
      run: |
        ISO="${{ matrix.iso }}"
        ARGS="--iso $ISO --auto-commit"

        THRESHOLDS="${{ inputs.thresholds }}"
        if [ -n "$THRESHOLDS" ]; then
          ARGS="$ARGS --thresholds \"$THRESHOLDS\""
          echo "Threshold filter: $THRESHOLDS"
        fi

        ZONES="${{ inputs.zones }}"
        if [ -n "$ZONES" ]; then
          ARGS="$ARGS --zones \"$ZONES\""
          echo "Zone filter: $ZONES"
        fi

        echo "=== Zone search for $ISO ==="
        echo "Command: python scripts/step1b_zone_search.py $ARGS"
        eval python scripts/step1b_zone_search.py $ARGS

    - name: "Commit Zone Search results"
      if: (inputs.script == 'All' || inputs.script == 'Zone Search (1B)') && always()
      run: |
        ISO="${{ matrix.iso }}"
        git add -f data/step1-pfs-parquets/"${ISO}"_*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1B Zone Search: ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

    # ── Floor-Aware PFS (1B2) ─────────────────────────────────────────
    - name: "Run Floor-Aware PFS — ${{ matrix.iso }}"
      if: inputs.script == 'All' || inputs.script == 'Floor-Aware (1B2)'
      timeout-minutes: 90
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Floor-Aware PFS (50-70%)"
        echo "═══════════════════════════════════════════════════════════"
        python scripts/step1b2_floor_aware_pfs.py --iso ${{ matrix.iso }}

    - name: "Commit Floor-Aware results"
      if: (inputs.script == 'All' || inputs.script == 'Floor-Aware (1B2)') && always()
      run: |
        ISO="${{ matrix.iso }}"
        git add -f data/step1-pfs-parquets/"${ISO}"_*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1B2 Floor-Aware PFS: ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

    # ── Fine-Grid PFS (1B3) ───────────────────────────────────────────
    - name: "Run Fine-Grid PFS — ${{ matrix.iso }}"
      if: inputs.script == 'All' || inputs.script == 'Fine-Grid (1B3)'
      timeout-minutes: 150
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Fine-Grid PFS (40-70%, 1% step)"
        echo "═══════════════════════════════════════════════════════════"
        python scripts/step1b3_fine_grid_pfs.py --iso ${{ matrix.iso }}

    - name: "Commit Fine-Grid results"
      if: (inputs.script == 'All' || inputs.script == 'Fine-Grid (1B3)') && always()
      run: |
        ISO="${{ matrix.iso }}"
        git add -f data/step1-pfs-parquets/"${ISO}"_*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1B3 Fine-Grid PFS: ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

    # ── Final push ────────────────────────────────────────────────────
    - name: Push results
      if: always()
      run: |
        # Push with retry
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "Branch: $TARGET_BRANCH"
        echo "Merge this branch into master to bank the PFS results."
