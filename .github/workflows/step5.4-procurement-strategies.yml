name: "Step 6.4: Update Procurement Page"

# Computes procurement strategy comparison for the Procurement Strategy page.
# 10 strategy variants across 3 families:
#   - Strategy 1 (A-C): Consequential cross-regional netting
#   - Strategy 2 (A-C): Hourly matching same-ISO
#   - Strategy 3 (A-D): Annual matching (boundary × additionality)
# 25-year trajectories (2025→2050) along SBTi milestones.
#
# iso=ALL fans out parallel matrix jobs for strategy computation, then merge
# job combines results into dashboard JS and commits everything.
# Output: data/step5-post-processing/strategy*.json, dashboard/js/procurement-strategy-data.js

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to compute (ALL = parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      strategy:
        description: 'Which strategy family to compute'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - strategy1
          - strategy2
          - strategy3
      mode:
        description: 'Run mode'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
      generate_js:
        description: 'Generate dashboard JS data file'
        required: false
        default: true
        type: boolean
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-4-procurement

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas pyarrow numba

      - name: "Strategy 1: Consequential — ${{ matrix.iso }}"
        if: inputs.strategy == 'ALL' || inputs.strategy == 'strategy1'
        run: |
          QUICK_FLAG=""
          if [ "${{ inputs.mode }}" = "quick" ]; then QUICK_FLAG="--quick"; fi
          python scripts/step5_5_strategy1_consequential.py \
            --iso ${{ matrix.iso }} $QUICK_FLAG

      - name: "Strategy 2: Hourly — ${{ matrix.iso }}"
        if: inputs.strategy == 'ALL' || inputs.strategy == 'strategy2'
        run: |
          QUICK_FLAG=""
          if [ "${{ inputs.mode }}" = "quick" ]; then QUICK_FLAG="--quick"; fi
          python scripts/step5_5_strategy2_hourly.py \
            --iso ${{ matrix.iso }} $QUICK_FLAG

      - name: "Strategy 3: Annual — ${{ matrix.iso }}"
        if: inputs.strategy == 'ALL' || inputs.strategy == 'strategy3'
        run: |
          QUICK_FLAG=""
          if [ "${{ inputs.mode }}" = "quick" ]; then QUICK_FLAG="--quick"; fi
          python scripts/step5_5_strategy3_annual.py \
            --iso ${{ matrix.iso }} $QUICK_FLAG

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: procurement-${{ matrix.iso }}
          path: data/step5-post-processing/
          retention-days: 1

  merge:
    needs: [prepare, process]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.strategy }}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: procurement-*
          path: data/step5-post-processing/
          merge-multiple: true

      - name: Set up Python
        if: inputs.generate_js == true
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Combine results into dashboard JS"
        if: inputs.generate_js == true
        run: |
          mkdir -p dashboard/js
          python -c "
          import json, os

          pp_dir = 'data/step5-post-processing'
          raw = {}

          for f in ['strategy1_consequential.json', 'strategy2_hourly.json', 'strategy3_annual.json']:
              path = os.path.join(pp_dir, f)
              if os.path.exists(path):
                  with open(path) as fh:
                      data = json.load(fh)
                      raw.update(data)
                  print(f'  Loaded {f}: {len(data)} strategy groups')

          if not raw:
              print('  No strategy results found to combine')
              exit(0)

          compact = {}
          entry_count = 0
          for sk in raw:
              compact[sk] = {}
              for iso in raw[sk]:
                  compact[sk][iso] = {}
                  for gr in ['Medium']:
                      if gr not in raw[sk][iso]:
                          continue
                      compact[sk][iso][gr] = {}
                      for pk in raw[sk][iso][gr]:
                          entries = raw[sk][iso][gr][pk]
                          slim = []
                          for e in entries:
                              se = {
                                  'y': e['year'], 't': e['threshold'], 'p': e.get('participation_pct', 0),
                                  'c': round(e.get('cost_per_mwh', 0), 2),
                                  'tc': round(e.get('total_cost_m', 0), 1),
                                  'co2': round(e.get('co2_abated_mmt', 0), 5),
                                  'mac': round(e['mac_per_ton'], 1) if e.get('mac_per_ton') and e['mac_per_ton'] < 100000 else None,
                                  'dt': round(e.get('demand_twh', 0), 1),
                                  'bt': round(e.get('buyer_demand_twh', 0), 2)
                              }
                              mix = e.get('resource_mix', {})
                              rm = {}
                              for k, v in mix.items():
                                  if isinstance(v, (int, float)):
                                      if v > 0.01: rm[k] = round(v, 2)
                                  elif isinstance(v, dict) and 'twh' in v:
                                      if v['twh'] > 0.01:
                                          rm[k] = {'t': round(v['twh'], 2)}
                                          if v.get('cost_m', 0) > 0: rm[k]['\$'] = round(v['cost_m'], 1)
                              if rm: se['rm'] = rm
                              meta = e.get('metadata', {})
                              if isinstance(meta, dict) and meta.get('lmp_impact'):
                                  se['lmp'] = round(meta['lmp_impact'], 2)
                              slim.append(se)
                              entry_count += 1
                          compact[sk][iso][gr][pk] = slim

          js_dir = 'dashboard/js'
          os.makedirs(js_dir, exist_ok=True)
          js_path = os.path.join(js_dir, 'procurement-strategy-data.js')
          js_str = json.dumps(compact, separators=(',', ':'))
          with open(js_path, 'w') as fh:
              fh.write('// Compact procurement strategy data (Medium growth only)\n')
              fh.write(f'const PROCUREMENT_DATA = {js_str};\n')
          sz_mb = os.path.getsize(js_path) / 1024 / 1024
          print(f'  Generated {js_path}: {sz_mb:.1f} MB, {entry_count} entries')
          "

      - name: Batched commit and push (per-ISO)
        run: |
          git config http.postBuffer 524288000

          push_with_retry() {
            local label="$1"
            local MAX_RETRIES=4
            for i in $(seq 1 $MAX_RETRIES); do
              echo "  Push attempt $i/$MAX_RETRIES for ${label}..."
              git push -u origin "$TARGET_BRANCH" 2>&1 && return 0
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "  ERROR: Push failed for ${label} after $MAX_RETRIES attempts"
                return 1
              fi
              BACKOFF=$((2 ** i))
              echo "  Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
            done
          }

          PUSHED=false

          if [ "${{ inputs.iso }}" = "ALL" ]; then
            ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
          else
            ISOS="${{ inputs.iso }}"
          fi

          for iso in $ISOS; do
            echo "--- Batching commit for $iso ---"
            FILES=$(find data/step5-post-processing/ -name "*${iso}*" -type f 2>/dev/null || true)
            if [ -z "$FILES" ]; then
              echo "  No files for $iso — skipping"
              continue
            fi
            git add -f $FILES
            if git diff --cached --quiet; then
              echo "  No changes for $iso — skipping"
              continue
            fi
            BATCH_MB=$(du -cm $FILES | tail -1 | cut -f1)
            echo "  Staging ~${BATCH_MB} MB for $iso"
            git commit -m "Step 6.4 Procurement: ${iso} (${{ inputs.mode }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if push_with_retry "$iso"; then
              PUSHED=true
            else
              echo "  Per-ISO push failed for $iso — falling back to per-file"
              git reset HEAD~1
              for f in $FILES; do
                FNAME=$(basename "$f")
                git add -f "$f"
                if git diff --cached --quiet; then continue; fi
                git commit -m "Step 6.4 Procurement: ${iso} ${FNAME} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if push_with_retry "$FNAME"; then PUSHED=true; else git reset HEAD~1; fi
              done
            fi
          done

          # Remaining post-processing + dashboard JS
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            echo "--- Staging remaining files + dashboard JS ---"
            git commit -m "Step 6.4 Procurement: dashboard JS (${{ inputs.mode }}) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if push_with_retry "dashboard-js"; then PUSHED=true; else git reset HEAD~1; fi
          fi

          if [ "$PUSHED" = "false" ]; then
            echo "No changes were pushed"
          fi
