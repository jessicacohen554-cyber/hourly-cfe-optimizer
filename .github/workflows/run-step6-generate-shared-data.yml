name: Run Step 7 Generate Shared Data

on:
  workflow_dispatch:

env:
  BRANCH_PREFIX: step7-shared

jobs:
  run-step6:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify step-5 and step-4 data exist
        run: |
          echo "Available inputs:"
          ls -lh data/step5-post-processing/ 2>/dev/null || echo "  No step5 results dir"
          ls -lh data/step4-gas-ccs-parquets/ 2>/dev/null || echo "  No step4 parquets"
          ls -lh dashboard/overprocure_results.json 2>/dev/null || echo "  No overprocure_results.json"

          # At minimum we need step4 or step5 parquets
          if [ ! -d "data/step4-gas-ccs-parquets" ] && [ ! -d "data/step5-post-processing" ]; then
            echo "ERROR: No step-4 or step-5 data found."
            echo "Run earlier pipeline steps first and merge results to master."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pandas pyarrow

      - name: Ensure output directories exist
        run: |
          mkdir -p dashboard/js
          mkdir -p data/step5-post-processing

      - name: Run Step 7 Generate Shared Data
        run: |
          python scripts/step7_generate_shared_data.py

      - name: Commit and push Step 6 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f dashboard/js/shared-data.js 2>/dev/null || true
          git add -f data/step5-post-processing/shared_data.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 7 Generate Shared Data — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push fresh branch (retry for transient network errors only)
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            # Fail immediately on large-file rejection (not recoverable by retry)
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              echo "Check file sizes — GitHub limit is 100 MB per file."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## Summary"$'\n'"- Step 7: Generate shared-data.js and shared_data.json from pipeline results"$'\n'"- Runs step7_generate_shared_data.py to consolidate overprocure_results + MAC stats into dashboard JS"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 7 Generate Shared Data" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
