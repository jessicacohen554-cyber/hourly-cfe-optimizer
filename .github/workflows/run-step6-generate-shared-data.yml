name: Run Step 6 Generate Shared Data

on:
  workflow_dispatch:

env:
  TARGET_BRANCH: step6-shared-data

jobs:
  run-step6:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch step-5 post-processing outputs
        run: |
          # Step 5 branch has co2-enriched parquets, mac_stats, compressed day, etc.
          git fetch origin step5-post-processing || true
          if git rev-parse --verify "origin/step5-post-processing" >/dev/null 2>&1; then
            git checkout origin/step5-post-processing -- data/step5-post-processing-results/ 2>/dev/null || true
            git checkout origin/step5-post-processing -- data/step4-gas-CCS/ 2>/dev/null || true
            git checkout origin/step5-post-processing -- data/lmp/ 2>/dev/null || true
            git checkout origin/step5-post-processing -- dashboard/js/mac-stats-data.js 2>/dev/null || true
            git checkout origin/step5-post-processing -- dashboard/compressed_day_profiles.json 2>/dev/null || true
            git checkout origin/step5-post-processing -- dashboard/overprocure_results.json 2>/dev/null || true
            echo "Step-5 outputs restored"
          fi

          # Also try step-4 as fallback for gas CCS data
          git fetch origin step4-gas-CCS-parquets || true
          if git rev-parse --verify "origin/step4-gas-CCS-parquets" >/dev/null 2>&1; then
            git checkout origin/step4-gas-CCS-parquets -- data/step4-gas-CCS/ 2>/dev/null || true
            echo "Step-4 Gas CCS fallback restored"
          fi

          echo "Available inputs:"
          ls -lh data/step5-post-processing-results/ 2>/dev/null || echo "  No step5 results dir"
          ls -lh dashboard/overprocure_results.json 2>/dev/null || echo "  No overprocure_results.json"

      - name: Switch to target branch
        run: |
          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            # Re-apply data (may have been overwritten by branch switch)
            git checkout origin/step5-post-processing -- data/step5-post-processing-results/ 2>/dev/null || true
            git checkout origin/step5-post-processing -- dashboard/overprocure_results.json 2>/dev/null || true
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Ensure output directories exist
        run: |
          mkdir -p dashboard/js
          mkdir -p data/step5-post-processing-results

      - name: Run Step 6 Generate Shared Data
        run: |
          python scripts/generate_shared_data.py

      - name: Commit Step 6 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f dashboard/js/shared-data.js 2>/dev/null || true
          git add -f data/step5-post-processing-results/shared_data.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Step 6 Generate Shared Data — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git push origin "$TARGET_BRANCH"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
          else
            PR_BODY="## Summary"$'\n'"- Step 6: Generate shared-data.js and shared_data.json from pipeline results"$'\n'"- Runs generate_shared_data.py to consolidate overprocure_results + MAC stats into dashboard JS"$'\n'"- Auto-generated by GitHub Actions workflow run"
            gh pr create \
              --title "Step 6 Generate Shared Data" \
              --body "$PR_BODY" \
              --base master \
              --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
          fi
