name: Run Step 6 Generate Shared Data

on:
  workflow_dispatch:

env:
  TARGET_BRANCH: step6-shared-data

jobs:
  run-step6:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify step-5 and step-4 data exist
        run: |
          echo "Available inputs:"
          ls -lh data/step5-post-processing/ 2>/dev/null || echo "  No step5 results dir"
          ls -lh data/step4-gas-ccs-parquets/ 2>/dev/null || echo "  No step4 parquets"
          ls -lh dashboard/overprocure_results.json 2>/dev/null || echo "  No overprocure_results.json"

          # At minimum we need step4 or step5 parquets
          if [ ! -d "data/step4-gas-ccs-parquets" ] && [ ! -d "data/step5-post-processing" ]; then
            echo "ERROR: No step-4 or step-5 data found."
            echo "Run earlier pipeline steps first and merge results to master."
            exit 1
          fi

      - name: Switch to target branch
        run: |
          git stash --include-untracked || true

          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -B "$TARGET_BRANCH"
          fi

          git stash drop || true

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Ensure output directories exist
        run: |
          mkdir -p dashboard/js
          mkdir -p data/step5-post-processing

      - name: Run Step 6 Generate Shared Data
        run: |
          python scripts/step6_generate_shared_data.py

      - name: Commit and push Step 6 outputs (with retry)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f dashboard/js/shared-data.js 2>/dev/null || true
          git add -f data/step5-post-processing/shared_data.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6 Generate Shared Data — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Retry push with pull-rebase to handle concurrent pushes
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            if git push origin "$TARGET_BRANCH"; then
              echo "Push succeeded on attempt $i"
              break
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push rejected. Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"

            git pull --rebase origin "$TARGET_BRANCH"
          done

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
          else
            PR_BODY="## Summary"$'\n'"- Step 6: Generate shared-data.js and shared_data.json from pipeline results"$'\n'"- Runs step6_generate_shared_data.py to consolidate overprocure_results + MAC stats into dashboard JS"$'\n'"- Auto-generated by GitHub Actions workflow run"
            gh pr create \
              --title "Step 6 Generate Shared Data" \
              --body "$PR_BODY" \
              --base master \
              --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
          fi
