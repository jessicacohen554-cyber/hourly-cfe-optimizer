name: "Step 6.5: Procurement Strategy Comparison"

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy to compute (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - strategy1
          - strategy2
          - strategy3
      iso:
        description: 'ISO to compute (or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      mode:
        description: 'Run mode'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - full
      generate_js:
        description: 'Generate dashboard JS data file'
        required: false
        default: true
        type: boolean

env:
  BRANCH_PREFIX: procurement-strategy

jobs:
  run-strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          STRATEGY_LABEL="${{ github.event.inputs.strategy }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${STRATEGY_LABEL}-${ISO_LABEL}" >> "$GITHUB_ENV"

      - name: Create output branch
        run: |
          git checkout -b "$TARGET_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy pandas pyarrow numba

      - name: Run Strategy 1 (Consequential)
        if: github.event.inputs.strategy == 'ALL' || github.event.inputs.strategy == 'strategy1'
        run: |
          cd scripts
          QUICK_FLAG=""
          if [ "${{ github.event.inputs.mode }}" = "quick" ]; then
            QUICK_FLAG="--quick"
          fi
          python step6_5_strategy1_consequential.py \
            --iso ${{ github.event.inputs.iso }} \
            $QUICK_FLAG

      - name: Run Strategy 2 (Hourly)
        if: github.event.inputs.strategy == 'ALL' || github.event.inputs.strategy == 'strategy2'
        run: |
          cd scripts
          QUICK_FLAG=""
          if [ "${{ github.event.inputs.mode }}" = "quick" ]; then
            QUICK_FLAG="--quick"
          fi
          python step6_5_strategy2_hourly.py \
            --iso ${{ github.event.inputs.iso }} \
            $QUICK_FLAG

      - name: Run Strategy 3 (Annual)
        if: github.event.inputs.strategy == 'ALL' || github.event.inputs.strategy == 'strategy3'
        run: |
          cd scripts
          QUICK_FLAG=""
          if [ "${{ github.event.inputs.mode }}" = "quick" ]; then
            QUICK_FLAG="--quick"
          fi
          python step6_5_strategy3_annual.py \
            --iso ${{ github.event.inputs.iso }} \
            $QUICK_FLAG

      - name: Combine results into JS data file
        if: github.event.inputs.generate_js == 'true'
        run: |
          cd scripts
          python -c "
          import json, os, glob

          pp_dir = '../data/step5-post-processing'
          results = {}

          for f in ['strategy1_consequential.json', 'strategy2_hourly.json', 'strategy3_annual.json']:
              path = os.path.join(pp_dir, f)
              if os.path.exists(path):
                  with open(path) as fh:
                      data = json.load(fh)
                      results.update(data)
                  print(f'  Loaded {f}: {len(data)} strategy groups')

          if results:
              js_dir = '../dashboard/js'
              os.makedirs(js_dir, exist_ok=True)
              js_path = os.path.join(js_dir, 'procurement-strategy-data.js')
              with open(js_path, 'w') as fh:
                  fh.write('// Auto-generated by Step 6.5 procurement strategy pipeline\n')
                  fh.write(f'// Strategies: {list(results.keys())}\n\n')
                  fh.write('const PROCUREMENT_DATA = ')
                  json.dump(results, fh, indent=2, default=str)
                  fh.write(';\n')
              print(f'  Generated {js_path} with {len(results)} strategy groups')
          else:
              print('  No strategy results found to combine')
          "

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/step5-post-processing/ dashboard/js/
          if git diff --cached --quiet; then
            echo "No results to commit"
          else
            git commit -m "Step 6.5: Procurement strategy results — ${{ github.event.inputs.strategy }} (${{ github.event.inputs.iso }}, ${{ github.event.inputs.mode }})"
            git push origin "$TARGET_BRANCH"
          fi

      - name: Create PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git log origin/master.."$TARGET_BRANCH" --oneline | grep -q .; then
            gh pr create \
              --title "Step 6.5: Procurement strategy — ${{ github.event.inputs.strategy }} (${{ github.event.inputs.mode }})" \
              --body "## Summary
          - Computed procurement strategy comparison for ${{ github.event.inputs.strategy }} / ${{ github.event.inputs.iso }}
          - Mode: ${{ github.event.inputs.mode }}
          - 10 strategy variants: 1A-C (consequential), 2A-C (hourly), 3A-D (annual)
          - 25-year trajectories (2025→2050) along SBTi milestones
          - Results: \`data/step5-post-processing/strategy{1,2,3}_*.json\`
          - Dashboard data: \`dashboard/js/procurement-strategy-data.js\`

          ## Strategy Families
          - **Strategy 1**: Consequential cross-regional netting (3 emission baselines)
          - **Strategy 2**: Hourly matching same-ISO (3 existing-clean-credit variants)
          - **Strategy 3**: Annual matching (2×2: boundary × additionality)" \
              --base master
          fi
