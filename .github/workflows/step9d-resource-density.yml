name: "Step 9D: Resource Density Data"

# Extracts per-scenario resource density data from Step 3 DG parquets
# for the resource investment deep dive strip plots on the abatement dashboard.
#
# Prerequisite: Step 3 DG parquets + optimal_targets.json must exist.
# Output: dashboard/js/resource-density-data.js

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step9d-resource-density

jobs:
  extract-density:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data
        run: |
          echo "Checking for Step 3 DG parquets..."
          DG_COUNT=$(ls data/step3-cost-opt-parquets/step3_dg_*.parquet 2>/dev/null | wc -l)
          echo "  Found $DG_COUNT DG parquet files"
          if [ "$DG_COUNT" -eq 0 ]; then
            echo "ERROR: No Step 3 DG parquets found. Run Step 3 first."
            exit 1
          fi

          echo "Checking for optimal_targets.json..."
          if [ ! -f "data/step5-post-processing/optimal_targets.json" ]; then
            echo "WARNING: No optimal_targets.json found. Will use default crossover ranges."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas pyarrow

      - name: "Extract Resource Density Data"
        run: |
          echo "=== Extracting resource density data ==="
          python scripts/step9d_extract_resource_density.py

      - name: Commit and push
        run: |
          git config http.postBuffer 524288000

          git add -f dashboard/js/resource-density-data.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 9D Resource Density — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done
