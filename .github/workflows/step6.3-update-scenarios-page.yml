name: "Step 6.3: Update Scenarios Page"

# Runs scenario scripts to populate the Scenarios comparison page:
#   1. step6_scenario_a.py — Consequential scenario
#   2. step6_scenario_b.py — Hourly matching scenario
#   3. step6_scenario_compare.py — Merges A+B results into comparison data
#
# iso=ALL fans out parallel matrix jobs (each ISO runs A→B→Compare), then
# merges into one branch + PR.
# Prerequisite: Step 6.0 (CO2) should have run first.
# Output: data/step5-post-processing/scenario_*.json, dashboard/js/scenario-comparison-data.js

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process (ALL = parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which script to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - scenario-a
          - scenario-b
          - scenario-compare
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-3-scenarios

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          for dir in data/step4-gas-ccs-parquets data/step3-cost-opt-parquets; do
            if [ -d "$dir" ] && ls "$dir"/*.parquet >/dev/null 2>&1; then
              HAS_DATA=true
            fi
          done
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No step-3 or step-4 parquets found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: |
          mkdir -p data/step5-post-processing
          mkdir -p dashboard/js

      - name: "Scenario A (Consequential) — ${{ matrix.iso }}"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'scenario-a' }}
        run: python scripts/step6_scenario_a.py --iso ${{ matrix.iso }}

      - name: "Scenario B (Hourly Matching) — ${{ matrix.iso }}"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'scenario-b' }}
        run: python scripts/step6_scenario_b.py --iso ${{ matrix.iso }}

      - name: "Scenario Comparison — ${{ matrix.iso }}"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'scenario-compare' }}
        run: python scripts/step6_scenario_compare.py --iso ${{ matrix.iso }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ matrix.iso }}
          path: |
            data/step5-post-processing/
            dashboard/js/scenario-comparison-data.js
          retention-days: 1

  merge:
    needs: [prepare, process]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.script }}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scenarios-*
          path: ./artifact-tmp/
          merge-multiple: true

      - name: Place artifacts
        run: |
          cp -rf artifact-tmp/data/step5-post-processing/* data/step5-post-processing/ 2>/dev/null || true
          cp -f artifact-tmp/dashboard/js/scenario-comparison-data.js dashboard/js/ 2>/dev/null || true

      - name: Commit and push
        run: |
          git config http.postBuffer 524288000

          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/scenario-comparison-data.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6.3 Scenarios: ${{ inputs.script }} ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 6.3 Scenarios: ${{ inputs.script }} ${{ inputs.iso }}" \
            --body "## Summary
          Updates the Scenarios comparison page for **${{ inputs.iso }}** (script: ${{ inputs.script }}).

          ## Scripts (sequential per ISO, ISOs run in parallel)
          1. \`step6_scenario_a.py\` — Consequential scenario
          2. \`step6_scenario_b.py\` — Hourly matching scenario
          3. \`step6_scenario_compare.py\` — Merges A+B into comparison data

          ## Outputs
          - \`data/step5-post-processing/scenario_*.json\`
          - \`dashboard/js/scenario-comparison-data.js\`" \
            --base ${{ inputs.branch || 'master' }} \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
