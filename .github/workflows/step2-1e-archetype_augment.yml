name: "Step 2.1e: Archetype Augmentation"

# Generates constrained mixes to ensure ≥ target mixes per archetype
# (balanced, solar-led, wind-led, nuclear-heavy) at the 2030 waypoint
# band (50% for low-baseline ISOs, 60% for CAISO/ERCOT/SPP).
#
# Runs AFTER Step 2.1 EF + 2.1b/c/d augments, BEFORE Step 2.3 adaptive.
#
# Prerequisite: Step 2.1 EF parquets + hybrid profiles + gen/demand profiles
# Output: data/step2.1-ef/step_2_1_EF_{iso}_{band}_augment.parquet per ISO

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      target:
        description: 'Target mixes per archetype per ISO'
        required: false
        default: '5000'
        type: string
      runner_size:
        description: 'Runner size'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - large
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step2-1e-archetype-augment
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  augment:
    needs: prepare
    runs-on: ${{ inputs.runner_size == 'large' && 'ubuntu-24.04-16core' || 'ubuntu-latest' }}
    timeout-minutes: 60

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    concurrency:
      group: step2-1e-${{ matrix.iso }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 1

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          shopt -s nullglob
          ISO="${{ matrix.iso }}"

          # Determine waypoint band
          case "$ISO" in
            CAISO|ERCOT|SPP) BAND=60 ;;
            *) BAND=50 ;;
          esac
          echo "BAND=${BAND}" >> "$GITHUB_ENV"

          # Check EF parquets at waypoint band
          EF_FILES=(data/step2.1-ef/step_2_1_EF_${ISO}_${BAND}*.parquet)
          EF_COUNT=0
          for f in "${EF_FILES[@]}"; do
            case "$f" in
              # FIX: also exclude _augment.parquet so prior augment files
              # don't satisfy the prereq when base EF files are missing
              *_peakclean.parquet|*_interp_*.parquet|*_augment.parquet) ;;
              *) EF_COUNT=$((EF_COUNT + 1)) ;;
            esac
          done

          if [ "$EF_COUNT" -eq 0 ]; then
            echo "ERROR: No EF parquets at band ${BAND}% for ${ISO}. Run Step 2.1 first."
            exit 1
          fi

          # Check profiles
          [[ -f "data/hybrid_profiles/${ISO}_hybrid_profiles.npz" ]] || \
            { echo "ERROR: No hybrid profiles for ${ISO}."; exit 1; }
          [[ -f "data/eia-930/eia_generation_profiles.parquet" ]] || \
            { echo "ERROR: Missing generation profiles."; exit 1; }
          [[ -f "data/eia-930/eia_demand_profiles.parquet" ]] || \
            { echo "ERROR: Missing demand profiles."; exit 1; }

          echo "Found ${EF_COUNT} EF parquet(s) at band ${BAND}% for ${ISO}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --prefer-binary numpy pyarrow scipy

      - name: Set up git branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ matrix.iso }}"
          echo "TARGET_BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git checkout -b "${BRANCH}"

      # FIX: reference the actual filename (archetyoe typo in repo)
      - name: "Run archetype augmentation — ${{ matrix.iso }}"
        timeout-minutes: 45
        run: |
          python scripts/step2_1e_archetyoe_augment.py \
            --iso ${{ matrix.iso }} \
            --target ${{ inputs.target || '5000' }}

      - name: Report output
        run: |
          ISO="${{ matrix.iso }}"
          echo "=== Archetype augmentation output for ${ISO} ==="
          ls -lh data/step2.1-ef/step_2_1_EF_${ISO}_*_augment.parquet 2>/dev/null || echo "  (no augment files)"
          echo ""
          python3 -c "
          import glob, pyarrow.parquet as pq
          files = glob.glob('data/step2.1-ef/step_2_1_EF_${ISO}_*_augment.parquet')
          for f in sorted(files):
              n = pq.read_metadata(f).num_rows
              print(f'  {f}: {n:,} rows')
          " 2>/dev/null || echo "  (could not read parquets)"

      - name: "Rescue commit — ${{ matrix.iso }}"
        if: always() && failure()
        run: |
          set -euo pipefail
          ISO="${{ matrix.iso }}"
          git add -f data/step2.1-ef/step_2_1_EF_${ISO}_*_augment.parquet 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::warning::No files to rescue for ${ISO}"
            exit 0
          fi
          FILE_COUNT=$(git diff --cached --name-only | wc -l)
          git commit -m "Step 2.1e RESCUE: ${ISO} partial (${FILE_COUNT} files, job failed)"
          for i in 1 2 3 4; do
            git push -u origin "${TARGET_BRANCH}" 2>&1 && break
            [ "$i" -eq 4 ] && { echo "::error::Rescue push failed"; exit 1; }
            sleep $((2 ** i))
          done
          echo "::warning::Rescue commit pushed — ${FILE_COUNT} files saved"

      - name: "Commit + push — ${{ matrix.iso }}"
        if: success()
        run: |
          set -euo pipefail
          ISO="${{ matrix.iso }}"
          git add -f data/step2.1-ef/step_2_1_EF_${ISO}_*_augment.parquet 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::warning::No augmentation needed for ${ISO} (all archetypes already ≥ target)"
            exit 0
          fi

          FILE_COUNT=$(git diff --cached --name-only | wc -l)
          TARGET="${{ inputs.target || '5000' }}"
          git commit -m "Step 2.1e: archetype augmentation for ${ISO} (target=${TARGET}/archetype) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "${TARGET_BRANCH}" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Summary
        if: always()
        run: |
          ISO="${{ matrix.iso }}"
          {
            echo "## Step 2.1e — ${ISO} archetype augmentation"
            echo ""
            if [ -n "${TARGET_BRANCH:-}" ]; then
              echo "- Branch: \`${TARGET_BRANCH}\`"
            fi
            echo "- Band: ${BAND}%"
            echo "- Target: ${{ inputs.target || '5000' }} mixes/archetype"
            echo "- Runner: \`${{ inputs.runner_size == 'large' && 'ubuntu-24.04-16core' || 'ubuntu-latest' }}\`"
            echo ""
            echo "### Next steps"
            echo "1. Run **Squash Pipeline Branches** with pattern \`auto/.*step2-1e-archetype\`"
            echo "2. Run **Step 2.3 Adaptive** to pick up augmented seeds"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-1e-${{ matrix.iso }}-${{ github.run_id }}
          path: data/step2.1-ef/step_2_1_EF_${{ matrix.iso }}_*_augment.parquet
          retention-days: 14
          if-no-files-found: warn
