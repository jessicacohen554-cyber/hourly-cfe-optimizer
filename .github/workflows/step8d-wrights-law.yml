name: "Step 8D: Wright's Law Learning Curves"

# Computes Wright's Law cost learning curves for renewable + storage technologies.
# Projects FOAK → NOAK cost trajectories over 25-year deployment horizons.
# Output: data/step5-post-processing/ + dashboard data

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step8d-wrights-law

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing

      - name: "Run Wright's Law curves"
        run: |
          echo "=== Step 8D: Wright's Law Learning Curves ==="
          python scripts/step8d_wrights_law_curves.py

      - name: Create branch, commit, and push
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

          git add -f data/step5-post-processing/ dashboard/js/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 8D Wright's Law Curves — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 8D: Wright's Law Curves — $(date -u +%Y-%m-%d)" \
            --body "Auto-generated by step8d-wrights-law workflow.

          Updates Wright's Law FOAK→NOAK learning curve projections." \
            --base "${{ inputs.branch || 'master' }}" \
            --head "$(git branch --show-current)" || echo "PR creation skipped (no changes or PR exists)"
