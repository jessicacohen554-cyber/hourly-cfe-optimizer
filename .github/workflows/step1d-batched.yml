name: "Step 1d: Batched Storage (Large ISOs)"

# For large ISO/threshold pairs that exceed single-job timeout.
# Splits eligible mixes into ~10-min batches, each producing a separate
# parquet: {ISO}_t{XX}_storage_b{N}.parquet
#
# Step 2 automatically discovers and loads batch files alongside
# non-batch files — no merge step needed.
#
# Workflow modes:
#   info — Print batch count estimates (no processing, ~2 min)
#   run  — Process a specific batch number
#
# ──────────────────────────────────────────────────────────────
# ESTIMATED BATCH COUNTS (conservative, ~10 min target):
#
#   ERCOT:
#     t95%:   ~2.2M eligible, ~22 batches (H2 grid)
#     t97.5%: ~2.6M eligible, ~26 batches
#     t99%:   ~3.2M eligible, ~32 batches
#     t99.9%: ~4.9M eligible, ~49 batches
#     t99.99%: ~4.9M eligible, ~49 batches
#
#   SPP:
#     t95%+: similar scale to ERCOT
#
#   MISO / CAISO / NYISO:
#     t95%+: typically 5-15 batches
#
# Run --batch-info first to get exact counts for your ISO.
# ──────────────────────────────────────────────────────────────
#
# Prerequisite: Step 1c (Zone Search) must have run first.
# Output: data/step1d-storage-parquets/{ISO}_t{XX}_storage_b{N}.parquet

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region'
        required: true
        type: choice
        options:
          - ERCOT
          - SPP
          - CAISO
          - PJM
          - NYISO
          - NEISO
          - MISO
      threshold:
        description: 'Single threshold (e.g., 95, 97.5, 99.99)'
        required: true
        type: string
        default: '95'
      mode:
        description: 'info = print batch counts; run = process a batch'
        required: true
        type: choice
        default: 'info'
        options:
          - info
          - run
      batch_num:
        description: 'Batch number to run (1-indexed, required for mode=run)'
        required: false
        type: string
        default: '1'
      total_batches:
        description: 'Total batches (required for mode=run; get from mode=info)'
        required: false
        type: string
        default: '1'
      branch:
        description: 'Source branch'
        required: false
        type: string
        default: 'master'

env:
  BRANCH_PREFIX: step1d-batch
  PYTHONUNBUFFERED: "1"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # BATCH INFO — Print eligible counts and recommended batch numbers
  # ════════════════════════════════════════════════════════════════════════
  batch-info:
    if: ${{ inputs.mode == 'info' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        lfs: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Run batch info
      run: |
        python scripts/step1d_fine_storage.py \
          --iso "${{ inputs.iso }}" \
          --batch-info \
          --target-minutes 10

    - name: Display batch info JSON
      run: |
        ISO="${{ inputs.iso }}"
        INFO="data/step1d-storage-parquets/${ISO}_batch_info.json"
        if [ -f "$INFO" ]; then
          echo "=== Batch info for $ISO ==="
          cat "$INFO"
          echo ""
          echo "Use these batch counts with mode=run to process individual batches."
        fi

  # ════════════════════════════════════════════════════════════════════════
  # RUN BATCH — Process a single batch for one ISO/threshold
  # ════════════════════════════════════════════════════════════════════════
  run-batch:
    if: ${{ inputs.mode == 'run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ inputs.iso }}" | tr '[:upper:]' '[:lower:]')
        THR=$(echo "${{ inputs.threshold }}" | tr '.' '_')
        BATCH="${{ inputs.batch_num }}"
        TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LOWER}-t${THR}-b${BATCH}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Verify near-miss data exists
      run: |
        ISO="${{ inputs.iso }}"
        NM="data/step1-pfs-parquets/${ISO}_near_miss.parquet"
        CC="data/step1-pfs-parquets/${ISO}_coarse_cache.parquet"
        if [ ! -f "$NM" ] && [ ! -f "$CC" ]; then
          echo "ERROR: Missing both near-miss and coarse cache for $ISO"
          exit 1
        fi
        [ -f "$NM" ] && echo "Near-miss: $(python3 -c "import pyarrow.parquet as pq; print(pq.read_table('$NM').num_rows)")" || echo "No near-miss (will use coarse cache)"
        [ -f "$CC" ] && echo "Coarse cache: $(python3 -c "import pyarrow.parquet as pq; print(pq.read_table('$CC').num_rows)")" || true

    - name: Ensure output directory
      run: mkdir -p data/step1d-storage-parquets

    - name: "Run batch ${{ inputs.batch_num }}/${{ inputs.total_batches }} — ${{ inputs.iso }} t${{ inputs.threshold }}%"
      timeout-minutes: 20
      run: |
        echo "Processing: ${{ inputs.iso }} t${{ inputs.threshold }}% batch ${{ inputs.batch_num }}/${{ inputs.total_batches }}"
        python scripts/step1d_fine_storage.py \
          --iso "${{ inputs.iso }}" \
          --thresholds "${{ inputs.threshold }}" \
          --batch "${{ inputs.batch_num }}" \
          --total-batches "${{ inputs.total_batches }}" \
          --auto-commit

    - name: Final commit and push
      if: always()
      run: |
        ISO="${{ inputs.iso }}"
        git add data/step1d-storage-parquets/"${ISO}"_*.parquet \
                data/step1d-storage-parquets/"${ISO}"_*.json 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1d batch: ${{ inputs.iso }} t${{ inputs.threshold }}% b${{ inputs.batch_num }}/${{ inputs.total_batches }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

        # Push with retry
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "Branch: $TARGET_BRANCH"
        echo "Merge into master to bank the batch results."
