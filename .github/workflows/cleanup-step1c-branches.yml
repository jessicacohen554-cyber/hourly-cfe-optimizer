name: "Cleanup: Deduplicate Pipeline Branches"

# One-shot cleanup for existing step1c and step1d auto/* branches.
#
# Problem: multiple step1c/step1d runs for the same ISO create separate branches
# (e.g. 4 CAISO branches, 3 MISO branches). When squash-merged they conflict
# because the same parquet files appear with different content.
#
# Fix: for each ISO, keep only the MOST RECENT branch (highest timestamp)
# and delete all older same-ISO branches. The squash workflow then has exactly
# one branch per ISO — guaranteed no same-file conflicts.
#
# Branch formats handled:
#   Step 1c:  auto/{TS}-step1c-zone-search-{iso}
#   Step 1d:  auto/{TS}-step1d-fine-storage-{iso}-{mode}
#
# After this runs:
#   - 1 branch per ISO remains (the latest)
#   - Older branches are deleted and their PRs are closed
#   - Run "Squash Pipeline Branches" with the matching pattern to bank results
#
# Dry-run first — see what would be kept/deleted before committing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — list what would be kept/deleted without changing anything'
        default: true
        type: boolean
      delete_old:
        description: 'Delete older duplicate branches (false = only close PRs, keep branches)'
        default: true
        type: boolean
      close_prs:
        description: 'Close PRs associated with deleted branches'
        default: true
        type: boolean
      branch_pattern:
        description: 'Branch pattern to scan'
        default: 'auto/.*step1c-zone-search'
        type: choice
        options:
          - 'auto/.*step1c-zone-search'
          - 'auto/.*step1d-fine-storage'
          - 'auto/.*step1[cd]'
      then_squash:
        description: 'Automatically trigger squash after cleanup completes'
        default: false
        type: boolean

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all remote branches
        run: git fetch origin --prune

      - name: Group branches by ISO and identify latest per ISO
        id: group
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATTERN="${{ inputs.branch_pattern }}"
          echo "Scanning for branches matching: ${PATTERN}"
          echo ""

          # Collect matching unmerged branches
          BRANCHES=()
          while IFS= read -r ref; do
            branch=$(echo "$ref" | sed 's|^ *remotes/origin/||; s|^ *origin/||; s/^ *//')
            [ -z "$branch" ] && continue
            BRANCHES+=("$branch")
          done < <(git branch -r --no-merged master | grep "origin/${PATTERN}")

          echo "Found ${#BRANCHES[@]} total matching branch(es)."
          echo ""

          if [ ${#BRANCHES[@]} -eq 0 ]; then
            echo "Nothing to do."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Group by ISO: extract ISO from branch name suffix
          # Branch format: auto/{TS}-step1c-zone-search-{iso}
          # ISO = everything after the last "-" in the step1c-zone-search- segment
          declare -A LATEST_BRANCH   # ISO -> latest branch name
          declare -A LATEST_TS       # ISO -> latest timestamp
          declare -A ALL_BRANCHES    # ISO -> space-separated list of ALL branches

          for branch in "${BRANCHES[@]}"; do
            # Extract ISO (last segment after step1c-zone-search- or step1d-fine-storage-)
            ISO=$(echo "$branch" | grep -oP '(?<=step1c-zone-search-)[a-z]+' || \
                  echo "$branch" | grep -oP '(?<=step1d-fine-storage-)[a-z]+' || \
                  echo "unknown")
            # Extract timestamp (first segment after auto/)
            TS=$(echo "$branch" | grep -oP '(?<=auto/)\d{8}T\d{6}' || echo "00000000T000000")

            # Track all branches for this ISO
            if [ -n "${ALL_BRANCHES[$ISO]+x}" ]; then
              ALL_BRANCHES[$ISO]="${ALL_BRANCHES[$ISO]} $branch"
            else
              ALL_BRANCHES[$ISO]="$branch"
            fi

            # Keep highest timestamp as latest
            if [ -z "${LATEST_TS[$ISO]}" ] || [[ "$TS" > "${LATEST_TS[$ISO]}" ]]; then
              LATEST_TS[$ISO]="$TS"
              LATEST_BRANCH[$ISO]="$branch"
            fi
          done

          echo "═══════════════════════════════════════════════"
          echo "  Deduplication Plan"
          echo "═══════════════════════════════════════════════"
          echo ""

          KEEP_FILE="/tmp/branches_to_keep.txt"
          DELETE_FILE="/tmp/branches_to_delete.txt"
          > "$KEEP_FILE"
          > "$DELETE_FILE"

          for ISO in $(echo "${!LATEST_BRANCH[@]}" | tr ' ' '\n' | sort); do
            LATEST="${LATEST_BRANCH[$ISO]}"
            ALL="${ALL_BRANCHES[$ISO]}"
            COUNT=$(echo "$ALL" | wc -w)

            echo "  ISO: $ISO ($COUNT branch(es))"
            echo "    KEEP:   $LATEST"
            echo "$LATEST" >> "$KEEP_FILE"

            for branch in $ALL; do
              if [ "$branch" != "$LATEST" ]; then
                echo "    DELETE: $branch"
                echo "$branch" >> "$DELETE_FILE"
              fi
            done
            echo ""
          done

          KEEP_COUNT=$(wc -l < "$KEEP_FILE" | tr -d ' ')
          DELETE_COUNT=$(wc -l < "$DELETE_FILE" | tr -d ' ')

          echo "═══════════════════════════════════════════════"
          echo "  Keep: $KEEP_COUNT branch(es)   Delete: $DELETE_COUNT branch(es)"
          echo "═══════════════════════════════════════════════"

          echo "has_work=true"    >> "$GITHUB_OUTPUT"
          echo "keep_count=$KEEP_COUNT"     >> "$GITHUB_OUTPUT"
          echo "delete_count=$DELETE_COUNT" >> "$GITHUB_OUTPUT"

      - name: "Dry run — preview only"
        if: inputs.dry_run && steps.group.outputs.has_work == 'true'
        run: |
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  DRY RUN — no changes made"
          echo "  Re-run with dry_run=false to execute."
          echo "════════════════════════════════════════════════"

      - name: Close PRs for old branches
        if: ${{ !inputs.dry_run && inputs.close_prs && steps.group.outputs.has_work == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOSED=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            PR_NUM=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
              echo "Closing PR #${PR_NUM} for $branch (superseded by newer run)"
              gh pr close "$PR_NUM" \
                --comment "Superseded by a more recent pipeline run. Keeping latest branch only." 2>/dev/null || true
              CLOSED=$((CLOSED + 1))
            fi
          done < /tmp/branches_to_delete.txt
          echo "Closed $CLOSED PR(s)."

      - name: Delete older duplicate branches
        if: ${{ !inputs.dry_run && inputs.delete_old && steps.group.outputs.has_work == 'true' }}
        run: |
          DELETED=0
          FAILED=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            echo "  Deleting origin/$branch ..."
            if git push origin --delete "$branch" 2>/dev/null; then
              DELETED=$((DELETED + 1))
            else
              echo "    (failed — may already be deleted or protected)"
              FAILED=$((FAILED + 1))
            fi
          done < /tmp/branches_to_delete.txt
          echo ""
          echo "Deleted: $DELETED   Failed: $FAILED"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  CLEANUP SUMMARY"
          echo "════════════════════════════════════════════════"
          if [ -f /tmp/branches_to_keep.txt ]; then
            KEEP=$(wc -l < /tmp/branches_to_keep.txt | tr -d ' ')
            DELETE=$(wc -l < /tmp/branches_to_delete.txt | tr -d ' ')
            echo "  Branches retained (latest per ISO): $KEEP"
            echo "  Branches deleted (older duplicates): $DELETE"
            echo ""
            echo "  Branches kept:"
            while IFS= read -r b; do
              echo "    ✓ $b"
            done < /tmp/branches_to_keep.txt
          fi
          echo ""
          PATTERN="${{ inputs.branch_pattern }}"
          if [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ inputs.then_squash }}" = "true" ]; then
            echo "  Next: run 'Squash Pipeline Branches' with matching pattern to bank results."
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "  Re-run with dry_run=false to apply."
          else
            echo "  Next: run 'Squash Pipeline Branches' with matching pattern to bank results."
          fi
          echo "════════════════════════════════════════════════"
