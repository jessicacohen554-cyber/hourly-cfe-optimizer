name: "Step 1.6: Thin-Threshold Augmentation"

# Generates fine-grid PFS mixes for ISO/threshold bands where the
# efficient frontier has <100 mixes. Lightweight tack-on to Steps 1.1–1.5.
# Each ISO runs on its own runner in parallel.
#
# Output: data/step1-pfs/{ISO}_t{T}_augment.parquet
#
# Commit/push strategy: each file is committed and pushed individually
# to stay under GitHub's 50 MB file limit and avoid large-push failures.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region (default: all ISOs with thin bands)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      min_ef:
        description: 'Augment bands with fewer than N EF mixes (default: 100)'
        required: false
        default: '100'
        type: string
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

  augment:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    permissions:
      contents: write
      workflows: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        TARGET_BRANCH="auto/${TIMESTAMP}-step1-6-augment-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    - name: "Run Thin-Threshold Augmentation — ${{ matrix.iso }}"
      run: |
        MIN_EF="${{ inputs.min_ef }}"
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Step 1.6 Augmentation  |  min-ef: ${MIN_EF:-100}"
        echo "═══════════════════════════════════════════════════════════"

        ARGS="--iso ${{ matrix.iso }} --min-thresh 50"
        if [ -n "$MIN_EF" ]; then
          ARGS="$ARGS --min-ef $MIN_EF"
        fi
        python scripts/step1_6_thin_threshold_augment.py $ARGS

    - name: Split any oversized parquets (safety net)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        MAX_MB=45
        for f in data/step1-pfs/"${ISO}"_*augment*.parquet; do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "⚠ $f is ${SIZE_MB}MB (>${MAX_MB}MB), re-splitting..."
            python3 -c "
import sys; sys.path.insert(0, 'scripts')
from parquet_utils import write_parquet_chunked
import pyarrow.parquet as pq
import os
t = pq.read_table('$f')
os.remove('$f')
parts = write_parquet_chunked(t, '$f', max_mb=$MAX_MB)
print(f'Re-split into {len(parts)} parts')
"
          fi
        done

    - name: Commit and push each file individually (≤45 MB per push)
      if: always()
      run: |
        ISO="${{ matrix.iso }}"
        PUSHED=0
        SOURCE_BRANCH="${{ inputs.branch || 'master' }}"

        # Push the branch first (empty, just to create the remote ref)
        git push -u origin "$TARGET_BRANCH" 2>/dev/null || true

        for f in $(ls -1S data/step1-pfs/"${ISO}"_*augment*.parquet 2>/dev/null); do
          [ -f "$f" ] || continue
          SIZE_MB=$(du -m "$f" | cut -f1)
          FNAME=$(basename "$f")

          if [ "$SIZE_MB" -gt 49 ]; then
            echo "ERROR: $FNAME is ${SIZE_MB}MB — still over limit after split, skipping"
            continue
          fi

          echo "── ${FNAME} (${SIZE_MB}MB) ──"

          # Commit this single file
          git add -f "$f"
          if git diff --cached --quiet; then
            echo "  (no changes, skipping)"
            continue
          fi
          git commit -m "Step 1.6 Augment: ${ISO} ${FNAME} (${SIZE_MB}MB) — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push immediately after each commit (retry with backoff)
          for attempt in 1 2 3 4; do
            if git push origin "$TARGET_BRANCH"; then
              echo "  ✓ pushed successfully"
              PUSHED=$((PUSHED + 1))
              break
            fi
            echo "  Push attempt $attempt failed, retrying in $((2**attempt))s..."
            sleep $((2**attempt))
          done
        done

        if [ "$PUSHED" -eq 0 ]; then
          echo "No new results pushed (ISO may have no thin bands)"
        else
          echo "Pushed $PUSHED file(s) individually. Run Step 2.1 separately to rebuild EF."
          echo "Branch: $TARGET_BRANCH"
          echo "Merge this branch into ${SOURCE_BRANCH} to bank augmented PFS results."
        fi
