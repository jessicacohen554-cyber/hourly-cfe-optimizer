name: "Step 6.1: Update Abatement Page"

# Runs three scripts sequentially to fully populate the Abatement / MAC page:
#   1. step6_compute_mac_stats.py  — 6 MAC metrics, ANOVA decomposition, crossover analysis
#   2. step6_compute_optimal_targets.py — optimal CFE target per ISO via DAC crossover
#   3. step7_generate_shared_data.py — consolidates all results into shared-data.js
#
# Prerequisite: Step 6.0 (CO2) must have run first — MAC depends on CO2 output.
# Output: dashboard/js/mac-stats-data.js, optimal-target-data.js, shared-data.js

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which script to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - mac-stats
          - optimal-targets
          - shared-data
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-1-mac

jobs:
  update-mac-page:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ inputs.iso }}"
          SCRIPT_LABEL="${{ inputs.script }}"
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${SCRIPT_LABEL}-${ISO_LABEL}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          for dir in data/step4-gas-ccs-parquets data/step3-cost-opt-parquets; do
            if [ -d "$dir" ] && ls "$dir"/*.parquet >/dev/null 2>&1; then
              HAS_DATA=true
            fi
          done
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No step-3 or step-4 parquets found. Run earlier steps first."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: |
          mkdir -p data/step5-post-processing
          mkdir -p dashboard/js

      # ════════════════════════════════════════════════════════════════════
      # Sequential: MAC Stats → Optimal Targets → Shared Data
      # ════════════════════════════════════════════════════════════════════

      - name: "1/3 — Compute MAC Statistics"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'mac-stats' }}
        run: |
          echo "=== MAC Statistics (6 metrics, ANOVA, crossover) ==="
          python scripts/step6_compute_mac_stats.py

      - name: "2/3 — Compute Optimal Targets"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'optimal-targets' }}
        run: |
          echo "=== Optimal CFE Targets (DAC crossover analysis) ==="
          python scripts/step6_compute_optimal_targets.py

      - name: "3/3 — Generate Shared Data"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'shared-data' }}
        run: |
          echo "=== Consolidate results into shared-data.js ==="
          python scripts/step7_generate_shared_data.py

      - name: Commit and push
        run: |
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/mac-stats-data.js 2>/dev/null || true
          git add -f dashboard/js/optimal-target-data.js 2>/dev/null || true
          git add -f dashboard/js/shared-data.js 2>/dev/null || true
          git add -f data/step5-post-processing/shared_data.json 2>/dev/null || true
          git add -f data/step5-post-processing/optimal_targets.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6.1 Abatement: ${{ inputs.script }} ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 6.1 Abatement: ${{ inputs.script }} ${{ inputs.iso }}" \
            --body "## Summary
          Updates the Abatement / MAC page for **${{ inputs.iso }}** (script: ${{ inputs.script }}).

          ## Scripts (sequential when ALL)
          1. \`step6_compute_mac_stats.py\` — 6 MAC metrics, ANOVA decomposition, DAC/SCC/ETS crossover
          2. \`step6_compute_optimal_targets.py\` — optimal CFE target per ISO via smooth marginal MAC × DAC
          3. \`step7_generate_shared_data.py\` — consolidates all results into shared-data.js

          ## Outputs
          - \`dashboard/js/mac-stats-data.js\`
          - \`dashboard/js/optimal-target-data.js\`
          - \`dashboard/js/shared-data.js\`" \
            --base ${{ inputs.branch || 'master' }} \
            --head "$TARGET_BRANCH" || echo "PR creation skipped"
