name: Run Step 4 Gas CCS Post-Processing

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP

env:
  BRANCH_PREFIX: step4-gas-ccs

jobs:
  run-step4:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify step-3 CO parquets exist
        run: |
          if [ ! -d data/step3-cost-opt-parquets ] || [ -z "$(ls data/step3-cost-opt-parquets/*.parquet 2>/dev/null)" ]; then
            echo "ERROR: Step-3 CO parquets not found in data/step3-cost-opt-parquets/"
            echo "Run Step 3 workflow first and merge results to master."
            exit 1
          fi
          echo "Step-3 CO parquets found:"
          ls -lh data/step3-cost-opt-parquets/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas

      - name: Ensure output directory exists
        run: mkdir -p data/step4-gas-ccs-parquets

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=--all" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Step 4 Gas CCS Post-Processing
        run: |
          python scripts/step4_gas_ccs_adjustement.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: Commit and push Step 4 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step4-gas-ccs-parquets/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          ISO_LABEL="${{ github.event.inputs.iso }}"
          git commit -m "Step 4 Gas CCS: ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push fresh branch (retry for transient network errors only)
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            # Fail immediately on large-file rejection (not recoverable by retry)
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              echo "Check file sizes — GitHub limit is 100 MB per file."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## Summary"$'\n'"- Step 4 Gas CCS post-processing results for **${{ github.event.inputs.iso }}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 4 Gas CCS: ${{ github.event.inputs.iso }}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
