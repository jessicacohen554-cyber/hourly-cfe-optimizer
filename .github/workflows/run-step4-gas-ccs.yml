name: Run Step 4 Gas CCS Post-Processing

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process (CAISO, ERCOT, PJM, NYISO, NEISO — or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP

env:
  TARGET_BRANCH: step4-gas-CCS-parquets

jobs:
  run-step4:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch input data from step-3 branch
        run: |
          git fetch origin step3-CO-ISO-parquets || true
          git checkout origin/step3-CO-ISO-parquets -- data/step-3-CO-ISO-parquets/ || {
            echo "ERROR: Could not fetch step-3 CO parquets from branch step3-CO-ISO-parquets"
            echo "Run Step 3 workflow first."
            exit 1
          }
          echo "Step-3 CO parquets restored:"
          ls -lh data/step-3-CO-ISO-parquets/

      - name: Switch to target branch
        run: |
          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            # Re-apply step-3 data (may have been overwritten by branch switch)
            git checkout origin/step3-CO-ISO-parquets -- data/step-3-CO-ISO-parquets/ || true
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyarrow

      - name: Ensure output directory exists
        run: mkdir -p data/step4-gas-CCS

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=--all" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Step 4 Gas CCS Post-Processing
        run: |
          python scripts/step4_gas_ccs_adjustement.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: Commit Step 4 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step4-gas-CCS/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            ISO_LABEL="${{ github.event.inputs.iso }}"
            git commit -m "Step 4 Gas CCS: ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git push origin "$TARGET_BRANCH"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
          else
            PR_BODY="## Summary"$'\n'"- Step 4 Gas CCS post-processing results for **${{ github.event.inputs.iso }}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
            gh pr create \
              --title "Step 4 Gas CCS: ${{ github.event.inputs.iso }}" \
              --body "$PR_BODY" \
              --base master \
              --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
          fi
