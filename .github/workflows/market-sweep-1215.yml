name: "Market Simulator: 1,215-Scenario Sweep"

# Runs the full 1,215-scenario parametric sweep
# (3 demand × 5 price × 3 PPA × 3 gas friction × 3 queue × 3 new-build fossil cost)
# across all 7 ISOs, simulating annual years 2023–2060.
#
# Each ISO runs in a parallel matrix job.
# Results are merged into a single branch with parquet output only (no large JSON).
#
# Output: market-simulator/results/sweep_1215/
#   - sweep_1215_flat.parquet         (flat table, ~10 MB)
#   - sweep_1215_aggregates.json      (P10/P50/P90 bands, ~1 MB)
#
# Total simulations: 1,215 scenarios × 7 ISOs × 38 years = 323,190 ISO-year runs

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region (ALL = parallel matrix)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: market-sweep-1215

jobs:
  # ── Phase 1: Run sweep per-ISO in parallel ──
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        iso:
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas pyarrow scipy numba

      - name: Create output directory
        run: mkdir -p market-simulator/results/sweep_1215

      - name: "Run 1,215-scenario sweep — ${{ matrix.iso }}"
        working-directory: market-simulator/scripts
        run: |
          python run_sweep_1215.py \
            --isos ${{ matrix.iso }} \
            --output-dir ../results/sweep_1215/${{ matrix.iso }}

      - name: Upload per-ISO parquet
        uses: actions/upload-artifact@v4
        with:
          name: sweep-1215-${{ matrix.iso }}
          path: market-simulator/results/sweep_1215/${{ matrix.iso }}/
          retention-days: 3

  # ── Phase 2: Merge per-ISO parquets into combined output ──
  merge:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas pyarrow scipy numba

      - name: Download all per-ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sweep-1215-*
          path: ./artifact-tmp/

      - name: Merge per-ISO parquets into combined output
        working-directory: market-simulator/scripts
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          import pandas as pd

          artifact_root = os.path.join(os.getcwd(), '..', '..', 'artifact-tmp')
          out_dir = os.path.join(os.getcwd(), '..', 'results', 'sweep_1215')
          os.makedirs(out_dir, exist_ok=True)

          # Merge parquet files from all ISOs
          dfs = []
          for iso_dir in sorted(os.listdir(artifact_root)):
              iso_path = os.path.join(artifact_root, iso_dir)
              for root, dirs, files in os.walk(iso_path):
                  for f in files:
                      if f.endswith('.parquet'):
                          df = pd.read_parquet(os.path.join(root, f))
                          dfs.append(df)
                          print(f"  Loaded {iso_dir}: {len(df)} rows")
          if dfs:
              combined_df = pd.concat(dfs, ignore_index=True)
              parquet_path = os.path.join(out_dir, 'sweep_1215_flat.parquet')
              combined_df.to_parquet(parquet_path, index=False)
              print(f"Combined parquet: {len(combined_df)} rows × {len(combined_df.columns)} cols")
              size_mb = os.path.getsize(parquet_path) / 1e6
              print(f"  Size: {size_mb:.1f} MB")
          else:
              print("ERROR: No parquet files found in artifacts")
              sys.exit(1)

          # Compute aggregates from the combined parquet
          # (lightweight: just percentile bands on scalar columns)
          print("Computing P10/P50/P90 aggregates from parquet...")
          agg_cols = [
              'avg_lmp', 'lmp_p90', 'emissions_mt', 'emission_rate_tco2_mwh',
              'cost_per_mwh', 'revenue_per_mwh', 'clean_pct', 'demand_twh',
              'total_new_fossil_mw', 'total_economic_retirement_mw',
              'ordc_scarcity_hours',
          ]
          existing_cols = [c for c in agg_cols if c in combined_df.columns]

          aggregates = {}
          for iso in sorted(combined_df['iso'].dropna().unique()):
              iso_df = combined_df[combined_df['iso'] == iso]
              aggregates[iso] = {}
              for year in sorted(iso_df['year'].dropna().unique()):
                  yr_df = iso_df[iso_df['year'] == year]
                  yr_agg = {}
                  for col in existing_cols:
                      vals = yr_df[col].dropna()
                      if len(vals) > 0:
                          yr_agg[col] = {
                              'p10': round(float(vals.quantile(0.1)), 4),
                              'p50': round(float(vals.quantile(0.5)), 4),
                              'p90': round(float(vals.quantile(0.9)), 4),
                              'mean': round(float(vals.mean()), 4),
                          }
                  aggregates[iso][str(int(year))] = yr_agg

          agg_path = os.path.join(out_dir, 'sweep_1215_aggregates.json')
          with open(agg_path, 'w') as f:
              json.dump(aggregates, f, indent=2)
          print(f"Aggregates saved: {agg_path} ({len(aggregates)} ISOs)")
          PYEOF

      - name: Create output branch and commit
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

          git add -f market-simulator/results/sweep_1215/
          git add -f market-simulator/scripts/run_sweep_1215.py

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Market simulator: 1,215-scenario sweep results (parquet-only) — $(date -u +%Y-%m-%dT%H:%M:%SZ)

          1,215 scenarios (3 demand × 5 price × 3 PPA × 3 gas friction × 3 queue × 3 new fossil cost)
          × 7 ISOs × 6 years (2023, 2030, 2035, 2040, 2045, 2050) = 51,030 results.

          Output: parquet (flat table) + aggregates JSON (P10/P50/P90).
          Combined JSON removed — was 300+ MB, parquet is ~10 MB with same data."

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done
