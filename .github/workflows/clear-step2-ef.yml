name: "Cleanup: Clear Step 2 EF Parquets"

# Removes all step2 efficient frontier parquets from data/step2-ef-parquets/.
# Use this before re-running Step 2 to ensure a clean slate — no stale EF
# files from previous runs will linger.
#
# Can target a single ISO or clear all ISOs at once.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to clear (or ALL for everything)'
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      dry_run:
        description: 'Preview only — list files that would be deleted without changing anything'
        default: true
        type: boolean
      branch:
        description: 'Branch to commit the deletion to'
        default: 'master'
        type: string

jobs:
  clear-ef:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

      - name: Find EF files to clear
        id: find
        run: |
          DIR="data/step2-ef-parquets"
          if [ ! -d "$DIR" ]; then
            echo "Directory $DIR does not exist"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ISO="${{ inputs.iso }}"
          if [ "$ISO" = "ALL" ]; then
            PATTERN="step2_ef_*.parquet"
          else
            PATTERN="step2_ef_${ISO}_*.parquet"
          fi

          FILES=$(find "$DIR" -name "$PATTERN" | sort)
          COUNT=$(echo "$FILES" | grep -c . 2>/dev/null || echo 0)

          echo "Found $COUNT EF file(s) matching $PATTERN:"
          echo "$FILES"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "pattern=$PATTERN" >> "$GITHUB_OUTPUT"

      - name: Preview (dry run)
        if: ${{ inputs.dry_run && steps.find.outputs.count != '0' }}
        run: |
          DIR="data/step2-ef-parquets"
          PATTERN="${{ steps.find.outputs.pattern }}"

          echo "═══════════════════════════════════════════════"
          echo "  DRY RUN — No files will be deleted"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "Files that would be removed (${{ inputs.iso }}):"
          find "$DIR" -name "$PATTERN" -exec du -h {} \; | sort
          echo ""
          TOTAL=$(find "$DIR" -name "$PATTERN" -exec du -cb {} + | tail -1 | cut -f1)
          echo "Total size: $(echo "$TOTAL" | numfmt --to=iec 2>/dev/null || echo "${TOTAL} bytes")"
          echo ""
          echo "Re-run with dry_run=false to delete."

      - name: Delete files and commit
        if: ${{ !inputs.dry_run && steps.find.outputs.count != '0' }}
        run: |
          DIR="data/step2-ef-parquets"
          ISO="${{ inputs.iso }}"
          COUNT=${{ steps.find.outputs.count }}
          PATTERN="${{ steps.find.outputs.pattern }}"

          echo "Deleting $COUNT EF parquet(s) matching $PATTERN..."
          find "$DIR" -name "$PATTERN" -delete

          git add -u "$DIR/"
          git commit -m "Clear step2 EF parquets ($ISO): $COUNT files removed

          Clean slate before re-running Step 2 efficient frontier extraction."

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push origin "${{ inputs.branch || 'master' }}" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  CLEAR EF SUMMARY"
          echo "═══════════════════════════════════════════════"
          echo "  ISO:        ${{ inputs.iso }}"
          echo "  Files found: ${{ steps.find.outputs.count }}"
          echo "  Dry run:    ${{ inputs.dry_run }}"
          if [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ steps.find.outputs.count }}" != "0" ]; then
            echo "  Status:     Deleted and committed"
          fi
          echo "═══════════════════════════════════════════════"
