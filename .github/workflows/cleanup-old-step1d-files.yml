name: "Cleanup: Remove Old Step 1D _refined Files"

# Deletes obsolete _storage_refined.parquet files from data/step1d-storage-parquets/.
# The current step1d script outputs {ISO}_t{XX}_storage.parquet — the _refined
# suffix was from an older naming convention and is no longer produced.
#
# Creates a commit on master (or target branch) removing the old files.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — list files that would be deleted without changing anything'
        default: true
        type: boolean
      branch:
        description: 'Branch to commit the deletion to'
        default: 'master'
        type: string

jobs:
  cleanup-refined:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

      - name: Find old _storage_refined files
        id: find
        run: |
          DIR="data/step1d-storage-parquets"
          if [ ! -d "$DIR" ]; then
            echo "Directory $DIR does not exist"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(find "$DIR" -name '*_storage_refined.parquet' | sort)
          COUNT=$(echo "$FILES" | grep -c . 2>/dev/null || echo 0)

          echo "Found $COUNT old _storage_refined.parquet file(s):"
          echo "$FILES"
          echo ""

          CURRENT=$(find "$DIR" -name '*_storage.parquet' ! -name '*_storage_refined.parquet' | sort)
          CURRENT_COUNT=$(echo "$CURRENT" | grep -c . 2>/dev/null || echo 0)
          echo "Current _storage.parquet files (will be kept): $CURRENT_COUNT"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Preview (dry run)
        if: ${{ inputs.dry_run && steps.find.outputs.count != '0' }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  DRY RUN — No files will be deleted"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "Files that would be removed:"
          find data/step1d-storage-parquets -name '*_storage_refined.parquet' -exec du -h {} \; | sort
          echo ""
          TOTAL=$(find data/step1d-storage-parquets -name '*_storage_refined.parquet' -exec du -cb {} + | tail -1 | cut -f1)
          echo "Total size: $(echo "$TOTAL" | numfmt --to=iec 2>/dev/null || echo "${TOTAL} bytes")"
          echo ""
          echo "Re-run with dry_run=false to delete."

      - name: Delete old files and commit
        if: ${{ !inputs.dry_run && steps.find.outputs.count != '0' }}
        run: |
          COUNT=${{ steps.find.outputs.count }}
          echo "Deleting $COUNT old _storage_refined.parquet files..."

          find data/step1d-storage-parquets -name '*_storage_refined.parquet' -delete

          git add -u data/step1d-storage-parquets/
          git commit -m "Remove $COUNT obsolete _storage_refined.parquet files from step1d

          The current step1d script outputs {ISO}_t{XX}_storage.parquet.
          The _refined suffix was from an older naming convention."

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push origin "${{ inputs.branch || 'master' }}" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  CLEANUP SUMMARY"
          echo "═══════════════════════════════════════════════"
          echo "  Old _refined files found: ${{ steps.find.outputs.count }}"
          echo "  Dry run: ${{ inputs.dry_run }}"
          if [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ steps.find.outputs.count }}" != "0" ]; then
            echo "  Status: Deleted and committed"
          fi
          echo "═══════════════════════════════════════════════"
