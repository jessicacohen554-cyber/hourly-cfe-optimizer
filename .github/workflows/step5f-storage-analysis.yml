name: "Step 5F: Storage Analysis"

# Runs storage utilization analysis — battery/LDES dispatch patterns,
# capacity factor analysis, and storage economics.
# Reads from dispatch cache + step3 cost optimization parquets.
# Output: data/step5-post-processing/storage_analysis/ + dashboard/js/storage-analysis-data.js

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step5f-storage

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Verify upstream data exists
        run: |
          if [ ! -d "data/step3-cost-opt-parquets" ] || ! ls data/step3-cost-opt-parquets/*.parquet >/dev/null 2>&1; then
            echo "ERROR: No step-3 parquets found."
            exit 1
          fi
          if [ ! -d "data/step5-post-processing/dispatch_cache" ]; then
            echo "WARNING: No dispatch cache found — script will compute dispatch on the fly"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing/storage_analysis

      - name: "Run storage analysis"
        run: |
          echo "=== Step 5F: Storage Analysis ==="
          python scripts/step5f_analyze_storage.py

      - name: Create branch, commit, and push
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

          git add -f data/step5-post-processing/storage_analysis/ dashboard/js/storage-analysis-data.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 5F Storage Analysis — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Step 5F: Storage Analysis — $(date -u +%Y-%m-%d)" \
            --body "Auto-generated by step5f-storage-analysis workflow.

          Updates storage utilization analysis and dashboard data." \
            --base "${{ inputs.branch || 'master' }}" \
            --head "$(git branch --show-current)" || echo "PR creation skipped (no changes or PR exists)"
