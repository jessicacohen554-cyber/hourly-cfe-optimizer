name: "Step 5: Dispatch Cache & Track Analysis"

# Pre-computes 8760-hour dispatch for all unique mixes (dispatch cache),
# then exports and analyzes track results.
#
# Execution order:
#   1. step5_build_dispatch_cache.py — builds cache (MUST run first)
#   2. step5_export_track_results.py — exports track parquets to JSON (parallel)
#   3. step5_analyze_tracks.py — track cost envelopes, mix differentials (parallel)
#
# Prerequisite: Step 4 (or Step 3) must have produced parquets.
# Output: data/step5-post-processing/dispatch_cache/, dashboard/track_results.json

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which scripts to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - dispatch-cache-only
          - export-tracks-only
          - analyze-tracks-only
      force:
        description: 'Force rebuild dispatch cache (ignore existing)'
        required: false
        default: true
        type: boolean
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step5-dispatch

jobs:
  run-step5:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.script }}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data
        run: |
          HAS_DATA=false
          for dir in data/step4-gas-ccs-parquets data/step3-cost-opt-parquets; do
            if [ -d "$dir" ] && ls "$dir"/*.parquet >/dev/null 2>&1; then
              HAS_DATA=true
            fi
          done
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: No step-3 or step-4 parquets found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas

      - name: Build ISO arguments
        id: iso-args
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso ${{ inputs.iso }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure output directories
        run: |
          mkdir -p data/step5-post-processing/dispatch_cache
          mkdir -p dashboard

      # ════════════════════════════════════════════════════════════════════
      # Dispatch cache MUST run first, then track scripts in parallel
      # ════════════════════════════════════════════════════════════════════

      - name: "Build Dispatch Cache"
        if: ${{ inputs.script == 'ALL' || inputs.script == 'dispatch-cache-only' }}
        run: |
          echo "=== Building dispatch cache ==="
          FORCE_FLAG="${{ inputs.force == true && '--force' || '' }}"
          python scripts/step5_build_dispatch_cache.py $FORCE_FLAG ${{ steps.iso-args.outputs.iso_flags }}

      - name: "Parallel Track Analysis (Export + Analyze)"
        if: ${{ inputs.script == 'ALL' }}
        run: |
          echo "=== Launching track scripts in parallel ==="
          python scripts/step5_export_track_results.py &
          PID_EXPORT=$!
          python scripts/step5_analyze_tracks.py &
          PID_ANALYZE=$!

          FAILED=0
          wait $PID_EXPORT  || { echo "FAILED: Export Track Results"; FAILED=1; }
          wait $PID_ANALYZE || { echo "FAILED: Analyze Tracks"; FAILED=1; }
          if [ "$FAILED" -ne 0 ]; then exit 1; fi
          echo "=== Track analysis completed ==="

      - name: "Export Track Results"
        if: ${{ inputs.script == 'export-tracks-only' }}
        run: python scripts/step5_export_track_results.py

      - name: "Analyze Tracks"
        if: ${{ inputs.script == 'analyze-tracks-only' }}
        run: python scripts/step5_analyze_tracks.py

      - name: Commit and push
        run: |
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/track_results.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 5: ${{ inputs.script }} ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

