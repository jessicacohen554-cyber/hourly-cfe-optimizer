name: "Step 1.2–1.4: Zone Search + Floor-Aware + Fine Grid"

# Unified workflow for Steps 1.2, 1.3, and 1.4:
#   - Zone Search (1.2): Score-band zone search, fine 1% mixes per zone
#   - Floor-Aware (1.3): Floor-aware PFS for 50-70% thresholds (2% step)
#   - Fine-Grid (1.4): Fine-grid PFS for 40-70% thresholds (1% step)
#
# Use the "script" dropdown to run one script, or "All" to run all three
# sequentially per ISO.
#
# Each ISO runs on its own runner in parallel and commits to its own auto/* branch.
# Output: data/step1-pfs/{ISO}_*.parquet

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Which step to run'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Zone Search (1.2)
          - Floor-Aware (1.3)
          - Fine-Grid (1.4)
      iso:
        description: 'ISO region to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds (e.g. "90,95,99"). Zone Search only. Leave blank for all.'
        required: false
        default: ''
        type: string
      zones:
        description: 'Zones to run: A (50-75%), B (75-90%), C (90-99.99%). Zone Search only. Blank for all.'
        required: false
        default: ''
        type: string
      branch:
        description: 'Source branch to checkout code from'
        required: false
        default: 'master'
        type: string

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Build the ISO matrix: single ISO or fan out to all 7
  # ════════════════════════════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      timeout: ${{ steps.set-timeout.outputs.timeout }}
    steps:
      - name: Build ISO matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix={"iso":["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"iso":["${{ inputs.iso }}"]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Set timeout based on script selection
        id: set-timeout
        run: |
          SCRIPT="${{ inputs.script }}"
          case "$SCRIPT" in
            "All"|"Zone Search (1.2)")
              echo "timeout=360" >> "$GITHUB_OUTPUT"
              ;;
            "Fine-Grid (1.4)")
              echo "timeout=180" >> "$GITHUB_OUTPUT"
              ;;
            "Floor-Aware (1.3)")
              echo "timeout=120" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "timeout=360" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ════════════════════════════════════════════════════════════════════════
  # Per-ISO job: runs on its own runner in parallel
  # ════════════════════════════════════════════════════════════════════════
  step1b:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(needs.prepare.outputs.timeout) }}

    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || 'master' }}
        fetch-depth: 0

    - name: Create output branch
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LOWER=$(echo "${{ matrix.iso }}" | tr '[:upper:]' '[:lower:]')
        # Short label for branch name
        SCRIPT="${{ inputs.script }}"
        case "$SCRIPT" in
          "All")                LABEL="step1-2-3-4-all" ;;
          "Zone Search (1.2)")  LABEL="step1-2-zone-search" ;;
          "Floor-Aware (1.3)")  LABEL="step1-3-floor-pfs" ;;
          "Fine-Grid (1.4)")    LABEL="step1-4-fine-grid" ;;
          *)                    LABEL="step1-2-3-4" ;;
        esac
        TARGET_BRANCH="auto/${TIMESTAMP}-${LABEL}-${ISO_LOWER}"
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config http.postBuffer 524288000
        git checkout -b "$TARGET_BRANCH"
        echo "Working on branch: $TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install numpy numba pyarrow pandas
        python -c "from numba import njit; print('Numba OK')"

    - name: Ensure output directory
      run: mkdir -p data/step1-pfs

    # ── Zone Search (1.2) ──────────────────────────────────────────────
    - name: Verify scored database (Zone Search)
      if: inputs.script == 'All' || inputs.script == 'Zone Search (1.2)'
      run: |
        ISO="${{ matrix.iso }}"
        CACHE="data/step1-pfs/${ISO}_coarse_cache.parquet"
        if [ ! -f "$CACHE" ]; then
          echo "ERROR: Missing scored database for $ISO"
          echo "  Expected: $CACHE"
          echo "  Run Step 1.1 (Scored Database) first."
          exit 1
        fi
        SIZE=$(du -h "$CACHE" | cut -f1)
        echo "OK: $ISO scored database ($SIZE)"

    - name: "Check hybrid columns in scored database"
      if: inputs.script == 'All' || inputs.script == 'Zone Search (1.2)'
      run: |
        ISO="${{ matrix.iso }}"
        CACHE="data/step1-pfs/${ISO}_coarse_cache.parquet"
        python3 -c "
        import pyarrow.parquet as pq
        s = pq.read_schema('$CACHE')
        hyb = 'solar_batt4' in s.names
        cols = [c for c in s.names if 'batt' in c]
        print(f'Hybrid mode: {hyb}')
        if cols: print(f'Hybrid columns: {cols}')
        "

    - name: "Compute prior windows (Zone Search)"
      if: inputs.script == 'All' || inputs.script == 'Zone Search (1.2)'
      continue-on-error: true
      run: |
        python scripts/step1_prior_windows.py --iso "${{ matrix.iso }}"

    - name: "Run Zone Search — ${{ matrix.iso }}"
      if: inputs.script == 'All' || inputs.script == 'Zone Search (1.2)'
      run: |
        ISO="${{ matrix.iso }}"
        BASE_ARGS="--iso $ISO"

        THRESHOLDS="${{ inputs.thresholds }}"
        if [ -n "$THRESHOLDS" ]; then
          BASE_ARGS="$BASE_ARGS --thresholds \"$THRESHOLDS\""
          echo "Threshold filter: $THRESHOLDS"
        fi

        REQUESTED_ZONES="${{ inputs.zones }}"
        if [ -n "$REQUESTED_ZONES" ]; then
          ZONE_LIST="$REQUESTED_ZONES"
        else
          ZONE_LIST="A,B,C"
        fi

        # Run each zone separately and commit after each one.
        # This ensures partial results survive if the job times out.
        IFS=',' read -ra ZONES <<< "$ZONE_LIST"
        for ZONE in "${ZONES[@]}"; do
          ZONE=$(echo "$ZONE" | tr -d ' ')
          echo ""
          echo "========================================="
          echo "  Zone $ZONE — $ISO"
          echo "========================================="
          ARGS="$BASE_ARGS --zones \"$ZONE\""
          echo "Command: python scripts/step1_2_zone_search.py $ARGS"
          eval python scripts/step1_2_zone_search.py $ARGS

          # Commit zone results immediately
          git add -f data/step1-pfs/"${ISO}"_*.parquet 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Step 1.2 Zone Search ($ZONE): ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "  Committed zone $ZONE results"
          else
            echo "  No new results for zone $ZONE"
          fi
        done

    - name: "Commit Zone Search results"
      if: (inputs.script == 'All' || inputs.script == 'Zone Search (1.2)') && always()
      run: |
        ISO="${{ matrix.iso }}"
        git add -f data/step1-pfs/"${ISO}"_*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1.2 Zone Search (final): ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

    # Push zone search results before starting 1.3, so they survive
    # even if subsequent steps OOM or timeout.
    - name: "Push Zone Search results"
      if: (inputs.script == 'All' || inputs.script == 'Zone Search (1.2)') && always()
      run: |
        for i in 1 2 3 4; do
          git push origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done

    # ── Floor-Aware PFS (1.3) ─────────────────────────────────────────
    - name: "Run Floor-Aware PFS — ${{ matrix.iso }}"
      if: inputs.script == 'All' || inputs.script == 'Floor-Aware (1.3)'
      timeout-minutes: 90
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Floor-Aware PFS (50-70%)"
        echo "═══════════════════════════════════════════════════════════"
        python scripts/step1_3_floor_aware_pfs.py --iso ${{ matrix.iso }}

    - name: "Commit Floor-Aware results"
      if: (inputs.script == 'All' || inputs.script == 'Floor-Aware (1.3)') && always()
      run: |
        ISO="${{ matrix.iso }}"
        git add -f data/step1-pfs/"${ISO}"_*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1.3 Floor-Aware PFS: ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

    # ── Fine-Grid PFS (1.4) ───────────────────────────────────────────
    - name: "Run Fine-Grid PFS — ${{ matrix.iso }}"
      if: inputs.script == 'All' || inputs.script == 'Fine-Grid (1.4)'
      timeout-minutes: 150
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  ISO: ${{ matrix.iso }}  |  Fine-Grid PFS (40-70%, 1% step)"
        echo "═══════════════════════════════════════════════════════════"
        python scripts/step1_4_fine_grid_pfs.py --iso ${{ matrix.iso }}

    - name: "Commit Fine-Grid results"
      if: (inputs.script == 'All' || inputs.script == 'Fine-Grid (1.4)') && always()
      run: |
        ISO="${{ matrix.iso }}"
        git add -f data/step1-pfs/"${ISO}"_*.parquet 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "Step 1.4 Fine-Grid PFS: ${ISO} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

    # ── Final push ────────────────────────────────────────────────────
    - name: Push results
      if: always()
      run: |
        # Push with retry
        for i in 1 2 3 4; do
          git push -u origin "$TARGET_BRANCH" && break
          echo "Push attempt $i failed, retrying in $((2**i))s..."
          sleep $((2**i))
        done
        echo "Branch: $TARGET_BRANCH"
        echo "Merge this branch into master to bank the PFS results."
