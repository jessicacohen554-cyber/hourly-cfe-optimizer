name: Run Step 1 PFS by ISO/threshold

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run'
        required: true
        default: 'NYISO'
        type: choice
        options:
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      thresholds:
        description: 'Comma-separated thresholds (e.g., "99.5,99.9", "100", "all")'
        required: true
        default: '99.5,99.9'
      max_runtime_minutes:
        description: 'Max runtime in minutes per threshold before checkpointing (0 = no cap)'
        required: false
        default: '330'
      max_mixes_per_run:
        description: 'Max outer-loop mixes per threshold before checkpointing (0 = no cap)'
        required: false
        default: '0'

env:
  BRANCH_PREFIX: step1-pfs

jobs:
  run-pfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repo (from master)
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0

    - name: Generate unique branch name
      run: |
        TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
        ISO_LABEL="${{ github.event.inputs.iso }}"
        echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}" >> "$GITHUB_ENV"
        echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}"

    - name: Create fresh branch from master
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git checkout -b "$TARGET_BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy numba pyarrow pandas

    - name: Create output directories
      run: |
        mkdir -p data/checkpoints_v4
        mkdir -p data/step1-pfs-parquets

    - name: Run Step 1 PFS for each threshold
      run: |
        python scripts/step1_pfs_individual_iso_threshold.py \
          --iso "${{ github.event.inputs.iso }}" \
          --thresholds "${{ github.event.inputs.thresholds }}" \
          --max-runtime-minutes "${{ github.event.inputs.max_runtime_minutes || '330' }}" \
          --max-mixes-per-run "${{ github.event.inputs.max_mixes_per_run || '0' }}"

    - name: Commit and push results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        # Add both completed parquets and checkpoint files (-f to override .gitignore)
        git add -f data/step1-pfs-parquets/ data/checkpoints_v4/

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Step 1 PFS: ${{ github.event.inputs.iso }} thresholds=${{ github.event.inputs.thresholds }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

        # Push fresh branch (retry for transient network errors only)
        MAX_RETRIES=5
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Push attempt $i/$MAX_RETRIES..."
          PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
            echo "Push succeeded on attempt $i"
            break
          }
          echo "$PUSH_OUTPUT"

          # Fail immediately on large-file rejection (not recoverable by retry)
          if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
            echo "ERROR: Push rejected due to large files (GH001). Not retryable."
            echo "Check file sizes — GitHub limit is 100 MB per file."
            exit 1
          fi

          if [ "$i" -eq "$MAX_RETRIES" ]; then
            echo "ERROR: Push failed after $MAX_RETRIES attempts"
            exit 1
          fi

          BACKOFF=$((2 ** i))
          echo "Push failed (transient). Retrying in ${BACKOFF}s..."
          sleep "$BACKOFF"
        done

    - name: Create pull request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PR_BODY="## Summary"$'\n'"- Step 1 PFS results for **${{ github.event.inputs.iso }}** at thresholds **${{ github.event.inputs.thresholds }}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
        gh pr create \
          --title "Step 1 PFS: ${{ github.event.inputs.iso }} thresholds=${{ github.event.inputs.thresholds }}" \
          --body "$PR_BODY" \
          --base master \
          --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
