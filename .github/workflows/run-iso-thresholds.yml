name: Run ISO Threshold Script

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (e.g., NYISO, CAISO, PJM, ERCOT, NEISO)'
        required: true
        default: 'NYISO'
      threshold:
        description: 'Threshold percentage to run (e.g., 100, 95, 92.5)'
        required: true
        default: '100'

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyarrow numba pandas

    - name: Create checkpoint directory
      run: mkdir -p data/checkpoints

    - name: Run script
      run: |
        python complete_iso_thresholds.py --iso "${{ github.event.inputs.iso }}" --threshold "${{ github.event.inputs.threshold }}"

    - name: Commit results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        BRANCH="iso-threshold-${{ github.event.inputs.iso }}-${{ github.event.inputs.threshold }}"
        git fetch origin "$BRANCH" || true

        if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
          git checkout -B "$BRANCH" "origin/$BRANCH"
        else
          git checkout -B "$BRANCH"
        fi

        git add data/checkpoints/

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update ${{ github.event.inputs.iso }} ISO threshold ${{ github.event.inputs.threshold }}"
        fi

        git push origin "$BRANCH"
