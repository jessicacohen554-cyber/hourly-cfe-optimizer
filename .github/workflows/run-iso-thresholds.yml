name: Run Step 1 PFS by ISO/threshold

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (e.g., NYISO, CAISO, PJM, ERCOT, NEISO)'
        required: true
        default: 'NYISO'
      threshold:
        description: 'Threshold percentage to run (e.g., 100, 95, 92.5)'
        required: true
        default: '100'

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Ensure target branch exists locally
      run: |
        BRANCH="iso-threshold-${{ github.event.inputs.iso }}-${{ github.event.inputs.threshold }}"
        git fetch origin "$BRANCH" || true
        git checkout -B "$BRANCH" "origin/$BRANCH" || git checkout -B "$BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyarrow numba pandas

    - name: Create checkpoint directory
      run: mkdir -p data/checkpoints data/checkpoints_v4

    - name: Run script
      run: |
        python scripts/step1_pfs_generator.py "${{ github.event.inputs.iso }}" --threshold "${{ github.event.inputs.threshold }}"

    - name: Commit results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        BRANCH="iso-threshold-${{ github.event.inputs.iso }}-${{ github.event.inputs.threshold }}"

        git add data/checkpoints/ data/checkpoints_v4/ dashboard/
        git add data/physics_cache_v4_*.parquet || true

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update ${{ github.event.inputs.iso }} ISO threshold ${{ github.event.inputs.threshold }}"
        fi

        git push origin "$BRANCH"
