name: Run Step 1 PFS by ISO/threshold

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (e.g., NYISO, CAISO, PJM, ERCOT, NEISO)'
        required: true
        default: 'NYISO'
      thresholds:
        description: 'Comma-separated thresholds (e.g., "100", "95,92.5,90", "all")'
        required: true
        default: '100'
      max_runtime_minutes:
        description: 'Max runtime in minutes per threshold before checkpointing (0 = no cap)'
        required: false
        default: '330'
      max_mixes_per_run:
        description: 'Max outer-loop mixes per threshold before checkpointing (0 = no cap)'
        required: false
        default: '0'

env:
  TARGET_BRANCH: step1-PFS-ISO-parquets

jobs:
  run-pfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Switch to target branch
      run: |
        git fetch origin "$TARGET_BRANCH" || true
        if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
        else
          git checkout -B "$TARGET_BRANCH"
        fi

    - name: Merge latest from master
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git fetch origin master
        git merge origin/master --no-edit || {
          echo "ERROR: Merge conflict with master. Resolve manually."
          exit 1
        }

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy numba pyarrow

    - name: Create output directories
      run: |
        mkdir -p data/checkpoints_v4
        mkdir -p data/step1-pfs-parquets

    - name: Run Step 1 PFS for each threshold
      run: |
        python scripts/step1_pfs_individual_iso_threshold.py \
          --iso "${{ github.event.inputs.iso }}" \
          --thresholds "${{ github.event.inputs.thresholds }}" \
          --max-runtime-minutes "${{ github.event.inputs.max_runtime_minutes || '330' }}" \
          --max-mixes-per-run "${{ github.event.inputs.max_mixes_per_run || '0' }}"

    - name: Commit and push results (with retry for concurrent runs)
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        # Add both completed parquets and checkpoint files (-f to override .gitignore)
        git add -f data/step1-pfs-parquets/ data/checkpoints_v4/

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Step 1 PFS: ${{ github.event.inputs.iso }} thresholds=${{ github.event.inputs.thresholds }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

        # Retry push with pull-rebase to handle concurrent ISO jobs pushing
        MAX_RETRIES=5
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Push attempt $i/$MAX_RETRIES..."
          PUSH_OUTPUT=$(git push origin "$TARGET_BRANCH" 2>&1) && {
            echo "Push succeeded on attempt $i"
            break
          }
          echo "$PUSH_OUTPUT"

          # Fail immediately on large-file rejection (not recoverable by retry)
          if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
            echo "ERROR: Push rejected due to large files (GH001). Not retryable."
            echo "Check file sizes — GitHub limit is 100 MB per file."
            exit 1
          fi

          if [ "$i" -eq "$MAX_RETRIES" ]; then
            echo "ERROR: Push failed after $MAX_RETRIES attempts"
            exit 1
          fi

          BACKOFF=$((2 ** i))
          echo "Push rejected — another job pushed first. Retrying in ${BACKOFF}s..."
          sleep "$BACKOFF"

          git pull --rebase origin "$TARGET_BRANCH"
        done

    - name: Create or update pull request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
        if [ -n "$EXISTING_PR" ]; then
          echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
        else
          PR_BODY="## Summary"$'\n'"- Step 1 PFS results for **${{ github.event.inputs.iso }}** at thresholds **${{ github.event.inputs.thresholds }}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 1 PFS: ${{ github.event.inputs.iso }} thresholds=${{ github.event.inputs.thresholds }}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
        fi
