name: Run Step 1 PFS by ISO/threshold

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run on and push results to'
        required: true
        default: 'work'
      iso:
        description: 'ISO to run (e.g., NYISO, CAISO, PJM, ERCOT, NEISO)'
        required: true
        default: 'NYISO'
      threshold:
        description: 'Threshold percentage to run (e.g., 100, 95, 92.5)'
        required: true
        default: '100'

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Ensure target branch exists locally
      run: |
        BRANCH="${{ github.event.inputs.branch }}"
        git fetch origin "$BRANCH" || true
        git checkout -B "$BRANCH" "origin/$BRANCH" || git checkout -B "$BRANCH"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyarrow numba pandas

    - name: Create output directories
      run: |
        mkdir -p data/checkpoints_v4
        mkdir -p data/step1_raw_pfs_parquets

    - name: Run script
      run: |
        python "scripts/step 1 PFS - individual ISO threshold selector.py" \
          --iso "${{ github.event.inputs.iso }}" \
          --threshold "${{ github.event.inputs.threshold }}" \
          --max-runtime-minutes 0 \
          --max-mixes-per-run 0

    - name: Commit results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        BRANCH="${{ github.event.inputs.branch }}"

        git add data/checkpoints_v4/ data/step1_raw_pfs_parquets/

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update ${{ github.event.inputs.iso }} ISO threshold ${{ github.event.inputs.threshold }} parquet outputs"
        fi

        git push origin "$BRANCH"
