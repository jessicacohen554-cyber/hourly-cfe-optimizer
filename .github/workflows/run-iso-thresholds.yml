name: Run Step 1 PFS by ISO/threshold

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to run (e.g., NYISO, CAISO, PJM, ERCOT, NEISO)'
        required: true
        default: 'NYISO'
      threshold:
        description: 'Threshold percentage to run (e.g., 100, 95, 92.5)'
        required: true
        default: '100'
      max_runtime_minutes:
        description: 'Max runtime in minutes before checkpointing (0 = no cap)'
        required: false
        default: '330'
      max_mixes_per_run:
        description: 'Max outer-loop mixes before checkpointing (0 = no cap)'
        required: false
        default: '0'

jobs:
  run-pfs:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        ref: step1-PFS-ISO-parquets

    - name: Ensure target branch exists locally
      run: |
        git fetch origin step1-PFS-ISO-parquets || true
        git checkout -B step1-PFS-ISO-parquets origin/step1-PFS-ISO-parquets || git checkout -B step1-PFS-ISO-parquets

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy numba pyarrow pandas

    - name: Create output directories
      run: |
        mkdir -p data/checkpoints_v4
        mkdir -p data/step1_raw_pfs_parquets

    - name: Run Step 1 PFS individual ISO/threshold
      run: |
        python scripts/step1_pfs_individual_iso_threshold.py \
          --iso "${{ github.event.inputs.iso }}" \
          --threshold "${{ github.event.inputs.threshold }}" \
          --max-runtime-minutes "${{ github.event.inputs.max_runtime_minutes || '330' }}" \
          --max-mixes-per-run "${{ github.event.inputs.max_mixes_per_run || '0' }}"

    - name: Commit results
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        # Add both completed parquets and checkpoint files
        git add data/step1_raw_pfs_parquets/ data/checkpoints_v4/

        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Step 1 PFS: ${{ github.event.inputs.iso }} ${{ github.event.inputs.threshold }}% — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        fi

        git push origin step1-PFS-ISO-parquets
