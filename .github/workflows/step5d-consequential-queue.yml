name: "Step 5D: Consequential Deployment Queue"

# Runs step5d_deployment_queue.py — cross-regional deployment path under
# consequential accounting.  Uses dispatch cache for hourly emission
# accounting.
#
# iso=ALL fans out parallel matrix jobs, then merges into one branch + PR.
# Output: data/step5-post-processing/

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process (ALL = parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step5d-consequential-queue

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Verify dispatch cache exists
        run: |
          if [ -d "data/step4-dispatch-cache" ] && ls data/step4-dispatch-cache/*.npz >/dev/null 2>&1; then
            echo "Dispatch cache found"
          else
            echo "WARNING: No dispatch cache found. Script will compute dispatch live (slower)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing

      - name: "Consequential Queue — ${{ matrix.iso }}"
        run: python scripts/step5d_deployment_queue.py --iso ${{ matrix.iso }}

      - name: Scope output to current ISO only
        run: |
          find data/step5-post-processing/ -name "*.parquet" -o -name "*.json" | grep -v "${{ matrix.iso }}" | xargs rm -f 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: consequential-queue-${{ matrix.iso }}
          path: |
            data/step5-post-processing/
            dashboard/js/consequential-queue-data.js
          retention-days: 1

  merge:
    needs: [prepare, process]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      workflows: write   # needed when source branch has workflow file changes


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: consequential-queue-*
          path: ./artifact-tmp/
          merge-multiple: true

      - name: Place artifacts
        run: |
          cp -rf artifact-tmp/data/step5-post-processing/* data/step5-post-processing/ 2>/dev/null || true
          cp -f artifact-tmp/dashboard/js/consequential-queue-data.js dashboard/js/ 2>/dev/null || true

      - name: Batched commit and push (per-ISO)
        run: |
          git config http.postBuffer 524288000

          push_with_retry() {
            local label="$1"
            local MAX_RETRIES=4
            for i in $(seq 1 $MAX_RETRIES); do
              echo "  Push attempt $i/$MAX_RETRIES for ${label}..."
              git push -u origin "$TARGET_BRANCH" 2>&1 && return 0
              if [ "$i" -eq "$MAX_RETRIES" ]; then
                echo "  ERROR: Push failed for ${label} after $MAX_RETRIES attempts"
                return 1
              fi
              BACKOFF=$((2 ** i))
              echo "  Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
            done
          }

          PUSHED=false

          if [ "${{ inputs.iso }}" = "ALL" ]; then
            ISOS="CAISO ERCOT PJM NYISO NEISO MISO SPP"
          else
            ISOS="${{ inputs.iso }}"
          fi

          for iso in $ISOS; do
            echo "--- Batching commit for $iso ---"
            FILES=$(find data/step5-post-processing/ -name "*${iso}*" -type f 2>/dev/null || true)
            if [ -z "$FILES" ]; then
              echo "  No files for $iso — skipping"
              continue
            fi
            git add -f $FILES
            if git diff --cached --quiet; then
              echo "  No changes for $iso — skipping"
              continue
            fi
            BATCH_MB=$(du -cm $FILES | tail -1 | cut -f1)
            echo "  Staging ~${BATCH_MB} MB for $iso"
            git commit -m "Step 5D Consequential Queue: ${iso} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if push_with_retry "$iso"; then
              PUSHED=true
            else
              echo "  Per-ISO push failed for $iso — falling back to per-file"
              git reset HEAD~1
              for f in $FILES; do
                FNAME=$(basename "$f")
                git add -f "$f"
                if git diff --cached --quiet; then continue; fi
                git commit -m "Step 5D Consequential Queue: ${iso} ${FNAME} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if push_with_retry "$FNAME"; then PUSHED=true; else git reset HEAD~1; fi
              done
            fi
          done

          # Remaining dashboard files
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/consequential-queue-data.js 2>/dev/null || true
          if ! git diff --cached --quiet; then
            echo "--- Staging remaining files + dashboard data ---"
            git commit -m "Step 5D Consequential Queue: dashboard data — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if push_with_retry "dashboard-data"; then PUSHED=true; else git reset HEAD~1; fi
          fi

          if [ "$PUSHED" = "false" ]; then
            echo "No changes were pushed"
          fi
