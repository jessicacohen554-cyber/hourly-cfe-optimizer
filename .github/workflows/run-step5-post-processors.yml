name: Run Step 5 & 6 Post-Processors

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process (CAISO, ERCOT, PJM, NYISO, NEISO — or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      scripts:
        description: 'Which post-processors to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - step5_dispatch_cache
          - step5_eac_scarcity
          - step5_export_tracks
          - step5_analyze_tracks
          - step6_co2
          - step6_mac
          - step6_lmp
          - step6_compressed_day
          - step6_consequential
          - step6_scenario_comparison

env:
  BRANCH_PREFIX: step5-6-pp

jobs:
  run-post-processors:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}-${SCRIPTS_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}-${SCRIPTS_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify step-4 or step-3 parquets exist
        run: |
          HAS_DATA=false
          if [ -d "data/step4-gas-ccs-parquets" ] && ls data/step4-gas-ccs-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-4 Gas CCS parquets found:"
            ls -lh data/step4-gas-ccs-parquets/
            HAS_DATA=true
          fi
          if [ -d "data/step3-cost-opt-parquets" ] && ls data/step3-cost-opt-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-3 CO parquets found:"
            ls -lh data/step3-cost-opt-parquets/
            HAS_DATA=true
          fi
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: Neither step-4 nor step-3 parquets found."
            echo "Run Step 3 or Step 4 workflow first and merge results to master."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step4-gas-ccs-parquets
          mkdir -p data/step5-post-processing/lmp
          mkdir -p data/step5-post-processing/dispatch_cache
          mkdir -p dashboard/js

      # ════════════════════════════════════════════════════════════════════
      # STEP 5: Dispatch cache build + cache-independent scripts
      # ════════════════════════════════════════════════════════════════════

      - name: "Step 5: Build Dispatch Cache"
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'step5_dispatch_cache' }}
        run: |
          echo "=== Step 5: Building dispatch cache ==="
          python scripts/step5_build_dispatch_cache.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: "Step 5: Run cache-independent scripts"
        if: ${{ github.event.inputs.scripts == 'ALL' }}
        run: |
          echo "=== Step 5: Export Track Results ==="
          python scripts/step5_export_track_results.py &
          PID_TRACKS=$!

          echo "=== Step 5: EAC Scarcity ==="
          python scripts/step5_compute_eac_scarcity.py &
          PID_EAC=$!

          FAIL=0
          wait $PID_TRACKS || { echo "ERROR: Export Track Results failed"; FAIL=1; }
          wait $PID_EAC    || { echo "ERROR: EAC Scarcity failed"; FAIL=1; }

          if [ "$FAIL" -ne 0 ]; then
            echo "One or more Step 5 scripts failed"
            exit 1
          fi

      # Individual Step 5 script runs
      - name: "Step 5: EAC Scarcity (individual)"
        if: ${{ github.event.inputs.scripts == 'step5_eac_scarcity' }}
        run: python scripts/step5_compute_eac_scarcity.py

      - name: "Step 5: Export Track Results (individual)"
        if: ${{ github.event.inputs.scripts == 'step5_export_tracks' }}
        run: python scripts/step5_export_track_results.py

      - name: "Step 5: Analyze Tracks (individual)"
        if: ${{ github.event.inputs.scripts == 'step5_analyze_tracks' }}
        run: python scripts/step5_analyze_tracks.py

      # ════════════════════════════════════════════════════════════════════
      # STEP 6: Dispatch-cache-dependent scripts
      # ════════════════════════════════════════════════════════════════════

      - name: "Step 6: Run ALL dispatch-dependent post-processors"
        if: ${{ github.event.inputs.scripts == 'ALL' }}
        run: |
          echo "=== Step 6: Starting LMP (background) ==="
          python scripts/step6_compute_lmp_prices.py ${{ steps.iso-args.outputs.iso_flags }} &
          PID_LMP=$!

          echo "=== Step 6: Starting Compressed Day (background) ==="
          python scripts/step6_compressed_day.py &
          PID_CD=$!

          echo "=== Step 6: Starting Consequential Queue (background) ==="
          python scripts/step6_consequential_queue.py &
          PID_CQ=$!

          echo "=== Step 6: Starting Scenario Comparison (background) ==="
          python scripts/step6_scenario_comparison.py &
          PID_SC=$!

          echo "=== Step 6: Starting CO₂ Recomputation (foreground — MAC depends on it) ==="
          python scripts/step6_recompute_co2.py ${{ steps.iso-args.outputs.iso_flags }}

          echo "=== Step 6: CO₂ done — starting MAC Statistics (background) ==="
          python scripts/step6_compute_mac_stats.py &
          PID_MAC=$!

          FAIL=0
          wait $PID_LMP  || { echo "ERROR: LMP failed"; FAIL=1; }
          wait $PID_CD   || { echo "ERROR: Compressed Day failed"; FAIL=1; }
          wait $PID_CQ   || { echo "ERROR: Consequential Queue failed"; FAIL=1; }
          wait $PID_SC   || { echo "ERROR: Scenario Comparison failed"; FAIL=1; }
          wait $PID_MAC  || { echo "ERROR: MAC Statistics failed"; FAIL=1; }

          if [ "$FAIL" -ne 0 ]; then
            echo "One or more Step 6 post-processors failed"
            exit 1
          fi
          echo "=== All Step 6 post-processors completed ==="

      # Individual Step 6 script runs
      - name: "Step 6: CO₂ Recomputation (individual)"
        if: ${{ github.event.inputs.scripts == 'step6_co2' }}
        run: python scripts/step6_recompute_co2.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: "Step 6: MAC Statistics (individual)"
        if: ${{ github.event.inputs.scripts == 'step6_mac' }}
        run: python scripts/step6_compute_mac_stats.py

      - name: "Step 6: LMP Prices (individual)"
        if: ${{ github.event.inputs.scripts == 'step6_lmp' }}
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            python scripts/step6_compute_lmp_prices.py
          else
            python scripts/step6_compute_lmp_prices.py --iso "$INPUT_ISO"
          fi

      - name: "Step 6: Compressed Day (individual)"
        if: ${{ github.event.inputs.scripts == 'step6_compressed_day' }}
        run: python scripts/step6_compressed_day.py

      - name: "Step 6: Consequential Queue (individual)"
        if: ${{ github.event.inputs.scripts == 'step6_consequential' }}
        run: python scripts/step6_consequential_queue.py

      - name: "Step 6: Scenario Comparison (individual)"
        if: ${{ github.event.inputs.scripts == 'step6_scenario_comparison' }}
        run: python scripts/step6_scenario_comparison.py

      # ════════════════════════════════════════════════════════════════════
      # COMMIT & PR
      # ════════════════════════════════════════════════════════════════════

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage all possible outputs
          git add -f data/step4-gas-ccs-parquets/ 2>/dev/null || true
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/mac-stats-data.js 2>/dev/null || true
          git add -f dashboard/js/consequential-queue-data.js 2>/dev/null || true
          git add -f dashboard/js/scenario-comparison-data.js 2>/dev/null || true
          git add -f dashboard/compressed_day_profiles.json 2>/dev/null || true
          git add -f dashboard/track_results.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          ISO_LABEL="${{ github.event.inputs.iso }}"
          git commit -m "Step 5/6 Post-Processing: ${SCRIPTS_LABEL} ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## Summary"$'\n'"- Post-processing (**${{ github.event.inputs.scripts }}**) for **${{ github.event.inputs.iso }}**"$'\n'"- Step 5: dispatch cache + independent scripts"$'\n'"- Step 6: dispatch-dependent analysis"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 5/6 Post-Processing: ${{ github.event.inputs.scripts }} ${{ github.event.inputs.iso }}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
