name: Run Step 5 Post-Processors

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process (CAISO, ERCOT, PJM, NYISO, NEISO — or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      scripts:
        description: 'Which post-processors to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - co2
          - mac
          - lmp
          - compressed_day

env:
  TARGET_BRANCH: step5-post-processing

jobs:
  run-step5:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch step-4 data (preferred) or step-3 fallback
        run: |
          # Try step-4 first
          git fetch origin step4-gas-CCS-parquets || true
          if git rev-parse --verify "origin/step4-gas-CCS-parquets" >/dev/null 2>&1; then
            git checkout origin/step4-gas-CCS-parquets -- data/step4-gas-CCS/ || true
            echo "Step-4 Gas CCS parquets restored:"
            ls -lh data/step4-gas-CCS/ 2>/dev/null || echo "  (empty)"
          fi

          # Also fetch step-3 as fallback
          git fetch origin step3-CO-ISO-parquets || true
          if git rev-parse --verify "origin/step3-CO-ISO-parquets" >/dev/null 2>&1; then
            git checkout origin/step3-CO-ISO-parquets -- data/step-3-CO-ISO-parquets/ || true
            echo "Step-3 CO parquets restored:"
            ls -lh data/step-3-CO-ISO-parquets/ 2>/dev/null || echo "  (empty)"
          fi

          # Verify at least one source exists
          if [ ! -d "data/step4-gas-CCS" ] && [ ! -d "data/step-3-CO-ISO-parquets" ]; then
            echo "ERROR: Neither step-4 nor step-3 parquets available."
            echo "Run Step 3 or Step 4 workflow first."
            exit 1
          fi

      - name: Switch to target branch
        run: |
          git fetch origin "$TARGET_BRANCH" || true
          if git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            # Re-apply parquet data (may have been overwritten by branch switch)
            git checkout origin/step4-gas-CCS-parquets -- data/step4-gas-CCS/ 2>/dev/null || true
            git checkout origin/step3-CO-ISO-parquets -- data/step-3-CO-ISO-parquets/ 2>/dev/null || true
          else
            git checkout -B "$TARGET_BRANCH"
          fi

      - name: Merge latest from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin master
          git merge origin/master --no-edit || {
            echo "ERROR: Merge conflict with master. Resolve manually."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step4-gas-CCS
          mkdir -p data/lmp
          mkdir -p dashboard/js

      # ── Step 5a: CO₂ Recomputation (must run first — enriches parquets) ──
      - name: Run CO₂ Recomputation
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'co2' }}
        run: |
          python scripts/recompute_co2.py ${{ steps.iso-args.outputs.iso_flags }}

      # ── Step 5b: MAC Statistics (depends on CO₂ data) ──
      - name: Run MAC Statistics
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'mac' }}
        run: |
          python scripts/compute_mac_stats.py

      # ── Step 5c: LMP Price Calculation ──
      - name: Run LMP Price Calculation
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'lmp' }}
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            python scripts/compute_lmp_prices.py
          else
            python scripts/compute_lmp_prices.py --iso "$INPUT_ISO"
          fi

      # ── Step 5d: Compressed Day Profiles ──
      - name: Run Compressed Day Profiles
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'compressed_day' }}
        run: |
          python scripts/step5_PP1_compressed_day.py

      - name: Commit Step 5 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage all possible outputs
          git add -f data/step4-gas-CCS/ 2>/dev/null || true
          git add -f data/lmp/ 2>/dev/null || true
          git add -f data/mac_stats.json 2>/dev/null || true
          git add -f dashboard/js/mac-stats-data.js 2>/dev/null || true
          git add -f dashboard/compressed_day_profiles.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
            ISO_LABEL="${{ github.event.inputs.iso }}"
            git commit -m "Step 5 Post-Processing: ${SCRIPTS_LABEL} ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          git push origin "$TARGET_BRANCH"

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --base master --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already open for ${TARGET_BRANCH} → master"
          else
            PR_BODY="## Summary"$'\n'"- Step 5 post-processing (**${{ github.event.inputs.scripts }}**) for **${{ github.event.inputs.iso }}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
            gh pr create \
              --title "Step 5 Post-Processing: ${{ github.event.inputs.scripts }} ${{ github.event.inputs.iso }}" \
              --body "$PR_BODY" \
              --base master \
              --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
          fi
