name: Run Step 5 Post-Processors

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process (CAISO, ERCOT, PJM, NYISO, NEISO — or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      scripts:
        description: 'Which post-processors to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - co2
          - mac
          - lmp
          - compressed_day

env:
  BRANCH_PREFIX: step5-pp

jobs:
  run-step5:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          echo "TARGET_BRANCH=auto/${BRANCH_PREFIX}-${ISO_LABEL}-${SCRIPTS_LABEL}-${TIMESTAMP}" >> "$GITHUB_ENV"
          echo "Branch: auto/${BRANCH_PREFIX}-${ISO_LABEL}-${SCRIPTS_LABEL}-${TIMESTAMP}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify step-4 or step-3 parquets exist
        run: |
          HAS_DATA=false
          if [ -d "data/step4-gas-ccs-parquets" ] && ls data/step4-gas-ccs-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-4 Gas CCS parquets found:"
            ls -lh data/step4-gas-ccs-parquets/
            HAS_DATA=true
          fi
          if [ -d "data/step3-cost-opt-parquets" ] && ls data/step3-cost-opt-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-3 CO parquets found:"
            ls -lh data/step3-cost-opt-parquets/
            HAS_DATA=true
          fi
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: Neither step-4 nor step-3 parquets found."
            echo "Run Step 3 or Step 4 workflow first and merge results to master."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step4-gas-ccs-parquets
          mkdir -p data/step5-post-processing/lmp
          mkdir -p dashboard/js

      # ── Step 5a: CO₂ Recomputation (must run first — enriches parquets) ──
      - name: Run CO₂ Recomputation
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'co2' }}
        run: |
          python scripts/step5_PP4_recompute_co2.py ${{ steps.iso-args.outputs.iso_flags }}

      # ── Step 5b: MAC Statistics (depends on CO₂ data) ──
      - name: Run MAC Statistics
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'mac' }}
        run: |
          python scripts/step5_PP5_compute_mac_stats.py

      # ── Step 5c: LMP Price Calculation ──
      - name: Run LMP Price Calculation
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'lmp' }}
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            python scripts/step5_PP6_compute_lmp_prices.py
          else
            python scripts/step5_PP6_compute_lmp_prices.py --iso "$INPUT_ISO"
          fi

      # ── Step 5d: Compressed Day Profiles ──
      - name: Run Compressed Day Profiles
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'compressed_day' }}
        run: |
          python scripts/step5_PP1_compressed_day.py

      - name: Commit and push Step 5 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage all possible outputs
          git add -f data/step4-gas-ccs-parquets/ 2>/dev/null || true
          git add -f data/step5-post-processing/lmp/ 2>/dev/null || true
          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/mac-stats-data.js 2>/dev/null || true
          git add -f dashboard/compressed_day_profiles.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          ISO_LABEL="${{ github.event.inputs.iso }}"
          git commit -m "Step 5 Post-Processing: ${SCRIPTS_LABEL} ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push fresh branch (retry for transient network errors only)
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            # Fail immediately on large-file rejection (not recoverable by retry)
            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              echo "Check file sizes — GitHub limit is 100 MB per file."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## Summary"$'\n'"- Step 5 post-processing (**${{ github.event.inputs.scripts }}**) for **${{ github.event.inputs.iso }}**"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 5 Post-Processing: ${{ github.event.inputs.scripts }} ${{ github.event.inputs.iso }}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
