name: "Step 6.5: Supplemental Analytics"

# Runs supplemental dispatch-cache-dependent analytics that don't belong
# to a specific dashboard page:
#   - step6_compressed_day.py — 24-hour representative day profiles
#   - step6_consequential_queue.py — cross-regional deployment path
#
# These scripts use dispatch cache but are independent of each other.
# iso=ALL fans out parallel matrix jobs, then merges into one branch + PR.
# Output: data/step5-post-processing/

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO region to process (ALL = parallel)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      script:
        description: 'Which analytics to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - compressed-day
          - consequential-queue
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'master'
        type: string

env:
  BRANCH_PREFIX: step6-5-supplemental

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.iso }}" = "ALL" ]; then
            echo 'matrix=["CAISO","ERCOT","PJM","NYISO","NEISO","MISO","SPP"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.iso }}"]' >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        iso: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}

      - name: Verify dispatch cache exists
        run: |
          if [ -d "data/step5-post-processing/dispatch_cache" ] && ls data/step5-post-processing/dispatch_cache/*.npz >/dev/null 2>&1; then
            echo "Dispatch cache found"
          else
            echo "WARNING: No dispatch cache found. Scripts will compute dispatch live (slower)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy numba pyarrow pandas scipy

      - name: Ensure output directories
        run: mkdir -p data/step5-post-processing

      - name: "Run analytics (parallel) — ${{ matrix.iso }}"
        if: ${{ inputs.script == 'ALL' }}
        run: |
          python scripts/step6_compressed_day.py --iso ${{ matrix.iso }} &
          PID_CD=$!
          python scripts/step6_consequential_queue.py --iso ${{ matrix.iso }} &
          PID_CQ=$!

          FAILED=0
          wait $PID_CD || { echo "FAILED: Compressed Day"; FAILED=1; }
          wait $PID_CQ || { echo "FAILED: Consequential Queue"; FAILED=1; }
          if [ "$FAILED" -ne 0 ]; then exit 1; fi

      - name: "Compressed Day — ${{ matrix.iso }}"
        if: ${{ inputs.script == 'compressed-day' }}
        run: python scripts/step6_compressed_day.py --iso ${{ matrix.iso }}

      - name: "Consequential Queue — ${{ matrix.iso }}"
        if: ${{ inputs.script == 'consequential-queue' }}
        run: python scripts/step6_consequential_queue.py --iso ${{ matrix.iso }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-${{ matrix.iso }}
          path: |
            data/step5-post-processing/
            dashboard/compressed_day_profiles.json
            dashboard/js/consequential-queue-data.js
          retention-days: 1

  merge:
    needs: [prepare, process]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'master' }}
          fetch-depth: 0

      - name: Create output branch
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          TARGET_BRANCH="auto/${TIMESTAMP}-${BRANCH_PREFIX}-${{ inputs.script }}-${{ inputs.iso }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supplemental-*
          path: ./artifact-tmp/
          merge-multiple: true

      - name: Place artifacts
        run: |
          cp -rf artifact-tmp/data/step5-post-processing/* data/step5-post-processing/ 2>/dev/null || true
          cp -f artifact-tmp/dashboard/compressed_day_profiles.json dashboard/ 2>/dev/null || true
          cp -f artifact-tmp/dashboard/js/consequential-queue-data.js dashboard/js/ 2>/dev/null || true

      - name: Commit and push
        run: |
          git config http.postBuffer 524288000

          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/compressed_day_profiles.json 2>/dev/null || true
          git add -f dashboard/js/consequential-queue-data.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Step 6.5 Supplemental: ${{ inputs.script }} ${{ inputs.iso }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            git push -u origin "$TARGET_BRANCH" 2>&1 && break
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            BACKOFF=$((2 ** i))
            echo "Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

