name: "Step 6: Analytics & Post-Processing"

on:
  workflow_dispatch:
    inputs:
      iso:
        description: 'ISO to process (CAISO, ERCOT, PJM, NYISO, NEISO — or ALL)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - CAISO
          - ERCOT
          - PJM
          - NYISO
          - NEISO
          - MISO
          - SPP
      scripts:
        description: 'Which Step 6 scripts to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - step6_co2
          - step6_mac
          - step6_lmp
          - step6_compressed_day
          - step6_consequential
          - step6_scenario_comparison
          - step6_optimal_targets

env:
  BRANCH_PREFIX: step6-pp

jobs:
  run-step6:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo (from master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Generate unique branch name
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          ISO_LABEL="${{ github.event.inputs.iso }}"
          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          echo "TARGET_BRANCH=auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}-${SCRIPTS_LABEL}" >> "$GITHUB_ENV"
          echo "Branch: auto/${TIMESTAMP}-${BRANCH_PREFIX}-${ISO_LABEL}-${SCRIPTS_LABEL}"

      - name: Create fresh branch from master
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b "$TARGET_BRANCH"

      - name: Verify upstream data exists
        run: |
          HAS_DATA=false
          if [ -d "data/step4-gas-ccs-parquets" ] && ls data/step4-gas-ccs-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-4 Gas CCS parquets found:"
            ls -lh data/step4-gas-ccs-parquets/
            HAS_DATA=true
          fi
          if [ -d "data/step3-cost-opt-parquets" ] && ls data/step3-cost-opt-parquets/*.parquet >/dev/null 2>&1; then
            echo "Step-3 CO parquets found:"
            ls -lh data/step3-cost-opt-parquets/
            HAS_DATA=true
          fi
          if [ "$HAS_DATA" = "false" ]; then
            echo "ERROR: Neither step-4 nor step-3 parquets found."
            echo "Run Step 3 or Step 4 workflow first and merge results to master."
            exit 1
          fi

          # Check dispatch cache
          if [ -d "data/step5-post-processing/dispatch_cache" ] && ls data/step5-post-processing/dispatch_cache/*.npz >/dev/null 2>&1; then
            echo "Dispatch cache found:"
            ls -lh data/step5-post-processing/dispatch_cache/
          else
            echo "WARNING: No dispatch cache found. Scripts will compute dispatch live (slower)."
            echo "Consider running Step 5 dispatch cache first."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python runtime
        run: echo "PYTHONUNBUFFERED=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy numba pyarrow pandas scipy

      - name: Build ISO arguments
        id: iso-args
        run: |
          INPUT_ISO="${{ github.event.inputs.iso }}"
          if [ "$INPUT_ISO" = "ALL" ]; then
            echo "iso_flags=" >> "$GITHUB_OUTPUT"
          else
            echo "iso_flags=--iso $INPUT_ISO" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure output directories exist
        run: |
          mkdir -p data/step5-post-processing/lmp
          mkdir -p dashboard/js

      # ════════════════════════════════════════════════════════════════════
      # STEP 6: Dispatch-cache-dependent scripts
      #         CO₂ runs first (MAC depends on CO₂ output).
      #         Remaining 6 scripts run in parallel — no cross-dependencies.
      # ════════════════════════════════════════════════════════════════════

      - name: "Step 6: Compute CO₂"
        if: ${{ github.event.inputs.scripts == 'ALL' || github.event.inputs.scripts == 'step6_co2' }}
        run: |
          echo "=== Step 6: Compute CO₂ ==="
          python scripts/step6_recompute_co2.py ${{ steps.iso-args.outputs.iso_flags }}

      # ── When running ALL: launch remaining 6 scripts in parallel ──
      - name: "Step 6: Parallel Post-Processing (MAC, LMP, Compressed Day, Consequential, Scenarios, Optimal Targets)"
        if: ${{ github.event.inputs.scripts == 'ALL' }}
        run: |
          echo "=== Launching 6 post-processors in parallel ==="

          python scripts/step6_compute_mac_stats.py &
          PID_MAC=$!
          echo "  MAC Statistics started (PID: $PID_MAC)"

          python scripts/step6_compute_lmp_prices.py ${{ steps.iso-args.outputs.iso_flags }} &
          PID_LMP=$!
          echo "  LMP Prices started (PID: $PID_LMP)"

          python scripts/step6_compressed_day.py &
          PID_CD=$!
          echo "  Compressed Day started (PID: $PID_CD)"

          python scripts/step6_consequential_queue.py &
          PID_CQ=$!
          echo "  Consequential Queue started (PID: $PID_CQ)"

          python scripts/step6_scenario_comparison.py &
          PID_SC=$!
          echo "  Scenario Comparison started (PID: $PID_SC)"

          python scripts/step6_compute_optimal_targets.py &
          PID_OT=$!
          echo "  Optimal Targets started (PID: $PID_OT)"

          echo "=== Waiting for all 6 to complete ==="
          FAILED=0
          wait $PID_MAC || { echo "FAILED: MAC Statistics"; FAILED=1; }
          wait $PID_LMP || { echo "FAILED: LMP Prices"; FAILED=1; }
          wait $PID_CD  || { echo "FAILED: Compressed Day"; FAILED=1; }
          wait $PID_CQ  || { echo "FAILED: Consequential Queue"; FAILED=1; }
          wait $PID_SC  || { echo "FAILED: Scenario Comparison"; FAILED=1; }
          wait $PID_OT  || { echo "FAILED: Optimal Targets"; FAILED=1; }

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: One or more parallel scripts failed"
            exit 1
          fi
          echo "=== All 6 post-processors completed successfully ==="

      # ── Individual script runs (when not running ALL) ──
      - name: "Step 6: MAC Statistics"
        if: ${{ github.event.inputs.scripts == 'step6_mac' }}
        run: |
          echo "=== Step 6: MAC Statistics ==="
          python scripts/step6_compute_mac_stats.py

      - name: "Step 6: LMP Prices"
        if: ${{ github.event.inputs.scripts == 'step6_lmp' }}
        run: |
          echo "=== Step 6: LMP Prices ==="
          python scripts/step6_compute_lmp_prices.py ${{ steps.iso-args.outputs.iso_flags }}

      - name: "Step 6: Compressed Day"
        if: ${{ github.event.inputs.scripts == 'step6_compressed_day' }}
        run: |
          echo "=== Step 6: Compressed Day ==="
          python scripts/step6_compressed_day.py

      - name: "Step 6: Consequential Queue"
        if: ${{ github.event.inputs.scripts == 'step6_consequential' }}
        run: |
          echo "=== Step 6: Consequential Queue ==="
          python scripts/step6_consequential_queue.py

      - name: "Step 6: Scenario Comparison"
        if: ${{ github.event.inputs.scripts == 'step6_scenario_comparison' }}
        run: |
          echo "=== Step 6: Scenario Comparison ==="
          python scripts/step6_scenario_comparison.py

      - name: "Step 6: Optimal Targets"
        if: ${{ github.event.inputs.scripts == 'step6_optimal_targets' }}
        run: |
          echo "=== Step 6: Optimal Targets ==="
          python scripts/step6_compute_optimal_targets.py

      # ════════════════════════════════════════════════════════════════════
      # COMMIT & PR
      # ════════════════════════════════════════════════════════════════════

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/step5-post-processing/ 2>/dev/null || true
          git add -f dashboard/js/mac-stats-data.js 2>/dev/null || true
          git add -f dashboard/js/consequential-queue-data.js 2>/dev/null || true
          git add -f dashboard/js/scenario-comparison-data.js 2>/dev/null || true
          git add -f dashboard/js/optimal-target-data.js 2>/dev/null || true
          git add -f dashboard/compressed_day_profiles.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          SCRIPTS_LABEL="${{ github.event.inputs.scripts }}"
          ISO_LABEL="${{ github.event.inputs.iso }}"
          git commit -m "Step 6 Post-Processing: ${SCRIPTS_LABEL} ${ISO_LABEL} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            PUSH_OUTPUT=$(git push -u origin "$TARGET_BRANCH" 2>&1) && {
              echo "Push succeeded on attempt $i"
              break
            }
            echo "$PUSH_OUTPUT"

            if echo "$PUSH_OUTPUT" | grep -q "GH001"; then
              echo "ERROR: Push rejected due to large files (GH001). Not retryable."
              exit 1
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "ERROR: Push failed after $MAX_RETRIES attempts"
              exit 1
            fi

            BACKOFF=$((2 ** i))
            echo "Push failed (transient). Retrying in ${BACKOFF}s..."
            sleep "$BACKOFF"
          done

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## Summary"$'\n'"- Step 6 Analytics & Post-Processing (**${{ github.event.inputs.scripts }}**) for **${{ github.event.inputs.iso }}**"$'\n'"- CO₂ → parallel: MAC, LMP, compressed day, consequential, scenarios, optimal targets"$'\n'"- Auto-generated by GitHub Actions workflow run"
          gh pr create \
            --title "Step 6: ${{ github.event.inputs.scripts }} ${{ github.event.inputs.iso }}" \
            --body "$PR_BODY" \
            --base master \
            --head "$TARGET_BRANCH" || echo "PR creation skipped (no diff or already exists)"
