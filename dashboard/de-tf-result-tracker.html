<style>
:root {
    --bg-page: #F8F9FC; --navy: #1A2744; --navy-dark: #0F1A2E;
    --bg-card: #FFFFFF; --border: #D4D8E0; --border-light: #E5E7EB;
    --text-primary: #000000; --text-secondary: #1E293B; --text-muted: #566370;
    --text-dim: rgba(0,0,0,0.65);
    --font-body: 'DM Sans', 'Plus Jakarta Sans', sans-serif;
    --font-heading: 'Plus Jakarta Sans', 'DM Sans', sans-serif;
    --font-data: 'Plus Jakarta Sans', 'DM Sans', sans-serif;
    --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
    --pad-page: 24px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05); --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --max-content: 1440px;
    --iso-caiso: #F59E0B; --iso-ercot: #22C55E; --iso-miso: #F97316;
    --iso-neiso: #9C27B0; --iso-nyiso: #E91E63; --iso-pjm: #0EA5E9; --iso-spp: #14B8A6;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); color: var(--text-primary); background: var(--bg-page); line-height: 1.6; }
.page-wrap { max-width: var(--max-content); margin: 0 auto; padding: var(--space-xl) var(--pad-page); }
.page-header { text-align: center; margin-bottom: var(--space-lg); }
.page-header h1 { font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.page-header .subtitle { font-size: 0.82rem; color: var(--text-muted); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: var(–space-lg); align-items: flex-end; }
.control-group { display: flex; flex-direction: column; gap: 4px; }
.control-label { font-family: var(–font-heading); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(–text-muted); }
.toggle-group {
display: inline-flex; border: 1.5px solid var(–border); border-radius: var(–radius-sm);
overflow: hidden; background: #f3f4f6; flex-shrink: 0;
}
.toggle-group button {
font-family: var(–font-heading); font-size: 0.78rem; font-weight: 600;
padding: 7px 14px; border: none; background: transparent; color: var(–text-muted);
cursor: pointer; transition: all 0.15s; letter-spacing: 0.02em; white-space: nowrap;
}
.toggle-group button:not(:last-child) { border-right: 1px solid var(–border); }
.toggle-group button:hover { background: rgba(0,0,0,0.04); }
.toggle-group button.active { background: var(–navy); color: #fff; }

/* Tabs */
.tab-bar { display: flex; gap: 4px; margin-bottom: var(–space-lg); border-bottom: 2px solid var(–border-light); }
.tab-btn {
font-family: var(–font-heading); font-size: 0.82rem; font-weight: 600;
padding: 10px 20px; border: none; background: none; color: var(–text-muted);
cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
transition: color 0.15s, border-color 0.15s; letter-spacing: 0.02em;
}
.tab-btn:hover { color: var(–navy); }
.tab-btn.active { color: var(–navy); border-bottom-color: var(–navy); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Stats */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: var(–space-lg); }
.stat-card { background: var(–bg-card); border: 1px solid var(–border-light); border-radius: var(–radius-md); padding: 14px; text-align: center; box-shadow: var(–shadow-sm); }
.stat-val { font-family: var(–font-heading); font-size: 1.4rem; font-weight: 800; color: var(–navy); }
.stat-lbl { font-size: 0.65rem; color: var(–text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.04em; margin-top: 2px; }

/* ISO blocks */
.iso-block { margin-bottom: var(–space-lg); }
.iso-banner {
font-family: var(–font-heading); font-size: 0.82rem; font-weight: 700;
color: #fff; padding: 7px 14px; border-radius: var(–radius-sm) var(–radius-sm) 0 0;
letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center;
}
.iso-banner .cov { font-weight: 500; font-size: 0.7rem; opacity: 0.85; }

/* Grid table */
.g-table {
width: 100%; border-collapse: collapse; font-size: 0.75rem;
background: var(–bg-card); border: 1px solid var(–border-light); border-top: none;
border-radius: 0 0 var(–radius-sm) var(–radius-sm);
}
.g-table th {
font-family: var(–font-heading); font-size: 0.65rem; text-transform: uppercase;
letter-spacing: 0.06em; color: var(–text-dim); padding: 7px 6px;
text-align: center; background: #F3F4F6; border-bottom: 1px solid var(–border-light);
}
.g-table td {
padding: 5px 6px; text-align: center; font-family: var(–font-data);
font-size: 0.74rem; border-bottom: 1px solid #F0F1F3; font-variant-numeric: tabular-nums;
}
.g-table .pw-l { font-family: var(–font-heading); font-weight: 700; color: var(–text-muted); }
.g-table .it-l { color: var(–text-muted); font-size: 0.72rem; }
.g-table .da { color: #D1D5DB; }
.g-table .pwd td { border-bottom: 2px solid var(–border-light); }
.g-table .win { color: #fff; font-weight: 700; border-radius: 3px; }
.g-table .pat { font-size: 0.65rem; color: #888; }

/* Dashboard */
.d-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; background: var(–bg-card); border: 1px solid var(–border-light); border-radius: var(–radius-sm); overflow: hidden; }
.d-table th { font-family: var(–font-heading); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(–text-dim); padding: 8px 6px; text-align: center; background: #F3F4F6; border-bottom: 1px solid var(–border-light); }
.d-table td { padding: 7px 6px; text-align: center; font-family: var(–font-data); font-size: 0.75rem; border-bottom: 1px solid #F0F1F3; font-variant-numeric: tabular-nums; }
.d-table .idv td { border-bottom: 2px solid var(–border-light); }

/* Scoreboard */
.s-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: var(–bg-card); border: 1px solid var(–border-light); border-radius: var(–radius-sm); overflow: hidden; max-width: 840px; }
.s-table th { font-family: var(–font-heading); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(–text-dim); padding: 9px 10px; text-align: left; background: #F3F4F6; border-bottom: 1px solid var(–border-light); }
.s-table td { padding: 9px 10px; border-bottom: 1px solid #F0F1F3; font-family: var(–font-data); }
.s-table .r1 { background: #FFFBEB; font-weight: 700; }

.landed { margin-top: var(–space-xl); }
.landed h3 { font-family: var(–font-heading); font-size: 0.88rem; font-weight: 700; color: var(–navy); margin-bottom: var(–space-sm); }
.landed-r { display: flex; gap: 8px; align-items: baseline; margin-bottom: 3px; font-size: 0.8rem; }
.landed-i { font-family: var(–font-heading); font-weight: 700; min-width: 55px; }
.landed-d { color: var(–text-muted); }
.empty-state { padding: 40px; text-align: center; color: var(–text-muted); font-size: 0.9rem; background: var(–bg-card); border: 1px solid var(–border-light); border-radius: var(–radius-md); }

@media (max-width: 900px) {
.g-table { font-size: 0.65rem; }
.g-table td, .g-table th { padding: 4px 3px; }
.controls { gap: 10px; }
.toggle-group button { padding: 6px 10px; font-size: 0.72rem; }
}
</style>

        for (const pw of PWS) for (const p of POPS) for (const i of ITERS) {
            total++;
            if (get(iso,pw,p,i)!==undefined){ filled++; n++; }
        }
        perISO[iso]=n;
    }
    const slots=ISOS.length*PWS.length*POPS.length*ITERS.length;
    const isosWith=ISOS.filter(iso=>perISO[iso]>0).length;

    document.getElementById('stats').innerHTML=`
        <div class="stat-card"><div class="stat-val">${filled}</div><div class="stat-lbl">Cells filled</div></div>
        <div class="stat-card"><div class="stat-val">${slots}</div><div class="stat-lbl">Total slots</div></div>
        <div class="stat-card"><div class="stat-val">${slots>0?(filled/slots*100).toFixed(0):'0'}%</div><div class="stat-lbl">Coverage</div></div>
        <div class="stat-card"><div class="stat-val">${isosWith} / 7</div><div class="stat-lbl">ISOs with data</div></div>
    `;

    // Grid
    if (filled===0) {
        document.getElementById('grid').innerHTML='<div class="empty-state">No thermal fleet results for this filter combination yet.</div>';
        document.getElementById('dashboard').innerHTML='<div class="empty-state">No data for this filter.</div>';
        document.getElementById('scoreboard').innerHTML='<div class="empty-state">No data for this filter.</div>';
        return;
    }

    let gh='';
    for (const iso of ISOS) {
        const isoSlots=PWS.length*POPS.length*ITERS.length;
        gh+=`<div class="iso-block"><div class="iso-banner" style="background:${IX[iso]}">${iso}<span class="cov">${perISO[iso]} / ${isoSlots}</span></div>`;
        gh+=`<table class="g-table"><thead><tr><th>Pw</th><th>Iter</th>`;
        for (const p of POPS) gh+=`<th>p${p}</th>`;
        gh+=`</tr></thead><tbody>`;
        for (const pw of PWS) {
            const vals=[];
            for (const p of POPS) for (const i of ITERS){ const v=get(iso,pw,p,i); if(v!==undefined) vals.push(v); }
            const mc=vals.length?Math.min(...vals):null;
            const sv=[...vals].sort((a,b)=>a-b);
            const p75=sv.length>1?sv[Math.max(0,Math.floor(sv.length*0.75)-1)]:mc;
            const lm=mc?Math.log10(Math.max(mc,1)):0;
            const lp=p75?Math.log10(Math.max(p75,1)):0;
            const lr=(lp-lm)||1;
            const bc=IX[iso];
            for (let ii=0;ii<ITERS.length;ii++){
                const it=ITERS[ii]; const last=ii===ITERS.length-1;
                gh+=`<tr class="${last?'pwd':''}">`;
                gh+=ii===0?`<td class="pw-l">${pw}</td>`:`<td></td>`;
                gh+=`<td class="it-l">${it}</td>`;
                for (const p of POPS){
                    const v=get(iso,pw,p,it);
                    if(v===undefined){ gh+=`<td class="da">\u2014</td>`; }
                    else if(v===mc){ gh+=`<td class="win" style="background:${bc}">${fmt(v)}</td>`; }
                    else {
                        const lv=Math.log10(Math.max(v,1));
                        const fr=Math.min(1,(lv-lm)/lr);
                        const bg=tint(bc,0.40+fr*0.45);
                        const pat=mc&&v>mc*5;
                        gh+=`<td class="${pat?'pat':''}" style="background:${bg}">${fmt(v)}</td>`;
                    }
                }
                gh+=`</tr>`;
            }
        }
        gh+=`</tbody></table></div>`;
    }
    document.getElementById('grid').innerHTML=gh;

    // Dashboard
    let dh=`<table class="d-table"><thead><tr><th>ISO</th><th>Pw</th><th>Best Config</th><th>Cost ($B)</th></tr></thead><tbody>`;
    for (const iso of ISOS){
        for (let pi=0;pi<PWS.length;pi++){
            const pw=PWS[pi]; let best=null,cfg=null;
            for (const p of POPS) for (const i of ITERS){
                const v=get(iso,pw,p,i);
                if(v!==undefined&&(best===null||v<best)){best=v;cfg=`p${p} i${i}`;}
            }
            const last=pi===PWS.length-1;
            dh+=`<tr class="${last?'idv':''}">`;
            dh+=`<td style="background:${IX[iso]};color:#fff;font-weight:700;font-size:0.72rem;letter-spacing:0.04em">${iso}</td>`;
            dh+=`<td style="color:var(--text-muted);font-weight:600">${pw}</td>`;
            if(best!==null){
                dh+=`<td style="background:${IX[iso]};color:#fff;font-weight:700">${cfg}</td>`;
                dh+=`<td style="background:${IX[iso]};color:#fff;font-weight:700">${fmt(best)}</td>`;
            } else {
                dh+=`<td class="da">\u2014</td><td class="da">\u2014</td>`;
            }
            dh+=`</tr>`;
        }
    }
    dh+=`</tbody></table>`;
    document.getElementById('dashboard').innerHTML=dh;

    // Scoreboard
    const wins={};
    for (const iso of ISOS) for (const pw of PWS){
        let best=null,cfg=null;
        for (const p of POPS) for (const i of ITERS){
            const v=get(iso,pw,p,i);
            if(v!==undefined&&(best===null||v<best)){best=v;cfg=`p${p} i${i}`;}
        }
        if(cfg){
            if(!wins[cfg]) wins[cfg]={n:0,c:[]};
            wins[cfg].n++; wins[cfg].c.push(`${iso} pw${pw}`);
        }
    }
    const ranked=Object.entries(wins).sort((a,b)=>b[1].n-a[1].n);
    const tw=ranked.reduce((s,r)=>s+r[1].n,0);
    let sh=`<table class="s-table"><thead><tr><th>#</th><th>Config</th><th>Wins</th><th>Share</th><th>Winning Combos</th></tr></thead><tbody>`;
    ranked.forEach(([cfg,{n,c}],i)=>{
        sh+=`<tr class="${i===0?'r1':''}"><td>${i+1}</td><td>${cfg}</td><td>${n}</td><td>${n}/${tw}</td><td>${c.join(', ')}</td></tr>`;
    });
    sh+=`</tbody></table>`;
    sh+=`<div class="landed"><h3>Coverage by ISO</h3>`;
    for (const iso of ISOS){
        const pcs=PWS.map(pw=>{
            const n=POPS.flatMap(p=>ITERS.filter(i=>get(iso,pw,p,i)!==undefined)).length;
            return n?`pw${pw}: ${n}`:null;
        }).filter(Boolean);
        if(pcs.length) sh+=`<div class="landed-r"><span class="landed-i" style="color:${IX[iso]}">${iso}</span><span class="landed-d">${pcs.join(' \u00b7 ')}</span></div>`;
    }
    sh+=`</div>`;
    document.getElementById('scoreboard').innerHTML=sh;
}

render();
</script>

</body>
</html>
